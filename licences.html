<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赞比亚矿权介绍 · ECOBOX</title>
<style>
:root{
  --nav:#0d5c55; --nav2:#177a6f;
  --bg:#f4f6f8; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e4e8ec;
  --accent:#0f766e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent)}

/* ---------- 侧栏：就是矿证项目列表 ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sb{background:var(--nav);color:#dbeae8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--nav);display:grid;place-items:center;font-size:15px;font-weight:700}
.brand b{color:#fff;font-size:14.5px;letter-spacing:.4px;display:block;line-height:1.2}
.brand small{font-size:11px;color:#a9c8c3}

.plist{flex:1;overflow-y:auto;padding:8px}
.plist .item{display:block;width:100%;text-align:left;background:none;border:none;color:#cfe3e0;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.plist .item:hover{background:rgba(255,255,255,.08);color:#fff}
.plist .item.on{background:var(--nav2);color:#fff}
.plist .no{display:block;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;font-weight:700;line-height:1.35}
.plist .ar{display:block;font-size:11.5px;opacity:.72;margin-top:1px}
.plist .st{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.modal2{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.modal2 .mbox{background:#fff;border-radius:14px;padding:20px;width:min(100%,480px);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.modal2 h3{font-size:15px;margin-bottom:12px}
.modal2 label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
.modal2 input{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.modal2 .mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal2 .merr{color:#b91c1c;font-size:12px;min-height:16px}
.modal2 .mfoot2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mrow.p3{grid-template-columns:1fr 90px 86px}
.mrow input.ed{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.8px;background:#fff;font-family:inherit}
.mrow input.ed:focus{outline:none;border-color:#9dc9c2;box-shadow:0 0 0 3px rgba(15,92,85,.08)}
.lrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:12.8px;flex-wrap:wrap}
.lrow:first-of-type{border-top:none}
.lrow .lno{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:700}
.lrow .lnm{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lcur{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:1px 8px}

.pill{display:inline-block;font-size:10.5px;font-weight:600;border-radius:9px;padding:0 7px;background:rgba(255,255,255,.16);color:#e6f2f0;white-space:nowrap}
.pill.ok{background:#dcf5e3;color:#15803d}
.pill.warn{background:#fde7c8;color:#a16207}

.brand .sicon{margin-left:auto;flex:0 0 auto;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#cfe3e0;border-radius:8px;font-size:14px;line-height:1;cursor:pointer}
.brand .sicon:hover{background:rgba(255,255,255,.16);color:#fff}
.brand .sicon.on{background:var(--nav2);color:#fff;border-color:transparent}

.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#a9c8c3}
.sb-foot input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:7px;padding:5px 8px;font-size:12px}
.sb-foot button{width:100%;margin-top:7px;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:7px;padding:6px;font-size:12px;cursor:pointer}

/* ---------- 主区 ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:0;display:flex;flex-direction:column;position:sticky;top:0;z-index:10}
.tline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 20px 9px}
.top h1{font-size:15.5px;font-weight:600}
.top .sub{font-size:12px;color:var(--muted)}
#tabs{padding:0 20px;background:#fff;border-top:1px solid var(--line);border-bottom:none}
#tabs:empty{display:none}
.body{padding:16px 20px 40px;max-width:1080px;width:100%}

.detail{background:none;border:0;border-radius:0;overflow:visible}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:#fbfcfd;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pane{padding:14px 0 26px}
.pane h4{font-size:12.5px;color:var(--accent);margin:16px 0 6px;font-weight:700;letter-spacing:.3px}
.pane h4:first-child{margin-top:0}
.lead{font-size:14px;line-height:1.75;color:#374151}
dl{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:13.5px}
dt{color:var(--muted);font-size:12.5px}
dd{word-break:break-word}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.links a,.links button{flex:1;min-width:120px;text-align:center;text-decoration:none;border-radius:9px;padding:9px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;cursor:pointer}
.links a.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:340px;background:#eef2f4}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.gmap{position:relative;height:440px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0e1a20;cursor:grab;touch-action:none;user-select:none}
.gmap:active{cursor:grabbing}
.gtiles,.gvec{position:absolute;inset:0}
.gtiles img{position:absolute;width:256px;height:256px;pointer-events:none;-webkit-user-drag:none}
.gvec{pointer-events:none}
.gpoly{fill:rgba(20,184,166,.20);stroke:#14b8a6;stroke-width:2.2;vector-effect:non-scaling-stroke}
.gv{fill:#fff;stroke:#0f766e;stroke-width:1.3}
.glabel{font:600 13px/1 system-ui,sans-serif;fill:#fff;stroke:#0b3b36;stroke-width:3.4;paint-order:stroke;text-anchor:middle;dominant-baseline:middle}
.smark{pointer-events:auto;cursor:pointer}
.smark:hover circle{stroke:#0f172a;stroke-width:3.4}
.slabel{font:600 11px/1 system-ui,sans-serif;fill:#fff;stroke:#0b3b36;stroke-width:3;paint-order:stroke;text-anchor:middle;pointer-events:none}
.liccard.flash{box-shadow:0 0 0 3px #0f766e}
.gctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.gctrl button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.94);color:#0f172a;font-size:15px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gctrl button:hover{background:#fff}
.glayerpick{position:absolute;left:10px;top:10px;display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.glayerpick button{border:0;background:none;padding:5px 11px;font-size:12px;color:#334155;cursor:pointer}
.glayerpick button.on{background:#0f766e;color:#fff;font-weight:600}
.kpbox{padding:12px 14px 14px;border-top:1px solid #e6eef0;background:#fbfdfd}
.kpbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  font:12.5px/1.7 ui-monospace,Consolas,monospace;color:#0f172a;background:#fff;resize:vertical}
.kpbox textarea:focus{outline:0;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.kprow{display:flex;align-items:center;gap:8px;margin-top:8px}
.kprow .khint{color:#64748b;font-size:12px}
.gpanel{position:absolute;left:10px;top:10px;z-index:6;width:186px;max-height:calc(100% - 20px);
  display:flex;flex-direction:column;background:rgba(255,255,255,.94);border:1px solid #dbe4e8;border-radius:10px;
  box-shadow:0 6px 18px rgba(15,23,42,.14);font-size:12.5px;overflow:hidden;backdrop-filter:blur(3px)}
.gpanel.min .gpbody,.gpanel.min .gpfoot{display:none}
.gphead{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 10px;border-bottom:1px solid #eef2f5;color:#0f172a}
.gphead b{font-weight:600;font-size:12.5px}
.gpmin{margin-left:auto;border:0;background:#eef2f5;color:#334155;width:20px;height:20px;border-radius:5px;cursor:pointer;line-height:1}
.gpbody{padding:6px 8px 8px;overflow:auto}
.gpsub2{color:#64748b;font-size:11.5px;margin:8px 2px 4px;display:flex;gap:5px;align-items:center}
.gprow{display:flex;align-items:center;gap:6px;padding:2.5px 2px;cursor:pointer;border-radius:5px}
.gprow:hover{background:#f1f7f8}
.gprow input{accent-color:#0f766e;margin:0}
.gpn{flex:1;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpc{color:#94a3b8;font-variant-numeric:tabular-nums;font-size:11px}
.gpfoot{padding:5px 9px 6px;border-top:1px solid #eef2f5;color:#94a3b8;font-size:11px}
.gpbody .btn{margin-top:8px;width:100%}
.gattr,.gzoomnow{position:absolute;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.38);padding:1px 6px;border-radius:4px;pointer-events:none}
.gmap:fullscreen{width:100vw;height:100vh;border-radius:0;border:0;background:#0e1a20}
.gmap:fullscreen .gpanel{left:16px;top:16px}
.gattr{right:8px}.gzoomnow{left:10px}
.mapmeta{font-size:12.5px;color:var(--muted);margin-top:8px}
.kmlpanel.drag{outline:2px dashed var(--accent);outline-offset:-3px;background:#f4fbfa}
.khead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;background:#fbfcfd;border-bottom:1px solid var(--line)}
.khead .kt{font-size:13px;font-weight:600;color:var(--text)}
.ktag{font-size:10.5px;letter-spacing:.3px;font-weight:600;color:#0b5f57;background:#eef7f5;border:1px solid #cfe6e1;border-radius:5px;padding:1px 6px}
.khead .khint{font-size:11.5px;color:var(--muted)}
.khead .sp{flex:1}
.kbody{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:14px}
.kthumb{width:108px;height:80px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#f7faf9}
.kthumb .kmlsvg{width:98px;height:72px;border:0;border-radius:0;background:none}
.kmlinfo{flex:1;min-width:230px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.kmlinfo .kname{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-all}
.kmlinfo b{color:#0f766e;font-weight:600}
.kmlinfo .knote,.kmlinfo .kscope{font-size:11.5px;color:#9aa3ad}
.kmlinfo .kscope{font-family:ui-monospace,SFMono-Regular,monospace}
.kmlpanel .kempty{width:100%;padding:18px 14px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:9px;background:#fcfdfd;line-height:1.7}
.kempty b{color:var(--text)}
.kmlsvg{width:86px;height:62px;flex:0 0 auto;background:#f7faf9;border:1px solid var(--line);border-radius:8px}
.kmlcard{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.kmlcard .kmlsvg{width:132px;height:96px}
.kmlmeta{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.kmlmeta b{color:var(--text);font-size:13px;word-break:break-all}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.hint{font-size:12px;color:var(--muted);margin-top:10px}

/* ---------- 项目信息（矿证动态） ---------- */
.feed{display:flex;flex-direction:column;gap:12px;max-width:760px}
.composer{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:12px}
.composer .crow{display:flex;gap:10px}
textarea#ptext{flex:1;min-height:58px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13.5px;resize:vertical;background:#fff}
.cbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.cbar select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:#fff}
.cbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.cbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);margin-left:auto;font-weight:600}
.prev{position:relative;display:inline-block;margin-top:10px}
.prev img{max-height:170px;border-radius:9px;border:1px solid var(--line);display:block}
.prev button{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:7px;font-size:12px;padding:3px 7px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--nav2);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
.post{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.ph{display:flex;gap:9px;align-items:center}
.ph .who b{font-size:13.5px}
.ph .who time{font-size:11.5px;color:var(--muted);margin-left:6px}
.ph .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.ph .x{border:none;background:none;color:#9aa3ad;cursor:pointer;font-size:15px;line-height:1}
.pt{margin:9px 0 0;white-space:pre-wrap;word-break:break-word;font-size:13.8px}
.pimg{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:9px;display:block}
.rep{margin:0 0 22px}
.rep h4{margin:0 0 10px;font-size:15px;color:#0f172a}
.repimg{width:100%;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:0 0 10px;background:#f8fafb}
.sphotos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.sphotos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.nophoto{font-size:12px;color:var(--muted);background:#f8fafb;border:1px dashed var(--line);border-radius:8px;padding:10px;margin:0 0 10px;text-align:center}
.upbtn{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#0b5f57;cursor:pointer;white-space:nowrap}
.upbtn:disabled{opacity:.5;cursor:default}
.scatseg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.scatseg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;color:#334155;cursor:pointer}
.scatseg button.on{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:600}
.scat{margin:20px 0 4px;font-size:15px;color:#0b5f57;border-left:4px solid #0f766e;padding-left:8px}
.scat:first-of-type{margin-top:12px}
.cmts{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.cmt{font-size:12.8px;background:#f8fafb;border-radius:7px;padding:5px 8px}
.cmt b{color:#0b5f57;margin-right:4px}
.cmt time{color:var(--muted);font-size:11px;margin-left:6px}
.cform{display:flex;gap:6px;margin-top:6px}
.cform input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.cform button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}

/* ---------- 项目管理 ---------- */
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1.6fr 1.2fr 1.2fr .9fr .7fr 66px;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.mrow.head{background:#fbfcfd;font-size:11.5px;color:var(--muted);font-weight:600}
.mrow input,.mrow select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;background:#fff;min-width:0}
.mrow input.no{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}
.mrow .ro{font-size:12.5px;padding:6px 8px;border:1px dashed #e3e8eb;border-radius:7px;background:#fafbfc;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .del{border:none;background:none;color:#9aa3ad;cursor:pointer;font-size:15px}
.mrow .att{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:7px;padding:5px 6px;font-size:12px;white-space:nowrap;color:#9aa3ad}
.mrow .att.has{background:#eef7f5;border-color:#b9dcd6;color:#0b5f57;font-weight:600}
.mrow .cfg{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 6px;font-size:12px;cursor:pointer;white-space:nowrap}
.mrow .cfg:hover{background:#eef7f5;border-color:#b9dcd6;color:#0b5f57}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:#374151}
.backbar button:hover{background:#f3f6f8;border-color:#b9dcd6}
.backbar .who{font-size:12.5px;color:var(--muted)}
.setbar{position:sticky;top:var(--toph,0px);z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 2px;margin:0 0 10px}
.setbar .sbhint{font-size:12px;color:var(--muted);flex:1;min-width:170px;line-height:1.45}
.setbar .btn.primary{padding:7px 18px}
.props{display:grid;grid-template-columns:1.2fr 1.2fr 1.2fr .8fr 1fr;gap:10px;padding:12px}
.props.two{grid-template-columns:1fr 90px}
.kbadge{font-size:11px;border-radius:20px;padding:1px 8px;background:#eef7f5;color:#0f766e;border:1px solid #d6ece8}
.kbadge.off{background:#fdf6e7;color:#a16207;border-color:#f3e3bd}
.mpick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mpick button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12.5px;color:#334155;cursor:pointer;font-family:ui-monospace,SFMono-Regular,monospace}
.mpick button:hover{background:#f2f8f7}
.mpick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mpick button i{font-style:normal;opacity:.72;margin-left:4px;font-family:inherit}
.liccards{display:flex;flex-direction:column;gap:10px;margin:2px 0 16px}
.liccard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.liccard .lch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
.liccard dl{margin:0}
.liccard .lcsub{margin-top:6px;font-size:12px;color:var(--muted)}
.props label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.props input,.props select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;background:#fff;color:var(--text);font-weight:400}
.props input:focus,.props select:focus{outline:none;border-color:#9dc9c2;box-shadow:0 0 0 3px rgba(15,92,85,.08)}

const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let AREAS=[],LICS=[],BASE=[],SEL=null,PROJ=null,TAB="intro",PIMG="",VIEW="lic",MROWS=[],MAP_PICK="",MAP_PICK_AREA=null,SAMPLES=[],FACTORY={};
let HOLDER_TOUCHED=false;
const FS_KEY="lic_feed_v1",AU_KEY="lic_author",CACHE_KEY="lic_cache_v1",EDIT_KEY="lic_edit_v1",NOTE_KEY="lic_notes_v1",INFO_KEY="lic_info_v1",SET_KEY="lic_setok";
const MEDIA_URL="https://ecobox-media.frankataix.workers.dev",SP_KEY="samp_photos_v1",MT_KEY="m_token";
let EDITS={},ADDED=[],DELETED=[],NOTES={};

/* ---------- 数据 ---------- */
async function jget(u){
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok)throw new Error(u+" "+r.status);
  return r.json();
}
async function jgetOpt(u){try{return await jget(u)}catch(e){return null}}
const mergeBy=(pub,loc,key)=>[...(loc||[]),...pub.filter(p=>!(loc||[]).some(o=>o[key]===p[key]))];
async function loadData(){
  try{
    const [a,l,al,ll,sm,fc]=await Promise.all([
      jget("areas.json"),jget("licences.json"),
      jgetOpt("areas.local.json"),jgetOpt("licences.local.json"),
      jgetOpt("samples.json"),jgetOpt("factory.json")]);
    AREAS_BASE=mergeBy(a.areas||[],al&&al.areas||[],"id").filter(x=>x&&x.id);
    areaEditsLoad();applyAreaEdits();
    LICS=mergeBy(l.licences||[],ll&&ll.licences||[],"no").filter(x=>x&&x.no);
    SAMPLES=(sm&&sm.samples)||[];
    FACTORY=(fc&&fc.factory)||{};
    BASE=LICS.slice();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({areas:AREAS,licences:LICS,ts:Date.now()}))}catch(e){}
  }catch(e){
    let c=null;
    try{c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null")}catch(_){}
    if(c&&c.licences&&c.licences.length){AREAS_BASE=c.areas||[];areaEditsLoad();applyAreaEdits();LICS=c.licences;BASE=LICS.slice()}
    else throw new Error("配置读取失败："+(e.message||e));
  }
  applyEdits();
}
const areaById=id=>AREAS.find(a=>a.id===id)||null;
const areaName=id=>{const a=areaById(id);return a?a.name:""};
const areaOptions=v=>`<option value="">（未归属）</option>`+
  AREAS.map(a=>`<option value="${esc(a.id)}"${a.id===v?" selected":""}>${esc(a.name)}</option>`).join("");
const licByNo=no=>LICS.find(l=>l.no===no)||null;
const infoVal=(l,k)=>{const r=((l&&l.info)||[]).find(x=>(x.k||"").trim()===k);return r?(r.v||""):""};
const holderOf=l=>infoVal(l,"公司持有")||infoVal(l,"持有人")||(l&&l.holder)||"";
const sortedLics=()=>LICS.slice().sort((a,b)=>
  (a.order??999)-(b.order??999)
  ||(a.area_id||"").localeCompare(b.area_id||"")
  ||String(a.no).localeCompare(String(b.no),"zh"));

/* ---------- 项目实体（= 矿区）。名称/排序/新建 都存本机 ---------- */
const AREA_KEY="lic_area_v1";
let AREAS_BASE=[],AREA_EDIT={},AREA_ADD=[],AREA_DEL=[];
function areaEditsLoad(){
  try{const e=JSON.parse(localStorage.getItem(AREA_KEY)||"{}");AREA_EDIT=e.edits||{};AREA_ADD=e.added||[];AREA_DEL=e.deleted||[]}
  catch(e){AREA_EDIT={};AREA_ADD=[];AREA_DEL=[]}
}
function areaEditsSave(){try{localStorage.setItem(AREA_KEY,JSON.stringify({edits:AREA_EDIT,added:AREA_ADD,deleted:AREA_DEL}))}catch(e){}}
function applyAreaEdits(){
  const out=AREAS_BASE.filter(a=>!AREA_DEL.includes(a.id)).map(a=>({...a,...(AREA_EDIT[a.id]||{})}));
  AREA_ADD.forEach(a=>{
    if(AREA_DEL.includes(a.id))return;
    const i=out.findIndex(x=>x.id===a.id);const v={...a,...(AREA_EDIT[a.id]||{})};i<0?out.push(v):(out[i]=v)
  });
  AREAS=out;
}
function areaSet(id,patch){AREA_EDIT[id]={...(AREA_EDIT[id]||{}),...patch};areaEditsSave();applyAreaEdits()}
function areaDel(id){
  if(!id)return;
  if(!AREA_DEL.includes(id))AREA_DEL.push(id);
  delete AREA_EDIT[id];
  AREA_ADD=AREA_ADD.filter(a=>a.id!==id);
  areaEditsSave();applyAreaEdits();
}
function areaAdd(name){
  let id="p_"+Date.now().toString(36),i=2;
  while(AREAS.some(a=>a.id===id))id="p_"+Date.now().toString(36)+"_"+(i++);
  AREA_ADD.push({id,name,order:AREAS.length+1});
  areaEditsSave();applyAreaEdits();
  return id;
}

/* ---------- 矿证编辑（本机覆盖，可导出回 json） ---------- */
function editsLoad(){
  try{const e=JSON.parse(localStorage.getItem(EDIT_KEY)||"{}");EDITS=e.edits||{};ADDED=e.added||[];DELETED=e.deleted||[]}
  catch(e){EDITS={};ADDED=[]}
}
function persistEdits(){
  try{localStorage.setItem(EDIT_KEY,JSON.stringify({edits:EDITS,added:ADDED,deleted:DELETED}))}catch(e){}
}
function applyEdits(){
  LICS=BASE.filter(l=>!DELETED.includes(l.no)).map(l=>({...l,...(EDITS[l.no]||{})}));
  ADDED.forEach(a=>{if(!LICS.some(l=>l.no===a.no))LICS.push({...a,...(EDITS[a.no]||{})})});
  applyInfo();
}

/* ---------- 矿证信息字段（设置里可改/删/加） ---------- */
const INFO_LABELS=["公司持有","许可证类型","许可证状态","批准时间","到期时间","地区","产区面积","矿产","开发目标"];
let INFO={},SET_NO=null,SET_AREA=null,SROWS=[],SET_VIEW="list",HIT=new Set();

/* 粘贴文本 → 字段：先精确匹配，再模糊匹配；认不出的原样保留 */
const INFO_ALIAS={
  "矿证号":["矿证号","证号","许可证号","许可证编号","licence no","license no","licence","license"],
  "公司持有":["公司持有","持有人","持证人","矿权人","持证公司","公司名称","许可证持有人","所有人","licence holder","holder"],
  "许可证类型":["许可证类型","矿权类型","证类型","许可证类别","类型","licence type"],
  "许可证状态":["许可证状态","当前状态","状态","status"],
  "申请时间":["申请时间","申请日期","提交时间","受理时间","申请日"],
  "开发目标":["开发目标","开发计划","开发目的","规划","目标"],
  "批准时间":["批准时间","批准日期","发证时间","签发时间","批准日"],
  "到期时间":["到期时间","到期日期","有效期至","截止时间","有效期","失效时间"],
  "地区":["地区","区域","省份","省","地址","位置","坐标","所在地区","location"],
  "产区面积":["产区面积","矿区面积","面积","面积(km²)","area"],
  "矿产":["矿产","矿种","矿物","矿产品","主要矿产","commodity"],
  "是否释放":["是否释放"],
  "刷新时间":["刷新时间","更新时间","数据更新时间"],
  "相关项目":["相关项目","关联项目"],
  "查看报告":["查看报告","报告链接","报告"]
};
function canonKey(raw){
  const k=raw.replace(/[\s＊*·•]/g,"").replace(/[（(][^（()）]*[)）]$/,"");
  if(!k)return null;
  for(const [c,al] of Object.entries(INFO_ALIAS))if(al.some(a=>k===a))return c;
  for(const [c,al] of Object.entries(INFO_ALIAS))if(al.some(a=>k.includes(a)))return c;
  return null;
}
function parsePaste(txt){
  const pairs=[],loose=[];
  txt.split(/\r?\n/).forEach(line=>{
    const s=line.replace(/[\u200b\ufeff]/g,"").trim();
    if(!s)return;
    const m=s.match(/^([^：:]{1,24})\s*[：:]\s*(.*)$/);
    if(!m){loose.push(s);return}
    const rawK=m[1].replace(/^[\s＊*·•\-]+/,"").trim();
    const v=m[2].replace(/^[\s＊*·•]+/,"").trim();
    if(v)pairs.push({k:canonKey(rawK)||rawK,v});
  });
  loose.forEach(s=>{
    if(/LIMITED|LTD|MINING|COMPANY|CORP/i.test(s)&&!/^[\d\s.,]+$/.test(s))pairs.push({k:"公司持有",v:s});
  });
  return {pairs,loose};
}
function applyPaste(){
  const txt=($("#pText").value||"").trim();
  if(!txt){$("#pHint").textContent="先把矿证文字粘到上面的框里";return}
  const {pairs,loose}=parsePaste(txt);
  if(!pairs.length){$("#pHint").textContent="没认出「字段：内容」的格式，试试一行写一条";return}
  let add=0,upd=0,noFromPaste="";
  HIT=new Set();
  pairs.forEach(p=>{
    if(p.k==="矿证号"){noFromPaste=p.v;return}   /* 证号是项目主键，填到上面去，不再单独建字段 */
    const row=SROWS.find(r=>(r.k||"").trim()===p.k);
    if(row){
      if((row.v||"").trim()!==p.v){row.v=p.v;upd++}
      HIT.add(p.k);
    }else{
      SROWS.push({k:p.k,v:p.v});add++;HIT.add(p.k);
    }
  });
  if(noFromPaste){const el=$("#setNo");if(el)el.value=noFromPaste;upd++}
  stashProps();
  drawSetBody();
  const bits=[add+upd?`已填 ${add+upd} 处${add?`（新增 ${add} 个字段）`:""}`:"内容没有变化"];
  if(noFromPaste)bits.push(`证号按文本改成 ${noFromPaste}（保存后生效）`);
  if(loose.length)bits.push(`另有 ${loose.length} 行没认出：${loose.slice(0,3).join(" / ")}${loose.length>3?" …":""}`);
  if(noFromPaste&&SET_NO&&noFromPaste!==SET_NO)bits.push(`和当前项目 ${SET_NO} 不一致，确认一下`);
  $("#pHint").textContent=bits.join("；")+"。检查后点保存";
}

/* ---------- 矿权边界 KML ---------- */
const KML_KEY="lic_kml_v1";
let KMLS={};
function kmlLoad(){try{KMLS=JSON.parse(localStorage.getItem(KML_KEY)||"{}")||{}}catch(e){KMLS={}}}
function kmlSave(){try{localStorage.setItem(KML_KEY,JSON.stringify(KMLS))}catch(e){}}
const kmlFor=no=>KMLS[no]||null;
function ringAreaKm2(r){
  const R=6371.0088,D=Math.PI/180;let a=0;
  for(let i=0;i<r.length;i++){
    const[p1,q1]=r[i],[p2,q2]=r[(i+1)%r.length];
    a+=(p2-p1)*D*(2+Math.sin(q1*D)+Math.sin(q2*D));
  }
  return a*R*R/2;
}
const kmlN=el=>String(el.localName||el.nodeName||"").toLowerCase();
function parseCoords(el){
  const ring=el.textContent.trim().split(/\s+/)
    .map(t=>{const q=t.split(",");return [parseFloat(q[0]),parseFloat(q[1])]})
    .filter(q=>Number.isFinite(q[0])&&Number.isFinite(q[1]));
  if(ring.length>1){
    const a=ring[0],b=ring[ring.length-1];
    if(a[0]===b[0]&&a[1]===b[1])ring.pop();
  }
  return ring;
}
function parseKml(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("不是有效的 KML 文件");
  const nodes=[...doc.getElementsByTagName("*")].filter(e=>kmlN(e)==="coordinates");
  if(!nodes.length)throw new Error("KML 里没有 <coordinates>");
  const outer=[],inner=[],lines=[];
  nodes.forEach(el=>{
    const ring=parseCoords(el);
    if(ring.length<3)return;
    let p=el.parentElement,kind="";
    while(p&&!kind){
      const n=kmlN(p);
      if(n==="outerboundaryis")kind="outer";
      else if(n==="innerboundaryis")kind="inner";
      else if(n==="polygon")kind="outer";
      else if(n==="linestring")kind="line";
      p=p.parentElement;
    }
    (kind==="inner"?inner:kind==="line"?lines:outer).push(ring);
  });
  const isPoly=outer.length>0;
  const rings=isPoly?outer:lines;
  if(!rings.length)throw new Error("KML 里没有面或线（需要 Polygon 或 LineString）");
  const all=rings.concat(isPoly?inner:[]).flat();
  const lons=all.map(q=>q[0]),lats=all.map(q=>q[1]);
  const bbox=[Math.min(...lons),Math.min(...lats),Math.max(...lons),Math.max(...lats)];
  const area=isPoly
    ?Math.abs(Math.abs(outer.reduce((a,r)=>a+ringAreaKm2(r),0))-Math.abs(inner.reduce((a,r)=>a+ringAreaKm2(r),0)))
    :0;
  return {
    rings,inner,kind:isPoly?"面":"线",pts:rings.reduce((a,r)=>a+r.length,0),
    parts:rings.length,bbox,
    center:[(bbox[0]+bbox[2])/2,(bbox[1]+bbox[3])/2],
    area
  };
}
async function kmlImport(no,file){
  if(/\.kmz$/i.test(file.name||""))throw new Error("KMZ 是压缩包，暂不支持。请在 Google Earth 里「另存为 KML」后再上传");
  if(file.size>2e6)throw new Error("文件太大（超过 2 MB）");
  const txt=await file.text();
  const g=parseKml(txt);
  KMLS[no]={...g,name:file.name,ts:Date.now(),raw:txt};
  kmlSave();
  return KMLS[no];
}
function kmlSvg(k,color){
  color=color||"#0f766e";
  const [w,so,e,n]=k.bbox,dx=e-w||1e-6,dy=n-so||1e-6;
  const main=k.rings.reduce((a,b)=>b.length>a.length?b:a);
  const pts=main.map(([x,y])=>`${((x-w)/dx*100).toFixed(1)},${((n-y)/dy*70).toFixed(1)}`).join(" ");
  return `<svg class="kmlsvg" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid meet">
    <polygon points="${pts}" fill="${color}" fill-opacity=".14" stroke="${color}" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>`;
}
function kmlSafe(k){
  if(!k||!Array.isArray(k.bbox)||k.bbox.length!==4)return null;
  const c=Array.isArray(k.center)&&k.center.length===2?k.center:[(k.bbox[0]+k.bbox[2])/2,(k.bbox[1]+k.bbox[3])/2];
  return {...k,rings:Array.isArray(k.rings)?k.rings:[],inner:Array.isArray(k.inner)?k.inner:[],
    kind:k.kind||"面",pts:Number(k.pts)||0,parts:Number(k.parts)||1,area:Number(k.area)||0,center:c};
}
function fmtArea(a){return a>=1000?a.toLocaleString("zh-CN",{maximumFractionDigits:0}):a.toFixed(2)}
/* 矿业部/ArcGIS 坐标表 → 环。支持 DMS（13°08'48"S 30°04'18"E）、空格分度分秒、十进制 */
function parseCoordText(txt){
  const out=[];
  String(txt||"").split(/[\r\n;]+/).forEach(raw=>{
    let s=raw.trim();
    if(!s||/^[#\/]/.test(s)||/^(lat|纬度|lat\.)/i.test(s))return;
    s=s.replace(/^\s*\(?\d{1,2}\s*[.)、]\s+/,"")
       .replace(/[°º]/g," ").replace(/[′’']/g," ").replace(/[″”"]/g," ").replace(/,/g," ");
    const t=s.split(/\s+/).filter(Boolean);
    const hemi=[],nums=[];
    t.forEach(x=>{
      if(/^[NSEWnsew]$/.test(x))hemi.push(x.toUpperCase());
      else if(/^[-+]?\d+(\.\d+)?$/.test(x))nums.push(parseFloat(x));
    });
    let lat=null,lon=null;
    if(nums.length>=6){
      lat=nums[0]+nums[1]/60+(nums[2]||0)/3600;
      lon=nums[3]+nums[4]/60+(nums[5]||0)/3600;
      if(hemi[0]==="S")lat=-lat;
      if(hemi[1]==="W")lon=-lon;
      if(nums[0]<0)lat=-Math.abs(lat);
      if(nums[3]<0)lon=-Math.abs(lon);
    }else if(nums.length>=2){
      let a=nums[0],b=nums[1];
      if((Math.abs(a)>90&&Math.abs(b)<=90)||(a>0&&b<0)){const t2=a;a=b;b=t2}
      lat=a;lon=b;
    }
    if(lat===null||lon===null)return;
    if(Math.abs(lat)>90||Math.abs(lon)>180)return;
    if(lat>0&&lat<35&&lon>20&&lon<45)lat=-lat; // 赞比亚一带没写 S 的按南纬
    out.push([lon,lat]);
  });
  return out;
}
function kmlFromPts(ring,name,raw){
  const pts=[];
  ring.forEach(p=>{
    const q=pts[pts.length-1];
    if(!q||Math.abs(q[0]-p[0])>1e-9||Math.abs(q[1]-p[1])>1e-9)pts.push(p);
  });
  if(pts.length>2){
    const a=pts[0],b=pts[pts.length-1];
    if(Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9)pts.pop();
  }
  if(pts.length<3)throw new Error("至少 3 个点，现在读到 "+pts.length+" 个");
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const bbox=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
  return {name,ts:Date.now(),rings:[pts],inner:[],kind:"面",pts:pts.length,parts:1,
    area:ringAreaKm2(pts),bbox,center:[(bbox[0]+bbox[2])/2,(bbox[1]+bbox[3])/2],raw:String(raw||"")};
}

/* 旧字段名归一：持有人 → 公司持有；展示时补齐默认 9 个字段，多余的旧字段丢掉 */
const INFO_DROP=new Set(["申请时间","是否释放","刷新时间","相关项目","查看报告"]);
function normInfo(rows){
  const map=new Map();
  (rows||[]).forEach(x=>{
    let k=(x.k||"").trim();
    if(!k)return;
    if(k==="持有人")k="公司持有";
    if(INFO_DROP.has(k))return;
    if(!map.has(k))map.set(k,(x.v||""));
  });
  const out=INFO_LABELS.map(k=>({k,v:map.get(k)||""}));
  for(const [k,v] of map)if(!INFO_LABELS.includes(k))out.push({k,v});
  return out;
}
function applyInfo(){
  const base=new Map(BASE.map(b=>[b.no,b]));
  LICS.forEach(l=>{
    const b=base.get(l.no);
    if(INFO[l.no])l.info=normInfo(INFO[l.no]);
    else if(b&&Array.isArray(b.info)&&b.info.length)l.info=normInfo(b.info);
    else l.info=normInfo(defaultInfo(l));
  });
}

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("lic_files_db",1);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains("files")){
        const s=db.createObjectStore("files",{keyPath:"id"});
        s.createIndex("no","no",{unique:false});
      }
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function filesOf(no){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction("files").objectStore("files").index("no").getAll(no);
    q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.ts-a.ts));
    q.onerror=()=>rej(q.error);
  });
}
async function allFiles(){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction("files").objectStore("files").getAll();
    q.onsuccess=()=>res(q.result||[]);
    q.onerror=()=>rej(q.error);
  });
}
async function putFile(rec){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const t=db.transaction("files","readwrite");
    t.objectStore("files").put(rec);
    t.oncomplete=()=>res(true);
    t.onerror=()=>rej(t.error);
  });
}
async function delFile(id){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const t=db.transaction("files","readwrite");
    t.objectStore("files").delete(id);
    t.oncomplete=()=>res(true);
    t.onerror=()=>rej(t.error);
  });
}

function fmt(ts){
  const d=new Date(ts),n=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return d.toDateString()===n.toDateString()?("今天 "+hm)
    :(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+hm);
}

const ZH_STATUS={active:"有效",pending:"待审核",expired:"已过期",granted:"已授予",suspended:"已暂停",cancelled:"已注销",canceled:"已注销",defaulted:"已违约",application:"申请中",applied:"已申请",renewal:"续期中",relinquished:"已放弃"};

const ZH_MIN={copper:"铜",gold:"金",cobalt:"钴",nickel:"镍",manganese:"锰",iron:"铁",lead:"铅",zinc:"锌",lithium:"锂",tin:"锡",tantalum:"钽",niobium:"铌",beryllium:"铍",caesium:"铯",cesium:"铯",silver:"银",uranium:"铀",coal:"煤",graphite:"石墨",emerald:"祖母绿",aquamarine:"海蓝宝石",tourmaline:"电气石",mica:"云母",quartz:"石英",feldspar:"长石",cu:"铜",au:"金",ag:"银",co:"钴",ni:"镍",mn:"锰",fe:"铁",pb:"铅",zn:"锌",li:"锂",sn:"锡",ta:"钽",nb:"铌",be:"铍",cs:"铯",u:"铀"};
const ZH_PROV={central:"中央省",copperbelt:"铜带省",lusaka:"卢萨卡省",southern:"南部省",northern:"北部省",eastern:"东部省",western:"西部省","north-western":"西北省",northwestern:"西北省",luapula:"卢阿普拉省",muchinga:"穆钦加省"};
const ZH_DIST={serenje:"塞伦杰",mkushi:"姆库希",chibombo:"奇邦博","kapiri mposhi":"卡皮里姆波希",ndola:"恩多拉",kitwe:"基特韦",solwezi:"索卢韦齐",mwinilunga:"姆维尼伦加",kalomo:"卡洛莫",choma:"乔马",lusaka:"卢萨卡",chipata:"奇帕塔",kasama:"卡萨马",mongu:"芒古",livingstone:"利文斯顿",kabwe:"卡布韦",mumbwa:"蒙布瓦",nyimba:"宁巴",petauke:"佩陶凯"};
const zhStatus=v=>{const t=String(v??"").trim();if(!t)return t;if(/[一-龥]/.test(t))return t;return ZH_STATUS[t.toLowerCase()]||t};
const zhType=v=>{const t=String(v??"").trim();if(!t)return t;if(/[一-龥]/.test(t))return t;
  const n=t.toLowerCase().replace(/[-\u2010-\u2015]/g," ");
  const hit=ZH_TYPE.find(([k])=>n.includes(k));return hit?hit[1]:t};
const zhMineral=v=>{const t=String(v??"").trim();if(!t)return t;if(/[一-龥]/.test(t))return t;
  return ZH_MIN[t.toLowerCase().replace(/\s*ore$/,"")]||t};
const zhRegion=v=>{const t=String(v??"").trim();if(!t)return t;if(/[一-龥]/.test(t))return t;
  return t.split(/[,，]/).map(x=>{const k=x.trim().toLowerCase();
    return ZH_PROV[k]||ZH_DIST[k]||x.trim()}).filter(Boolean).join(" · ")};
function zhVal(k,v){
  const key=String(k??"").trim(),t=String(v??"").trim();
  if(!t)return t;
  if(key==="许可证状态"||key==="状态")return zhStatus(t);
  if(key==="许可证类型"||key==="类型")return zhType(t);
  if(key==="矿产"||key==="矿种")return t.split(/[,，、\/]/).map(x=>zhMineral(x)).join("、");
  if(key==="地区"||key==="地址"||key==="省份")return zhRegion(t);
  return t;
}

/* ---------------- 项目地图：自绘瓦片地图（卫星/街道）+ 矿权边界 ---------------- */
const MAP_TILES={
  sat:{name:"卫星",max:19,attr:"影像 © Esri · Maxar · Earthstar",
    url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`},
  street:{name:"道路",max:19,attr:"道路/城市名 © Esri",
    url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`}
};
const MAPK="map_layer_v1";
let MAP=null;
const mercX=lon=>(lon+180)/360;
const mercY=lat=>{const s=Math.sin(lat*Math.PI/180);return 0.5-Math.log((1+s)/(1-s))/(4*Math.PI)};
const unmercX=x=>x*360-180;
const unmercY=y=>{const n=Math.PI-2*Math.PI*y;return 180/Math.PI*Math.atan((Math.exp(n)-Math.exp(-n))/2)};
function mapFitZoom(bbox,w,h,pad=0.84){
  const dx=Math.abs(mercX(bbox[2])-mercX(bbox[0]))||1e-9;
  const dy=Math.abs(mercY(bbox[1])-mercY(bbox[3]))||1e-9;
  const z=Math.log2(Math.min(w*pad/(256*dx),h*pad/(256*dy)));
  return Math.max(2,Math.min(17,Math.floor(z)));
}
function mapLayer(){
  let v="";try{v=localStorage.getItem(MAPK)||""}catch(e){}
  return MAP_TILES[v]?v:"sat";
}
const LIC_COLORS=["#e11d48","#2563eb","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#0d9488"];
function licColor(i){return LIC_COLORS[((i%LIC_COLORS.length)+LIC_COLORS.length)%LIC_COLORS.length]}
function ksFor(view,ls){return view.map(x=>{const i=ls.findIndex(y=>y.no===x.no);return {no:x.no,k:kmlSafe(kmlFor(x.no)),color:licColor(i)}}).filter(x=>x.k)}
/* 项目地图：突出地理位置；道路/城市名走「道路」底图（Esri 街道图，含电网线） */
function mapDraw(){
  if(!MAP)return;
  const{el,layer}=MAP;
  const w=el.clientWidth||600,h=el.clientHeight||360;
  const scale=256*Math.pow(2,MAP.zoom),n=Math.pow(2,MAP.zoom);
  const cx=mercX(MAP.center[0])*scale,cy=mercY(MAP.center[1])*scale;
  const left=cx-w/2,top=cy-h/2;
  const T=MAP_TILES[layer];
  const tx0=Math.floor(left/256),tx1=Math.floor((left+w)/256);
  const ty0=Math.floor(top/256),ty1=Math.floor((top+h)/256);
  let html="";
  for(let ty=ty0;ty<=ty1;ty++){
    if(ty<0||ty>=n)continue;
    for(let tx=tx0;tx<=tx1;tx++){
      const wx=((tx%n)+n)%n;
      html+=`<img alt="" draggable="false" src="${T.url(MAP.zoom,wx,ty)}" style="left:${tx*256-left}px;top:${ty*256-top}px">`;
    }
  }
  el.querySelector(".gtiles").innerHTML=html;
  el.querySelector(".gattr").textContent=T.attr;
  el.querySelector(".gzoomnow").textContent="z"+MAP.zoom;

  const px=(lon,lat)=>[mercX(lon)*scale-left,mercY(lat)*scale-top];
  const ringPath=r=>"M"+r.map(q=>{const[a,b]=px(q[0],q[1]);return a.toFixed(1)+","+b.toFixed(1)}).join("L")+"Z";
  const ks=MAP.ks||[];
  let vec="";
  ks.forEach(it=>{
    const k=it.k,col=it.color||"#0f766e";
    if(!k||!k.rings||!k.rings.length)return;
    const d=k.rings.map(ringPath).join(" ");
    const di=(k.inner&&k.inner.length)?k.inner.map(ringPath).join(" "):"";
    vec+=`<path class="gpoly" d="${d}${di?" "+di:""}" fill-rule="evenodd" stroke="${col}" fill="${col}" fill-opacity="0.16"/>`;
    vec+=k.rings.flat().slice(0,400)
      .map(q=>{const[a,b]=px(q[0],q[1]);return `<circle class="gv" cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="2.6" style="stroke:${col}"/>`}).join("");
    const r=k.rings[0];
    const c=[r.reduce((t,q)=>t+q[0],0)/r.length,r.reduce((t,q)=>t+q[1],0)/r.length];
    const[a,b]=px(c[0],c[1]);
    if(MAP.showLabels)vec+=`<text class="glabel" x="${a.toFixed(1)}" y="${b.toFixed(1)}">${k.kind==="线"?"":"约 "}${fmtArea(k.area)} km²</text>`;
  });
  const svg=el.querySelector(".gvec");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("width",w);svg.setAttribute("height",h);
  svg.innerHTML=vec;
}

function mapZoom(dir,ev){
  if(!MAP)return;
  const el=MAP.el,w=el.clientWidth||600,h=el.clientHeight||360;
  const oldZ=MAP.zoom;
  const nz=Math.max(2,Math.min(MAP_TILES[MAP.layer].max,oldZ+dir));
  if(nz===oldZ)return;
  const old=256*Math.pow(2,oldZ),scale=256*Math.pow(2,nz);
  let mx=w/2,my=h/2;
  if(ev){const r=el.getBoundingClientRect();mx=ev.clientX-r.left;my=ev.clientY-r.top}
  const left=mercX(MAP.center[0])*old-w/2,top=mercY(MAP.center[1])*old-h/2;
  const wx=(left+mx)/old,wy=(top+my)/old;
  MAP.zoom=nz;
  MAP.center=[unmercX((wx*scale-mx+w/2)/scale),unmercY(Math.max(0,Math.min(1,(wy*scale-my+h/2)/scale)))];
  mapDraw();
}
function mapMount(ls){
  const el=$("#gmap");if(!el)return;
  const picked=ls.find(x=>x.no===MAP_PICK)||null;
  const view=picked?[picked]:ls;
  const center=projCenter(view),bbox=projBBox(view);
  if(!center)return;
  const ks=ksFor(view,ls);
  MAP={el,ks,fit:bbox?bbox.slice():null,bbox,center:center.slice(),layer:mapLayer(),zoom:13,showLabels:!!picked};
  MAP.zoom=bbox?mapFitZoom(bbox,el.clientWidth||600,el.clientHeight||360):13;
  mapDraw();

  el.addEventListener("pointerdown",e=>{
    if(e.target.closest("button,input,label,select,textarea,a"))return;
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    MAP.drag={x:e.clientX,y:e.clientY,c:MAP.center.slice()};MAP.moved=false;
  });
  el.addEventListener("pointermove",e=>{
    if(!MAP.drag)return;
    if(Math.abs(e.clientX-MAP.drag.x)+Math.abs(e.clientY-MAP.drag.y)>4)MAP.moved=true;
    const w=el.clientWidth||600,h=el.clientHeight||360,scale=256*Math.pow(2,MAP.zoom);
    const nx=mercX(MAP.drag.c[0])-(e.clientX-MAP.drag.x)/scale;
    const ny=mercY(MAP.drag.c[1])-(e.clientY-MAP.drag.y)/scale;
    MAP.center=[unmercX(nx),unmercY(Math.max(0,Math.min(1,ny)))];
    mapDraw();
  });
  const drop=()=>{if(MAP)MAP.drag=null};
  el.addEventListener("pointerup",drop);
  el.addEventListener("pointercancel",drop);
  el.addEventListener("wheel",e=>{e.preventDefault();mapZoom(e.deltaY<0?1:-1,e)},{passive:false});
  el.addEventListener("dblclick",e=>mapZoom(1,e));
  el.querySelectorAll("[data-gz]").forEach(b=>b.onclick=()=>mapZoom(+b.dataset.gz));
  const fit=el.querySelector("[data-gfit]");
  if(fit)fit.onclick=()=>{
    if(!MAP.fit)return;
    MAP.zoom=mapFitZoom(MAP.fit,el.clientWidth||600,el.clientHeight||360);
    MAP.center=[(MAP.fit[0]+MAP.fit[2])/2,(MAP.fit[1]+MAP.fit[3])/2];
    mapDraw();
  };
  const fs=el.querySelector("[data-gfull]");
  if(fs)fs.onclick=()=>{
    if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}
    else{el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}
  };
  el.querySelectorAll("[data-glayer]").forEach(b=>b.onclick=()=>{
    MAP.layer=b.dataset.glayer;
    try{localStorage.setItem(MAPK,MAP.layer)}catch(e){}
    el.querySelectorAll("[data-glayer]").forEach(x=>x.classList.toggle("on",x.dataset.glayer===MAP.layer));
    mapDraw();
  });
  if(window.ResizeObserver)new ResizeObserver(()=>mapDraw()).observe(el);
}

function projBBox(ls){
  let b=null;
  ls.forEach(x=>{
    const k=kmlSafe(kmlFor(x.no));
    const bb=(k&&k.bbox)||x.bbox||(areaById(x.area_id)||{}).bbox;
    if(!bb)return;
    b=b?[Math.min(b[0],bb[0]),Math.min(b[1],bb[1]),Math.max(b[2],bb[2]),Math.max(b[3],bb[3])]:bb.slice();
  });
  return b;
}
function projCenter(ls){
  const b=projBBox(ls);
  if(b)return [(b[0]+b[2])/2,(b[1]+b[3])/2];
  for(const x of ls){
    const k=kmlSafe(kmlFor(x.no));
    const c=(k&&k.center)||x.center||(areaById(x.area_id)||{}).center;

  }
  return null;
}

function gradeFmt(v,u){
  if(v==null||v==="") return "待化验";
  if(typeof v==="number") return String(v)+(u||"%");
  return String(v)+(u||"%");
}
const SAMP_CATEGORIES=["取样","标记点"];
let SCAT="",SCAT_PROJ=null;
function markerSubCat(d){
  d=d||"";
  if(d.includes("桥"))return "桥";
  if(d.includes("路口")||d.includes("转弯"))return "路口";
  if(d.includes("电线")||d.includes("电杆"))return "电线";
  if(d.includes("马路")||d.includes("道路")||d.includes("路"))return "道路";
  if(d.includes("土地")||d.includes("农民")||d.includes("酋长"))return "土地/农户";
  return "其他标记";
}
function sampCat(s){
  if(s.category)return {cat:s.category,sub:s.subtype||"其他"};
  const t=(s.sample_type||"").trim();
  if(t==="岩石"||t==="土壤"||t==="刻槽")return {cat:"取样",sub:t};
  if(t==="其他标记")return {cat:"标记点",sub:markerSubCat(s.description)};
  if(s.mineral||(s.assays&&s.assays.length))return {cat:"取样",sub:t||"其他"};
  if(t==="其他")return {cat:"标记点",sub:markerSubCat(s.description)};
  return {cat:"取样",sub:"其他"};
}
function sampPhotos(){try{return JSON.parse(localStorage.getItem(SP_KEY)||"{}")}catch(e){return {}}}
function sampleAllPhotos(s){
  const base=(s&&s.photos||[]).filter(Boolean);
  const extra=sampPhotos()[s&&s.sample_id]||[];
  return base.concat(extra).slice(0,6);
}
function mediaTok(){return (localStorage.getItem(MT_KEY)||"").trim()}
async function uploadPhotos(sid,btn){
  let tok=mediaTok();
  if(!tok){
    const t=prompt("请输入媒体上传令牌（X-Upload-Token，用于把照片写入 R2）：");
    if(t==null)return;
    tok=t.trim();
    if(!tok){alert("令牌不能为空");return}
    localStorage.setItem(MT_KEY,tok);
  }
  const s=SAMPLES.find(x=>x.sample_id===sid)||{};
  const cur=sampleAllPhotos(s);
  const remain=Math.max(0,6-cur.length);
  if(remain<=0){alert("该样点已达 6 张照片上限");return}
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";inp.multiple=true;
  inp.onchange=async()=>{
    const files=Array.from(inp.files||[]).slice(0,remain);
    if(!files.length)return;
    const setBusy=(b)=>{if(btn){btn.disabled=b;btn.textContent=b?"上传中…":"上传照片"}};
    setBusy(true);
    const added=[];
    for(const f of files){
      const ext=f.type==="image/png"?"png":f.type==="image/webp"?"webp":"jpg";
      const idx=cur.length+added.length+1;
      const key=`photos/${sid}/${String(idx).padStart(2,"0")}.${ext}`;
      try{
        const r=await fetch(`${MEDIA_URL}/put?key=${encodeURIComponent(key)}`,{
          method:"POST",
          headers:{"X-Upload-Token":localStorage.getItem(MT_KEY)||"","Content-Type":f.type||"application/octet-stream"},
          body:f});
        const j=await r.json();
        if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
        added.push(j.url||(MEDIA_URL+"/m/"+key));
      }catch(e){alert("照片上传失败："+(e.message||e))}
    }
    if(added.length){
      const m=sampPhotos();
      m[sid]=(m[sid]||[]).concat(added).slice(0,6);
      localStorage.setItem(SP_KEY,JSON.stringify(m));
      render();
    }else{
      setBusy(false);
    }
  };
  inp.click();
}

function introFacts(ls){
  const g=(ls[0]&&ls[0].geology)||{};
  const aid=PROJ;
  const area=areaById(aid);
  const c=(area&&area.center)||(ls[0]&&ls[0].center)||null;
  const rows=SAMPLES.filter(s=>!s.area_id||s.area_id===aid);
  const ta=rows.map(s=>+s.ta2o5_pct).filter(v=>!isNaN(v));
  const nb=rows.map(s=>+s.nb2o5_pct).filter(v=>!isNaN(v));
  return {
    location:c?`${area?area.name:""}，中心约 ${(+c[0]).toFixed(2)}°E / ${Math.abs(+c[1]).toFixed(2)}°S`:"",
    lics: ls.map(x=>`${x.no}（${x.holder}）`),
    minerals:(g.minerals||[]).join("、"),
    host:g.host||"",
    structure:g.structure||"",
    alteration:g.alteration||"",
    samples:rows.length,
    taMax:ta.length?Math.max(...ta):null,
    nbMax:nb.length?Math.max(...nb):null,
    capacity:FACTORY.capacity||"",
    plan:FACTORY.plan||""
  };
}
function buildIntroTemplate(f){

/* 矿证信息 → 项目属性：列表的「持有人 / 许可证状态」列只读，值来自信息表 */
const SYNC_PAIRS=[[["公司持有","持有人"],"holder"],[["许可证状态"],"status"]];
/* 存储键：基础项目按 json 里的原始证号存 patch，改名后靠 patch.no 找回 */
function keyOf(no){
  if(EDITS[no])return no;
  if(ADDED.some(a=>a.no===no))return no;
  if(BASE.some(b=>b.no===no))return no;
  return Object.keys(EDITS).find(k=>EDITS[k]&&EDITS[k].no===no)||no;
}
function setProjectPatch(no,patch){
  if(!no||!Object.keys(patch).length)return;
  const k=keyOf(no),added=ADDED.find(a=>a.no===no);
  if(EDITS[k])Object.assign(EDITS[k],patch);
  else if(added)Object.assign(added,patch);
  else EDITS[k]={...patch};
  persistEdits();
  applyEdits();
}
function syncProjectFromInfo(no,rows){
  const get=ks=>{for(const k of ks){const r=rows.find(x=>(x.k||"").trim()===k);if(r)return (r.v||"").trim()}return null};
  const lic=licByNo(no);if(!lic)return;
  const patch={};
  SYNC_PAIRS.forEach(([ks,f])=>{
    const v=get(ks);
    if(v!=null&&v!==(lic[f]||""))patch[f]=v;
  });
  setProjectPatch(no,patch);
}
async function removeLicence(no){
  if(!no)return;
  const k=keyOf(no);
  delete EDITS[k];
  ADDED=ADDED.filter(a=>a.no!==no);
  if(BASE.some(b=>b.no===k)&&!DELETED.includes(k))DELETED.push(k);
  delete INFO[no];
  if(KMLS[no]){delete KMLS[no];kmlSave()}
  if(NOTES[no]){delete NOTES[no];try{localStorage.setItem(NOTE_KEY,JSON.stringify(NOTES))}catch(e){}}
  persistEdits();
  try{localStorage.setItem(INFO_KEY,JSON.stringify(INFO))}catch(e){}
  try{for(const f of await filesOf(no))await delFile(f.id)}catch(e){}
  if(SEL===no)SEL=null;
}

async function deleteProject(no){
  if(!no)return;
  const areaId=(licByNo(no)||{}).area_id||SET_AREA||"";
  if(!confirm(`删除矿证 ${no}？\n本机保存的矿证信息、区域、资料和文字记录会一起删掉；licences.json 文件本身不动。`))return;
  await removeLicence(no);
  SET_NO=null;
  if(areaId&&areaById(areaId)){SET_VIEW="proj";SET_AREA=areaId;location.hash="setp/"+encodeURIComponent(areaId)}
  else{SET_VIEW="list";SET_AREA=null;location.hash="set"}
  applyEdits();render();toast("已删除 "+no);
}

function exportJson(){
  const out={note:"矿证与地质资料",licences:sortedLics().map(l=>{
    const {order,...rest}=l;return order==null?rest:{order,...rest};

  const blob=new Blob([JSON.stringify(out,null,2)+"\n"],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="licences.json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("已下载 licences.json");
}

let DRAFT=null;
function readPropsDom(){
  const g=id=>{const el=$("#"+id);return el?el.value:null};
  return {no:g("setNo"),holder:g("setHolder"),type:g("setType"),status:g("setStatus"),area_id:g("setArea")};
}
function stashProps(){
  const p=readPropsDom();
  if(p.no===null)return;
  DRAFT=p;
}
const LIC_PROPS=["no","holder","type","status","area_id"];
const rowKey=rs=>rs.filter(r=>(r.k||"").trim()).map(r=>r.k.trim()+"\u0000"+(r.v||"").trim()).join("\u0001");
function isDirty(){
  const p=readPropsDom();
  if(p.no===null)return false;
  const l=licByNo(SET_NO)||{};
  const same=LIC_PROPS.every(f=>String(p[f]??"")===String(l[f]??""));
  return !same||rowKey(SROWS)!==rowKey(l.info||[]);
}
function leaveOK(){
  if(!isDirty())return true;
  if(!confirm("这本矿证有改动还没保存，确定离开？"))return false;
  DRAFT=null;return true;
}

const LIC_FIELDS={"许可证号":"no","证号":"no","矿证号":"no","licence":"no","license":"no",
  "名称":"name","项目名称":"name",
  "许可证类型":"type","类型":"type",
  "持有人":"holder","公司持有":"holder","公司":"holder",
  "许可证状态":"status","状态":"status",
  "批准时间":"valid_from","有效期起":"valid_from","开始时间":"valid_from",
  "到期时间":"valid_to","有效期止":"valid_to","截止时间":"valid_to",
  "产区面积":"area_km2","面积":"area_km2",
  "地区":"region","省份":"region"};
function parseLicText(txt){
  const out={};
  String(txt||"").split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\s*([^:：]{1,12})\s*[:：]\s*(.+?)\s*$/);
    if(!m)return;
    const k=LIC_FIELDS[m[1].replace(/\s/g,"")];
    if(k&&!out[k])out[k]=m[2];
  });
  return out;
}
function createLicence(areaId,spec){
  const a=areaById(areaId)||{},sib=sortedLics().find(l=>l.area_id===areaId)||{};
  const no=String(spec.no||"").trim();
  if(!no)throw new Error("缺少证号");
  if(LICS.some(x=>x.no===no))throw new Error("证号已存在："+no);
  const info=[],push=(k,v)=>{if(v)info.push({k,v})};
  push("公司持有",spec.holder);push("许可证类型",spec.type);push("许可证状态",spec.status);
  push("批准时间",spec.valid_from);push("到期时间",spec.valid_to);
  push("产区面积",spec.area_km2);push("地区",spec.region);
  const rec={no,name:String(spec.name||"").trim()||no,area_id:areaId||"",
    holder:String(spec.holder||"").trim()||"（待核实）",
    type:String(spec.type||"").trim(),status:String(spec.status||"").trim()||"Active",
    info,commodities:(spec.commodities||sib.commodities||["Ta","Nb"]),
    center:(a.center||sib.center||[]).slice(),
    geology:sib.geology?JSON.parse(JSON.stringify(sib.geology)):{},
    sampling:sib.sampling?JSON.parse(JSON.stringify(sib.sampling)):{},
    intro:"",reference:[],reports:[],order:(sib.order||999)+1};
  ADDED.push(rec);persistEdits();applyEdits();
  INFO[rec.no]=normInfo(rec.info);
  try{localStorage.setItem(INFO_KEY,JSON.stringify(INFO))}catch(e){}
  applyInfo();
  return rec;
}

async function handleKmlFile(file){
  const old=kmlFor(SET_NO);
  if(old&&!confirm(`已有边界 ${old.name}，用 ${file.name} 替换？`))return;
  try{
    const k=await kmlImport(SET_NO,file);
    stashProps();drawSetBody();
    toast(`已导入 ${k.kind}状边界：${k.pts} 个顶点，约 ${fmtArea(k.area)} km²`);
  }catch(e){
    alert("导入失败："+(e.message||e));
  }
}

function wireSettings(){
  $("#setBack").onclick=()=>{
    if(!leaveOK())return;
    goProj((licByNo(SET_NO)||{}).area_id||SET_AREA);
  };
  $("#setDel").onclick=()=>deleteProject(SET_NO);
  $("#setHolder").addEventListener("input",()=>{HOLDER_TOUCHED=true});
  $("#view").querySelectorAll(".irow:not(.head)").forEach(el=>{
    const i=+el.dataset.i;
    el.querySelectorAll("[data-k]").forEach(f=>{
      f.addEventListener("input",()=>{SROWS[i][f.dataset.k]=f.value});
    });
    el.querySelector("[data-del]").onclick=()=>{
      SROWS.splice(i,1);
      stashProps();drawSetBody();
    };
  });
  $("#setAdd").onclick=()=>{stashProps();SROWS.push({k:"",v:""});drawSetBody()};
  const kUp=$("#kmlUp");
  if(kUp)kUp.onchange=async()=>{
    const file=(kUp.files||[])[0];if(!file)return;
    await handleKmlFile(file);
    kUp.value="";
  };
  const kPanel=$("#kmlPanel");
  if(kPanel){
    ["dragenter","dragover"].forEach(ev=>kPanel.addEventListener(ev,e=>{e.preventDefault();kPanel.classList.add("drag")}));
    ["dragleave","dragend"].forEach(ev=>kPanel.addEventListener(ev,()=>kPanel.classList.remove("drag")));
    kPanel.addEventListener("drop",async e=>{
      e.preventDefault();kPanel.classList.remove("drag");
      const file=(e.dataTransfer.files||[])[0];
      if(file)await handleKmlFile(file);
    });
  }
  const kpBtn=$("#kmlPasteBtn"),kpBox=$("#kmlPaste"),kpTa=$("#kmlPts");
  if(kpBtn&&kpBox&&kpTa){
    kpBtn.onclick=()=>{kpBox.hidden=!kpBox.hidden;if(!kpBox.hidden)kpTa.focus()};
    const kpCount=()=>{const n=parseCoordText(kpTa.value).length,el=$("#kmlPtsN");if(el)el.textContent=n;return n};
    kpTa.addEventListener("input",kpCount);
    $("#kmlPtsX").onclick=()=>{kpBox.hidden=true};
    $("#kmlPtsOk").onclick=()=>{
      const ring=parseCoordText(kpTa.value);
      if(ring.length<3){alert(`至少要 3 个点，现在只读到 ${ring.length} 个。\n每行一个点，纬度在前：13°08'48.00" S 30°04'18.00" E`);return}
      const old=kmlFor(SET_NO);
      if(old&&!confirm(`已有边界 ${old.name}，用这 ${ring.length} 个坐标替换？`))return;
      try{
        const k=kmlFromPts(ring,`手工坐标（${ring.length} 点）`,kpTa.value.trim());
        KMLS[SET_NO]=k;kmlSave();stashProps();drawSetBody();
        toast(`已按坐标生成边界：${k.pts} 个顶点，约 ${fmtArea(k.area)} km²`);
      }catch(e){alert("坐标处理失败："+(e.message||e))}
    };
  }
  const kMap=$("#kmlMap");
  if(kMap)kMap.onclick=()=>{if(isDirty()&&!confirm("有改动还没保存，仍要离开？"))return;TAB="map";render()};
  const kDl=$("#kmlDl");
  if(kDl)kDl.onclick=()=>{
    const k=kmlSafe(kmlFor(SET_NO));if(!k||!k.raw){alert("原文件不在本机了");return}
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([k.raw],{type:"application/vnd.google-earth.kml+xml"}));
    a.download=k.name||"boundary.kml";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  const kDel=$("#kmlDel");
  if(kDel)kDel.onclick=()=>{
    if(!confirm("删除这本矿证的矿权边界？"))return;
    stashProps();delete KMLS[SET_NO];kmlSave();drawSetBody();toast("已删除边界");
  };
  $("#pParse").onclick=applyPaste;
  $("#setSave").onclick=saveSettings;
  $("#setReset").onclick=()=>{
    if(!confirm("放弃这本矿证的信息修改，回到 licences.json？"))return;
    delete INFO[SET_NO];
    try{localStorage.setItem(INFO_KEY,JSON.stringify(INFO))}catch(e){}
    applyInfo();render();toast("已还原");
  };
  $("#setExport").onclick=exportJson;
}

async function renameProject(oldNo,newNo){
  if(INFO[oldNo]){INFO[newNo]=INFO[oldNo];delete INFO[oldNo];
    try{localStorage.setItem(INFO_KEY,JSON.stringify(INFO))}catch(e){}}
  const k=keyOf(oldNo);
  EDITS[k]={...(EDITS[k]||{}),no:newNo};
  const a=ADDED.find(x=>x.no===oldNo);if(a)a.no=newNo;
  if(KMLS[oldNo]){KMLS[newNo]=KMLS[oldNo];delete KMLS[oldNo];kmlSave()}
  if(NOTES[oldNo]){NOTES[newNo]=NOTES[oldNo];delete NOTES[oldNo];
    try{localStorage.setItem(NOTE_KEY,JSON.stringify(NOTES))}catch(e){}}
  persistEdits();
  try{for(const f of await filesOf(oldNo))await putFile({...f,no:newNo})}catch(e){}
  if(SEL===oldNo)SEL=newNo;
}

function saveSettings(){
  const rows=SROWS.filter(r=>(r.k||"").trim());
  const seen=new Set();
  for(const r of rows){
    const k=r.k.trim();
    if(seen.has(k)){alert("字段重复："+k);return}
    seen.add(k);
  }
  const newNo=($("#setNo").value||"").trim();
  let holder=($("#setHolder").value||"").trim();
  const type=($("#setType").value||"").trim();
  const status=($("#setStatus").value||"").trim();
  const area_id=$("#setArea").value;
  const noteEl=$("#mNote");
  if(noteEl!==null&&noteEl!==undefined){try{noteSet(SET_NO,noteEl.value)}catch(e){}}
  // 持有人输入框与字段表里的「公司持有」是同一个值：
  // 用户改了输入框 → 以输入框为准写回字段表；没改 → 用字段表里的（粘贴解析进来的）
  const rowH=rows.find(r=>["公司持有","持有人"].includes(r.k.trim()));
  if(HOLDER_TOUCHED){
    if(rowH)rowH.v=holder;
    else if(holder)rows.push({k:"公司持有",v:holder});
  }else if(rowH){
    holder=(rowH.v||"").trim();
  }
  if(!newNo){alert("证号不能为空");$("#setNo").focus();return}
  if(LICS.some(l=>l.no===newNo&&l.no!==SET_NO)){alert("证号已被别的矿证占用："+newNo);$("#setNo").focus();return}

  const oldNo=SET_NO;
  if(newNo!==oldNo)renameProject(oldNo,newNo);
  SET_NO=newNo;SET_AREA=area_id;
  INFO[newNo]=rows.map(r=>({k:r.k.trim(),v:(r.v||"").trim()}));
  try{localStorage.setItem(INFO_KEY,JSON.stringify(INFO))}
  catch(e){alert("保存失败：本机存储不可用");return}
  setProjectPatch(newNo,{no:newNo,holder,type,status,area_id});
  syncProjectFromInfo(newNo,rows);
  applyEdits();
  if(location.hash!=="#set/"+encodeURIComponent(newNo))location.hash="set/"+encodeURIComponent(newNo);
  DRAFT=null;HIT.clear();render();toast("已保存");
}

async function pickImage(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    try{
      PIMG=await compress(f);
      $("#ppreview").innerHTML=`<div class="prev"><img src="${PIMG}"><button id="pdel">移除</button></div>`;
      $("#pdel").onclick=()=>{PIMG="";$("#ppreview").innerHTML=""};
    }catch(e){alert("图片处理失败："+e.message)}
  };
  inp.click();
}
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("读取失败"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("无法解码图片"));
      img.onload=()=>{
        const max=1200,sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.72));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const SALT="ecobox-lic-2026", CRED="fe46abfec5ffc6da", KEY="lic_auth_until";
function h64(s){
  let x=0xcbf29ce484222325n;
  for(const b of new TextEncoder().encode(s)){x^=BigInt(b);x=(x*0x100000001b3n)&0xffffffffffffffffn}
  return x.toString(16).padStart(16,"0");
}
const authed=()=>{try{return (+localStorage.getItem(KEY)||0)>Date.now()}catch(e){return false}};
function setAuth(keep){try{localStorage.setItem(KEY,String(Date.now()+(keep?30*864e5:12*36e5)))}catch(e){}}

    const g=$("#gate");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");
    btn.disabled=true;setTimeout(()=>btn.disabled=false,600);

});
