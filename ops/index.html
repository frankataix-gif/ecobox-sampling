<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ECOBOX 工作台</title>
<style>
:root{--bg:#f4f5f6;--card:#fff;--card2:#fafbfb;--chip:#eceeef;--ink:#111827;--mut:#6b7280;--line:#e2e5e8;--teal:#111111;--teal2:#111111;--tealsoft:#111111;--tealborder:#111111;--bar:#000;--good:#047857;--blue:#1d4ed8;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
a{color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 90px}
.bar{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -12px 12px}
.bar b{font-size:16px}
.bar .sp{flex:1}
.chip{font-size:12px;color:var(--mut);background:var(--chip);border-radius:999px;padding:3px 9px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
nav button{flex:0 0 auto;border-radius:999px;padding:7px 14px;color:var(--mut)}
nav button.on{background:var(--tealsoft);border-color:var(--tealborder);color:var(--teal2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.kpi b{font-size:22px;letter-spacing:.5px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.row3{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.pill.me{background:var(--tealsoft);color:var(--teal2)}
.hide{display:none!important}
#setup,#login{max-width:380px;margin:8vh auto;padding:0 12px}
#setup .card,#login .card{padding:20px}
#setup h1,#login h1{font-size:19px;margin:0 0 4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ok{color:var(--teal2);font-size:13px;min-height:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:18px 0}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.mod{display:block;width:100%;text-align:left;font:inherit;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px}
.mod:hover{border-color:var(--tealborder)}
.mod:active{background:var(--card2)}
.mod i{font-style:normal;font-size:21px;display:block;margin-bottom:6px;line-height:1}
.mod b{display:block;font-size:14.5px;font-weight:600}
.mod span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.sec{margin:18px 0 8px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.6px}
.hello{margin:4px 0 2px;font-size:15px}
/* 目录磁贴：未开放的模块 */
.mod.soon{opacity:.55;cursor:default;position:relative}
.mod.soon em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--mut)}
.mod.soon b,.mod.soon span{color:var(--mut)}

/* ---------- 财务 ---------- */
.fin-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.fin-kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fin-kpi b{display:block;font-size:17px;margin-top:2px}
.fin-kpi span{font-size:12px;color:var(--mut)}
.fin-bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.fin-bar select{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.fin-list{display:flex;flex-direction:column;gap:8px}
.fin-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.fin-row .d{font-size:12px;color:var(--mut);min-width:44px}
.fin-row .m{flex:1;min-width:0}
.fin-row .m b{font-size:15px}
.fin-row .m p{margin:2px 0 0;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-row .a{text-align:right;font-weight:700;white-space:nowrap}
.fin-row .a small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.fin-row img{width:38px;height:38px;object-fit:cover;border-radius:8px;margin-top:4px;border:1px solid var(--line)}
.fin-out .a{color:var(--bad)}.fin-in .a{color:var(--good)}.fin-float .a{color:var(--blue)}
.fin-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:14px;z-index:60;max-height:88vh;overflow:auto}
.fin-sheet h3{margin:0 0 10px;font-size:15px}
.fin-sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.fin-sheet input,.fin-sheet select,.fin-sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card)}
.fin-sheet .r{display:flex;gap:8px}
.fin-sheet .r>*{flex:1}
.fin-sheet .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fin-sheet .ph img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.fin-dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
.fin-acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.fin-acct .n{font-weight:600}
.fin-acct .g{display:flex;gap:8px;margin-top:6px}
.fin-acct .g>div{flex:1}
.fin-acct input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.fin-acct label{font-size:11px;color:var(--mut);display:block}
.fin-acct b{display:block;font-size:17px;margin-top:1px}
.fin-acct small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.fin-acct .acts{display:flex;gap:8px;margin-top:8px}
.fin-acct .acts button{flex:1;min-height:40px}
.fin-seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}
.fin-seg button{flex:1;border:0;background:transparent;padding:10px;font-size:15px;font-weight:600;color:var(--mut);border-radius:9px}
.fin-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fin-acts{display:flex;gap:8px;margin:10px 0}
.fin-acts button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600}
.fin-acts button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.fin-move .a{color:var(--ink)}
.fin-ptab{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fin-ptab::-webkit-scrollbar{display:none}
.fin-ptab button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.fin-ptab button.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---------- 手机适配 ---------- */
.fin-fab{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(15,118,110,.35)}
@media(max-width:640px){
  .wrap{padding:0 10px calc(96px + env(safe-area-inset-bottom))}
  .bar{padding:calc(10px + env(safe-area-inset-top)) 10px 10px;margin:0 -10px 10px;gap:8px;flex-wrap:wrap}
  .bar b{font-size:15px}
  nav{gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 10px;margin:0 -10px 10px}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:9px 15px;font-size:14px}
  input,select,textarea{font-size:16px;padding:11px 10px}
  button{min-height:42px}
  .row,.row3{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .kpi b{font-size:19px}
  .mods{grid-template-columns:1fr 1fr;gap:8px}
  .mod{padding:12px 10px}
  .mod i{font-size:19px}
  .mod b{font-size:14px}
  .card{padding:12px;border-radius:12px}
  #pane table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  #pane th,#pane td{padding:8px 6px}
  .fin-kpi{gap:8px}
  .fin-kpi b{font-size:16px}
  .fin-bar{flex-wrap:wrap;gap:8px}
  .fin-bar select{font-size:16px;padding:10px}
  #fin_addbar{display:none}
  .fin-fab{display:flex}
  .fin-row{padding:11px 10px;gap:8px}
  .fin-row .m b{font-size:15px}
  .fin-row .a{font-size:15px}
  .fin-row img{width:46px;height:46px}
  .fin-row .d{min-width:40px;font-size:12px}
  .fin-acct{padding:12px}
  .fin-acct .g{gap:10px}
  .fin-seg button{font-size:16px}
  .fin-acts button{font-size:15px;min-height:46px}
  .fin-sheet{padding:14px 14px calc(16px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:92vh}
  .fin-sheet button{min-height:46px}
  .fin-sheet input,.fin-sheet select,.fin-sheet textarea{font-size:16px;padding:11px 10px}
  .fin-dim img{max-width:100%}
}
@media(max-width:380px){.fin-kpi{grid-template-columns:1fr}.mods{grid-template-columns:1fr}}

#back{margin:0 2px 0 -4px;padding:6px 10px;font-size:18px;line-height:1;border-color:transparent}
button.chip{border:1px solid var(--line);background:var(--chip);color:var(--mut);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip:active{background:var(--tealsoft);color:var(--teal2)}
@media(max-width:640px){#back{min-width:42px;min-height:42px;font-size:20px;border:none;background:transparent}}

/* ---------- 操作提示（常驻，不自动消失） ---------- */
.toastbar{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:90;background:#0f766e;color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:600;line-height:1.35;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transition:opacity .18s,transform .18s;width:min(92vw,420px);text-align:center;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.35)}
.toastbar:before{content:"✓ ";font-weight:700}
.toastbar.on{opacity:1;transform:translate(-50%,0)}
.toastbar.bad{background:var(--bad)}
.toastbar.bad:before{content:"! "}
@media(max-width:640px){.toastbar{bottom:calc(86px + env(safe-area-inset-bottom))}}

/* ---------- 更新提示（浮在表面，不进布局） ---------- */
.updbar{display:none;position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:95;background:#0f766e;color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 20px;font:inherit;font-size:14px;font-weight:600;line-height:1.25;box-shadow:0 12px 34px rgba(0,0,0,.32);max-width:92vw;text-align:center;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none}
.updbar.show{display:block;pointer-events:auto}
.updbar.in{opacity:1;transform:translate(-50%,0)}
.updbar.bad{background:var(--bad)}
@media(max-width:640px){.updbar{bottom:calc(86px + env(safe-area-inset-bottom))}}

/* ---------- 动态 ---------- */
#fd_body{width:100%;box-sizing:border-box;border:1px solid var(--line,var(--line));border-radius:11px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;background:var(--card);color:inherit}
.fd-post{margin:0 0 10px}
.fd-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fd-h b{font-size:14.5px}
.fd-h .mut{font-size:12px}
.fd-h .ghost{margin-left:auto;font-size:18px;line-height:1}
.fd-b{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.fd-post .ph{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.fd-post .ph img,.fd-new .ph img{width:auto;height:104px;border-radius:9px;object-fit:cover;background:var(--card2)}

/* ---------- 黑白：顶部黑 / 内容白 / 按钮黑白 ---------- */
.bar{background:var(--bar);border-bottom:1px solid #000;color:#fff}
.bar b{color:#fff}
.bar #back{color:#fff}
.bar .chip{background:rgba(255,255,255,.14);color:#e9edf0}
nav button{background:#fff;color:#4b5563;border-color:var(--line)}
nav button.on{background:#111;border-color:#111;color:#fff;font-weight:600}
button.pri{background:#111;border-color:#111;color:#fff}
button.pri:hover{background:#000}
.mod:hover{border-color:#111}
.pill{background:var(--chip);color:#374151}
.pill.me{background:#111;color:#fff}
.updbar{background:#111;color:#fff;border-color:#000}
.updbar.ok{background:#047857;color:#fff}
.updbar.bad{background:#b91c1c;color:#fff}
.fin-fab{background:#111;color:#fff}
.fin-dim{background:rgba(0,0,0,.45)}
.ok{color:var(--good)}
a{color:#111}
/* ---------- 动态卡片流（适配移动端：触控 ≥44px / 安全区 / 留言体验） ---------- */
.fd-top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.fd-title{font-size:17px;font-weight:700}
.fd-fab{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:56px;height:56px;border-radius:50%;background:#111;color:#fff;font-size:28px;line-height:1;border:0;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:40;display:flex;align-items:center;justify-content:center}
.fd-fab:active{background:#000;transform:scale(.95)}
.fd-post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.fd-h{display:flex;align-items:center;gap:12px}
.fd-av{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 auto}
.fd-meta{flex:1;min-width:0}
.fd-meta b{display:block;font-size:15.5px;line-height:1.3}
.fd-meta span{font-size:12px;color:var(--mut)}
.fd-more{background:transparent;border:0;color:#6b7280;font-size:20px;padding:10px 8px;letter-spacing:2px;line-height:1;min-height:44px;min-width:44px}
.fd-b{margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.65}
.fd-media{display:grid;gap:4px;margin-top:10px}
.fd-media.g1{grid-template-columns:1fr}
.fd-media.g2{grid-template-columns:1fr 1fr}
.fd-media.g3{grid-template-columns:repeat(3,1fr)}
.fd-tile{position:relative;padding:0;border:0;background:#eef1f2;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;display:block;width:100%}
.fd-media.g1 .fd-tile{aspect-ratio:4/3;max-height:440px}
.fd-tile img,.fd-tile video{width:100%;height:100%;object-fit:cover;display:block}
.fd-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;background:rgba(0,0,0,.22)}
.fd-more-n{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.fd-acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.fd-acts button{display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;border:0;color:#4b5563;font-size:14px;min-height:44px;min-width:72px;padding:4px 10px}
.fd-acts button i{font-style:normal;font-size:17px}
.fd-acts button.on{color:#e11d48;font-weight:600}
.fd-acts button.on i{transform:scale(1.1)}
.fd-comments{margin-top:8px;background:#f7f8f8;border-radius:12px;padding:10px 12px}
.fd-c{font-size:13.5px;line-height:1.6;padding:3px 0;display:flex;gap:6px;align-items:baseline}
.fd-c b{color:#111;flex:0 0 auto;font-weight:600}
.fd-c span{flex:1;word-break:break-word;color:#1f2937}
.fd-c em{flex:0 0 auto;font-style:normal;color:#9aa3a8;font-size:11px}
.fd-c .x{border:0;background:transparent;color:#9aa3a8;font-size:15px;padding:6px;line-height:1;min-width:28px;flex:0 0 auto}
.fd-cmore{display:block;border:0;background:transparent;color:#111;font-size:12.5px;font-weight:600;padding:8px 0 4px;margin:0}
.fd-cin{display:flex;gap:8px;margin-top:8px}
.fd-cin input{flex:1;padding:11px 13px;border-radius:22px;border:1px solid var(--line);font-size:16px;background:#fff;min-width:0}
.fd-cin input:focus{outline:none;border-color:#111}
.fd-cin button{padding:10px 16px;font-size:14px;border-radius:22px;flex:0 0 auto;min-height:44px}
.fd-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:70;max-height:88vh;overflow:auto}
.fd-sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fd-sh h3{margin:0;font-size:16px}
.fd-sh button{background:transparent;border:0;color:var(--mut);font-size:14px;padding:8px 4px;min-height:40px}
.fd-sheet textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px;background:#fff;resize:vertical}
.fd-cnt{text-align:right;color:var(--mut);font-size:11.5px;margin:4px 2px 0}
.fd-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fd-thumbs .t{position:relative}
.fd-thumbs img,.fd-thumbs video{width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fd-thumbs .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#111;color:#fff;border:0;font-size:13px;line-height:20px;padding:0}
.fd-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;z-index:80;min-width:140px}
.fd-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;font-size:14px;border-radius:9px;min-height:44px}
.fd-menu button:hover{background:#f3f4f5}
.fd-menu button.dz{color:#b91c1c}
.fd-dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:65}
.fd-tile[data-vid]{background:#14161a}
.fd-view{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:90;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.fd-view video{max-width:96vw;max-height:92vh}
.fd-zoom{display:flex;align-items:center;justify-content:center;max-width:100vw;max-height:100vh;touch-action:none}
.fd-zoom img{max-width:96vw;max-height:92vh;transition:transform .18s ease;will-change:transform}
.fd-view-x{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:24px;line-height:1}

#upd_ver{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:120;background:#111;color:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.32);display:flex;gap:12px;align-items:center;font-size:13px}
#upd_ver button{background:#fff;color:#111;border:0;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
</style>
</head>
<body>

<div id="setup" class="hide">
  <div class="card">
    <h1>ecobox 初始化</h1>
    <p class="mut">第一次使用：用部署时给出的「初始化口令」建第一个管理员账号。</p>
    <form id="sf">
      <label>初始化口令</label><input id="s_token" autocomplete="off" required>
      <div class="row"><div><label>姓名</label><input id="s_name" required></div><div><label>账号（可留空，默认用姓名）</label><input id="s_login" autocomplete="username" placeholder="邮箱 / 手机号 / 姓名"></div></div>
      <label>密码（≥8 位）</label><input id="s_pass" type="password" autocomplete="new-password" required>
      <div class="err" id="s_err"></div>
      <button class="pri" style="width:100%;margin-top:6px">创建管理员</button>
    </form>
  </div>
</div>

<div id="login" class="hide">
  <div class="card">
    <h1>ecobox 经营台账</h1>
    <p class="mut">赞比亚公司日常经营管理 · 每人一个账号</p>
    <form id="lf">
      <label>账号</label><input id="l_login" type="text" autocomplete="username" required placeholder="邮箱 / 手机号 / 姓名">
      <label>密码</label><input id="l_pass" type="password" autocomplete="current-password" required>
      <div class="err" id="l_err"></div>
      <button class="pri" style="width:100%;margin-top:6px">登录</button>
    </form>
    <p class="mut" style="margin:12px 0 0">还没有账号？找管理员开通。</p>
  </div>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <div class="bar">
      <button class="ghost hide" id="back" aria-label="返回目录">←</button>
      <b id="ttl">ECOBOX</b><span class="chip" id="who"></span><span class="sp"></span>
    </div>
    <nav id="tabs"></nav>
    <div id="pane"></div>
  </div>
</div>

<div id="moddlg" class="hide" style="position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50">
  <div class="card" id="modbox" style="max-width:460px;width:100%;max-height:85vh;overflow:auto;margin:0"></div>
</div>

<button id="updbar" class="updbar" type="button"></button>

<script>
const BUILD = "__BUILD__";
let UPD_SEEN = false;
async function checkUpdate() {
  try {
    const r = await fetch("/api/build", { cache: "no-store" });
    const j = await r.json();
    if (j.build && j.build !== BUILD && !UPD_SEEN) {
      UPD_SEEN = true;
      const d = document.createElement("div");
      d.id = "upd_ver";
      d.innerHTML = "<span>有新版本</span><button>立即更新</button>";
      d.querySelector("button").onclick = () => {
        try { caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch (e) {}
        location.reload();
      };
      document.body.appendChild(d);
    }
  } catch (e) {}
}
setInterval(checkUpdate, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
window.addEventListener("focus", checkUpdate);
setTimeout(checkUpdate, 8000);
const S = { user: null, tab: "status", logs: [], users: [], from: "", to: "", editId: 0 };
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d) => d.toISOString().slice(0, 10);
const money = (v) => (v == null ? "-" : (+v).toLocaleString("en-US", { maximumFractionDigits: 2 }));
const num = (v, d = 3) => (v == null ? "-" : (+v).toLocaleString("en-US", { maximumFractionDigits: d }));
const SITES = ["Serenje 1330NW", "Chitambo 1230SE", "Kalomo", "Lusaka 办公室"];

/* ---------- 操作提示 ---------- */
function showUpd(msg, kind) {
  const b = document.getElementById("updbar");
  if (!b) return;
  b.textContent = (kind === "bad" ? "✗ " : "✓ ") + msg;
  b.className = "updbar show " + (kind === "bad" ? "bad" : "ok");
  requestAnimationFrame(() => b.classList.add("in"));
}

function hideUpd() {
  const b = document.getElementById("updbar");
  if (!b) return;
  b.classList.remove("in");
  setTimeout(() => { if (!b.classList.contains("in")) b.classList.remove("show"); }, 200);
}

function toast(msg, kind = "good") {
  showUpd(msg, kind);
}

function resetUpdbar() { hideUpd(); }

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { ...(opts.body ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== "/me") { showLogin(); throw new Error(data.error || "请先登录"); }
  if (!r.ok) throw new Error(data.error || "请求失败 " + r.status);
  if (opts.method && opts.method !== "GET" && !opts.quiet && !/^\/(login|logout|setup)\b/.test(path)) {
    const txt = opts.toast || (opts.method === "DELETE" ? "已删除" : "已保存");
    toast(txt + " · " + new Date().toTimeString().slice(0, 5));
  }
  return data;
}

function showLogin() {
  S.user = null;
  $("#setup").classList.add("hide");
  $("#app").classList.add("hide");
  $("#login").classList.remove("hide");
  $("#l_pass").value = "";
}
function showSetup() {
  $("#login").classList.add("hide");
  $("#app").classList.add("hide");
  $("#setup").classList.remove("hide");
}
async function showApp() {
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#who").textContent = S.user.name + (S.user.role === "admin" ? " · 管理员" : S.user.role === "manager" ? " · 负责人" : "");
  try { MODS = (await api("/modules")).modules || []; } catch (e) { if (!MODS.length) MODS = []; }
  const tabs = [["status", "状态"], ["home", "目录"]];
  for (const g of GROUPS) {
    const ms = groupMods(g);
    if (g !== "系统" && !ms.length) continue;
    tabs.push(["g:" + g, g]);
  }
  $("#tabs").innerHTML = tabs.map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").onclick = (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    enterApp(b.dataset.tab);
  };
  $("#back").onclick = () => goHome();
  $("#updbar").onclick = async () => {
    const b = $("#updbar");
    b.textContent = "刷新中…";
    b.className = "updbar show in";
    try { await render(); showUpd("已刷新到最新"); }
    catch (e) { showUpd(e.message, "bad"); }
    setTimeout(hideUpd, 1000);
  };
  resetUpdbar();
  render();
}


/* ---------- 目录 ---------- */
let MODS = []; // 服务器 /api/modules 下发的模块目录
const allowed = (k) =>
  !!k && !!S.user && (S.user.role === "admin" || (S.user.modules || []).includes(k));
const TAB_KEY = { board: "board", log: "log", users: "users", mine: "mine", fin: "finance" };

function homeHtml() {
  const hour = new Date().getHours();
  const hi = hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : "晚上好";
  const groups = [];
  const byG = {};
  for (const m of MODS) {
    if (!allowed(m.k) || m.navOnly) continue;
    if (m.soon && S.user.role !== "admin") continue; // 还没做的先别给员工看
    if (!byG[m.g]) { byG[m.g] = []; groups.push(m.g); }
    byG[m.g].push(m);
  }
  const secs = groups.map((g) => {
    const cards = byG[g].map((x) => {
      if (x.soon) return `<div class="mod soon"><i>${x.i}</i><b>${esc(x.t)}</b><span>${esc(x.d)}</span><em>待开放</em></div>`;
      return x.tab
        ? `<button class="mod" data-go="${x.tab}"><i>${x.i}</i><b>${esc(x.t)}</b><span>${esc(x.d)}</span></button>`
        : `<a class="mod" href="${x.u}" target="_blank" rel="noopener"><i>${x.i}</i><b>${esc(x.t)}</b><span>${esc(x.d)}</span></a>`;
    }).join("");
    return `<div class="sec">${esc(g)}</div><div class="mods">${cards}</div>`;
  }).join("");
  return `<div class="hello">${hi}，${esc(S.user.name)}</div>
    <div class="mut" style="margin-bottom:4px">选一个模块进去；手机可加到主屏，一个图标就是全部。</div>
    ${secs || '<div class="empty">还没有可用模块，找管理员开通</div>'}`;
}

/* 管理员给某人勾模块 */
function openModPicker(u) {
  const has = u.modules || [];
  const box = $("#modbox");
  box.innerHTML = `<h3 style="margin:0 0 4px">${esc(u.name)} · 可用模块</h3>
    <p class="mut" style="margin:0 0 8px">勾上的才会出现在这个人的目录里。${u.role === "admin" ? "管理员默认全开。" : ""}</p>
    ${MODS.map((m) => `<label style="display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px;color:inherit">
        <input type="checkbox" data-k="${m.k}" style="width:auto" ${has.includes(m.k) ? "checked" : ""} ${m.adminOnly || m.soon ? "disabled" : ""}>
        <span>${m.i} ${esc(m.t)}</span><span class="mut" style="margin-left:auto;text-align:right">${m.soon ? "待开放" : esc(m.d)}</span>
      </label>`).join("")}
    <div class="err" id="mod_err"></div>
    <div class="acts" style="margin-top:12px"><button class="pri" id="mod_save">保存</button><button class="ghost" id="mod_close">关闭</button></div>`;
  $("#moddlg").classList.remove("hide");
  $("#mod_close").onclick = () => $("#moddlg").classList.add("hide");
  $("#mod_save").onclick = async () => {
    $("#mod_err").textContent = "";
    const keys = [...box.querySelectorAll("input[data-k]")].filter((x) => x.checked).map((x) => x.dataset.k);
    try {
      await patchUser(u.id, { modules: keys });
      if (u.id === S.user.id) S.user = (await api("/me")).user;
      S.users = (await api("/users")).users;
      $("#moddlg").classList.add("hide");
      await showApp();
    } catch (e) { $("#mod_err").textContent = e.message; }
  };
}

/* ---------- 看板 ---------- */
async function loadBoard() {
  if (!S.from) { const d = new Date(); S.from = iso(new Date(d.getFullYear(), d.getMonth(), 1)); S.to = iso(d); }
  const [sum, ls] = await Promise.all([
    api(`/summary?from=${S.from}&to=${S.to}`),
    api(`/logs?from=${S.from}&to=${S.to}`),
  ]);
  S.logs = ls.logs;
  return sum;
}

function boardHtml(sum) {
  const t = sum.totals || {};
  const siteRows = (sum.by_site || []).map((r) => `<tr><td>${esc(r.site)}</td><td class="n">${r.entries}</td><td class="n">${num(r.man_days, 0)}</td><td class="n">${num(r.ore_t, 1)}</td><td class="n">${money(r.cost_usd)}</td></tr>`).join("");
  const recent = S.logs.slice(0, 12).map((l) => `<tr><td>${esc(l.day)}</td><td>${esc(l.site)}</td><td class="n">${num(l.ore_t, 1)}</td><td class="n">${num(l.headcount, 0)}</td><td>${esc(l.user_name)}</td></tr>`).join("");
  return `<div class="card">
    <div class="row" style="align-items:end">
      <div><label>从</label><input type="date" id="f_from" value="${S.from}"></div>
      <div><label>到</label><input type="date" id="f_to" value="${S.to}"></div>
    </div>
  </div>
  <div class="grid">
    <div class="kpi"><i>记录天数</i><b>${num(t.days, 0)}</b></div>
    <div class="kpi"><i>人·天</i><b>${num(t.man_days, 0)}</b></div>
    <div class="kpi"><i>矿石（吨）</i><b>${num(t.ore_t, 1)}</b></div>
    <div class="kpi"><i>支出（USD）</i><b>${money(t.cost_usd)}</b></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>按矿区</h3>
    ${siteRows ? `<table><tr><th>矿区/项目</th><th>记录</th><th>人·天</th><th>矿石吨</th><th>USD</th></tr>${siteRows}</table>` : `<div class="empty">这段时间还没有记录</div>`}
  </div>
  <div class="card"><h3>最近记录</h3>
    ${recent ? `<table><tr><th>日期</th><th>矿区</th><th>矿石</th><th>人数</th><th>录入</th></tr>${recent}</table>` : `<div class="empty">还没有记录</div>`}
  </div>`;
}

/* ---------- 日报 ---------- */
function logForm(l) {
  const d = l || { day: iso(new Date()), site: S.user.site || SITES[0], shift: "白班", crew: "", headcount: "", ore_t: "", waste_t: "", grade: "", cost_usd: "", note: "" };
  return `<div class="card">
    <h3>${l ? "修改记录 #" + l.id : "新增日报"}</h3>
    <div class="row">
      <div><label>日期</label><input type="date" id="d_day" value="${esc(d.day)}"></div>
      <div><label>矿区/项目</label><input id="d_site" list="sites" value="${esc(d.site)}"></div>
    </div>
    <datalist id="sites">${SITES.map((s) => `<option>${esc(s)}</option>`).join("")}</datalist>
    <div class="row3">
      <div><label>班次</label><select id="d_shift">${["白班", "夜班", "全天"].map((x) => `<option${x === d.shift ? " selected" : ""}>${x}</option>`).join("")}</select></div>
      <div><label>班组</label><input id="d_crew" value="${esc(d.crew)}" placeholder="选填"></div>
      <div><label>出勤人数</label><input id="d_people" type="number" min="0" step="1" value="${esc(d.headcount)}"></div>
    </div>
    <div class="row3">
      <div><label>矿石（吨）</label><input id="d_ore" type="number" min="0" step="0.1" value="${esc(d.ore_t)}"></div>
      <div><label>废石（吨）</label><input id="d_waste" type="number" min="0" step="0.1" value="${esc(d.waste_t)}"></div>
      <div><label>支出（USD）</label><input id="d_cost" type="number" min="0" step="0.01" value="${esc(d.cost_usd)}"></div>
    </div>
    <label>品位 / 品级</label><input id="d_grade" value="${esc(d.grade)}" placeholder="例：Ta2O5 180 ppm">
    <label>备注</label><textarea id="d_note" placeholder="今天做了什么、有什么问题">${esc(d.note)}</textarea>
    <div class="err" id="d_err"></div>
    <div class="acts" style="margin-top:10px">
      <button class="pri" id="d_save">${l ? "保存修改" : "提交"}</button>
      ${l ? `<button id="d_cancel">取消</button>` : ""}
    </div>
  </div>`;
}

function logListHtml() {
  if (!S.logs.length) return `<div class="card"><div class="empty">这段时间还没有记录</div></div>`;
  const rows = S.logs.slice(0, 60).map((l) => {
    const mine = l.user_id === S.user.id;
    return `<tr>
      <td>${esc(l.day)}<div class="mut">${esc(l.site)} · ${esc(l.shift)}</div></td>
      <td class="n">${num(l.ore_t, 1)}<div class="mut">${num(l.headcount, 0)} 人</div></td>
      <td>${esc(l.note || "").slice(0, 40)}<div class="mut">${esc(l.user_name)}${mine ? ' <span class="pill me">我</span>' : ""}</div></td>
      <td class="n" style="white-space:nowrap">
        ${(mine || S.user.role !== "staff") ? `<button data-edit="${l.id}" style="padding:4px 8px">改</button> <button class="danger" data-del="${l.id}" style="padding:4px 8px">删</button>` : ""}
      </td></tr>`;
  }).join("");
  return `<div class="card"><h3>记录（${S.logs.length}）</h3><table>
    <tr><th>日期 / 矿区</th><th>矿石 / 人数</th><th>内容 / 录入</th><th></th></tr>${rows}</table></div>`;
}

/* ---------- 人员 ---------- */
function usersHtml() {
  const rows = S.users.map((u) => `<tr>
    <td>${esc(u.name)}${u.active ? "" : ' <span class="pill">停用</span>'}<div class="mut">${esc(u.login)}</div></td>
    <td><select data-role="${u.id}">${[["staff", "员工"], ["manager", "负责人"], ["admin", "管理员"]].map(([v, t]) => `<option value="${v}"${u.role === v ? " selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><input data-site="${u.id}" value="${esc(u.site)}" placeholder="矿区" style="padding:6px 8px"></td>
    <td style="white-space:nowrap">
      <button data-mods="${u.id}" style="padding:4px 8px">权限</button>
      <button data-pwd="${u.id}" style="padding:4px 8px">改密码</button>
      <button data-active="${u.id}" style="padding:4px 8px">${u.active ? "停用" : "启用"}</button>
    </td></tr>`).join("");
  return `<datalist id="sites">${SITES.map((s) => `<option>${esc(s)}</option>`).join("")}</datalist>
  <div class="card"><h3>新增账号</h3>
    <div class="row"><div><label>姓名</label><input id="u_name"></div><div><label>账号</label><input id="u_login" placeholder="可留空，默认用姓名"></div></div>
    <div class="row"><div><label>初始密码（≥8 位）</label><input id="u_pass" type="text"></div><div><label>角色</label><select id="u_role"><option value="staff">员工</option><option value="manager">负责人</option><option value="admin">管理员</option></select></div></div>
    <div class="row"><div><label>矿区</label><input id="u_site" list="sites" placeholder="选填"></div><div><label>电话</label><input id="u_phone" placeholder="选填"></div></div>
    <div class="ok" id="u_ok"></div><div class="err" id="u_err"></div>
    <button class="pri" id="u_add" style="margin-top:8px">开通账号</button>
  </div>
  <div class="card"><h3>账号（${S.users.length}）</h3>
    <table><tr><th>姓名</th><th>角色</th><th>矿区</th><th></th></tr>${rows}</table>
    <p class="mut">员工只能改自己录的日报；负责人和管理员能改全部；只有管理员能管账号。</p>
  </div>`;
}

/* ---------- 我的 ---------- */
function mineHtml() {
  return `<div class="card"><h3>我的账号</h3>
    <table>
      <tr><th>姓名</th><td>${esc(S.user.name)}</td></tr>
      <tr><th>账号</th><td>${esc(S.user.login)}</td></tr>
      <tr><th>角色</th><td>${S.user.role === "admin" ? "管理员" : S.user.role === "manager" ? "负责人" : "员工"}</td></tr>
      <tr><th>矿区</th><td>${esc(S.user.site || "—")}</td></tr>
      <tr><th>上次登录</th><td>${esc((S.user.last_login || "").slice(0, 16).replace("T", " ") || "—")}</td></tr>
    </table></div>
  <div class="card"><h3>改密码</h3>
    <label>原密码</label><input id="p_old" type="password">
    <label>新密码（≥8 位）</label><input id="p_new" type="password">
    <div class="err" id="p_err"></div><div class="ok" id="p_ok"></div>
    <button class="pri" id="p_save" style="margin-top:8px">保存</button>
    <p class="mut">改完其它设备上的登录会失效，需要用新密码重登。</p>
  </div>
  <div class="card"><h3>关于</h3><p class="mut" style="margin:0">页面版本 ${esc(BUILD)}</p></div>
  <div class="card"><h3>退出</h3>
    <p class="mut" style="margin:0 0 8px">退出后需要重新用账号密码登录。</p>
    <button class="danger" id="p_out" style="width:100%">退出登录</button>
  </div>`;
}


/* ---------- 财务 ---------- */
let FIN = null;
let FINM = "";
let FINPH = [];
let FINWHO = ""; // "" = 我自己；"ALL" = 全部汇总；其它 = 某个人的账本
try {
  const v = JSON.parse(localStorage.getItem("ops_fin_view") || "{}");
  if (v.month) FINM = v.month;
  if (v.who) FINWHO = v.who;
} catch (e) {}
const saveFinView = () => {
  try { localStorage.setItem("ops_fin_view", JSON.stringify({ who: FINWHO, month: FINM })); } catch (e) {}
};
const FIN_CAT_ZH = { transport: "交通", daily: "日常", postage: "邮费", office: "办公", tip: "小费", loan: "借款",
  serenje: "塞伦杰项目", meal: "餐费", fuel: "加油", lodging: "住宿", comms: "通讯", misc: "杂费", pliving: "生活用品", other: "其它" };
const finMoney = (n) => (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const finCatName = (k) => {
  if (!k) return "未分类";
  if (String(k).startsWith("u:")) return String(k).slice(2);
  return (FIN && FIN.cats && FIN.cats.names && FIN.cats.names[k]) || FIN_CAT_ZH[k] || k;
};
const finKindName = (k) => (k === "in" ? "收入" : k === "float" ? "备用金" : k === "move" ? "内部转账" : "支出");

/* 账户：对账余额 + 之后的流入/流出，拆成「来源 − 花费 = 剩余」 */
function finAcct(uid) {
  const a = (FIN.accounts || []).find((x) => x.uid === uid) || {};
  const since = a.since || "";
  const src = { cash: Number(a.cash) || 0, card: Number(a.card) || 0 };
  const out = { cash: 0, card: 0 };
  const chOf = (ch) => (ch === "card" ? "card" : "cash");
  for (const e of FIN.entries) {
    if (since && String(e.date) <= since) continue;
    const amt = Number(e.amount) || 0;
    const ch = chOf(e.ch);
    if (e.kind === "float") {
      if (e.to_uid === uid) src[ch] += amt;      // 收到备用金 → 现金来源
      if (e.uid === uid) out[ch] += amt;         // 发出备用金 → 花费
    } else if (e.kind === "move") {
      if (e.uid === uid) { const to = ch === "card" ? "cash" : "card"; out[ch] += amt; src[to] += amt; }
    } else if (e.uid === uid) {
      if (e.kind === "in") src[ch] += amt; else out[ch] += amt;
    }
  }
  return { cash: src.cash - out.cash, card: src.card - out.card, src, out, since, name: a.name };
}
const finBalance = (uid) => { const a = finAcct(uid); return { cash: a.cash, card: a.card }; };

/* 某人手上还有多少备用金：收到的备用金 − 收到之后他自己的支出（备用金本身不算花费） */
function finFloatOf(uid) {
  const got = (FIN.entries || []).filter((e) => e.kind === "float" && e.to_uid === uid);
  if (!got.length) return null;
  const since = got.map((e) => String(e.date || "")).sort()[0] || "";
  const used = (FIN.entries || []).filter((e) => e.uid === uid && e.kind === "out" && String(e.date || "") >= since);
  return {
    got: got.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    used: used.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    giver: got[0].uid, since,
  };
}

const finPeople = () => {
  const us = (FIN.users || []).map((u) => ({ login: u.login, name: u.name, role: u.role, ghost: false }));
  const known = new Set(us.map((u) => u.login));
  for (const a of FIN.accounts || []) {
    if (!known.has(a.uid)) us.push({ login: a.uid, name: a.name || a.uid, role: "", ghost: true });
  }
  return us.length ? us : [{ login: FIN.me.uid, name: FIN.me.name, role: FIN.me.role }];
};
const finNameOf = (uid) => {
  const u = (FIN.users || []).find((x) => x.login === uid);
  return (u && u.name) || uid;
};

function finView(src) {
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.style.display = "flex";
  box.style.alignItems = "center";
  box.style.justifyContent = "center";
  box.innerHTML = `<img src="${src}" style="max-width:94%;max-height:92%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

async function loadFin() {
  FIN = await api("/fin/bootstrap");
  if (!FINM) FINM = new Date().toISOString().slice(0, 7);
}

function finHtml() {
  const who = FINWHO || FIN.me.uid;
  const isAll = FINWHO === "ALL";
  const isMe = !FINWHO;                 // 空 = 我自己
  const ro = !isMe && !isAll;           // 点某个人 = 只读（只看看，不能改）
  const canAll = FIN.canAll;
  const mine = (e) => e.uid === who || e.to_uid === who;   // 自己的账本：自己花的 + 收到的备用金
  const scoped = isAll ? FIN.entries : FIN.entries.filter(mine);
  const months = [...new Set(scoped.map((e) => String(e.date).slice(0, 7)))].sort().reverse();
  const list = scoped.filter((e) => !FINM || String(e.date).startsWith(FINM));
  const sum = { out: 0, in: 0, float: 0 };
  for (const e of list) sum[e.kind] = (sum[e.kind] || 0) + (Number(e.amount) || 0);

  const rows = list.map((e) => {
    const ph = (e.photos || []).slice(0, 3).map((k) => `<img src="/api/fin/photo/${k}" data-finview="/api/fin/photo/${k}" alt="">`).join("");
    let whoTxt = esc(e.uid), sign = "-", label = finKindName(e.kind), title = esc(finCatName(e.cat));
    if (e.kind === "float") {
      whoTxt = `${esc(e.by_name || e.uid)} → ${esc(e.to_uid || "")}`;
      sign = e.to_uid === who ? "+" : "-";
      label = e.to_uid === who ? "收到备用金" : "发出备用金";
      title = "备用金";
    } else if (e.kind === "move") {
      sign = "⇄";
      const out = e.ch === "card";
      title = out ? "取现" : "存现";
      label = out ? "银行 → 现金" : "现金 → 银行";
    } else {
      sign = e.kind === "in" ? "+" : "-";
    }
    return `<div class="fin-row fin-${e.kind}">
      <div class="d">${esc(String(e.date).slice(5))}</div>
      <div class="m"><b>${title}</b>
        <p>${whoTxt} · ${e.ch === "card" ? "银行" : "现金"}${e.note ? " · " + esc(e.note) : ""}</p>
        ${ph ? `<div class="ph">${ph}</div>` : ""}</div>
      <div class="a">${sign}${finMoney(e.amount)}<small>${esc(label)}</small></div>
      ${FIN.owner ? `<button class="ghost" data-findel="${e.id}" title="删除">×</button>` : ""}
    </div>`;
  }).join("");

  const roleLabel = (p) => (p.ghost ? "历史账户" : p.role === "admin" ? "管理员" : p.role === "manager" ? "负责人" : "员工");
  const acctCard = (p) => {
    const a = finAcct(p.login);
    const row = (FIN.accounts || []).find((x) => x.uid === p.login) || {};
    const acts = [];
    if (FIN.owner) acts.push(`<button class="ghost" data-recon="${esc(p.login)}">对账</button>`);
    if (FIN.owner) acts.push(`<button class="ghost" data-give="${esc(p.login)}">给员工</button>`);
    return `<div class="fin-acct" data-acct="${esc(p.login)}">
      <div class="n">${esc(p.name || p.login)} <span class="mut">${esc(roleLabel(p))}${row.since ? " · 对账 " + esc(row.since) : ""}</span></div>
      <div class="g">
        <div><label>现金</label><b>${finMoney(a.cash)}</b><small>来源 ${finMoney(a.src.cash)} − 花费 ${finMoney(a.out.cash)}</small></div>
        <div><label>银行</label><b>${finMoney(a.card)}</b><small>来源 ${finMoney(a.src.card)} − 花费 ${finMoney(a.out.card)}</small></div>
      </div>
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}
    </div>`;
  };
  const people = finPeople();
  const personCard = () => acctCard(people.find((p) => p.login === who) || { login: who, name: finNameOf(who), role: "", ghost: false });
  const acctHtml = isAll ? "" : `<div class="sec">${isMe ? "我的账户" : esc(finNameOf(who)) + " 账户"}</div>` + personCard();

  const withAcct = (FIN.accounts || []).filter((a) => Number(a.cash) || Number(a.card));
  const scopeChips = [`<button data-fscope="" class="${isMe ? "on" : ""}">我</button>`];
  if (canAll) {
    scopeChips.push(`<button data-fscope="ALL" class="${isAll ? "on" : ""}">全部</button>`);
    for (const a of withAcct) {
      const p = people.find((x) => x.login === a.uid) || { login: a.uid, name: a.name || a.uid, role: "", ghost: true };
      scopeChips.push(`<button data-fscope="${esc(p.login)}" class="${FINWHO === p.login ? "on" : ""}">${esc(p.name || p.login)}</button>`);
    }
  }
  const tabs = `<div class="fin-ptab">${scopeChips.join("")}</div>`;

  const actions = !ro ? `<div class="fin-acts">
    ${!isAll ? `<button id="fin_add" class="pri">＋ 记一笔</button>` : ""}
    <button id="fin_move">🔁 取现</button>
    ${FIN.owner ? `<button id="fin_give">🤝 给员工</button>` : ""}
  </div>` : "";

  const roHint = ro ? `<div class="mut" style="margin:0 0 8px">🔒 只读 · ${esc(finNameOf(who))}</div>` : "";

  const floatUids = isAll ? people.map((p) => p.login) : [who];
  const floats = floatUids.map((uid) => [uid, finFloatOf(uid)]).filter(([, f]) => f);
  const floatHtml = floats.length ? `<div class="fin-acct">
    <div class="n">🧾 员工往来（备用金）</div>
    ${floats.map(([uid, f]) => `<div class="g" style="margin-top:8px"><div><label>${esc(finNameOf(uid))}</label><b>${finMoney(f.got - f.used)}</b><small>收到 ${finMoney(f.got)}（来自 ${esc(finNameOf(f.giver))}） − 已花 ${finMoney(f.used)}</small></div></div>`).join("")}
    <div class="mut" style="margin-top:6px">收到备用金 − 之后的支出 = 手上还剩多少；备用金本身不算花费。</div>
  </div>` : "";

  return `${tabs}${roHint}
    ${acctHtml}
    ${floatHtml}
    ${actions}
    <div class="fin-bar"><select id="fin_m"><option value="">全部月份</option>${months.map((m) => `<option value="${m}" ${m === FINM ? "selected" : ""}>${m}</option>`).join("")}</select></div>
    <div class="fin-kpi">
      <div><span>${isAll ? "全部" : esc(finNameOf(who))} · ${FINM || "全部月份"} 支出</span><b>${finMoney(sum.out)}</b></div>
      <div><span>收入</span><b>${finMoney(sum.in)}</b></div>
      <div><span>备用金流转</span><b>${finMoney(sum.float)}</b></div>
      <div><span>笔数</span><b>${list.length}</b></div>
    </div>
    <div class="fin-list">${rows || '<div class="empty">这个月还没有记录</div>'}</div>
    ${!ro && !isAll ? `<button class="fin-fab" id="fin_add2">＋ 记一笔</button>` : ""}
    ${FIN.owner && !ro ? `<div class="sec">设置</div>
      <div class="fin-acct"><div class="n">期初余额</div>
        <div class="g">
          <div><label>日期</label><input type="date" id="fo_date" value="${esc(FIN.opening.date || "")}"></div>
          <div><label>现金</label><input type="number" id="fo_cash" value="${FIN.opening.cash || 0}"></div>
          <div><label>银行</label><input type="number" id="fo_card" value="${FIN.opening.card || 0}"></div>
        </div>
        <div class="acts"><button class="ghost" id="fo_save">保存期初</button>
        <button class="ghost" id="fin_cats">改分类</button></div>
      </div>` : ""}`;
}

function finSheet(forceGiver, presetKind) {
  const canAll = FIN.canAll;
  const viewUid = FINWHO && FINWHO !== "ALL" ? FINWHO : FIN.me.uid;
  const people = canAll ? finPeople().map((u) => u.login) : [FIN.me.uid];
  const cats = [...(FIN.cats.life || []), ...(FIN.cats.project || [])];
  const builtin = Object.keys(FIN_CAT_ZH).map((k) => `${k}`);
  const opts = [...new Set([...cats, ...builtin, "u:员工工资", "u:员工补贴"])]
    .map((k) => `<option value="${esc(k)}">${esc(finCatName(k))}</option>`).join("");
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet">
    <h3>记一笔</h3>
    <label>类型</label>
    <select id="ff_kind"><option value="out">支出</option><option value="in">收入</option>${FIN.owner ? `<option value="float">发备用金</option>` : ""}</select>
    <div class="r" style="margin-top:8px">
      <div><label>金额 ZMW</label><input id="ff_amt" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>日期</label><input id="ff_date" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    </div>
    <div id="ff_out">
      <label>分类</label><select id="ff_cat">${opts}</select>
      <div class="r" style="margin-top:8px">
        <div><label>归属</label><select id="ff_ft"><option value="life">生活</option><option value="project">项目</option></select></div>
        <div><label>渠道</label><select id="ff_ch"><option value="cash">现金</option><option value="card">银行</option></select></div>
      </div>
      ${canAll ? `<label>记在谁名下</label><select id="ff_uid">${people.map((p) => `<option value="${esc(p)}" ${p === viewUid ? "selected" : ""}>${esc(finNameOf(p))}</option>`).join("")}</select>` : ""}
    </div>
    <div id="ff_fl" class="hide">
      <div class="r"><div><label>从谁出</label><select id="ff_giver">${people.map((p) => `<option value="${esc(p)}" ${p === viewUid ? "selected" : ""}>${esc(finNameOf(p))}</option>`).join("")}</select></div>
      <div><label>从哪个口</label><select id="ff_from"><option value="cash">现金</option><option value="card">银行</option></select></div></div>
      <label>发给谁</label><select id="ff_to">${people.filter((p) => p !== viewUid).map((p) => `<option value="${esc(p)}">${esc(finNameOf(p))}</option>`).join("")}</select>
    </div>
    <label>备注</label><input id="ff_note" placeholder="比如：去矿区打车">
    <label>单据照片（最多 6 张）</label>
    <input id="ff_file" type="file" accept="image/*" capture="environment" multiple>
    <div class="ph" id="ff_ph"></div>
    <p class="mut" id="ff_msg" style="min-height:1em;margin:8px 0 0"></p>
    <div class="r" style="margin-top:8px"><button class="ghost" id="ff_x">取消</button><button id="ff_save">保存</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#ff_x", box).onclick = close;
  const setKind = (k) => { const fl = k === "float"; $("#ff_kind", box).value = k; $("#ff_out", box).classList.toggle("hide", fl); $("#ff_fl", box).classList.toggle("hide", !fl); };
  if (forceGiver || presetKind) { setKind(forceGiver ? "float" : presetKind);
    if ($("#ff_giver", box)) $("#ff_giver", box).value = forceGiver || viewUid; }
  $("#ff_kind", box).onchange = (e) => {
    const fl = e.target.value === "float";
    $("#ff_out", box).classList.toggle("hide", fl);
    $("#ff_fl", box).classList.toggle("hide", !fl);
  };
  FINPH = [];
  $("#ff_file", box).onchange = async (e) => {
    for (const f of [...e.target.files].slice(0, 6 - FINPH.length)) {
      const key = await finUpload(f, $("#ff_msg", box));
      if (key) FINPH.push(key);
    }
    $("#ff_ph", box).innerHTML = FINPH.map((k) => `<img src="/api/fin/photo/${k}">`).join("");
  };
  $("#ff_save", box).onclick = async () => {
    const kind = $("#ff_kind", box).value;
    const b = {
      kind,
      amount: +$("#ff_amt", box).value,
      date: $("#ff_date", box).value,
      note: $("#ff_note", box).value,
      photos: FINPH,
      cat: kind === "float" ? "" : $("#ff_cat", box).value,
      ft: kind === "float" ? "life" : $("#ff_ft", box).value,
      ch: kind === "float" ? $("#ff_from", box).value : $("#ff_ch", box).value,
      to_uid: kind === "float" ? $("#ff_to", box).value : "",
      uid: kind === "float" ? ($("#ff_giver", box) ? $("#ff_giver", box).value : viewUid)
        : (canAll && $("#ff_uid", box) ? $("#ff_uid", box).value : viewUid),
    };
    try {
      await api("/fin/entries", { method: "POST", body: b, toast: kind === "float" ? "备用金已记录" : "已记账 " + finMoney(b.amount) + " ZMW" });
      close(); await loadFin(); render();
    } catch (err) { $("#ff_msg", box).textContent = err.message; }
  };
}

async function finUpload(file, msgEl, dir) {
  const data = await new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => res("");
    img.src = URL.createObjectURL(file);
  });
  if (!data) return "";
  try {
    return (await api("/fin/photo", { method: "POST", body: { data, dir: dir || "" }, quiet: true })).key;
  } catch (e) { if (msgEl) msgEl.textContent = "照片没传上：" + e.message; return ""; }
}

async function finRecon(uid) {
  const b = finBalance(uid);
  const c = prompt(finNameOf(uid) + " 实际现金余额（ZMW）", String(b.cash.toFixed(2)));
  if (c === null) return;
  const k = prompt(finNameOf(uid) + " 实际银行余额（ZMW）", String(b.card.toFixed(2)));
  if (k === null) return;
  const row = (FIN.accounts || []).find((x) => x.uid === uid) || {};
  await api("/fin/accounts/" + encodeURIComponent(uid), { method: "PUT", body: {
    name: finNameOf(uid), bank: row.bank || "", card_no: row.card_no || "",
    cash: Number(c) || 0, card: Number(k) || 0, since: new Date().toISOString().slice(0, 10),
  }, toast: "余额已更新" });
  await loadFin(); render();
}

async function finSaveAcct(uid) {
  const el = document.querySelector(`[data-acct="${uid}"]`);
  const v = (f) => el.querySelector(`[data-f="${f}"]`).value;
  await api("/fin/accounts/" + encodeURIComponent(uid), {
    method: "PUT",
    body: { cash: +v("cash"), card: +v("card"), since: v("since"), name: (FIN.accounts.find((a) => a.uid === uid) || {}).name || uid },
  });
  await loadFin(); render();
}

function bindFin() {
  const pane = $("#pane");
  pane.querySelectorAll("[data-fscope]").forEach((b) => b.onclick = () => { FINWHO = b.dataset.fscope; saveFinView(); S.editId = 0; render(); });
  const m = $("#fin_m");
  if (m) m.onchange = (e) => { FINM = e.target.value; saveFinView(); render(); };
  const add = $("#fin_add");
  if (add) add.onclick = () => finSheet();
  const mv = $("#fin_move");
  if (mv) mv.onclick = () => finMoveSheet();
  const gv = $("#fin_give");
  if (gv) gv.onclick = () => finSheet(undefined, "float");
  const fab = $("#fin_add2");
  if (fab) fab.onclick = () => finSheet();
  pane.querySelectorAll("[data-finview]").forEach((img) => img.onclick = () => finView(img.dataset.finview));
  pane.querySelectorAll("[data-recon]").forEach((b) => b.onclick = () => finRecon(b.dataset.recon).catch((e) => toast(e.message, "bad")));
  pane.querySelectorAll("[data-give]").forEach((b) => b.onclick = () => finSheet(b.dataset.give));
  pane.querySelectorAll("[data-findel]").forEach((b) => b.onclick = async () => {
    if (!confirm("删除这条记录？")) return;
    await api("/fin/entries/" + b.dataset.findel, { method: "DELETE", toast: "记录已删除" });
    await loadFin(); render();
  });
  const fo = $("#fo_save");
  if (fo) fo.onclick = async () => {
    await api("/fin/opening", { method: "PUT", toast: "期初已保存", body: { date: $("#fo_date").value, cash: +$("#fo_cash").value, card: +$("#fo_card").value } });
    await loadFin(); render();
  };
  const fc = $("#fin_cats");
  if (fc) fc.onclick = async () => {
    const life = prompt("生活类分类（逗号分隔）", (FIN.cats.life || []).join(","));
    if (life === null) return;

let FEED = null;

/* ---------- 动态：卡片流 ---------- */
const mediaSrc = (u) => (/^https?:\/\//.test(u) ? u : "/api/fin/photo/" + u);
const mediaList = (p) => (p.photos || []).map((m) => (typeof m === "string" ? { t: "i", u: m } : m)).filter((m) => m && m.u);
const KIND = { company: "🏢 公司", prod: "⛏ 生产", export: "🚢 出口" };
const whenOf = (p) => { const raw = String(p.created_at || ""); return raw.slice(11, 16) === "00:00" ? raw.slice(0, 10) : raw.replace("T", " ").slice(0, 16); };
const ago = (t) => { if (!t) return ""; const d = Date.now() - new Date(t).getTime(); if (d < 60000) return "刚刚"; if (d < 3600000) return Math.floor(d / 60000) + " 分钟前"; if (d < 86400000) return Math.floor(d / 3600000) + " 小时前"; if (d < 604800000) return Math.floor(d / 86400000) + " 天前"; return String(t || "").slice(0, 10); };
const fb = (u) => (u.startsWith("feed/old/") ? ` onerror="this.onerror=null;this.src='/api/feed/img/${u.slice(9)}'"` : "");
const FD_EXP = new Set();
const FD_OPEN = new Set();
const meId = () => S.user.login || S.user.uid;

function feedHtml() {

function mediaHtml(p) {
  const list = mediaList(p);
  if (!list.length) return "";
  const cls = list.length === 1 ? "g1" : list.length === 2 ? "g2" : "g3";
  const tiles = list.slice(0, 9).map((m, i) => {
    const src = mediaSrc(m.u);
    const more = i === 8 && list.length > 9 ? `<span class="fd-more-n">+${list.length - 9}</span>` : "";
    return m.t === "v"
      ? `<button class="fd-tile" data-vid="${esc(src)}"><video src="${esc(src)}" preload="none" muted playsinline></video><span class="fd-play">▶</span>${more}</button>`
      : `<button class="fd-tile" data-img="${esc(src)}"><img src="${esc(src)}" loading="lazy" alt=""${fb(m.u)}>${more}</button>`;
  }).join("");
  return `<div class="fd-media ${cls}">${tiles}</div>`;
}

function cmtHtml(p) {

  const rows = vis.map(([c, i]) => `<div class="fd-c"><b>${esc(c.by || "")}</b><span>${esc(c.text || "")}</span><em>${esc(ago(c.at))}</em>${

    : "";
  return `<div class="fd-comments">${rows}${moreBtn}

function postHtml(p) {

function bindPost(el) {

function thumbVideos() {
  const load = (v) => { if (v.dataset.tried) return; v.dataset.tried = "1"; v.preload = "metadata"; v.load(); };
  document.querySelectorAll(".fd-tile[data-vid] video").forEach((v) => {
    if (v.dataset.tried) return;
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) {} }, { once: true });
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { load(v); io.disconnect(); } }), { rootMargin: "300px" });
      io.observe(v.closest(".fd-tile"));
    } else load(v);
  });
}

function drawFeed() {
  const el = $("#fd_list");
  if (!el) return;
  el.innerHTML = (FEED && FEED.length) ? FEED.map(postHtml).join("") : '<div class="empty">还没有动态，点右下角 ＋ 发第一条</div>';
  el.querySelectorAll(".fd-post").forEach(bindPost);

  const p = (FEED || []).find((x) => x.id === id);

  const el = document.querySelector(`.fd-post[data-id="${id}"]`);
  if (!el) return;
  el.outerHTML = postHtml(p);
  const next = document.querySelector(`.fd-post[data-id="${id}"]`);

  thumbVideos();
}

function toggleCmt(id) {

  refreshPost(id);

}

async function likePost(id) {
  const p = (FEED || []).find((x) => x.id === id);
  if (!p) return;
  const me = meId();
  const liked = (p.likes || []).includes(me);
  p.likes = liked ? p.likes.filter((x) => x !== me) : (p.likes || []).concat([me]);

  try { await api("/feed/" + encodeURIComponent(id) + "/like", { method: "POST", quiet: true }); }

async function sendComment(id) {
  const inp = document.querySelector(`[data-cin="${id}"]`);
  const text = (inp && inp.value || "").trim();
  if (!text) { if (inp) inp.focus(); return; }
  const p = (FEED || []).find((x) => x.id === id);
  const me = meId();
  if (p) { p.comments = (p.comments || []).concat([{ uid: me, by: S.user.name || me, text, at: new Date().toISOString() }]); FD_EXP.add(id); refreshPost(id); }
  if (inp) inp.value = "";
  try { await api("/feed/" + encodeURIComponent(id) + "/comment", { method: "POST", body: { text }, quiet: true }); }
  catch (e) { toast("留言没发出去，重试一下", "bad"); await loadFeed(); }

async function delComment(spec) {
  const [id, i] = spec.split(":");
  const p = (FEED || []).find((x) => x.id === id);

function drawDraft() {
  const box = $("#fd_ph");
  if (!box) return;
  box.innerHTML = FD_DRAFT.map((m, i) => `<div class="t">${

  }<button class="x" data-rm="${i}">×</button></div>`).join("");
  box.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { FD_DRAFT.splice(+b.dataset.rm, 1); drawDraft(); }));

function closeSheet() { ["fd_dim", "fd_sheet"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); }

async function sendPost() {
  const t = ($("#fd_body").value || "").trim();
  if (!t && !FD_DRAFT.length) { toast("写点内容再发", "bad"); return; }
  const btn = $("#fd_send");
  btn.disabled = true;
  try {
    if (FD_EDIT) {
      await api("/feed/" + encodeURIComponent(FD_EDIT.id), { method: "PATCH", body: { body: t, photos: FD_DRAFT }, toast: "已保存" });
    } else {
      await api("/feed", { method: "POST", body: { body: t, photos: FD_DRAFT }, toast: "已发布" });

function fdView(img, vid) {
  const box = document.createElement("div");
  box.className = "fd-view";
  if (vid) {
    box.innerHTML = `<video src="${esc(vid)}" controls autoplay playsinline preload="auto"></video><button class="fd-view-x">×</button>`;
    box.onclick = (e) => { if (e.target === box || e.target.classList.contains("fd-view-x")) box.remove(); };
  } else {
    box.innerHTML = `<div class="fd-zoom"><img src="${esc(img)}" alt=""></div><button class="fd-view-x">×</button>`;
    box.onclick = (e) => { if (e.target === box || e.target.classList.contains("fd-view-x")) box.remove(); };
    attachZoom(box.querySelector(".fd-zoom"), box.querySelector(".fd-zoom img"));
  }
  document.body.appendChild(box);
}

function attachZoom(wrap, im) {
  let s = 1, tx = 0, ty = 0, pinch = 0, startS = 1, px = 0, py = 0, start = null, last = 0;
  const apply = () => { im.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const reset = () => { s = 1; tx = ty = 0; apply(); };
  wrap.onclick = (e) => e.stopPropagation();
  wrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      startS = s;
    } else if (e.touches.length === 1) { start = [e.touches[0].clientX, e.touches[0].clientY]; px = tx; py = ty; }
  }, { passive: false });
  wrap.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { s = Math.min(4, Math.max(1, startS * d / pinch)); apply(); }
    } else if (e.touches.length === 1 && start && s > 1) {
      tx = px + (e.touches[0].clientX - start[0]); ty = py + (e.touches[0].clientY - start[1]); apply();
    }
  }, { passive: false });
  wrap.addEventListener("touchend", (e) => {
    start = null; pinch = 0;
    const now = Date.now();
    if (e.touches.length === 0) {
      if (now - last < 320) { if (s > 1) reset(); else { s = 2.5; tx = ty = 0; apply(); } last = 0; }
      else last = now;
    }
  });
}

      : `<a class="mod" href="${x.u}" target="_blank" rel="noopener"><i>${x.i}</i><b>${esc(x.t)}</b><span>${esc(x.d)}</span></a>`;

  return `<div class="sec">${esc(g)}</div><div class="mods">${cards || '<div class="empty">这个分类还没有模块</div>'}</div>`;

async function render() {
  const pane = $("#pane");
  syncChrome();

  [...$("#tabs").children].forEach((b) => b.classList.toggle("on", b.dataset.tab === S.tab));

    pane.innerHTML = homeHtml();
    pane.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => enterApp(b.dataset.go));
    return;
  }
  if (S.tab === "status") {
    pane.innerHTML = feedHtml();
    bindFeed();
    return;
  }
  if (S.tab.startsWith("g:")) {
    pane.innerHTML = groupHtml(S.tab.slice(2));
    pane.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => enterApp(b.dataset.go));
    return;
  }
  if (S.tab === "board") {
    pane.innerHTML = `<div class="empty">加载中…</div>`;
    const sum = await loadBoard();
    pane.innerHTML = boardHtml(sum);
    $("#f_from").onchange = (e) => { S.from = e.target.value; render(); };
    $("#f_to").onchange = (e) => { S.to = e.target.value; render(); };
  } else if (S.tab === "log") {
    await loadBoard();
    const editing = S.editId ? S.logs.find((l) => l.id === S.editId) : null;
    pane.innerHTML = logForm(editing) + logListHtml();
    $("#d_save").onclick = saveLog;
    if (editing) $("#d_cancel").onclick = () => { S.editId = 0; render(); };
    pane.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => { S.editId = +b.dataset.edit; render(); });
    pane.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => delLog(+b.dataset.del));
  } else if (S.tab === "fin") {
    pane.innerHTML = `<div class="empty">加载中…</div>`;
    try { await loadFin(); } catch (e) { pane.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    if (!FIN.canAll && FINWHO) FINWHO = "";
    pane.innerHTML = finHtml();
    bindFin();
  } else if (S.tab === "users") {
    S.users = (await api("/users")).users;
    pane.innerHTML = usersHtml();
    $("#u_add").onclick = addUser;
    pane.querySelectorAll("[data-role]").forEach((el) => el.onchange = () => patchUser(el.dataset.role, { role: el.value }).catch(alert));
    pane.querySelectorAll("[data-site]").forEach((el) => el.onchange = () => patchUser(el.dataset.site, { site: el.value }).catch(alert));
    pane.querySelectorAll("[data-mods]").forEach((b) => b.onclick = () => {
      const u = S.users.find((x) => x.id === +b.dataset.mods);
      if (u) openModPicker(u);
    });
    pane.querySelectorAll("[data-pwd]").forEach((b) => b.onclick = () => {
      const pw = prompt("新的密码（至少 8 位）");
      if (pw) patchUser(b.dataset.pwd, { password: pw }).then(() => toast("已改，对方需要用新密码重登")).catch((e) => toast(e.message, "bad"));
    });
    pane.querySelectorAll("[data-active]").forEach((b) => b.onclick = () => {
      const u = S.users.find((x) => x.id === +b.dataset.active);
      patchUser(u.id, { active: u.active ? 0 : 1 }).then(render).catch((e) => toast(e.message, "bad"));
    });
  } else {
    pane.innerHTML = mineHtml();
    $("#p_out").onclick = async () => {
      if (!confirm("退出登录？")) return;
      try { await api("/logout", { method: "POST" }); } catch (e) {}
      showLogin();
    };
    $("#p_save").onclick = async () => {
      $("#p_err").textContent = ""; $("#p_ok").textContent = "";
      try {
        await api("/password", { method: "POST", body: { old: $("#p_old").value, new: $("#p_new").value } });
        $("#p_ok").textContent = "已改。下次用新密码登录。";
        $("#p_old").value = $("#p_new").value = "";
      } catch (e) { $("#p_err").textContent = e.message; }
    };
  }
}

/* ---------- 动作 ---------- */
function numOf(id) { const v = $(id).value.trim(); return v === "" ? 0 : +v; }

async function saveLog() {
  $("#d_err").textContent = "";
  const body = {
    day: $("#d_day").value, site: $("#d_site").value, shift: $("#d_shift").value,
    crew: $("#d_crew").value, headcount: numOf("#d_people"),
    ore_t: numOf("#d_ore"), waste_t: numOf("#d_waste"), cost_usd: numOf("#d_cost"),
    grade: $("#d_grade").value, note: $("#d_note").value,
  };
  const btn = $("#d_save"); btn.disabled = true;
  try {
    if (S.editId) await api("/logs/" + S.editId, { method: "PATCH", body, toast: "生产记录已更新" });
    else await api("/logs", { method: "POST", body, toast: "生产记录已保存" });
    S.editId = 0; S.tab = "log"; await render();
  } catch (e) { $("#d_err").textContent = e.message; btn.disabled = false; }
}

async function delLog(id) {
  if (!confirm("删掉这条记录？不能撤销。")) return;
  try { await api("/logs/" + id, { method: "DELETE", toast: "生产记录已删除" }); S.editId = 0; render(); }
  catch (e) { toast(e.message, "bad"); }
}

async function addUser() {
  $("#u_err").textContent = ""; $("#u_ok").textContent = "";
  try {
    const r = await api("/users", { method: "POST", body: {
      name: $("#u_name").value, login: $("#u_login").value, password: $("#u_pass").value,
      role: $("#u_role").value, site: $("#u_site").value, phone: $("#u_phone").value,
    }, toast: "人员已添加" });
    $("#u_ok").textContent = "已开通。下面勾一下这个人能用哪些模块。";
    ["#u_name", "#u_login", "#u_pass", "#u_phone"].forEach((s) => ($(s).value = ""));
    S.users = (await api("/users")).users;
    await render();
    const nu = S.users.find((x) => x.id === r.id);
    if (nu) openModPicker(nu);
  } catch (e) { $("#u_err").textContent = e.message; }
}

async function patchUser(id, patch) {
  const t = patch.password ? "密码已修改" : patch.active != null ? (patch.active ? "已启用" : "已停用") : "已更新";
  await api("/users/" + id, { method: "PATCH", body: patch, toast: t });
}

/* ---------- 启动 ---------- */
$("#lf").onsubmit = async (e) => {
  e.preventDefault();
  $("#l_err").textContent = "";
  try {
    const r = await api("/login", { method: "POST", body: { login: $("#l_login").value, password: $("#l_pass").value } });
    S.user = r.user; await showApp();
  } catch (e2) { $("#l_err").textContent = e2.message; }
};


$("#sf").onsubmit = async (e) => {
  e.preventDefault();
  $("#s_err").textContent = "";
  try {
    const r = await api("/setup", { method: "POST", headers: { "x-setup-token": $("#s_token").value.trim() },
      body: { login: $("#s_login").value, name: $("#s_name").value, password: $("#s_pass").value } });
    S.user = r.user; await showApp();
  } catch (e2) { $("#s_err").textContent = e2.message; }
};

(async () => {
  try {
    const st = await api("/status");
    if (st.setup_needed) return showSetup();
  } catch {}
  try {
    const r = await api("/me");
    if (r.user) { S.user = r.user; await showApp(); } else showLogin();
  } catch { showLogin(); }
})();
</script>
