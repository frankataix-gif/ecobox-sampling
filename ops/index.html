/* ---------- 财务 ---------- */
let FIN = null;
let FINR = "month"; // day | week | month | year
const FINR_ZH = { day: "今日", week: "本周", month: "本月", year: "本年" };
let FININV = "all"; // all | yes | no   票据筛选
let FINMARK = false; // 补票模式：逐行标有票/无票
let FINANA = false; // 核对与报表（资金总览 / 备用金 / 调拨 / 支出汇总）默认收起
const FINCO = "__company"; // 公司账户（一级户，uid 固定；只作为资金沉淀处，不是人）
let FINVIEW = null; // 最近一次渲染的列表（导出用）
let FINWHO = ""; // "" = 我自己；"ALL" = 全部汇总；其它 = 某个人的账本
try {
  const v = JSON.parse(localStorage.getItem("ops_fin_view") || "{}");
  if (FINR_ZH[v.range]) FINR = v.range;
  if (v.inv === "yes" || v.inv === "no" || v.inv === "all") FININV = v.inv;
  if (v.ana) FINANA = true;
  if (v.who) FINWHO = v.who;
} catch (e) {}
const saveFinView = () => {
  try { localStorage.setItem("ops_fin_view", JSON.stringify({ who: FINWHO, range: FINR, inv: FININV, ana: FINANA })); } catch (e) {}
};
const FIN_CAT_ZH = { transport: "交通", fuel: "加油", tip: "小费", meal: "餐饮住宿", comms: "通讯", office: "办公",
  allow: "员工补贴", pliving: "生活开销", repair: "维修", misc: "其它",
  sub: "外协劳务（包工头）", serenje: "Serenje 钽铌矿项目",
  loan: "借款", home: "家庭开支",
  /* 老分类：只用来显示还没合并的历史记录 */
  lodging: "住宿", daily: "日常", postage: "邮费", other: "其它" };
/* 归属（大类）→ 分类（细类）：改这里就是改「记一笔」的下拉 */
const FIN_FT = [
  ["life", "生活", ["transport", "fuel", "tip", "meal", "comms", "office", "allow", "pliving", "repair", "misc"]],
  ["project", "项目", ["sub", "serenje"]],
  ["licence", "矿权维护", []],
  ["ledger", "往来（不计费用）", ["loan", "home"]],
];
const FIN_FT_CATS = Object.fromEntries(FIN_FT.map(([k, , c]) => [k, c]));
const FIN_CAT_FT = Object.fromEntries(FIN_FT.reduce((a, [k, , cs]) => a.concat(cs.map((c) => [c, k])), []));
/* 老分类 → 新分类，合并按钮和接口都按这张表走 */
const FIN_CAT_MERGE = { daily: "misc", postage: "misc", other: "misc", lodging: "meal" };
/* 不是公司费用的科目：钱照样出账（余额要扣），但不进利润表 */
const FIN_OFFBOOK = { home: "私人", loan: "往来" };
/* 选中某些分类时给一句解释 */
const FIN_CAT_HINT = {
  home: "家庭开支 = 私人：钱从账户出，但不计入公司费用、不用发票",
  sub: "外协劳务：付给包工头的工作目标款（不是本公司员工工资）。留合同/工作范围 + 收据，最好要票",
};
const finOffbook = (e) => ((e.kind === "out" || e.kind === "in") && (FIN_OFFBOOK[e.cat] || (e.ft === "ledger" && "往来"))) || "";
const finMoney = (n) => (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const finCatName = (k) => {
  if (!k) return "未分类";
  if (String(k).startsWith("u:")) return String(k).slice(2);
  return (FIN && FIN.cats && FIN.cats.names && FIN.cats.names[k]) || FIN_CAT_ZH[k] || k;
};
const finKindName = (k) => (k === "in" ? "收入" : k === "float" ? "备用金" : k === "move" ? "取现/存现" : k === "transfer" ? "人员转账" : "支出");

/* 账户：对账余额 + 之后的流入/流出，拆成「来源 − 花费 = 剩余」 */
function finAcct(uid, skipId) {
  const a = (FIN.accounts || []).find((x) => x.uid === uid) || {};
  const since = a.since || "";
  const src = { cash: Number(a.cash) || 0, card: Number(a.card) || 0 };
  const out = { cash: 0, card: 0 };
  const chOf = (ch) => (ch === "card" ? "card" : "cash");
  for (const e of FIN.entries) {
    if (skipId && e.id === skipId) continue;
    if (since && String(e.date) <= since) continue;
    const amt = Number(e.amount) || 0;
    const ch = chOf(e.ch);
    if (e.kind === "float") {
      if (e.to_uid === uid) src[ch] += amt;      // 收到备用金 → 现金来源
      if (e.uid === uid) out[ch] += amt;         // 发出备用金 → 花费
    } else if (e.kind === "move") {
      if (e.uid === uid) { const to = ch === "card" ? "cash" : "card"; out[ch] += amt; src[to] += amt; }
    } else if (e.kind === "transfer") {
      if (e.uid === uid) out[ch] += amt;                          // 转出人：按转出口减少
      if (e.to_uid === uid) src[chOf(e.to_ch || e.ch)] += amt;    // 转入人：按转入渠道增加
    } else if (e.uid === uid) {
      if (e.kind === "in") src[ch] += amt; else out[ch] += amt;
    }
  }
  return { cash: src.cash - out.cash, card: src.card - out.card, src, out, since, name: a.name };
}
const finBalance = (uid) => { const a = finAcct(uid); return { cash: a.cash, card: a.card }; };

/* 某人手上还有多少备用金：收到的备用金 − 收到之后他自己的支出（备用金本身不算花费） */
function finFloatOf(uid) {
  const got = (FIN.entries || []).filter((e) => e.kind === "float" && e.to_uid === uid);
  if (!got.length) return null;
  const since = got.map((e) => String(e.date || "")).sort()[0] || "";
  const used = (FIN.entries || []).filter((e) => e.uid === uid && e.kind === "out" && String(e.date || "") >= since);
  return {
    got: got.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    used: used.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    giver: got[0].uid, since,
  };
}

/* 常用花费人：列表置顶（顺序即优先），其余保持原顺序 */
const FIN_FAV = ["frank", "supeichang"];
const finFavRank = (u) => {
  const keys = [String(u.login || "").trim().toLowerCase(), String(u.name || "").trim().toLowerCase()];
  const i = FIN_FAV.findIndex((k) => keys.includes(k));
  return i < 0 ? FIN_FAV.length : i;
};

const finPeople = () => {
  const us = (FIN.users || []).filter((u) => u.login !== FINCO).map((u) => ({ login: u.login, name: u.name, role: u.role, ghost: false }));
  const known = new Set(us.map((u) => u.login));
  for (const a of FIN.accounts || []) {
    if (a.uid === FINCO || known.has(a.uid)) continue;
    us.push({ login: a.uid, name: a.name || a.uid, role: "", ghost: true });
  }
  us.sort((a, b) => finFavRank(a) - finFavRank(b));
  return us.length ? us : [{ login: FIN.me.uid, name: FIN.me.name, role: FIN.me.role }];
};
const finNameOf = (uid) => {
  if (uid === FINCO) return "公司账户";
  const u = (FIN.users || []).find((x) => x.login === uid);
  if (u && u.name) return u.name;
  const a = (FIN.accounts || []).find((x) => x.uid === uid);
  return (a && a.name) || uid;
};

/* 时间范围起点（YYYY-MM-DD），本周从周一起算 */
function finFrom() {
  const n = new Date();
  const y = n.getFullYear(), m = n.getMonth(), d = n.getDate();
  let dt = new Date(y, m, 1);
  if (FINR === "day") dt = new Date(y, m, d);
  else if (FINR === "week") dt = new Date(y, m, d - ((n.getDay() + 6) % 7));
  else if (FINR === "year") dt = new Date(y, 0, 1);
  const p = (x) => String(x).padStart(2, "0");
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}

function finHtml() {
  const who = FINWHO || FIN.me.uid;

  const isMe = !FINWHO;                 // 空 = 我自己

  const rows = list.map((e) => {

      sign = "⇄";
      const out = e.ch === "card";
      title = out ? "取现" : "存现";
      label = out ? "银行 → 现金" : "现金 → 银行";
    } else if (e.kind === "transfer") {
      sign = isAll ? "⇄" : (e.to_uid === who ? "+" : "-");
      const fromCh = e.ch === "card" ? "银行" : "现金";
      const toCh = (e.to_ch || e.ch) === "card" ? "银行" : "现金";
      whoTxt = `${esc(finNameOf(e.uid))} → ${esc(finNameOf(e.to_uid))}`;
      label = isAll ? "转账" : (e.to_uid === who ? "转入" : "转出");
      title = `${fromCh} → ${toCh}`;
    } else {
      sign = e.kind === "in" ? "+" : "-";
    }
    const chTxt = e.kind === "transfer" ? "" : ` · ${e.ch === "card" ? "银行" : "现金"}`;
    const isExp = e.kind === "out" || e.kind === "in";
    const offBook = finOffbook(e);
    const canMark = isExp && !offBook && (FIN.owner || FIN.canAll || e.uid === FIN.me.uid);
    const hasPh = (e.photos || []).length > 0;

      : offBook ? `<i class="fin-inv ${offBook === "往来" ? "l" : "p"}" title="${offBook}科目，不计入公司费用">${offBook}·不计费用</i>`

        : `<i class="fin-inv n">无票</i>`;
    const markBtns = FINMARK && canMark

      <div class="a">${sign}${finMoney(e.amount)}<small>${esc(label)}</small></div>
      ${(FIN.owner || FIN.canAll || e.uid === FIN.me.uid) ? `<button class="ghost fin-more" data-finmore="${e.id}" title="更多">⋯</button>` : ""}
    </div>`;
  }).join("");

  const roleLabel = (p) => (p.ghost ? "历史账户" : ROLE_ZH[p.role] || "员工");
  const acctCard = (p) => {
    const a = finAcct(p.login);
    const row = (FIN.accounts || []).find((x) => x.uid === p.login) || {};
    const acts = [];
    if (FIN.owner) acts.push(`<button class="ghost" data-recon="${esc(p.login)}">对账</button>`);
    if (FIN.owner) acts.push(`<button class="ghost" data-give="${esc(p.login)}">给员工</button>`);
    return `<div class="fin-acct" data-acct="${esc(p.login)}">
      <div class="n">${esc(p.name || p.login)} <span class="mut">${esc(roleLabel(p))}${row.since ? " · 对账 " + esc(row.since) : ""}</span></div>
      <div class="g">
        <div><label>现金</label><b>${finMoney(a.cash)}</b><small>来源 ${finMoney(a.src.cash)} − 花费 ${finMoney(a.out.cash)}</small></div>
        <div><label>银行</label><b>${finMoney(a.card)}</b><small>来源 ${finMoney(a.src.card)} − 花费 ${finMoney(a.out.card)}</small></div>
      </div>
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}
    </div>`;
  };
  const people = finPeople();
  const personCard = () => acctCard(people.find((p) => p.login === who) || { login: who, name: finNameOf(who), role: "", ghost: false });
  const acctHtml = isAll ? "" : `<div class="sec">${isMe ? "我的账户" : esc(finNameOf(who)) + " 账户"}</div>` + personCard();

  const withAcct = (FIN.accounts || []).filter((a) => a.uid !== FINCO && (Number(a.cash) || Number(a.card)));
  const scopeChips = [`<button data-fscope="" class="${isMe ? "on" : ""}">我</button>`];
  if (canAll) {
    scopeChips.push(`<button data-fscope="ALL" class="${isAll ? "on" : ""}">全部</button>`);
    for (const a of withAcct) {
      const p = people.find((x) => x.login === a.uid) || { login: a.uid, name: a.name || a.uid, role: "", ghost: true };
      scopeChips.push(`<button data-fscope="${esc(p.login)}" class="${FINWHO === p.login ? "on" : ""}">${esc(p.name || p.login)}</button>`);

  const pplBal = people.reduce((s, p) => { const a = finAcct(p.login); s.cash += a.cash; s.card += a.card; return s; }, { cash: 0, card: 0 });
  const totCash = coBal.cash + pplBal.cash, totCard = coBal.card + pplBal.card;
  const floatLeft = people.reduce((s, p) => { const f = finFloatOf(p.login); return s + (f ? Math.max(0, f.got - f.used) : 0); }, 0);
  const coHtml = !canAll ? "" : `<div class="fin-acct">
    <div class="n">🏦 资金总览 <span class="mut" style="font-weight:400;font-size:12px">· 调拨不减总额，消费才减</span></div>
    <div class="g" style="margin-top:8px">
      <div><label>公司账户</label><b>${finMoney(coBal.cash + coBal.card)}</b><small>对账日 ${esc(coRow.since || "未设")}</small></div>
      <div><label>员工手上</label><b>${finMoney(pplBal.cash + pplBal.card)}</b><small>现金 ${finMoney(pplBal.cash)} · 银行 ${finMoney(pplBal.card)}</small></div>
    </div>
    <div class="g" style="margin-top:8px">
      <div><label>公司资金总额</label><b>${finMoney(totCash + totCard)}</b><small>现金 ${finMoney(totCash)} · 银行 ${finMoney(totCard)}</small></div>
      <div><label>未报备用金</label><b>${finMoney(floatLeft)}</b><small>已发 − 已花，仍算在员工手上</small></div>
    </div>
  </div>`;

  const actions = !ro ? `<div class="fin-acts">
    ${!isAll && (FIN.canAll || FIN.owner) ? `<button id="fin_transfer">🔀 调拨</button>` : ""}
    ${canAll ? `<button id="fin_cosend">🏦 公司调款</button>` : ""}
    <button id="fin_move">🔁 取现</button>
    ${FIN.owner ? `<button id="fin_give">🤝 给员工</button>` : ""}

  const trSum = trList.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const trOut = trList.filter((e) => isAll || e.uid === who).reduce((s, e) => s + (Number(e.amount) || 0), 0);

  const byCat = new Map();
  for (const e of expOut) {
    const k = e.cat || "";
    const o = byCat.get(k) || { k, yes: 0, no: 0, n: 0 };
    const amt = Number(e.amount) || 0;
    if (Number(e.inv)) o.yes += amt; else o.no += amt;
    o.n++;
    byCat.set(k, o);

function finPhotoHtml(p) {
  return `<label>单据照片 <span id="${p}_phn" style="font-weight:400;color:var(--mut)">0/6</span></label>
    <div class="r" style="gap:8px;margin-bottom:6px">
      <button class="ghost" type="button" id="${p}_cam">📷 拍照</button>
      <button class="ghost" type="button" id="${p}_alb">🖼 从相册选</button>
    </div>
    <input id="${p}_cam_in" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="${p}_alb_in" type="file" accept="image/*" multiple style="display:none">
    <div class="ph" id="${p}_ph"></div>`;
}

function finPhotoWire(box, p, initial, dir) {
  const state = { list: Array.isArray(initial) ? initial.slice(0, 6) : [], busy: false };
  const phBox = $("#" + p + "_ph", box), phN = $("#" + p + "_phn", box), msgEl = $("#" + p + "_msg", box);
  const draw = () => {
    phBox.innerHTML = state.list.map((k, i) => `<span class="pht"><img src="/api/fin/photo/${k}" data-phv="/api/fin/photo/${k}" alt=""><b data-delph="${i}" title="移除">×</b></span>`).join("");
    phN.textContent = state.list.length + "/6";
    phBox.querySelectorAll("[data-delph]").forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); state.list.splice(+b.dataset.delph, 1); draw(); });
    phBox.querySelectorAll("[data-phv]").forEach((im) => im.onclick = () => finView(im.dataset.phv));
  };
  const addFiles = async (files) => {
    const list = [...files].slice(0, Math.max(0, 6 - state.list.length));
    if (!list.length) { if (msgEl) msgEl.textContent = "最多 6 张，先移除一些再添加"; return; }
    let fail = 0;
    state.busy = true;
    try {
      for (let i = 0; i < list.length; i++) {
        if (msgEl) msgEl.textContent = "上传中…（" + i + "/" + list.length + "）";
        const key = await finUpload(list[i], msgEl, dir);
        if (key) state.list.push(key); else fail++;
        draw();
      }
    } finally { state.busy = false; }
    if (msgEl) {
      msgEl.textContent = fail ? "有 " + fail + " 张没传上" : "已添加 " + list.length + " 张";
      if (fail) toast("有 " + fail + " 张照片没传上，先别保存", "bad");
      setTimeout(() => { if (/^(已添加|有 )/.test(msgEl.textContent)) msgEl.textContent = ""; }, 2500);
    }
  };
  $("#" + p + "_cam", box).onclick = () => $("#" + p + "_cam_in", box).click();
  $("#" + p + "_alb", box).onclick = () => $("#" + p + "_alb_in", box).click();
  $("#" + p + "_cam_in", box).onchange = async (e) => { const f = [...e.target.files]; e.target.value = ""; await addFiles(f); };
  $("#" + p + "_alb_in", box).onchange = async (e) => { const f = [...e.target.files]; e.target.value = ""; await addFiles(f); };
  draw();
  return state;
}

/* 上次用过的 分类 / 渠道 / 归属：日常记账预填，少点几下 */
const finLastUse = () => { try { return JSON.parse(localStorage.getItem("ops_fin_last") || "{}"); } catch (e) { return {}; } };
const saveFinLast = (o) => { try { localStorage.setItem("ops_fin_last", JSON.stringify(o)); } catch (e) {} };

function finSheet(presetTo, presetKind, editEntry) {
  const canAll = FIN.canAll;
  const viewUid = FINWHO && FINWHO !== "ALL" ? FINWHO : FIN.me.uid;
  const people = canAll ? finPeople().map((u) => u.login) : [FIN.me.uid];
  /* 归属（大类）→ 分类（细类）：两级联动，项目/矿权维护的自定义项来自 fin_cfg.cats */
  const opt = (k) => `<option value="${esc(k)}">${esc(finCatName(k))}</option>`;
  const catsOf = (ft) => {
    const base = (FIN_FT_CATS[ft] || []).filter((k) => FIN_CAT_ZH[k]);
    const custom = ((FIN.cats && FIN.cats[ft]) || []).filter(Boolean);
    const extra = ft === "life" ? ["u:员工工资"] : [];
    return [...new Set([...base, ...custom, ...extra])];
  };
  const catsHtml = (ft, cur) => {
    const list = catsOf(ft);
    if (cur && !list.includes(cur)) list.unshift(cur);
    return list.length ? list.map(opt).join("") : `<option value="">（暂无，先「改分类」添加）</option>`;
  };
  const ftHtml = FIN_FT.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join("");
  const last = editEntry ? null : finLastUse();
  const initFt = editEntry ? (FIN_FT_CATS[editEntry.ft] ? editEntry.ft : (FIN_CAT_FT[editEntry.cat] || "life"))
    : (last && FIN_FT_CATS[last.ft] ? last.ft : "life");
  const edit = editEntry || null;
  const d = edit || {};
  const initKind = edit ? edit.kind : (presetTo || presetKind === "float" ? "float" : "out");
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet">
    <h3>${edit ? "修改记录" : "记一笔"}</h3>
    <label>类型</label>
    <select id="ff_kind"${edit ? " disabled" : ""}><option value="out">支出</option><option value="in">收入</option>${FIN.owner ? `<option value="float">发备用金</option>` : ""}</select>
    <div class="r" style="margin-top:8px">
      <div><label>金额 ZMW <i class="req">*</i></label><input id="ff_amt" type="number" step="0.01" inputmode="decimal" value="${edit ? d.amount : ""}"></div>
      <div><label>日期</label><input id="ff_date" type="date" value="${esc(edit ? d.date : new Date().toISOString().slice(0, 10))}"></div>
    </div>
    <label>备注 <i class="req">*</i></label><input id="ff_note" placeholder="比如：去矿区打车" value="${esc(d.note || "")}">
    <div id="ff_out">
      <div class="row3" style="margin-top:8px">
        <div><label>归属</label><select id="ff_ft">${ftHtml}</select></div>
        <div><label>分类</label><select id="ff_cat">${catsHtml(initFt, edit ? d.cat : null)}</select></div>
        <div><label>渠道</label><select id="ff_ch"><option value="cash">现金</option><option value="card">银行</option></select></div>
      </div>
      <div class="mut" id="ff_cat_hint" style="display:none;margin:6px 0 0"></div>
      <div id="ff_invwrap" style="margin-top:8px">
        <div class="fin-seg" style="margin:0">
          <button type="button" data-inv="0">无发票</button>
          <button type="button" data-inv="1">有发票 <i class="req" id="ff_inv_req" style="display:none">*</i></button>
        </div>
        <div class="mut" id="ff_inv_hint" style="display:none;margin:6px 0 0">有发票要上传发票照片（最多 6 张）</div>
      </div>
      ${canAll ? `<label>记在谁名下</label><select id="ff_uid">${people.map((p) => `<option value="${esc(p)}" ${p === (edit ? d.uid : viewUid) ? "selected" : ""}>${esc(finNameOf(p))}</option>`).join("")}</select>` : ""}
    </div>
    <div id="ff_fl" class="hide">
      <div class="r"><div><label>从谁出</label><select id="ff_giver">${people.map((p) => `<option value="${esc(p)}" ${p === (edit ? d.uid : FIN.me.uid) ? "selected" : ""}>${esc(finNameOf(p))}</option>`).join("")}</select></div>
      <div><label>从哪个口</label><select id="ff_from"><option value="cash">现金</option><option value="card">银行</option></select></div></div>
      <label>发给谁</label><select id="ff_to">${people.filter((p) => p !== (edit ? d.uid : FIN.me.uid)).map((p) => `<option value="${esc(p)}">${esc(finNameOf(p))}</option>`).join("")}</select>
    </div>
    ${finPhotoHtml("ff")}
    <p class="mut" id="ff_msg" style="min-height:1em;margin:8px 0 0"></p>
    <div class="r" style="margin-top:8px"><button class="ghost" id="ff_x">取消</button><button id="ff_save">${edit ? "保存修改" : "保存"}</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#ff_x", box).onclick = close;
  const setKind = (k) => {
    const fl = k === "float";
    $("#ff_kind", box).value = k;
    $("#ff_out", box).classList.toggle("hide", fl);
    $("#ff_fl", box).classList.toggle("hide", !fl);
  };
  setKind(initKind);
  let INV = edit ? (Number(d.inv) ? 1 : 0) : 0;
  const paintInv = () => {
    box.querySelectorAll("[data-inv]").forEach((b) => b.classList.toggle("on", +b.dataset.inv === INV));
    const req = $("#ff_inv_req", box);
    if (req) req.style.display = INV ? "inline" : "none";
    const hint = $("#ff_inv_hint", box);
    if (hint) hint.style.display = INV ? "block" : "none";
  };
  box.querySelectorAll("[data-inv]").forEach((b) => b.onclick = () => { INV = +b.dataset.inv; paintInv(); });
  paintInv();
  const ftSel = $("#ff_ft", box), catSel = $("#ff_cat", box);
  ftSel.value = initFt;
  if (edit) {
    if (d.cat) catSel.value = d.cat;
    $("#ff_ch", box).value = d.ch || "cash";
    $("#ff_from", box).value = d.ch || "cash";
    if ($("#ff_to", box)) $("#ff_to", box).value = d.to_uid || "";
    if ($("#ff_uid", box)) $("#ff_uid", box).value = d.uid || viewUid;
    if ($("#ff_giver", box)) $("#ff_giver", box).value = d.uid || viewUid;
  } else if (presetTo) {
    if ($("#ff_to", box)) $("#ff_to", box).value = presetTo;
  }
  if (!edit && last) {
    /* 日常记账少点几下：沿用上次的 分类 / 渠道 / 归属（往来科目不记） */
    if (last.cat && !FIN_OFFBOOK[last.cat] && catsOf(initFt).includes(last.cat)) catSel.value = last.cat;
    if (last.ch) $("#ff_ch", box).value = last.ch === "card" ? "card" : "cash";
  }
  const paintCat = () => {
    const hint = $("#ff_cat_hint", box);
    const txt = FIN_CAT_HINT[catSel.value] || "";
    hint.textContent = txt;
    hint.style.display = txt ? "block" : "none";
  };
  ftSel.onchange = () => { catSel.innerHTML = catsHtml(ftSel.value, null); paintCat(); };
  catSel.onchange = paintCat;
  paintCat();
  $("#ff_kind", box).onchange = (e) => setKind(e.target.value);
  const PH = finPhotoWire(box, "ff", edit ? d.photos : []);
  $("#ff_save", box).onclick = async () => {
    const kind = $("#ff_kind", box).value;
    const amt = +$("#ff_amt", box).value;
    const note = $("#ff_note", box).value.trim();
    const inv = kind === "float" ? 0 : INV;
    const fail = (t) => { const m = $("#ff_msg", box); if (m) m.textContent = t; toast(t, "bad"); };
    if (PH.busy) return fail("照片还在上传，等一两秒再点保存");
    if (!(amt > 0)) return fail("金额要填（大于 0）");
    if (!$("#ff_date", box).value) return fail("选个日期");
    if (kind !== "move" && !note) return fail("备注要填");
    if (inv && !PH.list.length) return fail("选了「有发票」就要上传发票照片");
    const cat = kind === "float" ? "" : $("#ff_cat", box).value;
    const ft = kind === "float" ? "life" : $("#ff_ft", box).value;
    if (!cat && ft === "licence") return fail("矿权维护还没分类，先点「改分类」加矿证");
    const b = {
      amount: amt,
      date: $("#ff_date", box).value,
      note,
      inv,
      photos: PH.list,
      cat,
      ft,
      ch: kind === "float" ? $("#ff_from", box).value : $("#ff_ch", box).value,
      to_uid: kind === "float" ? $("#ff_to", box).value : "",
    };
    try {
      if (edit) {
        await api("/fin/entries/" + encodeURIComponent(edit.id), { method: "PATCH", body: b, toast: "记录已修改" });
      } else {
        b.kind = kind;
        b.uid = kind === "float" ? ($("#ff_giver", box) ? $("#ff_giver", box).value : FIN.me.uid)
          : (canAll && $("#ff_uid", box) ? $("#ff_uid", box).value : viewUid);
        await api("/fin/entries", { method: "POST", body: b, toast: kind === "float" ? "备用金已记录" : "已记账 " + finMoney(b.amount) + " ZMW" });
      }
      if (!edit) saveFinLast({ cat: b.cat, ch: b.ch, ft: b.ft === "ledger" ? "life" : b.ft });
      close(); await loadFin(); render();
    } catch (err) { fail(err.message); }
  };
}

      <div><label>金额 ZMW</label><input id="ft_amt" type="number" step="0.01" inputmode="decimal" value="${edit ? edit.amount : ""}"></div>
      <div><label>日期</label><input id="ft_date" type="date" value="${esc(edit ? edit.date : new Date().toISOString().slice(0, 10))}"></div>
    </div>
    <p class="mut" id="ft_preview" style="margin:8px 0 0;min-height:2.6em"></p>
    <label>备注</label><input id="ft_note" placeholder="比如：给 Peter 现金进货" value="${esc(edit ? edit.note || "" : "")}">
    ${finPhotoHtml("ft")}
    <p class="mut" id="ft_msg" style="min-height:1em;margin:8px 0 0"></p>
    <div class="r" style="margin-top:8px"><button class="ghost" id="ft_x">取消</button><button id="ft_save">${edit ? "保存修改" : "确认转账"}</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#ft_x", box).onclick = close;

  const fromSel = $("#ft_from", box), toSel = $("#ft_to", box);
  const fillTo = (keep) => {
    const list = [...people, coOpt].filter((p) => p.login !== fromSel.value);
    toSel.innerHTML = list.map((p) => `<option value="${esc(p.login)}">${esc(p.name || p.login)}</option>`).join("");
    if (keep && list.some((p) => p.login === keep)) toSel.value = keep;
  };
  fillTo(edit ? edit.to_uid : "");
  $("#ft_ch", box).value = edit && edit.ch === "card" ? "card" : "cash";
  $("#ft_toch", box).value = edit && (edit.to_ch || edit.ch) === "card" ? "card" : "cash";

  /* 公司账户只有银行口：选中公司账户时锁死渠道并禁用「现金」 */
  const lockCo = () => {
    [[fromSel, $("#ft_ch", box)], [toSel, $("#ft_toch", box)]].forEach(([sel, ch]) => {
      const isCo = sel.value === FINCO;
      const cashOpt = [...ch.options].find((o) => o.value === "cash");
      if (cashOpt) cashOpt.disabled = isCo;
      if (isCo) ch.value = "card";
    });
  };

  const draw = () => {
    lockCo();
    const el = $("#ft_preview", box);
    const from = fromSel.value, to = toSel.value;
    if (!to) { el.textContent = "系统里还没有可转入的第二个人"; return; }
    const fch = $("#ft_ch", box).value, tch = $("#ft_toch", box).value;
    const amt = Number($("#ft_amt", box).value) || 0;
    const skip = edit ? edit.id : "";
    const A = finAcct(from, skip), B = finAcct(to, skip);
    const fa = { cash: A.cash, card: A.card }, ba = { cash: B.cash, card: B.card };
    fa[fch] -= amt; ba[tch] += amt;
    const money = (v) => (v < 0 ? `<b style="color:#c33">${finMoney(v)}</b>` : finMoney(v));
    const side = (uid, x) => `${esc(finNameOf(uid))}：现金 ${money(x.cash)} · 银行 ${money(x.card)}`;
    el.innerHTML = `转出后 ${side(from, fa)}<br>转入后 ${side(to, ba)}`;
  };

  const PH = finPhotoWire(box, "ft", edit ? edit.photos : []);
  fromSel.onchange = () => { fillTo(); draw(); };
  ["#ft_to", "#ft_ch", "#ft_toch", "#ft_amt"].forEach((s) => {
    const el = $(s, box);
    el.onchange = draw;
    el.oninput = draw;
  });
  draw();

  $("#ft_save", box).onclick = async () => {
    const from = fromSel.value, to = toSel.value;
    const b = {
      amount: +$("#ft_amt", box).value,
      date: $("#ft_date", box).value,
      note: $("#ft_note", box).value,
      photos: PH.list,
      kind: "transfer", cat: "", ft: "life",
      uid: from, ch: $("#ft_ch", box).value,
      to_uid: to, to_ch: $("#ft_toch", box).value,
    };
    if (!to) return void ($("#ft_msg", box).textContent = "请选择调到谁");
    if (from === to) return void ($("#ft_msg", box).textContent = "调出和调入不能是同一户");
    if (!(b.amount > 0)) return void ($("#ft_msg", box).textContent = "金额要大于 0");
    try {
      if (edit) await api("/fin/entries/" + encodeURIComponent(edit.id), { method: "PATCH", body: b, toast: "调拨已修改" });
      else await api("/fin/entries", { method: "POST", body: b, toast: "已调拨 " + finMoney(b.amount) + " ZMW" });
      close(); await loadFin(); render();
    } catch (err) { $("#ft_msg", box).textContent = err.message; }
  };
}

/* ---------- CSV 导出：给会计核对 / Excel 直接打开 ---------- */
function finCsv(name, head, rows) {
  const cell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const body = [head, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function finExport(mode) {
  const v = FINVIEW || { list: [] };
  const day = new Date().toISOString().slice(0, 10);
  const chZh = (c) => (c === "card" ? "银行" : "现金");
  const money = (n) => (Number(n) || 0).toFixed(2);
  if (mode === "items") {
    const rows = v.list.filter((e) => (e.kind === "out" || e.kind === "in") && !finOffbook(e));
    finCsv(`支出明细_${day}.csv`,
      ["日期", "类型", "付款户", "渠道", "用途", "归属", "金额ZMW", "票据", "备注", "照片数"],
      rows.map((e) => [e.date, finKindName(e.kind), finNameOf(e.uid), chZh(e.ch), finCatName(e.cat),
        e.ft === "project" ? "项目" : "生活", money(e.amount), Number(e.inv) ? "有票" : "无票",
        e.note || "", (e.photos || []).length]));
    toast(`已导出 ${rows.length} 笔支出明细`);
    return;
  }
  const all = (FIN.entries || []).filter((e) => String(e.date) >= finFrom());
  finCsv(`资金流水_${day}.csv`,
    ["日期", "类型", "出账户", "出账口", "入账户", "入账口", "金额ZMW", "用途", "票据", "备注"],
    all.map((e) => [e.date, finKindName(e.kind), finNameOf(e.uid), chZh(e.ch),
      e.to_uid ? finNameOf(e.to_uid) : "", e.to_ch ? chZh(e.to_ch) : "", money(e.amount),
      e.cat ? finCatName(e.cat) : "", Number(e.inv) ? "有票" : "无票", e.note || ""]));
  toast(`已导出 ${all.length} 笔资金流水`);
}



async function finUpload(file, msgEl, dir) {
  const data = await new Promise((res) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc) || 1; c.height = Math.round(img.height * sc) || 1;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      } catch (err) { res(""); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(""); };
    img.src = url;
  });
  if (!data) { if (msgEl) msgEl.textContent = "这张照片读不了（可能是 HEIC 或文件损坏），请换 JPG 再试"; return ""; }
  try {
    return (await api("/fin/photo", { method: "POST", body: { data, dir: dir || "" }, quiet: true })).key;
  } catch (e) { if (msgEl) msgEl.textContent = "照片没传上：" + e.message; return ""; }
}

const GROUPS = ["财务", "日常协同", "业务现场", "资产", "系统"];
function groupMods(g) {

/* 根页面：看得见页签；其余都是「点进去的独立页」，只有返回 */
const ROOT = (t) => t === "home" || t === "status" || String(t).startsWith("g:");
function tabUrl(k) {
  const h = !k || k === "home" ? "" : "#" + encodeURIComponent(k);
  return location.pathname + location.search + h;
}

function enterApp(k, opts = {}) {
  if (k === S.tab) { S.editId = 0; S.editUid = 0; render(); return; }
  S.stack.push(S.tab);
  if (ROOT(k)) S.stack = [];
  if (S.stack.length > 20) S.stack.shift();
  S.tab = k; S.editId = 0; S.editUid = 0; S.fresh = true;
  if (!opts.noHist) { try { history.pushState({ t: k }, "", tabUrl(k)); } catch (e) {} }
  try { window.scrollTo(0, 0); } catch (e) {}
  render();
}
function goBack() {
  const to = S.stack.pop() || "home";
  S.tab = to; S.editId = 0; S.editUid = 0; S.fresh = true;
  try { history.replaceState({ t: to }, "", tabUrl(to)); } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
  render();
}
function goHome() { S.stack = []; enterApp("home"); }
window.addEventListener("popstate", (e) => {
  const t = (e.state && e.state.t) || "home";
  S.tab = t; S.editId = 0; S.editUid = 0; S.stack = []; S.fresh = true;
  render();
});
function syncChrome() {
  /* 根页面留着页签；进了应用就变成独立页：只剩「← 标题」 */

    ttl.textContent = tr(names[S.tab] || (mod && mod.t) || (S.tab.startsWith("g:") ? S.tab.slice(2) : "ECOBOX"));
  }
}

const ago = (t) => { if (!t) return ""; const d = Date.now() - new Date(t).getTime(); if (d < 60000) return "刚刚"; if (d < 3600000) return Math.floor(d / 60000) + " 分钟前"; if (d < 86400000) return Math.floor(d / 3600000) + " 小时前"; if (d < 604800000) return Math.floor(d / 86400000) + " 天前"; return String(t || "").slice(0, 10); };
const fb = (u) => (u.startsWith("feed/old/") ? ` onerror="this.onerror=null;this.src='/api/feed/img/${u.slice(9)}'"` : "");

function thumbVideos() {
  const load = (v) => { if (v.dataset.tried) return; v.dataset.tried = "1"; v.preload = "metadata"; v.load(); };
  document.querySelectorAll(".fd-tile[data-vid] video").forEach((v) => {
    if (v.dataset.tried) return;
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) {} }, { once: true });
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { load(v); io.disconnect(); } }), { rootMargin: "300px" });
      io.observe(v.closest(".fd-tile"));
    } else load(v);
  });
}

function attachZoom(wrap, im) {
  let s = 1, tx = 0, ty = 0, pinch = 0, startS = 1, px = 0, py = 0, start = null, last = 0;
  const apply = () => { im.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const reset = () => { s = 1; tx = ty = 0; apply(); };
  wrap.onclick = (e) => e.stopPropagation();
  wrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      startS = s;
    } else if (e.touches.length === 1) { start = [e.touches[0].clientX, e.touches[0].clientY]; px = tx; py = ty; }
  }, { passive: false });
  wrap.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { s = Math.min(4, Math.max(1, startS * d / pinch)); apply(); }
    } else if (e.touches.length === 1 && start && s > 1) {
      tx = px + (e.touches[0].clientX - start[0]); ty = py + (e.touches[0].clientY - start[1]); apply();
    }
  }, { passive: false });
  wrap.addEventListener("touchend", (e) => {
    start = null; pinch = 0;
    const now = Date.now();
    if (e.touches.length === 0) {
      if (now - last < 320) { if (s > 1) reset(); else { s = 2.5; tx = ty = 0; apply(); } last = 0; }
      else last = now;
    }
  });
}

  if (!navigator.geolocation) return bad(new Error("这台设备/浏览器不支持定位"));

function attHtml() {
  const cfg = ATT.cfg || {};
  const rec = ATT.rec;

  const admin = S.user.role === "admin";
  const btnTxt = phase === "in" ? "上班打卡" : phase === "out" ? "下班打卡" : "今天已打卡完成";
  const btnCls = phase === "done" ? "" : "pri";
  const noSite = !cfg.lat && !cfg.lng;
  const ym = ATT.ym || localDay(new Date()).slice(0, 7);

  const rows = (ATT.records || []).map((r) => {
    const late = r.inHm && cfg.start && r.inHm > cfg.start && attMinOf(r.inHm) > attMinOf(cfg.start) + (+cfg.grace || 0);
    const early = r.outHm && cfg.end && r.outHm < cfg.end;
    return `<tr>
      <td>${esc(r.d)}${ATT.all ? ` · ${esc(r.name || r.uid)}` : ""}</td>
      <td>${esc(hhmm(r.inAt) || "-")}</td>
      <td>${esc(hhmm(r.outAt) || "-")}</td>
      <td>${r.inDist ? esc(r.inDist) + " m" : "-"}</td>
      <td>${late ? '<span style="color:var(--warn)">迟到</span>' : ""}${early ? '<span style="color:var(--warn)"> 早退</span>' : ""}${!late && !early && r.outAt ? "正常" : ""}</td>
      <td class="mut">${esc(r.site || "")}</td>
    </tr>`;
  }).join("");

  return `
  <div class="card">
    <h3>今日打卡 · ${esc(localDay(new Date()))}</h3>
    ${noSite ? `<div class="empty" style="padding:10px 0;">还没设置办公点位置 —— ${admin ? "在下方「打卡设置」里填，或点「用当前位置」" : "请让管理员设置"}</div>` : ""}
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;">
      <div class="kpi"><i>上班</i><b>${esc(rec && rec.inAt ? hhmm(rec.inAt) : "--:--")}</b></div>
      <div class="kpi"><i>下班</i><b>${esc(rec && rec.outAt ? hhmm(rec.outAt) : "--:--")}</b></div>
      <div class="kpi"><i>今日工时</i><b>${rec && rec.inAt && rec.outAt ? attHours(rec) : "-"}</b></div>
    </div>
    <button id="att-punch" class="btn ${btnCls}" style="width:100%;margin-top:12px;padding:14px;font-size:16px;" ${phase === "done" ? "disabled" : ""}>${esc(btnTxt)}</button>
    <div class="mut" style="font-size:12px;margin-top:8px;">点打卡时自动定位，需在 ${esc(cfg.radius || 300)} 米范围内${cfg.site_name ? "（" + esc(cfg.site_name) + "）" : ""}；两段打卡都要在范围内。</div>
  </div>

  <div class="card">
    <h3>本月统计 · ${esc(ym)}</h3>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi"><i>出勤天数</i><b>${st.days || 0}</b></div>
      <div class="kpi"><i>迟到</i><b>${st.late || 0}</b></div>
      <div class="kpi"><i>早退</i><b>${st.early || 0}</b></div>
      <div class="kpi"><i>工时</i><b>${st.hours || 0}h</b></div>
    </div>
    <div class="row" style="margin-top:12px;">
      <label>月份<input id="att-month" type="month" value="${esc(ym)}"></label>
      ${admin ? `<label>范围<select id="att-scope">
        <option value="me"${ATT.all ? "" : " selected"}>只看我自己</option>
        <option value="all"${ATT.all ? " selected" : ""}>全公司</option></select></label>` : "<div></div>"}
    </div>
  </div>

  <div class="card">
    <h3>打卡记录${st.miss ? ` · 未打下班 ${st.miss} 天` : ""}</h3>
    ${rows ? `<table><thead><tr><th>日期</th><th>上班</th><th>下班</th><th>距离</th><th>状态</th><th>地点</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">本月还没有记录</div>`}
  </div>

  ${admin ? `<div class="card">
    <h3>打卡设置</h3>
    <div class="row">
      <label>办公点名称<input id="att-site" value="${esc(cfg.site_name || "")}" placeholder="如 Lusaka 办公室"></label>
      <label>允许范围（米）<input id="att-radius" type="number" value="${esc(cfg.radius || 300)}"></label>
    </div>
    <div class="row3">
      <label>纬度<input id="att-lat" type="number" step="0.000001" value="${cfg.lat ? esc(cfg.lat) : ""}" placeholder="-15.4067"></label>
      <label>经度<input id="att-lng" type="number" step="0.000001" value="${cfg.lng ? esc(cfg.lng) : ""}" placeholder="28.2871"></label>
      <label>&nbsp;<button id="att-here" class="btn" style="width:100%;">用当前位置</button></label>
    </div>
    <div class="row3">
      <label>上班时间<input id="att-start" value="${esc(cfg.start || "08:00")}" placeholder="08:00"></label>
      <label>下班时间<input id="att-end" value="${esc(cfg.end || "17:00")}" placeholder="17:00"></label>
      <label>宽限（分钟）<input id="att-grace" type="number" value="${esc(cfg.grace == null ? 15 : cfg.grace)}"></label>
    </div>
    <button id="att-cfg-save" class="btn pri" style="margin-top:12px;">保存设置</button>
  </div>` : ""}`;
}

function attMinOf(v) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(v || ""));
  return m ? +m[1] * 60 + +m[2] : 0;
}
function attHours(r) {
  const mins = (new Date(r.outAt) - new Date(r.inAt)) / 60000;
  if (!(mins > 0)) return "-";
  return Math.floor(mins / 60) + "h " + Math.round(mins % 60) + "m";
}

function bindAtt(pane) {
  const btn = $("#att-punch", pane);
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = "正在定位…";
    try {
      const g = await gpsFix();
      const now = new Date();
      const r = await api("/att/punch", {
        method: "POST", quiet: true,
        body: { lat: g.lat, lng: g.lng, acc: g.acc, d: localDay(now), hm: now.toTimeString().slice(0, 5) },
      });
      toast(r.phase === "in" ? "上班打卡成功" : "下班打卡成功");
      await punchPane(pane);
    } catch (e) {
      toast(e.message, "bad");
      btn.disabled = false;
      btn.textContent = old;
    }
  };
  const mo = $("#att-month", pane);
  if (mo) mo.onchange = () => { ATT.ym = mo.value; render(); };
  const sc = $("#att-scope", pane);
  if (sc) sc.onchange = () => { ATT.all = sc.value === "all"; render(); };
  const here = $("#att-here", pane);
  if (here) here.onclick = async () => {
    try {
      const g = await gpsFix();
      $("#att-lat", pane).value = g.lat.toFixed(6);
      $("#att-lng", pane).value = g.lng.toFixed(6);
      toast("已填入当前位置，记得保存");
    } catch (e) { toast(e.message, "bad"); }
  };
  const save = $("#att-cfg-save", pane);
  if (save) save.onclick = async () => {
    try {
      await api("/att/cfg", {
        method: "PUT", toast: "打卡设置已保存",
        body: {
          site_name: $("#att-site", pane).value.trim(),
          radius: +$("#att-radius", pane).value || 300,
          lat: +$("#att-lat", pane).value || 0,
          lng: +$("#att-lng", pane).value || 0,
          start: $("#att-start", pane).value.trim(),
          end: $("#att-end", pane).value.trim(),
          grace: +$("#att-grace", pane).value || 0,
        },
      });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
}

  permit: [["permitNo", "许可证号"], ["validUntil", "有效期"]],
  exported: [["note", "备注"]],
};

const expStageIdx = (x) => Math.max(0, EXP.stages.indexOf(x.status));

function expHtml() {
  const rows = EXP.list.map((x) => {
    const idx = expStageIdx(x);

function expDetailHtml(x) {
  const filesByStage = {};
  (x.files || []).forEach((f) => { (filesByStage[f.stage] = filesByStage[f.stage] || []).push(f); });
  const stages = EXP.stages.map((k) => {
    const st = (x.stages || {})[k] || {};
    const done = !!st.at;
    const fields = EXP_STAGE_FIELDS[k] || [];
    const inputs = fields.map(([fk, label]) =>
      `<label>${label}<input data-es="${k}:${fk}" value="${esc(st[fk] || "")}" placeholder="${done ? "" : "填写后点标记完成"}"></label>`).join("");
    const files = filesByStage[k] || [];
    const fileRows = files.map((f) => `<div class="file-row">
        <a href="/api/exports/${encodeURIComponent(x.id)}/file?k=${encodeURIComponent(f.k)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span class="mut">${Math.max(1, Math.round(f.size / 1024))} KB</span>
        <button class="btn danger" data-ef-del="${esc(k)}|${esc(f.k)}">删</button>
      </div>`).join("");
    return `<div class="exp-stage${done ? " done" : ""}">
      <div class="exp-stage-h"><b>${esc(EXP.labels[k] || k)}</b>
        <span class="mut">${done ? "已完成 " + esc(String(st.at).slice(0, 10)) : "未完成"}</span></div>
      <div class="grid">${inputs}</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn${done ? "" : " pri"}" data-es-save="${esc(k)}">${done ? "更新本阶段" : "标记完成"}</button>
        <label class="btn" style="margin:0;display:inline-flex;align-items:center;cursor:pointer;">＋ 上传文件
          <input type="file" accept="application/pdf,image/*" data-ef-up="${esc(k)}" style="display:none;">
        </label>
      </div>
      ${fileRows}
    </div>`;
  }).join("");

  return `<div class="exp-detail">
    <div class="mut" style="font-size:13px;">${esc([x.qty ? x.qty + " " + (x.unit || "t") : "", x.hs ? "HS " + x.hs : "", x.elems].filter(Boolean).join(" · "))}</div>
    ${x.note ? `<div class="mut" style="font-size:13px;">备注：${esc(x.note)}</div>` : ""}
    ${stages}
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn danger" data-exp-del="${esc(x.id)}">删除这张单</button>
    </div>
  </div>`;
}

function bindExp(pane) {
  const q = $("#exp-q", pane);
  if (q) {
    q.onkeydown = (e) => { if (e.key === "Enter") { EXP.q = q.value.trim(); render(); } };
    q.onblur = () => { if (q.value.trim() !== EXP.q) { EXP.q = q.value.trim(); render(); } };
  }
  const nw = $("#exp-new", pane);
  if (nw) nw.onclick = () => { EXP.adding = true; render(); };
  const cancel = $("#ex-cancel", pane);
  if (cancel) cancel.onclick = () => { EXP.adding = false; render(); };
  const save = $("#ex-save", pane);
  if (save) save.onclick = async () => {
    const body = {
      date: $("#ex-date", pane).value, co: $("#ex-co", pane).value.trim(),
      mineral: $("#ex-mineral", pane).value, kind: $("#ex-kind", pane).value,
      qty: +$("#ex-qty", pane).value || 0, unit: $("#ex-unit", pane).value.trim() || "t",
      importer: $("#ex-importer", pane).value.trim(), dest: $("#ex-dest", pane).value.trim(),
      hs: $("#ex-hs", pane).value.trim(), elems: $("#ex-elems", pane).value.trim(),
      note: $("#ex-note", pane).value.trim(),
    };
    try {
      const r = await api("/exports", { method: "POST", body, toast: "出口单已建立" });
      EXP.adding = false;
      EXP.open = r.id;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
  pane.querySelectorAll("[data-exp]").forEach((b) => b.onclick = () => {
    EXP.open = EXP.open === b.dataset.exp ? null : b.dataset.exp;
    render();
  });
  pane.querySelectorAll("[data-es-save]").forEach((b) => b.onclick = async () => {
    const stage = b.dataset.esSave;
    const body = { stage, fields: {} };
    pane.querySelectorAll(`[data-es^="${stage}:"]`).forEach((i) => { body.fields[i.dataset.es.split(":")[1]] = i.value; });
    try {
      await api(`/exports/${EXP.open}/stage`, { method: "POST", body, toast: "阶段已更新" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-ef-up]").forEach((inp) => inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast("文件太大（限 20MB）", "bad");
    const data = await new Promise((ok, bad) => {
      const rd = new FileReader();
      rd.onload = () => ok(rd.result);
      rd.onerror = () => bad(new Error("读取文件失败"));
      rd.readAsDataURL(f);
    });
    try {
      await api(`/exports/${EXP.open}/file`, { method: "POST", body: { stage: inp.dataset.efUp, name: f.name, data }, toast: "已上传" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-ef-del]").forEach((b) => b.onclick = async () => {
    const [stage, k] = b.dataset.efDel.split("|");
    if (!confirm("删除这份文件？")) return;
    try {
      await api(`/exports/${EXP.open}/file?k=${encodeURIComponent(k)}`, { method: "DELETE", toast: "已删除" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-exp-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("删除这张出口单（含全部文件）？")) return;
    try {
      await api("/exports/" + b.dataset.expDel, { method: "DELETE", toast: "已删除" });
      EXP.open = null;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
}

$("#sf").onsubmit = async (e) => {
  e.preventDefault();
  $("#s_err").textContent = "";
  try {
    const r = await api("/setup", { method: "POST", headers: { "x-setup-token": $("#s_token").value.trim() },
      body: { login: $("#s_login").value, name: $("#s_name").value, password: $("#s_pass").value } });
    S.user = r.user; await showApp();
  } catch (e2) { $("#s_err").textContent = e2.message; }
};

(async () => {
  try {
    const st = await api("/status");
    if (st.setup_needed) return showSetup();
  } catch {}
  try {
    const r = await api("/me");
    if (r.user) { S.user = r.user; await showApp(); } else showLogin();
  } catch { showLogin(); }
})();
</script>
</body>
</html>
