    t.status === "done" && (isMaker(t) || isAdmin()) ? `<button data-td-act="reopen" data-td-id="${t.id}">↺ ${esc(tr("重开"))}</button>` : "",
    canTouch(t) ? `<button data-td-act="edit" data-td-id="${t.id}">✎ ${esc(tr("修改"))}</button>` : "",
  ].filter(Boolean).join("");
  const composer = TD_ACT ? tdActBox(t) : `<div class="td-composer">
      ${TD_REPLY ? `<div class="td-replying"><span>↩ ${esc(tr("回复"))} ${esc(TD_REPLY.name)}：${esc(String(TD_REPLY.text || "").slice(0, 40))}</span><button data-td-xreply title="${esc(tr("取消回复"))}">✕</button></div>` : ""}
      ${isMine(t) && t.status === "doing" ? `<div class="td-quick">${Object.keys(REPORT_FLAGS).map((k) =>
        `<button data-td-flag="${k}">${esc(tr(REPORT_FLAGS[k]))}</button>`).join("")}</div>` : ""}
      <textarea id="td_pin" maxlength="1000" placeholder="${esc(tr(t.status === "submitted" ? "补充说明……" : "写一句……（Ctrl+Enter 发送）"))}"></textarea>
      <div class="td-crow">
        ${canTouch(t) ? `<label class="td-att-add">📎 ${esc(tr("附件"))}<input type="file" multiple hidden data-td-pfile="${t.id}" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.csv,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx,image/*,application/pdf"></label>` : ""}
        <span class="mut" style="font-size:11.5px">${files.length ? esc(tr(`${files.length} 个附件`)) : ""}</span>
        <button class="pri" id="td_psend">${esc(tr("发送"))}</button>

  return `<div class="td-phead">

      <div class="td-ph">
        <h3>${esc(t.title)}</h3>
        <div class="mut">${t.creator ? esc(t.creator_name || t.creator) : "—"} → ${t.owner ? esc(t.owner_name || t.owner) : esc(tr("未指派"))} · ${dueTxt}${t.rounds ? ` · ${esc(tr(`第 ${t.rounds} 轮`))}` : ""}</div>

function paintPanel() {
  const box = document.getElementById("td_panel");
  if (!box) return;
  const t = TODOS.find((x) => x.id === TD_PANEL);
  if (!t) { tdClosePanel(); return; }
  const pb = box.querySelector(".td-pbody");
  const ps = pb ? pb.scrollTop : 0;
  box.innerHTML = tdPanelHtml(t);
  bindPanel(t);
  const nb = box.querySelector(".td-pbody");
  if (nb) nb.scrollTop = TD_SCROLL != null ? TD_SCROLL : ps;
  TD_SCROLL = null;
}

function bindPanel(t) {
  const box = document.getElementById("td_panel");
  if (!box) return;
  const pc = box.querySelector("[data-pclose]");
  if (pc) pc.onclick = tdClosePanel;
  box.querySelectorAll("[data-td-reply]").forEach((b) => b.onclick = () => {
    const n = (t.notes || []).find((x) => x.id === b.dataset.tdReply);
    if (!n) return;
    TD_REPLY = { id: n.id, name: n.name, text: n.body };
    paintPanel();
    const inp = document.getElementById("td_pin");
    if (inp) inp.focus();
  });
  const xr = box.querySelector("[data-td-xreply]");
  if (xr) xr.onclick = () => { TD_REPLY = null; paintPanel(); };
  box.querySelectorAll("[data-td-flag]").forEach((b) => b.onclick = async () => {
    const pin = document.getElementById("td_pin");
    const text = (pin && pin.value || "").trim();
    try {
      await api("/todos/" + encodeURIComponent(t.id) + "/report", { method: "POST", body: { flag: b.dataset.tdFlag, text }, quiet: true });
      toast(tr("已上报，今天这项算报了"));
      await tdRefresh(true);
    } catch (e) { toast(e.message, "bad"); }
  });
  const send = async () => {
    const pin = document.getElementById("td_pin");
    const text = (pin && pin.value || "").trim();
    if (!text) { toast(tr("写点内容再发"), "bad"); return; }
    const data = { text };
    if (TD_REPLY) data.reply_to = TD_REPLY.id;
    try {
      await api("/todos/" + encodeURIComponent(t.id) + "/notes", { method: "POST", body: data, quiet: true });
      TD_REPLY = null;
      await tdRefresh(true);
    } catch (e) { toast(e.message, "bad"); }
  };
  const ps = box.querySelector("#td_psend");
  if (ps) ps.onclick = send;
  const pin = box.querySelector("#td_pin");
  if (pin) pin.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); } };
  box.querySelectorAll("[data-td-pfile]").forEach((inp) => inp.onchange = async () => {
    const list = [...(inp.files || [])];
    if (!list.length) return;
    inp.disabled = true;
    let n = 0;
    for (const f of list) {
      try { await tdUpload(t.id, f); n++; } catch (e) { toast(e.message || tr("上传失败"), "bad"); }
    }
    if (n) toast(tr(`已上传 ${n} 个附件`));
    await tdRefresh();
  });
  box.querySelectorAll("[data-td-fdel]").forEach((b) => b.onclick = async () => {
    if (!confirm(tr("删除这个附件？"))) return;
    try {
      await api("/todos/" + encodeURIComponent(b.dataset.tdFid) + "/file/" + encodeURIComponent(b.dataset.tdFdel), { method: "DELETE", quiet: true });
      await tdRefresh();
    } catch (e) { toast(e.message, "bad"); }
  });
  box.querySelectorAll("[data-td-act]").forEach((b) => b.onclick = () => {
    const type = b.dataset.tdAct;
    if (type === "edit") { todoSheet(t); return; }
    if (type === "reopen") return todoPatch(t.id, { status: "doing" });
    TD_ACT = { type, id: t.id };
    paintPanel();
  });
  const no = box.querySelector("#td_act_no");
  if (no) no.onclick = () => { TD_ACT = null; paintPanel(); };
  const val = () => {
    const el = document.getElementById("td_act_text");
    return (el && el.value || "").trim();
  };
  const subm = async () => {
    try {
      const r = await api("/todos/" + encodeURIComponent(t.id) + "/submit", { method: "POST", body: { note: val() }, quiet: true });
      TD_ACT = null;
      toast(r.status === "done" ? tr("已完成") : tr("已提交，等对方审核"));
      await tdRefresh(true);
    } catch (e) { const el = document.getElementById("td_act_err"); if (el) el.textContent = e.message; }
  };
  const review = async (pass) => {
    const note = val();
    if (!pass && !note) { const el = document.getElementById("td_act_err"); if (el) el.textContent = tr("驳回要写清哪里还没做完"); return; }
    try {
      await api("/todos/" + encodeURIComponent(t.id) + "/review", { method: "POST", body: { pass, note }, quiet: true });
      TD_ACT = null;
      toast(pass ? tr("已通过，任务完成") : tr("已驳回，任务回到进行中"));
      await tdRefresh(true);
    } catch (e) { const el = document.getElementById("td_act_err"); if (el) el.textContent = e.message; }
  };
  const ok = box.querySelector("#td_act_ok");
  if (ok) ok.onclick = subm;
  const ap = box.querySelector("#td_act_pass");
  if (ap) ap.onclick = () => review(true);
  const rj = box.querySelector("#td_act_rej");
  if (rj) rj.onclick = () => review(false);
  const ta = box.querySelector("#td_act_text");
  if (ta) ta.focus();
}

/* 局部刷新：只重画列表和抽屉，保住滚动位置和面板 */
async function tdRefresh(toEnd) {
  const y = window.scrollY;
  const pb = document.querySelector("#td_panel .td-pbody");
  await loadTodos();
  if (S.tab === "todo") {
    $("#pane").innerHTML = todoHtml();
    bindTodo();
  }
  if (TD_PANEL) paintPanel();
  const nb = document.querySelector("#td_panel .td-pbody");
  if (nb && toEnd) nb.scrollTop = nb.scrollHeight;
  window.scrollTo(0, y);
}

/* 有人回复时自动出现：待办页每 20 秒对一次，内容变了才重画 */
function tdPollStart() {
  tdPollStop();
  TD_POLL = setInterval(async () => {
    if (document.hidden || S.tab !== "todo") return;
    try {
      const r = await api("/todos", { quiet: true });
      const raw = JSON.stringify(r.todos || []);
      if (raw === TD_RAW) return;
      TODOS = r.todos || [];
      TD_RAW = raw;
      const y = window.scrollY;
      const pb = document.querySelector("#td_panel .td-pbody");
      const ps = pb ? pb.scrollTop : 0;
      $("#pane").innerHTML = todoHtml();
      bindTodo();
      if (TD_PANEL) paintPanel();
      const nb = document.querySelector("#td_panel .td-pbody");
      if (nb) nb.scrollTop = ps;
      window.scrollTo(0, y);
    } catch (e) {}
  }, 20000);
}
function tdPollStop() { if (TD_POLL) clearInterval(TD_POLL); TD_POLL = null; }

function bindTodo() {
  const pane = $("#pane");
  if ($("#td_new")) $("#td_new").onclick = () => todoSheet(null);
  pane.querySelectorAll("[data-td-filter]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    S.todoFilter = b.dataset.tdFilter;
    render();
  });
  pane.querySelectorAll("[data-td-open]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    tdOpenPanel(b.dataset.tdOpen);
  });
  pane.querySelectorAll("[data-td-star]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const t = TODOS.find((x) => x.id === b.dataset.tdStar) || {};
    todoPatch(b.dataset.tdStar, { imp: t.imp ? 0 : 1 });
  });
  pane.querySelectorAll("[data-td-act]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const t = TODOS.find((x) => x.id === b.dataset.tdId);
    if (!t) return;
    if (b.dataset.tdAct === "report") return tdReport(t);
    tdOpenPanel(t.id);
    TD_ACT = { type: b.dataset.tdAct, id: t.id };
    paintPanel();
  });
}

async function todoPatch(id, patch) {
  try {
    await api("/todos/" + encodeURIComponent(id), { method: "PATCH", body: patch, quiet: true });
    await tdRefresh();
  } catch (e) { toast(e.message, "bad"); }
}

/* 新建 / 修改 */
function todoSheet(t) {

/* 每日汇报：三下五除二 —— 推进了 / 卡住了 / 今天没动，点一下就算报过；想细说再写字 */
function tdReport(t) {
  if (!t) return;
  const quick = [["progress", "🟢 推进了", "今天做到哪一步"], ["blocked", "🟠 卡住了", "卡在哪，需要谁支持"], ["idle", "⚪ 今天没动", "今天没排上，明天做"]];
  document.body.insertAdjacentHTML("beforeend", `<div class="fd-dim" id="tdr_dim"></div>
    <div class="fd-sheet" id="td_report">
      <div class="fd-sh"><h3>📝 ${esc(tr("汇报进展"))} · ${esc(t.title)}</h3><button id="tdr_x">${esc(tr("取消"))}</button></div>
      <div class="mut" style="font-size:12.5px;margin-bottom:8px">${esc(tr("点一下就记下今天报过了；有细节就顺手写一句。老板和同事都看得见。"))}</div>
      <div class="td-quick">${quick.map(([k, label, ph]) =>
        `<button data-tdr-flag="${k}"><b>${esc(tr(label))}</b><span>${esc(tr(ph))}</span></button>`).join("")}</div>
      <label>${esc(tr("说一句（选填）"))}</label>
      <textarea id="tdr_text" maxlength="1000" placeholder="${esc(tr("做了什么、卡在哪、预计什么时候能完"))}"></textarea>
      <div class="err" id="tdr_err"></div>
      <div class="acts" style="margin-top:10px"><button class="pri" id="tdr_ok">${esc(tr("提交"))}</button><button id="tdr_cancel">${esc(tr("取消"))}</button></div>
    </div>`);
  const close = () => { ["tdr_dim", "td_report"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); };
  $("#tdr_x").onclick = close;
  $("#tdr_cancel").onclick = close;
  $("#tdr_dim").onclick = close;
  const send = async (flag) => {
    const text = $("#tdr_text").value.trim();
    try {
      await api("/todos/" + encodeURIComponent(t.id) + "/report", { method: "POST", body: { text, flag }, quiet: true });
      close();
      toast(tr("已上报，今天这项算报了"));
      await tdRefresh(true);
    } catch (e) { $("#tdr_err").textContent = e.message; }
  };
  document.querySelectorAll("[data-tdr-flag]").forEach((b) => b.onclick = () => send(b.dataset.tdrFlag));
  /* 直接点「提交」= 有推进（正文可选） */
  $("#tdr_ok").onclick = () => send("progress");
  if ($("#tdr_text")) $("#tdr_text").focus();
}

/* 每日提醒：逾期 + 今天还没汇报的，每天第一次打开工作台弹一张；管理层多看一行「谁还没报」 */
function maybeLateAlert() {
  if (!S.user || document.getElementById("td_alert")) return;
  const lm = lateForMe();
  const nr = needReport();
  const byOwner = {};
  if (canManage()) {
    for (const t of TODOS) {
      if (t.status === "done" || !t.owner || t.owner === S.user.login || reportedToday(t)) continue;
      const p = byOwner[t.owner] = byOwner[t.owner] || { name: t.owner_name || nameOf(t.owner), n: 0 };
      p.n++;
    }
  }
  const team = Object.values(byOwner).sort((a, b) => b.n - a.n);
  if (!lm.length && !nr.length && !team.length) return;
  const key = "tdal_" + S.user.login + "_" + iso(new Date());
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  const line = (t, right) => `<div class="td-al-line"><b>${esc(t.title)}</b><span class="${right.cls}">${right.txt}</span></div>`;
  const lateRows = lm.slice(0, 5).map((t) => line(t, { cls: "td-late", txt: tr(`${-daysLeft(t.due)} 天`) })).join("");
  const needRows = nr.slice(0, 5).map((t) => line(t, {
    cls: reportAge(t) >= 2 ? "td-late" : "mut",
    txt: reportAge(t) ? tr(`${reportAge(t)} 天没汇报`) : tr("今天还没汇报"),
  })).join("");
  const teamRows = team.map((p) => `<div class="td-al-line"><b>${esc(p.name)}</b><span class="td-late">${esc(tr(`${p.n} 项没汇报`))}</span></div>`).join("");
  const head = nr.length ? `📝 ${tr("今天还没汇报")} ${nr.length} ${tr("项")}`
    : lm.length ? `⚠ ${lm.length} ${tr("条已逾期")}`
      : `👀 ${team.length} ${tr("位同事今天还没汇报")}`;
  document.body.insertAdjacentHTML("beforeend", `<div class="fd-dim" id="tda_dim"></div>
    <div class="fd-sheet" id="td_alert">
      <div class="fd-sh"><h3>${esc(head)}</h3></div>
      <div class="mut" style="font-size:13px">${esc(tr(nr.length
        ? "点一下「今天没动」也算报过，别攒着。"
        : "这些过了截止日期还没交，今天处理一下。"))}</div>
      ${nr.length ? `<div class="td-al-sub">${esc(tr("今天还没汇报"))}</div><div class="td-al-list">${needRows}${nr.length > 5 ? `<div class="mut">+${nr.length - 5}</div>` : ""}</div>` : ""}
      ${lm.length ? `<div class="td-al-sub">${esc(tr("已逾期"))}</div><div class="td-al-list">${lateRows}${lm.length > 5 ? `<div class="mut">+${lm.length - 5}</div>` : ""}</div>` : ""}
      ${team.length ? `<div class="td-al-sub">${esc(tr("同事今天还没汇报"))}</div><div class="td-al-list">${teamRows}</div>` : ""}
      <div class="acts" style="margin-top:12px"><button class="pri" id="tda_go">${esc(tr(nr.length ? "去汇报" : "去处理"))}</button><button id="tda_ok">${esc(tr("知道了"))}</button></div>
    </div>`);
  const mark = () => { try { localStorage.setItem(key, "1"); } catch (e) {} };
  const close = () => { ["tda_dim", "td_alert"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); };
  $("#tda_ok").onclick = () => { mark(); close(); };
  $("#tda_dim").onclick = () => { mark(); close(); };
  $("#tda_go").onclick = async () => { mark(); close(); S.todoFilter = nr.length ? "need" : "late"; await enterApp("todo"); };
}

const coKB = (n) => { const s = Number(n) || 0; return s > 1048576 ? (s / 1048576).toFixed(1) + " MB" : s ? Math.round(s / 1024) + " KB" : ""; };

async function coUploadDoc(cid, f) {
  if (f.size > 25 * 1024 * 1024) throw new Error(tr("文件超过 25MB，请线下提供（U 盘 / 网盘 / 邮件）"));
  const data = await new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result);
    rd.onerror = () => rej(new Error(tr("读取失败")));
    rd.readAsDataURL(f);
  });
  const mime = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "image/jpeg");
  const r = await api("/companies/" + cid + "/doc", {
    method: "POST", quiet: true,
    body: { data, name: f.name, mime, label: f.name.replace(/\.[^.]+$/, "") },
  });
  return r.docs;
}

function coDocRow(d, cid) {
  const pdf = /pdf/i.test(d.mime || "");

  return `<div class="co-doc">
      <span class="co-ic">${pdf ? "📄" : "🖼"}</span>
      <a href="/api/companies/${esc(cid)}/doc/${esc(d.k)}" target="_blank" rel="noopener">

        <i>${esc(d.name || "")}${kb ? " · " + kb : ""}${d.at ? " · " + esc(d.at) : ""}</i></a>

function coReadForm() {
  const v = (id) => { const el = $("#" + id); return el ? el.value.trim() : ""; };
  const rows = (sel, cols) => [...document.querySelectorAll(sel + " tr")].map((tr) => {
    const o = {};
    cols.forEach((k) => { const el = tr.querySelector('[data-f="' + k + '"]'); o[k] = el ? el.value.trim() : ""; });
    o.amount = moneyNum(o.amount);
    return o;
  }).filter((x) => x.name);
  return {
    name: v("co_name"), name_en: v("co_name_en"), reg_no: v("co_reg_no"), reg_date: v("co_reg_date"),
    tpin: v("co_tpin"), address: v("co_addr"), phone: v("co_phone"), email: v("co_email"),
    share_capital: moneyNum(v("co_cap")), currency: v("co_cur") || "ZMW",
    notes: v("co_notes"), tags: v("co_tags"),
    shareholders: rows("#co_sh", ["name", "nationality", "id_no", "amount"]),
    directors: rows("#co_dir", ["name", "nationality", "id_no", "role"]),
  };
}

function bindCompany(pane) {
  const go = (fn) => (e) => { e.preventDefault(); fn(); };
  if ($("#co_q")) {
    const run = () => { CO.q = $("#co_q").value.trim(); loadCompanies().then(render).catch((e) => toast(e.message, "bad")); };
    $("#co_q").onkeydown = (e) => { if (e.key === "Enter") run(); };
    $("#co_q").onchange = run;
  }
  if ($("#co_q_toggle")) $("#co_q_toggle").onclick = go(() => { CO.showSearch = !CO.showSearch; render(); });
  if ($("#co_q_go")) $("#co_q_go").onclick = go(() => {
    CO.q = ($("#co_q").value || "").trim();
    loadCompanies().then(render).catch((e) => toast(e.message, "bad"));
  });
  if ($("#co_q_clear")) $("#co_q_clear").onclick = go(() => {
    CO.q = "";
    loadCompanies().then(render).catch((e) => toast(e.message, "bad"));
  });
  if ($("#co_new")) $("#co_new").onclick = go(() => { CO.cur = null; CO.edit = true; CO.imp = false; CO.pending = []; render(); });
  if ($("#co_imp_btn")) $("#co_imp_btn").onclick = go(() => { CO.imp = !CO.imp; render(); });
  if ($("#co_imp_cancel")) $("#co_imp_cancel").onclick = go(() => { CO.imp = false; render(); });
  if ($("#co_imp_demo")) $("#co_imp_demo").onclick = go(() => {
    const ta = $("#co_json");
    if (ta) {
      ta.value = JSON.stringify([
        { name: "ABC Mining Ltd", name_en: "ABC Mining Limited", reg_no: "120200012345", reg_date: "2020-05-12", tpin: "1001234567",
          address: "Plot 12, Great East Road, Lusaka", phone: "+260 97 000 0000", share_capital: 500000,
          shareholders: [{ name: "Zhang San", nationality: "China", id_no: "P1234567", amount: 400000 },
            { name: "Local Partner", nationality: "Zambia", id_no: "123456/11/1", amount: 100000 }],
          directors: [{ name: "Zhang San", nationality: "China", role: "Director" }], notes: "" },
      ], null, 2);
    }
  });
  if ($("#co_imp_go")) $("#co_imp_go").onclick = go(async () => {
    let arr;
    try { arr = JSON.parse($("#co_json").value); } catch (e) { return toast(tr("JSON 格式不对"), "bad"); }
    if (!Array.isArray(arr)) return toast(tr("要一个数组"), "bad");
    try {
      const r = await api("/companies/bulk", { method: "POST", body: { companies: arr } });
      CO.imp = false;
      await loadCompanies();
      render();
      toast(tr("已导入") + " " + r.added);
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_doc_up")) $("#co_doc_up").onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f || !CO.cur) return;
    try {
      CO.cur.docs = await coUploadDoc(CO.cur.id, f);
      render();
      toast(tr("已上传") + " " + f.name);
    } catch (e) { toast(e.message, "bad"); }
  };
  if ($("#co_doc_pick")) $("#co_doc_pick").onchange = (ev) => {
    for (const f of [...(ev.target.files || [])]) {
      if (CO.pending.some((x) => x.name === f.name && x.size === f.size)) continue;
      CO.pending.push(f);
    }
    ev.target.value = "";
    coPendRefresh();
  };
  bindPendDel();
  pane.querySelectorAll("[data-codel]").forEach((b) => {
    b.onclick = async (ev) => {
      ev.preventDefault();
      if (!CO.cur || !confirm(tr("删除这份资料？"))) return;
      try {
        const r = await api("/companies/" + CO.cur.id + "/doc?k=" + encodeURIComponent(b.dataset.codel),
          { method: "DELETE", quiet: true });
        CO.cur.docs = r.docs;
        render();
        toast(tr("已删除"));
      } catch (e) { toast(e.message, "bad"); }
    };
  });
  pane.querySelectorAll("[data-co]").forEach((b) => {
    b.onclick = () => { CO.cur = CO.list.find((x) => x.id === b.dataset.co) || null; CO.edit = false; render(); };
  });
  if ($("#co_back")) $("#co_back").onclick = go(() => { CO.cur = null; CO.edit = false; CO.pending = []; render(); });
  if ($("#co_edit")) $("#co_edit").onclick = go(() => { CO.edit = true; render(); });
  if ($("#co_cancel")) $("#co_cancel").onclick = go(() => { CO.edit = false; render(); });
  if ($("#co_save")) $("#co_save").onclick = go(async () => {
    const data = coReadForm();
    if (!data.name) return toast(tr("公司名必填"), "bad");
    const isNew = !(CO.cur && CO.cur.id);
    try {
      const r = isNew
        ? await api("/companies", { method: "POST", body: data })
        : await api("/companies/" + CO.cur.id, { method: "PATCH", body: data });
      CO.cur = r.company;
      CO.edit = false;
      let up = 0, bad = [];
      if (isNew && (CO.pending || []).length) {
        for (const f of CO.pending) {
          try { CO.cur.docs = await coUploadDoc(CO.cur.id, f); up++; } catch (e) { bad.push(f.name); }
        }
        CO.pending = [];
      }
      await loadCompanies();
      render();
      if (up) toast(tr(`已保存，资料 ${up} 份已上传`));
      else toast(tr("已保存"));
      if (bad.length) toast(tr(`${bad.length} 份资料上传失败：${bad.join("、")}`), "bad");
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_del")) $("#co_del").onclick = go(async () => {
    if (!confirm(tr(`确定删除「${CO.cur.name}」？`))) return;
    try {
      await api("/companies/" + CO.cur.id, { method: "DELETE" });
      CO.cur = null;
      await loadCompanies();
      render();
      toast(tr("已删除"));
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_add_sh")) $("#co_add_sh").onclick = go(() => $("#co_sh").insertAdjacentHTML("beforeend", coShRow()));
  if ($("#co_add_dir")) $("#co_add_dir").onclick = go(() => $("#co_dir").insertAdjacentHTML("beforeend", coDirRow()));
  ["#co_sh", "#co_dir"].forEach((sel) => {
    const tb = $(sel);
    if (tb) tb.onclick = (e) => { const b = e.target.closest(".co-x"); if (b) b.closest("tr").remove(); };
  });
}

let FIN = null;
let FINR = "month"; // day | week | month | year
const FINR_ZH = { day: "今日", week: "本周", month: "本月", year: "本年" };
let FININV = "all"; // all | yes | no   票据筛选
let FINMARK = false; // 补票模式：逐行标有票/无票
let FINANA = false; // 核对与报表（资金总览 / 备用金 / 调拨 / 支出汇总）默认收起
const FIN_START = "2026-11-01"; // 账从这天起算（和 Worker 的 FIN_START 一致）
const FINCO = "__company"; // 公司账户（一级户，uid 固定；只作为资金沉淀处，不是人）
const FIN_CCY = ["ZMW", "USD", "CNY", "EUR", "ZAR", "OTHER"]; // 与 worker 的 FIN_CCY 对齐
let FINVIEW = null; // 最近一次渲染的列表（导出用）
let FINCH = "cash"; // 费用记录分两本账：cash 现金 / bank 银行
const FIN_STATE_ZH = { recorded: "待核", linked: "已对上", confirmed: "已确认", reconciled: "已核销", auto: "账单补录", disputed: "有异议" };
let FINWHO = ""; // "" = 我自己；"ALL" = 全部汇总；其它 = 某个人的账本
try {
  const v = JSON.parse(localStorage.getItem("ops_fin_view") || "{}");
  if (FINR_ZH[v.range]) FINR = v.range;
  if (v.inv === "yes" || v.inv === "no" || v.inv === "all") FININV = v.inv;
  if (v.ana) FINANA = true;
  if (v.who) FINWHO = v.who;
} catch (e) {}
const saveFinView = () => {
  try { localStorage.setItem("ops_fin_view", JSON.stringify({ who: FINWHO, range: FINR, inv: FININV, ana: FINANA })); } catch (e) {}
};
const FIN_CAT_ZH = { transport: "交通", fuel: "加油", tip: "小费", meal: "餐饮住宿", comms: "通讯", office: "办公",
  bankfee: "银行手续费", allow: "员工补贴", pliving: "生活开销", repair: "维修", misc: "其它",
  sub: "外协劳务（包工头）", serenje: "Serenje 钽铌矿项目",
  loan: "借款", home: "家庭开支",
  /* 老分类：只用来显示还没合并的历史记录 */
  lodging: "住宿", daily: "日常", postage: "邮费", other: "其它" };
/* 归属（大类）→ 分类（细类）：改这里就是改「记一笔」的下拉 */
const FIN_FT = [
  ["life", "生活", ["transport", "fuel", "tip", "meal", "comms", "office", "bankfee", "allow", "pliving", "repair", "misc"]],
  ["project", "项目", ["sub", "serenje"]],
  ["licence", "矿权维护", []],
  ["ledger", "往来（不计费用）", ["loan", "home"]],
];
const FIN_FT_CATS = Object.fromEntries(FIN_FT.map(([k, , c]) => [k, c]));
const FIN_CAT_FT = Object.fromEntries(FIN_FT.reduce((a, [k, , cs]) => a.concat(cs.map((c) => [c, k])), []));
/* 老分类 → 新分类，合并按钮和接口都按这张表走 */
const FIN_CAT_MERGE = { daily: "misc", postage: "misc", other: "misc", lodging: "meal" };
/* 不是公司费用的科目：钱照样出账（余额要扣），但不进利润表 */
const FIN_OFFBOOK = { home: "私人", loan: "往来" };
/* 选中某些分类时给一句解释 */
const FIN_CAT_HINT = {
  home: "家庭开支 = 私人：钱从账户出，但不计入公司费用、不用发票",
  sub: "外协劳务：付给包工头的工作目标款（不是本公司员工工资）。留合同/工作范围 + 收据，最好要票",
};
const finOffbook = (e) => ((e.kind === "out" || e.kind === "in") && (FIN_OFFBOOK[e.cat] || (e.ft === "ledger" && "往来"))) || "";
const finMoney = (n) => (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* 金额输入框：不聚焦时显示 1,000,000.00，点进去变回纯数字方便改；读值一律走 moneyNum() */
const moneyNum = (v) => {
  const n = Number(String(v == null ? "" : v).replace(/[,\s]/g, ""));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
};
const moneyPaint = (el, force) => {
  if (!el || (!force && document.activeElement === el) || String(el.value).trim() === "") return;
  const txt = finMoney(moneyNum(el.value));
  if (el.value !== txt) el.value = txt;
};
const moneyScan = (root) => (root || document).querySelectorAll("input[data-money]").forEach((el) => moneyPaint(el));
new MutationObserver((ms) => {
  for (const m of ms) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.matches && n.matches("input[data-money]")) moneyPaint(n);
    if (n.querySelectorAll) n.querySelectorAll("input[data-money]").forEach((el) => moneyPaint(el));
  }
}).observe(document.body || document.documentElement, { childList: true, subtree: true });
document.addEventListener("focusin", (e) => {
  const el = e.target;
  if (el && el.matches && el.matches("input[data-money]") && String(el.value).trim() !== "") el.value = String(moneyNum(el.value));
});
document.addEventListener("focusout", (e) => {
  const el = e.target;
  if (el && el.matches && el.matches("input[data-money]")) moneyPaint(el, true);
});
const finCatName = (k) => {
  if (!k) return "未分类";
  if (String(k).startsWith("u:")) return String(k).slice(2);
  return (FIN && FIN.cats && FIN.cats.names && FIN.cats.names[k]) || FIN_CAT_ZH[k] || k;
};
const finKindName = (k) => (k === "in" ? "收入" : k === "float" ? "备用金" : k === "move" ? "取现/存现" : k === "transfer" ? "人员转账" : "支出");

/* 账户：对账余额 + 之后的流入/流出，拆成「来源 − 花费 = 剩余」 */
function finAcct(uid, skipId, upto) {
  const a = (FIN.accounts || []).find((x) => x.uid === uid) || {};
  const since = a.since || "";
  const src = { cash: Number(a.cash) || 0, card: Number(a.card) || 0 };
  const out = { cash: 0, card: 0 };
  const chOf = (ch) => (ch === "card" ? "card" : "cash");
  for (const e of FIN.entries) {
    if (skipId && e.id === skipId) continue;
    if (upto && String(e.date) > upto) continue;
    if (since && String(e.date) <= since) continue;
    const amt = Number(e.amount) || 0;
    const ch = chOf(e.ch);
    if (e.kind === "float") {
      if (e.to_uid === uid) src[ch] += amt;      // 收到备用金 → 现金来源
      if (e.uid === uid) out[ch] += amt;         // 发出备用金 → 花费
    } else if (e.kind === "move") {
      if (e.uid === uid) { const to = ch === "card" ? "cash" : "card"; out[ch] += amt; src[to] += amt; }
    } else if (e.kind === "transfer") {
      if (e.uid === uid) out[ch] += amt;                          // 转出人：按转出口减少
      if (e.to_uid === uid) src[chOf(e.to_ch || e.ch)] += amt;    // 转入人：按转入渠道增加
    } else if (e.uid === uid) {
      if (e.kind === "in") src[ch] += amt; else out[ch] += amt;
    }
  }
  return { cash: src.cash - out.cash, card: src.card - out.card, src, out, since, name: a.name };
}
const finBalance = (uid) => { const a = finAcct(uid); return { cash: a.cash, card: a.card }; };
/* 两本账的口径：老记录只看 ch，新记录带 acct */
const finAcctOf = (e) => (e.acct === "bank" || e.acct === "cash") ? e.acct : (e.ch === "card" ? "bank" : "cash");
const finCardOf = (id) => {
  const key = String(id || "");
  if (!key) return null;
  for (const a of FIN.accounts || []) {
    const c = (a.banks || []).find((x) => x.id === key);
    if (c) return { ...c, uid: a.uid };
  }
  return null;
};
const finCardShort = (c) => (c ? [c.bank || "银行", c.no ? "…" + String(c.no).slice(-4) : ""].filter(Boolean).join(" ") : tr("未指定卡"));

/* 某人手上还有多少备用金：收到的备用金 − 收到之后他自己的支出（备用金本身不算花费） */
function finFloatOf(uid) {
  const got = (FIN.entries || []).filter((e) => e.kind === "float" && e.to_uid === uid);
  if (!got.length) return null;
  const since = got.map((e) => String(e.date || "")).sort()[0] || "";
  const used = (FIN.entries || []).filter((e) => e.uid === uid && e.kind === "out" && String(e.date || "") >= since);
  return {
    got: got.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    used: used.reduce((s, e) => s + (Number(e.amount) || 0), 0),
    giver: got[0].uid, since,
  };
}

/* ---------- 银行水单：解析 + 与系统账对账 ---------- */
const BANK_MON = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const BANK_DATE_LINE = /^(\d{2}-(?:[A-Z]{3}|\d{2})-\d{4})\s+(\d{2}-(?:[A-Z]{3}|\d{2})-\d{4})\b/;
const BANK_AMT_PAIR = /(-?[\d,]+\.\d{2})\s+(-?[\d,]+\.\d{2})\s*$/;
const bankNum = (s) => {
  const v = Number(String(s == null ? "" : s).replace(/,/g, ""));
  return isFinite(v) ? Math.round(v * 100) / 100 : 0;
};
/* 水单日期 → YYYY-MM-DD（支持 12-11-2026 和 12-NOV-2026） */
function bankISO(s) {
  const m = /^(\d{2})-([A-Z]{3}|\d{2})-(\d{4})$/.exec(String(s || "").trim());
  if (!m) return "";
  const mo = /^\d+$/.test(m[2]) ? Number(m[2]) : BANK_MON[m[2]];
  if (!mo) return "";
  return `${m[3]}-${String(mo).padStart(2, "0")}-${m[1]}`;
}

/* 摘要关键词 → 分类（只是建议，界面上可改） */
const BANK_CAT_HINTS = [
  [/SAFEEINCOME|PORD|TXN ?CHARGE|CHARGES?|COMMISSION|MONTHLY FEE|LEDGER FEE/i, "bankfee"],
  [/SALARY|SLARY|WAGES|PAYROLL/i, "u:员工工资"],
  [/DONATION/i, "misc"],
  [/\bLAND\b|\bCADASTRE\b|\bCAD\b|\bSURVEY\b/i, "serenje"],
  [/FUEL|PETROL|DIESEL|PUMA|ENGEN|\bTOTAL\b|\bSPAR\b/i, "fuel"],
  [/TYRE|TIRE|SPARE|REPAIR|WORKSHOP/i, "repair"],
  [/AIRTIME|AIRTEL|MTN|ZAMTEL|BUNDLE/i, "comms"],
  [/RESTAURANT|HOTEL|LODGE|FOOD|CAFE|MEAL/i, "meal"],
  [/TAXI|UBER|BOLT|TRANSPORT|FREIGHT|LOGISTIC/i, "transport"],
  [/OFFICE|STATIONERY|PRINT/i, "office"],
];
function bankSuggestCat(descr) {
  for (const [re, cat] of BANK_CAT_HINTS) if (re.test(descr)) return cat;
  return "";
}

/* pdf.js 抽出来的文本（按行）→ 表头 + 逐笔。
   方向不用列坐标，用余额差：同一笔里余额下降=借方，上升=贷方。 */
function bankParseText(raw) {
  const lines = String(raw || "").split(/\r?\n/).map((s) => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  const all = lines.join("\n");
  const one = (re) => { const m = re.exec(all); return m ? m[1] : ""; };
  const meta = {
    bank: /FIRST\s*CAPITAL/i.test(all) ? "First Capital Bank"
      : /E-banking Account Statement|IZB/i.test(all) ? "IZB Bank" : "",
    acct_no: one(/Account number\s*:?\s*(\d{6,})/i) || one(/Account Number\s*:?\s*(\d{6,})/i),
    ccy: /ZAMBIAN KWACHA/i.test(all) ? "ZMW"
      : (one(/Currency\s*:?\s*([A-Z]{3})\b/i) || one(/Account Ccy\s*:?\s*([A-Z]{3})\b/i)),
    pf: "", pt: "", open_bal: "", close_bal: "", total_in: "", total_out: "",
  };
  const p1 = /Statement Period\s*:?\s*(\d{2}-[A-Z0-9]{2,3}-\d{4})\s*(?:To|-|~)\s*(\d{2}-[A-Z0-9]{2,3}-\d{4})/i.exec(all);
  const p2 = /From Date\s*:?\s*(\d{2}-[A-Z]{3}-\d{4})[\s\S]{0,40}?To Date\s*:?\s*(\d{2}-[A-Z]{3}-\d{4})/i.exec(all);
  if (p1) { meta.pf = bankISO(p1[1]); meta.pt = bankISO(p1[2]); }
  else if (p2) { meta.pf = bankISO(p2[1]); meta.pt = bankISO(p2[2]); }
  const ob = one(/Opening balance\s*:?\s*(-?[\d,]+\.\d{2})/i) || one(/Opening Balance\s*:?\s*(-?[\d,]+\.\d{2})/i);
  const cb = one(/Closing balance\s*:?\s*(-?[\d,]+\.\d{2})/i) || one(/Closing Balance\s*:?\s*(-?[\d,]+\.\d{2})/i);
  if (ob) meta.open_bal = bankNum(ob);
  if (cb) meta.close_bal = bankNum(cb);
  /* 借贷合计：IZB 在一行里写「借方 贷方」两个数，FCB 分两行写 Credits / Debits */
  const tIz = /Total\s*:\s*([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/.exec(all);
  const cF = /Credits\s*:?\s*([\d,]+\.\d{2})/i.exec(all);
  const dF = /Debits\s*:?\s*([\d,]+\.\d{2})/i.exec(all);
  if (tIz) { meta.total_out = bankNum(tIz[1]); meta.total_in = bankNum(tIz[2]); }
  else { if (cF) meta.total_in = bankNum(cF[1]); if (dF) meta.total_out = bankNum(dF[1]); }

  const txs = [];
  let cur = null;
  for (const ln of lines) {
    const dm = BANK_DATE_LINE.exec(ln);
    if (dm) {
      if (cur) txs.push(cur);
      cur = { d: bankISO(dm[1]), descr: ln.slice(dm[0].length).trim(), ref: "", debit: 0, credit: 0, bal: 0, amount: 0 };
    } else if (cur) {
      cur.descr += " " + ln;
    }
    if (cur) {
      const am = BANK_AMT_PAIR.exec(cur.descr);
      if (am) {
        cur.bal = bankNum(am[2]);
        cur.amount = Math.abs(bankNum(am[1]));
        cur.descr = cur.descr.slice(0, am.index).trim();
        const rm = /\b(S\d{6})\s*$/.exec(cur.descr);
        if (rm) { cur.ref = rm[1]; cur.descr = cur.descr.slice(0, rm.index).trim(); }
        txs.push(cur);
        cur = null;
      }
    }
  }
  if (cur) txs.push(cur);

  /* 有的银行倒序（最新在上），有的正序：统一成从旧到新 */
  if (txs.length > 1 && txs[0].d > txs[txs.length - 1].d) txs.reverse();

  let prev = meta.open_bal === "" ? null : bankNum(meta.open_bal);
  for (const t of txs) {
    if (prev === null) { prev = t.bal; continue; }
    const delta = Math.round((prev - t.bal) * 100) / 100;
    if (delta >= 0) t.debit = t.amount; else t.credit = t.amount;
    prev = t.bal;
  }
  const calc = {
    debit: txs.reduce((s, t) => s + (t.debit || 0), 0),
    credit: txs.reduce((s, t) => s + (t.credit || 0), 0),
    n: txs.length,
  };
  let warn = "";
  if (meta.total_out !== "" && Math.abs(calc.debit - bankNum(meta.total_out)) > 0.05) warn = "借方合计对不上";
  else if (meta.total_in !== "" && Math.abs(calc.credit - bankNum(meta.total_in)) > 0.05) warn = "贷方合计对不上";
  else if (meta.open_bal !== "" && meta.close_bal !== "" &&
    Math.abs(bankNum(meta.open_bal) + calc.credit - calc.debit - bankNum(meta.close_bal)) > 0.05) warn = "期初+贷−借 ≠ 期末";
  for (const t of txs) {
    t.descr = t.descr.replace(/\s{2,}/g, " ").trim();
    if (!t.cat) t.cat = bankSuggestCat(t.descr);
  }
  return { meta, txs, calc, warn };
}

/* 常用花费人：列表置顶（顺序即优先），其余保持原顺序 */
const FIN_FAV = ["frank", "supeichang"];
const finFavRank = (u) => {
  const keys = [String(u.login || "").trim().toLowerCase(), String(u.name || "").trim().toLowerCase()];
  const i = FIN_FAV.findIndex((k) => keys.includes(k));
  return i < 0 ? FIN_FAV.length : i;
};

const finPeople = () => {
  const us = (FIN.users || []).filter((u) => u.login !== FINCO).map((u) => ({ login: u.login, name: u.name, role: u.role, ghost: false }));
  const known = new Set(us.map((u) => u.login));
  for (const a of FIN.accounts || []) {
    if (a.uid === FINCO || known.has(a.uid)) continue;
    us.push({ login: a.uid, name: a.name || a.uid, role: "", ghost: true });
  }
  us.sort((a, b) => finFavRank(a) - finFavRank(b));
  return us.length ? us : [{ login: FIN.me.uid, name: FIN.me.name, role: FIN.me.role }];
};
const finNameOf = (uid) => {
  if (uid === FINCO) return tr("公司账户");
  const u = (FIN.users || []).find((x) => x.login === uid);
  if (u && u.name) return u.name;
  const a = (FIN.accounts || []).find((x) => x.uid === uid);
  return (a && a.name) || uid;
};

function finView(src) {
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.style.display = "flex";
  box.style.alignItems = "center";
  box.style.justifyContent = "center";
  box.innerHTML = `<img src="${src}" style="max-width:94%;max-height:92%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

async function loadFin() {
  FIN = await api("/fin/bootstrap");
}

/* 时间范围起点（YYYY-MM-DD），本周从周一起算 */
function finFrom() {
  const n = new Date();
  const y = n.getFullYear(), m = n.getMonth(), d = n.getDate();
  let dt = new Date(y, m, 1);
  if (FINR === "day") dt = new Date(y, m, d);
  else if (FINR === "week") dt = new Date(y, m, d - ((n.getDay() + 6) % 7));
  else if (FINR === "year") dt = new Date(y, 0, 1);
  const p = (x) => String(x).padStart(2, "0");
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}

function finHtml() {
  const who = FINWHO || FIN.me.uid;
  const coView = who === FINCO;
  const isAll = FINWHO === "ALL";
  const isMe = !FINWHO;                 // 空 = 我自己
  const ro = !isMe && !isAll && !(who === FINCO && FIN.canCo);   // 点某个人 = 只读（只看看，不能改）；公司账户对有记账权的人可写
  const canAll = FIN.canAll;
  const mine = (e) => e.uid === who || e.to_uid === who;   // 自己的账本：自己花的 + 收到的备用金
  const scoped = isAll ? FIN.entries : FIN.entries.filter(mine);
  const invOk = (e) => FININV === "all" || (e.kind !== "out" && e.kind !== "in")
    || (FININV === "yes" ? !!Number(e.inv) : !Number(e.inv));
  const list = scoped.filter((e) => String(e.date) >= finFrom() && invOk(e) && finAcctOf(e) === FINCH);
  const sum = { out: 0, in: 0, float: 0, home: 0, loanOut: 0, loanIn: 0 };
  for (const e of list) {
    const amt = Number(e.amount) || 0;
    const off = finOffbook(e);
    if (off === "私人") sum.home += amt;
    else if (off === "往来") sum[e.kind === "in" ? "loanIn" : "loanOut"] += amt;
    else sum[e.kind] = (sum[e.kind] || 0) + amt;
  }
  const offNote = [
    sum.home ? `🏠 私人 ${finMoney(sum.home)}` : "",
    (sum.loanOut || sum.loanIn) ? `🤝 借款 借出 ${finMoney(sum.loanOut)} · 已还 ${finMoney(sum.loanIn)}` : "",
  ].filter(Boolean).join(" · ");

  /* 银行账按卡分开排：卡头给出「期初 → 账面 vs 账单期末」，差额红字 */
  const bankBook = () => {
    const stmtAll = (FIN.bank || []).filter((s) => !Number(s.old) && !Number(s.deleted));
    const groups = new Map();
    const put = (k, e) => { if (!groups.has(k)) groups.set(k, []); if (e) groups.get(k).push(e); };
    for (const e of list) put(String(e.card_id || ""), e);
    if (!isAll) {
      for (const a of FIN.accounts || []) {
        if (a.uid !== who) continue;
        for (const c of a.banks || []) if (c.id) put(c.id, null);
      }
    }
    const keys = [...groups.keys()].sort((x, y) => (x === "" ? 1 : y === "" ? -1 : String(x).localeCompare(String(y))));
    const head = (k) => {
      const c = finCardOf(k);
      const rowsK = groups.get(k) || [];
      const ss = stmtAll.filter((s) => s.card_id === k).sort((a, b) => String(a.pf || "").localeCompare(String(b.pf || "")));
      const first = ss[0] || null, lastS = ss[ss.length - 1] || null;
      const open = first ? (Number(first.open_bal) || 0) : (c ? (Number(c.bal) || 0) : 0);
      let delta = 0;
      for (const e of rowsK) {
        const amt = Number(e.amount) || 0;
        if (e.kind === "in") delta += amt;
        else if (e.kind === "out") delta -= amt;
        else if (e.kind === "float") delta -= amt;
        else if (e.kind === "move") delta += e.ch === "card" ? -amt : amt;
        else if (e.kind === "transfer") {
          if (c && e.uid === c.uid) delta -= amt;
          else if (c && e.to_uid === c.uid) delta += amt;
        }
      }
      const book = Math.round((open + delta) * 100) / 100;
      const end = lastS ? (Number(lastS.close_bal) || 0) : null;
      const gap = end === null ? null : Math.round((book - end) * 100) / 100;
      const gapTxt = gap === null ? ""
        : Math.abs(gap) < 0.005 ? `<b style="color:#0a0">✓</b>`
          : `<b style="color:#c00">${finMoney(gap)}</b>`;
      return `<div class="fin-acct" data-finbook="${esc(k)}">
        <div class="n">🏦 ${esc(k ? finCardShort(c) : tr("未指定卡"))}</div>
        <div class="mut" style="margin-top:6px">${esc(tr("期初"))} ${finMoney(open)} · ${esc(tr("账面"))} <b>${finMoney(book)}</b>${end === null ? "" : ` · ${esc(tr("账单期末"))} ${finMoney(end)}`}${gapTxt ? " · " + gapTxt : ""}</div>
        ${k ? "" : `<div class="mut" style="margin-top:4px">${esc(tr("这些记录还没挂卡，改记录时选上卡，银行账才对得平"))}</div>`}
      </div>`;
    };
    return keys.map((k) => `<div class="fin-book">${head(k)}
      ${(groups.get(k) || []).map(entryRow).join("") || `<div class="empty">${esc(tr("这个月这张卡还没有记录"))}</div>`}</div>`).join("");
  };
  const entryRow = (e) => {
    const ph = (e.photos || []).slice(0, 3).map((k) => `<img src="/api/fin/photo/${k}" data-finview="/api/fin/photo/${k}" alt="">`).join("");
    let whoTxt = esc(e.uid), sign = "-", label = finKindName(e.kind), title = esc(finCatName(e.cat));
    if (e.kind === "float") {
      whoTxt = `${esc(e.by_name || e.uid)} → ${esc(e.to_uid || "")}`;
      sign = e.to_uid === who ? "+" : "-";
      label = e.to_uid === who ? "收到备用金" : "发出备用金";
      title = "备用金";
    } else if (e.kind === "move") {
      sign = "⇄";
      const out = e.ch === "card";
      title = out ? "取现" : "存现";
      label = out ? "银行 → 现金" : "现金 → 银行";
    } else if (e.kind === "transfer") {
      sign = isAll ? "⇄" : (e.to_uid === who ? "+" : "-");
      const fromCh = e.ch === "card" ? "银行" : "现金";
      const toCh = (e.to_ch || e.ch) === "card" ? "银行" : "现金";
      whoTxt = `${esc(finNameOf(e.uid))} → ${esc(finNameOf(e.to_uid))}`;
      label = isAll ? "转账" : (e.to_uid === who ? "转入" : "转出");
      title = `${fromCh} → ${toCh}`;
    } else {
      sign = e.kind === "in" ? "+" : "-";
    }
    const bkCard = finAcctOf(e) === "bank" ? finCardOf(e.card_id) : null;
    const chTxt = e.kind === "transfer" ? "" : (finAcctOf(e) === "bank"
      ? ` · 🏦 ${esc(bkCard ? finCardShort(bkCard) : tr("未指定卡"))}`
      : ` · 💵 ${esc(tr("现金"))}`);
    const isExp = e.kind === "out" || e.kind === "in";
    const offBook = finOffbook(e);
    const canMark = isExp && !offBook && (FIN.owner || FIN.canAll || e.uid === FIN.me.uid);
    const hasPh = (e.photos || []).length > 0;
    const invTag = !isExp ? ""
      : offBook ? `<i class="fin-inv ${offBook === "往来" ? "l" : "p"}" title="${esc(tr(`${offBook}科目，不计入公司费用`))}">${esc(tr(`${offBook}·不计费用`))}</i>`
      : Number(e.inv)
        ? (hasPh ? `<i class="fin-inv y">${esc(tr(`有票`))}</i>` : `<i class="fin-inv w" title="${esc(tr(`还没上传发票照片`))}">${esc(tr(`有票·缺图`))}</i>`)
        : `<i class="fin-inv n">${esc(tr(`无票`))}</i>`;
    const stTag = finAcctOf(e) === "bank" && e.state && e.state !== "recorded"
      ? ` <i class="fin-inv ${e.state === "reconciled" ? "y" : "w"}">${esc(tr(FIN_STATE_ZH[e.state] || e.state))}</i>` : "";
    const markBtns = FINMARK && canMark
      ? `<div class="fin-mark">
          <button data-setinv="${esc(e.id)}" data-inv="1" class="${Number(e.inv) ? "on" : ""}">${esc(tr(`有票`))}</button>
          <button data-setinv="${esc(e.id)}" data-inv="0" class="${Number(e.inv) ? "" : "on"}">${esc(tr(`无票`))}</button>
        </div>` : "";
    return `<div class="fin-row fin-${e.kind}">
      <div class="d">${esc(String(e.date).slice(5))}</div>
      <div class="m"><b>${title}${invTag}${stTag}</b>
        <p>${whoTxt}${chTxt}${e.note ? " · " + esc(tx(e, "note")) : ""}</p>
        ${ph ? `<div class="ph">${ph}</div>` : ""}
        ${markBtns}</div>
      <div class="a">${sign}${finMoney(e.amount)}<small>${esc(label)}</small></div>
      ${(FIN.owner || FIN.canAll || e.uid === FIN.me.uid) ? `<button class="ghost fin-more" data-finmore="${e.id}" title="${esc(tr(`更多`))}">⋯</button>` : ""}
    </div>`;
  };
  const rows = FINCH === "bank" ? bankBook() : list.map(entryRow).join("");

  const roleLabel = (p) => (p.ghost ? "历史账户" : ROLE_ZH[p.role] || "员工");
  const acctCard = (p) => {
    const a = finAcct(p.login);
    const row = (FIN.accounts || []).find((x) => x.uid === p.login) || {};
    const acts = [];
    if (FIN.owner) acts.push(`<button class="ghost" data-give="${esc(p.login)}">${esc(tr(`给员工`))}</button>`);
    const banks = row.banks || [];
    const bankLine = banks.length

/* pdf.js 只在第一次解析时从 CDN 拉（不塞进页面包），失败就退回粘贴文字 */
let BANK_PDFJS = null;
async function bankPdfText(file) {
  if (!BANK_PDFJS) {
    BANK_PDFJS = import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs").then((m) => {
      m.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
      return m;
    });
  }
  const pdfjs = await BANK_PDFJS;
  const buf = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    let line = "", lastY = null;
    for (const it of tc.items) {
      const y = Math.round(it.transform[5]);
      if (lastY !== null && Math.abs(y - lastY) > 2) { if (line.trim()) lines.push(line.trim()); line = ""; }
      line += it.str + " ";
      lastY = y;
      if (it.hasEOL) { if (line.trim()) lines.push(line.trim()); line = ""; }
    }
    if (line.trim()) lines.push(line.trim());
  }
  return { text: lines.join("\n"), pages: doc.numPages };
}

let BANK_CARD = "", BANK_MONTH = "", BANK_OLD = false;

const finCardLabel = (c) => [c.name, c.bank, c.no ? "…" + String(c.no).slice(-4) : "", c.ccy || "ZMW"].filter(Boolean).join(" · ");
const bkMon = (d) => (String(d || "").length >= 7 ? String(d).slice(0, 7) : "");
/* 期间按「几月到几月」说：同一个月显示 2026-09，跨月 2026-09 → 2026-10 */
const bkRange = (s) => {
  const a = bkMon(s.pf), b = bkMon(s.pt);
  if (!a && !b) return tr("未填期间");
  if (a && a === b) return a;
  return `${a || "?"} → ${b || "?"}`;
};
const bkDays = (s) => {
  const a = String(s.pf || "").length >= 10 ? String(s.pf).slice(5) : "";
  const b = String(s.pt || "").length >= 10 ? String(s.pt).slice(5) : "";
  return a && b ? `${a}→${b}` : "";
};
/* 期间一律按「几月到几月」再说一遍：原件和账单都长这样，扫一眼就对得上 */
const bkSpanCn = (s) => {
  const f = (d) => (String(d || "").length >= 10 ? `${String(d).slice(5, 7)}-${String(d).slice(8, 10)}` : "");
  const a = f(s.pf), b = f(s.pt);
  return a && b ? `${a} → ${b}` : (a || b || "");
};
const bkSpanOf = (arr) => {
  const a = arr.map((x) => String(x.pf || "")).filter(Boolean).sort()[0];
  const b = arr.map((x) => String(x.pt || "")).filter(Boolean).sort().pop();
  return a && b ? bkSpanCn({ pf: a, pt: b }) : "";
};
const bkStatus = (s) => (s.status === "checked" ? tr("已核对") : s.status === "diff" ? tr("有差异") : tr("待核对"));
/* 月度目录的钥匙：优先用期间止的月份（跨月水单归到结束月） */
const bkMonthOf = (s) => bkMon(s.pt || s.pf) || "—";
const bkMonths = (list) => {
  const m = new Map();
  for (const s of list) {
    const k = bkMonthOf(s);
    m.set(k, (m.get(k) || []).concat(s));
  }
  return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0]));
};
const bkRangeTxt = (ms) => (!ms.length ? "" : ms.length === 1 ? ms[0][0] : `${ms[ms.length - 1][0]} ~ ${ms[0][0]}`);

      <div><span>${esc(tr("期末"))}</span><b>${esc(finMoney(s.close_bal))}</b></div>
    </div>
    <div class="prog"><div class="bar"><i class="${pend ? "warn" : ""}" style="width:${pct}%"></i></div>
      <span>${okN}/${tot} ${esc(tr("笔"))}${gap ? " · ⚠ " + esc(tr("缺行")) : ""}</span></div>
    <div class="acts">
      <button class="ghost" data-bankopen="${esc(s.id)}">${esc(tr("看流水"))}</button>
      ${FIN.bankAll ? `<button class="ghost dz" data-bkdel="${esc(s.id)}">${esc(tr("删除"))}</button>` : ""}
    </div>
  </div>`;
};

function bankPageHtml() {
  const docs = FIN.bank || [];
  const live = docs.filter((s) => !Number(s.old));
  const old = docs.filter((s) => Number(s.old));

  const cards = [];
  for (const a of FIN.accounts || []) for (const b of a.banks || []) if (b.id) cards.push({ uid: a.uid, c: b });
  const byCard = new Map();
  for (const s of live) {
    const k = String(s.card_id || "");
    byCard.set(k, (byCard.get(k) || []).concat(s));
  }
  const orphans = docs.filter((s) => !finCardFind(s.card_id));

  const note = `<div class="mut" style="margin-top:12px">${esc(tr("账单只能从「银行原始单据」读出来：到那边上传原件、点「数字化」确认后才会出现在这里；本页只看每个文件的流水、逐笔核对。"))}
      <button class="ghost" data-go="bankdoc" style="margin-left:6px">${esc(tr("去原始单据"))}</button></div>`;

  if (!cards.length) {
    return `<div class="empty">${esc(tr("还没有登记银行卡。先到「财务账目设置」加一张卡，账单就归到那张卡下面。"))}</div>
      ${orphans.length ? `<div class="sec">${esc(tr("没挂到卡的账单"))}</div>
        <div class="fin-list">${orphans.map((s) => bankRowHtml(s, { withCard: true, dim: Number(s.old) })).join("")}</div>` : ""}
      ${note}`;
  }

  /* 卡就是这本账的「本子」：默认翻开第一张（公司账户在最前） */
  let card = BANK_CARD ? finCardFind(BANK_CARD) : null;
  if (!card) { card = cards[0].c; BANK_CARD = card.id; BANK_MONTH = ""; }
  const list = byCard.get(card.id) || [];
  const ms = bkMonths(list);
  const msOld = bkMonths(old.filter((s) => s.card_id === card.id));
  const mKeys = [...new Set(ms.map((x) => x[0]).concat(msOld.map((x) => x[0])))].sort().reverse();
  if (BANK_MONTH && mKeys.indexOf(BANK_MONTH) < 0) BANK_MONTH = "";

  const pills = `<div class="bkd-cards">${cards.map((x) => {
    const l = byCard.get(x.c.id) || [];
    const p = l.filter((s) => s.status !== "checked").length;
    const label = [x.uid === FINCO ? tr("公司") : finNameOf(x.uid), x.c.name || x.c.bank, (x.c.no || "").slice(-4)].filter(Boolean).join(" · ");
    return `<button data-bkcard="${esc(x.c.id)}" class="${x.c.id === card.id ? "on" : ""}">${esc(label)}${p ? `<b>${p}</b>` : ""}</button>`;
  }).join("")}</div>`;

  /* 第三级：这个月读出来的账单，一张一张对 */
  if (BANK_MONTH) {
    const rows = list.filter((s) => bkMonthOf(s) === BANK_MONTH)
      .sort((a, b) => String(b.pt || "").localeCompare(String(a.pt || "")));
    const olds = old.filter((s) => s.card_id === card.id && bkMonthOf(s) === BANK_MONTH);
    return `${pills}
      <button class="bkd-back" data-bkpath="card">‹ ${esc(tr("所有月份"))}</button>
      ${rows.map((s) => bkSheetHtml(s)).join("")}
      ${olds.length ? `<button class="bkd-old" data-bkold="1">${BANK_OLD ? "▾" : "▸"} ${esc(tr("历史版本"))} ${olds.length} ${esc(tr("份"))}</button>
        ${BANK_OLD ? olds.map((s) => bkSheetHtml(s, true)).join("") : ""}` : ""}
      ${note}`;
  }

  /* 第二级：月份台账，一行一个月，进度条一眼看出核到哪了 */
  const done = list.reduce((a, s) => a + (Number(s.ok_n) || 0), 0);
  const tot = list.reduce((a, s) => a + (Number(s.txn_n) || 0), 0);
  const pendN = list.filter((s) => s.status !== "checked").length;
  const latest = list.slice().sort((a, b) => String(b.pt || "").localeCompare(String(a.pt || "")))[0];

  const hero = `<div class="bkd-hero">
      <div class="k">${esc(tr("银行数字账单"))}${pendN ? `<span class="badge">${pendN} ${esc(tr("份待核"))}</span>` : ""}</div>
      <div class="n">${esc(finCardLabel(card))}</div>
      <div class="g">
        <div><b>${done}/${tot}</b><span>${esc(tr("已核笔数"))}</span></div>
        <div><b>${latest ? esc(finMoney(latest.close_bal)) : "—"}</b><span>${esc(tr("最近期末"))}</span></div>
        <div><b>${mKeys.length}</b><span>${esc(tr("个月"))}</span></div>
      </div>
    </div>`;

  const months = mKeys.length
    ? `<div class="bkd-months">${mKeys.map((m) => {
      const arr = (ms.find((x) => x[0] === m) || [])[1] || [];
      const oldN = ((msOld.find((x) => x[0] === m) || [])[1] || []).length;
      if (!arr.length) return `<div class="bkd-mrow" data-bkmonth="${esc(m)}">
        <span class="ym">${esc(m)}</span>
        <div class="mid"><small>${esc(tr("历史版本"))} ${oldN} ${esc(tr("份"))}</small></div>
        <span class="mut">›</span>
      </div>`;
      const okN = arr.reduce((a, s) => a + (Number(s.ok_n) || 0), 0);
      const tN = arr.reduce((a, s) => a + (Number(s.txn_n) || 0), 0);
      const p = arr.filter((s) => s.status !== "checked").length;
      const lastRow = arr.slice().sort((a, b) => String(b.pt || "").localeCompare(String(a.pt || "")))[0] || {};
      const pct = tN ? Math.round((okN / tN) * 100) : 0;
      return `<div class="bkd-mrow" data-bkmonth="${esc(m)}">
        <span class="ym">${esc(m)}</span>
        <div class="mid"><div class="bar"><i class="${p ? "warn" : ""}" style="width:${pct}%"></i></div>
          <small>${okN}/${tN} ${esc(tr("笔"))}${bkSpanOf(arr) ? " · " + esc(bkSpanOf(arr)) : ""} · ${p ? `${esc(tr("待核"))} ${p} ${esc(tr("份"))}` : esc(tr("已核对"))}</small></div>
        <span class="amt">${esc(finMoney(lastRow.close_bal))}<small>${esc(tr("期末"))}</small></span>
        <span class="mut">›</span>
      </div>`;
    }).join("")}</div>`
    : `<div class="empty">${esc(tr("这张卡还没有账单：到「银行原始单据」上传原件，再点「数字化」。"))}</div>`;

  return `${pills}${hero}${months}
    ${orphans.length ? `<div class="sec">${esc(tr("没挂到卡的账单"))}</div>
      <div class="fin-list">${orphans.map((s) => bankRowHtml(s, { withCard: true, dim: Number(s.old) })).join("")}</div>` : ""}
    ${note}`;
}
/* 当月一张当前版本都不剩了，就退回月份列表（历史版本仍能在月行里进去） */
function bankMonthBack() {
  if (!BANK_MONTH) return;
  if ((FIN.bank || []).some((s) => !Number(s.old) && s.card_id === BANK_CARD && bkMonthOf(s) === BANK_MONTH)) return;
  BANK_MONTH = "";
}

function bindBank(pane) {
  /* 目录逐级下钻：卡 → 月份；点行进详情/删除 */
  pane.querySelectorAll("[data-bkcard]").forEach((el) => el.onclick = () => {
    BANK_CARD = el.dataset.bkcard;
    BANK_MONTH = "";
    BANK_OLD = false;
    render();
  });
  pane.querySelectorAll("[data-bkmonth]").forEach((el) => el.onclick = () => {
    BANK_MONTH = el.dataset.bkmonth;
    BANK_OLD = false;
    render();
  });
  pane.querySelectorAll("[data-bkpath]").forEach((b) => b.onclick = () => {
    if (b.dataset.bkpath === "root") { BANK_CARD = ""; BANK_MONTH = ""; } else BANK_MONTH = "";
    BANK_OLD = false;
    render();
  });
  pane.querySelectorAll("[data-bkold]").forEach((b) => b.onclick = () => { BANK_OLD = !BANK_OLD; render(); });
  pane.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => enterApp(b.dataset.go));
  pane.querySelectorAll("[data-bankopen]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); finBankOpen(b.dataset.bankopen); });
  pane.querySelectorAll("[data-bkdel]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm(tr("删除这张账单？逐笔核对记录会一起删掉，不能恢复。"))) return;
    b.disabled = true;
    try {
      await api("/fin/bank/" + b.dataset.bkdel, { method: "DELETE" });
      toast(tr("已删除"));
      await loadFin();
      bankMonthBack();
      render();
    } catch (err) {
      b.disabled = false;
      toast(err.message);
    }
  });
}
async function bankPane(pane) {
  pane.innerHTML = `<div class="empty">${esc(tr("加载中…"))}</div>`;
  try { await loadFin(); } catch (e) { pane.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  /* 账单回指原件；原件清单只有 bankAll 拿得到，拿不到就不显示文件名 */
  try { FIN.docs = (await api("/fin/bankdocs")).docs || []; } catch (e) {}
  pane.innerHTML = bankPageHtml();
  bindBank(pane);
}
/* ---------- 银行原始单据（独立页）：账户 → 卡 → 月份，三级目录；原件只归档不解析 ---------- */
let BDOC_CARD = "", BDOC_MONTH = "";
const bdocSize = (n) => {
  const b = Number(n) || 0;
  return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
};
const bdocWho = (d) => (d.uid === FINCO ? tr("公司账户") : finNameOf(d.uid));
const bdocMonths = (list) => [...new Set(list.map((d) => d.period).filter(Boolean))].sort().reverse();
const bdocRangeTxt = (ms) => (!ms.length ? "" : ms.length === 1 ? ms[0] : `${ms[ms.length - 1]} ~ ${ms[0]}`);

const bdocBread = (card) => {
  const parts = [`<button data-bdpath="root">${esc(tr("全部卡"))}</button>`];
  if (card) parts.push(`<span class="mut">›</span><button data-bdpath="card">${esc(finCardLabel(card))}</button>`);
  if (card && BDOC_MONTH) parts.push(`<span class="mut">›</span><b>${esc(BDOC_MONTH)}</b>`);
  return `<div class="bk-crumb">${parts.join(" ")}</div>`;
};

/* 一份原件一行：点行看文件，右侧下载 / 数字化 / 删除 */
const bankDocRowHtml = (d, opt = {}) => {
  const ok = Number(d.stmt_n) || 0;
  /* 挂着的账单（含历史版本）决定能不能删原件：删了账单就找不到出处 */
  const used = Number(d.stmt_all_n) || ok;
  const card = finCardFind(d.card_id);
  const what = card ? finCardLabel(card) : [d.bank, d.acct_no].filter(Boolean).join(" · ");
  const who = opt.withCard ? [bdocWho(d), what].filter(Boolean).join(" · ") + " · " : "";
  const meta = [d.period, bkSpanCn(d), bdocSize(d.size), String(d.uploaded_at || "").slice(0, 10)].filter(Boolean);
  return `<div class="fin-fr bk bdoc${opt.dim ? " dim" : ""}" data-bdocopen="${esc(d.id)}">
    <span><b class="bn">${esc(d.file_name || tr("（没有文件名）"))}</b><small class="mut"> ${esc(who)}${esc(meta.join(" · "))}${opt.dim ? " · " + esc(tr("旧版本")) : ""}</small></span>
    <b class="${ok ? "ok" : "mut"}">${ok ? esc(tr("已数字化")) + " " + ok : esc(tr("未数字化"))}${!ok && used ? ` · ${esc(tr("旧账单"))} ${used}` : ""}</b>
    <div class="acts2">
      <button class="ghost" data-bdocdl="${esc(d.id)}">${esc(tr("下载"))}</button>
      <button class="ghost" data-bdocdig="${esc(d.id)}">${esc(tr("数字化"))}</button>
      <button class="ghost" data-bdocedit="${esc(d.id)}">${esc(tr("改期间"))}</button>
      ${used
        ? `<button class="ghost" disabled title="${esc(tr("已经数字化出账单，先删账单再删原件"))}">${esc(tr("删除"))}</button>`
        : `<button class="ghost dz" data-bdocdel="${esc(d.id)}">${esc(tr("删除"))}</button>`}
    </div>
  </div>`;
};

function bankDocPageHtml() {
  const docs = FIN.docs || [];
  const live = docs.filter((d) => !Number(d.old));
  const oldDocs = docs.filter((d) => Number(d.old));

  const cards = [];
  for (const a of FIN.accounts || []) for (const b of a.banks || []) if (b.id) cards.push({ uid: a.uid, c: b });
  const byCard = new Map();
  for (const d of live) {
    const k = String(d.card_id || "");
    byCard.set(k, (byCard.get(k) || []).concat(d));
  }
  const orphans = docs.filter((d) => !finCardFind(d.card_id));

  /* 路径失效就退回去：卡没了回根，月份没了回卡 */
  const card = BDOC_CARD ? finCardFind(BDOC_CARD) : null;
  if (BDOC_CARD && !card) { BDOC_CARD = ""; BDOC_MONTH = ""; }
  const monthsOf = (cid) => bdocMonths(docs.filter((d) => String(d.card_id || "") === cid));
  if (BDOC_MONTH && card && monthsOf(card.id).indexOf(BDOC_MONTH) < 0) BDOC_MONTH = "";

  /* 第三级：某个月的原件 */
  if (card && BDOC_MONTH) {
    const rows = ((byCard.get(card.id) || []).filter((d) => d.period === BDOC_MONTH))
      .sort((a, b) => String(b.uploaded_at || "").localeCompare(String(a.uploaded_at || "")));
    const olds = oldDocs.filter((d) => d.card_id === card.id && d.period === BDOC_MONTH);
    return `${bdocBread(card)}
      <div class="fin-acct">
        <div class="bd-head">
          <div class="n">${esc(BDOC_MONTH)}</div>
          <div class="acts2"><span class="mut">${esc(bkSpanOf(rows))}</span><span class="mut">${rows.length} ${esc(tr("份"))}</span>
            <button class="ghost" data-bdupload="${esc(card.id)}">${esc(tr("上传原件"))}</button></div>
        </div>
      </div>
      ${rows.length ? `<div class="fin-list">${rows.map((d) => bankDocRowHtml(d)).join("")}</div>` : olds.length ? "" : `<div class="empty">${esc(tr("这个月没有原件。"))}</div>`}
      ${olds.length ? `<div class="sec">${esc(tr("历史版本（同月重传留下的）"))}</div>
        <div class="fin-list">${olds.map((d) => bankDocRowHtml(d, { dim: true })).join("")}</div>` : ""}`;
  }

  /* 第二级：这张卡按月份分目录，月份再多也不会把页面拉长 */
  if (card) {
    const list = byCard.get(card.id) || [];
    const ms = monthsOf(card.id);
    const nd = list.filter((d) => !Number(d.stmt_n)).length;
    return `${bdocBread(card)}
      <div class="fin-acct">
        <div class="bd-head">
          <div class="n">${esc(finCardLabel(card))}</div>
          <div class="acts2">
            <span class="mut">${ms.length ? `${ms.length} ${esc(tr("个月"))} · ${list.length} ${esc(tr("份"))}${nd ? " · " + nd + " " + esc(tr("未数字化")) : ""}` : esc(tr("还没有原件"))}</span>
            <button class="ghost" data-bdupload="${esc(card.id)}">${esc(tr("上传原件"))}</button>
          </div>
        </div>
        <div class="mut" style="margin-top:6px">${esc(tr("按月份分目录，点月份看那一期的原件。"))}</div>
      </div>
      ${ms.length
        ? ms.map((m) => {
          const arr = list.filter((d) => d.period === m);
          const n2 = arr.filter((d) => !Number(d.stmt_n)).length;
          const nOld = oldDocs.filter((d) => d.card_id === card.id && d.period === m).length;
          if (!arr.length) return `<div class="fin-acct bd-card" data-bdmonth="${esc(m)}">
            <div class="bd-head">
              <div class="n">${esc(m)}</div>
              <div class="acts2"><span class="mut">${esc(tr("历史版本"))} ${nOld} ${esc(tr("份"))}</span><span class="mut">›</span></div>
            </div>
          </div>`;
          return `<div class="fin-acct bd-card" data-bdmonth="${esc(m)}">
            <div class="bd-head">
              <div class="n">${esc(m)}</div>
              <div class="acts2">
                <span class="mut">${esc(bkSpanOf(arr))}</span>
                <span class="mut">${arr.length} ${esc(tr("份"))}${n2 ? " · " + n2 + " " + esc(tr("未数字化")) : ""}</span>
                <span class="mut">${esc(bdocSize(arr.reduce((a, d) => a + (Number(d.size) || 0), 0)))}</span>
                <span class="mut">›</span>
              </div>
            </div>
          </div>`;
        }).join("")
        : `<div class="empty">${esc(tr("这张卡还没有原件。"))}</div>`}`;
  }

  /* 第一级：账户 → 卡 */
  const owners = [];
  for (const x of cards) if (owners.indexOf(x.uid) < 0) owners.push(x.uid);
  owners.sort((x, y) => (x === FINCO ? -1 : y === FINCO ? 1 : String(finNameOf(x)).localeCompare(String(finNameOf(y)))));

  const cardBlock = (x) => {
    const list = byCard.get(x.c.id) || [];
    const ms = monthsOf(x.c.id);
    const nd = list.filter((d) => !Number(d.stmt_n)).length;
    return `<div class="fin-acct bd-card" data-bdcardopen="${esc(x.c.id)}">
      <div class="bd-head">
        <div class="n">${esc(finCardLabel(x.c))}</div>
        <div class="acts2">
          <span class="mut">${list.length ? `${ms.length} ${esc(tr("个月"))} · ${list.length} ${esc(tr("份"))}${nd ? " · " + nd + " " + esc(tr("未数字化")) : ""}` : esc(tr("还没有原件"))}</span>
          <button class="ghost" data-bdupload="${esc(x.c.id)}">${esc(tr("上传原件"))}</button>
        </div>
      </div>
      ${ms.length ? `<div class="mut" style="margin-top:6px">${esc(bdocRangeTxt(ms))}${bkSpanOf(list) ? " · " + esc(bkSpanOf(list)) : ""} ›</div>` : ""}
    </div>`;
  };

  const tree = owners.map((uid) => {
    const mine = cards.filter((x) => x.uid === uid);
    const n = mine.reduce((s, x) => s + ((byCard.get(x.c.id) || []).length), 0);
    return `<div class="sec">${esc(uid === FINCO ? tr("公司账户") : finNameOf(uid))} <span class="mut">· ${mine.length} ${esc(tr("张卡"))} · ${n} ${esc(tr("份"))}</span></div>
      ${mine.map(cardBlock).join("")}`;
  }).join("");

  return `${cards.length ? tree : `<div class="empty">${esc(tr("还没有登记银行卡。先到「财务账目设置」加一张卡，原件就归到那张卡下面。"))}</div>`}
    ${orphans.length ? `<div class="sec">${esc(tr("没挂到卡上的原件"))}</div>
      <div class="fin-list">${orphans.map((d) => bankDocRowHtml(d, { withCard: true, dim: Number(d.old) })).join("")}</div>` : ""}
    <div class="mut" style="margin-top:12px">${esc(tr("这里只放原件（证据）；「银行数字账单」放从原件读出来的逐笔记录，用来核对和后续核销。点「数字化」会把原件里的记录读成账单，人工确认后再保存。"))} <a href="/api/fin/bankdocs?csv=1" style="margin-left:6px">${esc(tr("导出清单"))}</a></div>`;
}

function bindBankDoc(pane) {
  /* 目录逐级下钻：卡 → 月份；上传/删除的点击不要顺带进下一层 */
  pane.querySelectorAll("[data-bdcardopen]").forEach((el) => el.onclick = (e) => {
    if (e.target.closest("[data-bdupload]")) return;
    BDOC_CARD = el.dataset.bdcardopen;
    BDOC_MONTH = "";
    render();
  });
  pane.querySelectorAll("[data-bdmonth]").forEach((el) => el.onclick = (e) => {
    if (e.target.closest("[data-bdupload]")) return;

    render();
  });
  pane.querySelectorAll("[data-bdpath]").forEach((b) => b.onclick = () => {

  pane.querySelectorAll("[data-bdocopen]").forEach((b) => b.onclick = () => {
    window.open("/api/fin/bankdocs/" + encodeURIComponent(b.dataset.bdocopen) + "/file", "_blank");
  });
  pane.querySelectorAll("[data-bdocdl]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    window.open("/api/fin/bankdocs/" + encodeURIComponent(b.dataset.bdocdl) + "/file?dl=1", "_blank");
  });
  pane.querySelectorAll("[data-bdocedit]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const d = find(b.dataset.bdocedit);
    if (d) finBankDocEditSheet(d);
  });
  pane.querySelectorAll("[data-bdocdig]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const d = find(b.dataset.bdocdig);
    if (d) finBankDigitize(d);
  });
  pane.querySelectorAll("[data-bdocdel]").forEach((b) => b.onclick = async (e) => {

    const d = find(b.dataset.bdocdel);

    if (!confirm(tr(`从档案里删掉「${d.file_name || ""}」？（只摘掉记录，原件文件保留）`))) return;

}

/* 银行卡只在「财务账目设置」登记：账单 / 原件一律从这里选，不再自己填银行+账号 */
function finCardOpts(sel, onlyUid) {
  const out = [];
  for (const a of FIN.accounts || []) {
    if (onlyUid && a.uid !== onlyUid) continue;
    const owner = a.uid === FINCO ? tr("公司账户") : finNameOf(a.uid);
    for (const b of a.banks || []) {
      if (!b.id) continue;
      const tail = b.no ? " …" + b.no.slice(-4) : "";
      const label = `${owner} · ${b.name ? b.name + " · " : ""}${b.bank || tr("银行")}${tail} · ${b.ccy || "ZMW"}`;
      out.push(`<option value="${esc(b.id)}" data-no="${esc(b.no || "")}"${b.id === sel ? " selected" : ""}>${esc(label)}</option>`);
    }
  }
  return out.join("");
}
const finCardN = () => (FIN.accounts || []).reduce((n, a) => n + (a.banks || []).filter((b) => b.id).length, 0);
/* 按 card_id 找卡：账单 / 原件只存 id，显示时回查卡名，改名后老记录跟着变 */
function finCardFind(id) {
  if (!id) return null;
  for (const a of FIN.accounts || []) for (const b of a.banks || []) if (b.id && b.id === id) return b;
  return null;
}

  /* 「归档到」按真实去向说：没手动挑月份时，跟着期间止那个月归档 */
  let monthTouched = false;
  const span = () => {
    const el = $("#bd_span", box);
    const a = $("#bd_pf", box).value, b = $("#bd_pt", box).value;
    const per = monthTouched ? ($("#bd_period", box).value || bkMon(b)) : bkMon(b);
    el.textContent = a && b ? `${tr("归档到")}：${per} · ${bkSpanCn({ pf: a, pt: b })}` : "";
  };
  $("#bd_pf", box).oninput = span;
  $("#bd_pt", box).oninput = span;
  $("#bd_period", box).oninput = () => {
    monthTouched = true;
    const p = $("#bd_period", box).value;
    if (!p) return;
    $("#bd_pf", box).value = p + "-01";
    $("#bd_pt", box).value = new Date(Date.UTC(Number(p.slice(0, 4)), Number(p.slice(5, 7)), 0)).toISOString().slice(0, 10);
    span();
  };

  $("#bd_cancel", box).onclick = () => box.remove();
  $("#bd_save", box).onclick = async () => {
    const files = [...$("#bd_files", box).files];

    const pf = $("#bd_pf", box).value, pt = $("#bd_pt", box).value;

    const base = { card_id, period, pf, pt };

    btn.disabled = true;
    let ok = 0, dup = 0, fail = 0, firstErr = "";
    for (let i = 0; i < files.length; i++) {

      msg(`${tr("上传中…")} (${i + 1}/${files.length}) ${f.name}`);

  };
}

/* 数字化：读 R2 里的原件 → 本机解析 → 进「水单确认」流程（不重复上传文件） */
async function finBankDigitize(doc) {
  const done = (FIN.bank || []).find((s) => !Number(s.old) && s.doc_id === doc.id);
  if (done && !confirm(tr("这份原件已经数字化过，再读一次会多留一条历史版本。要重做吗？"))) { finBankOpen(done.id); return; }
  toast(tr("读取原件…"));
  try {
    const r = await fetch("/api/fin/bankdocs/" + encodeURIComponent(doc.id) + "/file", { credentials: "same-origin" });
    if (!r.ok) throw new Error(tr("原件读取失败"));
    const blob = await r.blob();
    const file = new File([blob], doc.file_name || "statement.pdf", { type: doc.mime || "application/pdf" });
    finBankSheet(doc, file);
  } catch (e) { toast(e.message, "bad"); }
}

    </div>
    <div class="r">
      <div><label>${esc(tr(`期间起`))}</label><input id="bk_pf" type="date"></div>
      <div><label>${esc(tr(`期间止`))}</label><input id="bk_pt" type="date"></div>

    <div class="mut" style="margin-top:6px">${esc(doc ? tr(`原件已经在档案里，这里只确认读出来的数字；保存后账单会指回这份原件。`) : tr(`解析在本机浏览器完成，水单内容不会发给第三方。`))}</div>

  let parsed = null, file = null, pages = 0;
  /* 水单上的账号只用来「认出是哪张卡」，卡本身还是登记处那一张 */
  const pickCard = (acct) => {
    const sel = $("#bk_card", box);
    const want = String(acct || "").replace(/\D/g, "");
    if (pin) return true;   // 卡已写死，水单上的账号不再改卡
    if (!sel || !want) return false;
    const hit = [...sel.options].find((o) => {
      const no = String(o.dataset.no || "").replace(/\D/g, "");
      return no && (no === want || no.endsWith(want) || want.endsWith(no));
    });
    if (!hit) return false;
    sel.value = hit.value;
    return true;
  };

  const span = () => {
    const el = $("#bk_span", box);

      const r = await bankPdfText(file);

    } catch (err) {

  if (doc) {
    if (doc.card_id) $("#bk_card", box).value = doc.card_id;
    else pickCard(doc.acct_no);
    const y = +String(doc.period || "").slice(0, 4), mo = +String(doc.period || "").slice(5, 7);

          $("#bk_paste_wrap", box).classList.remove("hide");

  $("#bk_paste", box).oninput = (e) => { const t = e.target.value; if (t.trim().length > 80) useText(t); };

    const btn = $("#bk_save", box);
    btn.disabled = true;
    try {

}

/* 水单明细：按日期一笔笔列出来，人工逐笔标「已核」→ 保存 */
async function finBankOpen(id) {
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet"><h3>${esc(tr(`加载中…`))}</h3></div>`;
