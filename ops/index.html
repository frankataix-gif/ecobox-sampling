<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ECOBOX 工作台</title>
<style>
:root{--bg:#f4f5f6;--card:#fff;--card2:#fafbfb;--chip:#eceeef;--ink:#111827;--mut:#6b7280;--line:#e2e5e8;--teal:#111111;--teal2:#111111;--tealsoft:#111111;--tealborder:#111111;--bar:#000;--good:#047857;--blue:#1d4ed8;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
a{color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 90px}
.bar{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -12px 12px}
.bar b{font-size:16px}
.bar .sp{flex:1}
.chip{font-size:12px;color:var(--mut);background:var(--chip);border-radius:999px;padding:3px 9px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
nav button{flex:0 0 auto;border-radius:999px;padding:7px 14px;color:var(--mut)}
nav button.on{background:var(--tealsoft);border-color:var(--tealborder);color:var(--teal2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.kpi b{font-size:22px;letter-spacing:.5px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.row3{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.pill.me{background:var(--tealsoft);color:var(--teal2)}
.pill.fin{background:#fff4e5;color:var(--warn)}
.hide{display:none!important}
#setup,#login{max-width:380px;margin:8vh auto;padding:0 12px}
#setup .card,#login .card{padding:20px}
#setup h1,#login h1{font-size:19px;margin:0 0 4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ok{color:var(--teal2);font-size:13px;min-height:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:18px 0}

/* 待办：卡片列表，手机上单列不横向滚 */
.td-filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.td-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.td-chip i{font-style:normal;font-size:11px;font-weight:700;color:inherit;opacity:.6}
.td-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.td-chip.on i{opacity:.85}
/* 顶部四个数：跟费用记录一个样子 */
.td-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.td-kpi>button{display:block;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;min-height:0}
.td-kpi>button span{display:block;font-size:11.5px;color:var(--mut);line-height:1.35}
.td-kpi>button b{display:block;font-size:19px;line-height:1.15;margin:1px 0;font-weight:700}
.td-kpi>button.bad b{color:var(--bad)}
.td-kpi>button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.td-kpi>button.on span{color:rgba(255,255,255,.72)}
@media(max-width:640px){.td-kpi{grid-template-columns:repeat(2,1fr)}}
.td-sec{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.td-sec i{font-style:normal;background:var(--chip);border-radius:999px;padding:0 6px;font-weight:600;color:var(--ink)}
.td-sec.late{color:var(--bad)}
.td-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:inset 3px 0 0 #e5e7eb}
.td-card.late{box-shadow:inset 3px 0 0 var(--bad)}
.td-card.done{box-shadow:inset 3px 0 0 var(--good);opacity:.62}
.td-row{display:flex;align-items:flex-start;gap:10px}
.td-check{flex:none;width:22px;height:22px;border:2px solid #cbd5e1;border-radius:6px;background:#fff;color:#fff;font-size:12px;line-height:1;padding:0;cursor:pointer}
.td-check.on{background:var(--good);border-color:var(--good)}
.td-mid{flex:1;min-width:0}
.td-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.td-card.done .td-title{text-decoration:line-through;color:var(--mut)}
.td-meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.td-who{display:inline-flex;align-items:center;gap:5px}
.td-who i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.td-who.none{opacity:.7}
.td-due{display:inline-flex;align-items:center;gap:3px}
.td-due.late{color:var(--bad);font-weight:600}
.td-due.today{color:#b45309;font-weight:600}
.td-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.td-body{font-size:13px;color:#374151;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.td-ops{display:flex;flex:none;gap:2px}
.td-ops button{background:transparent;border:0;color:var(--mut);font-size:12px;padding:4px 5px;cursor:pointer}
.td-ops button.on{color:#f59e0b}
.td-ops button.danger{color:var(--bad)}
.td-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:6px}
.td-foot button{font-size:12px;padding:4px 10px}
.td-log{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.td-note-line{font-size:12.5px;color:#374151;margin-bottom:3px;overflow-wrap:anywhere}
.td-note-line b{margin-right:4px}
.td-cin{display:flex;gap:6px;margin-top:6px}
.td-cin input{flex:1;min-width:0}
.td-cin button{font-size:12px;padding:4px 10px}
.td-imp{background:#fef3c7;color:#b45309}
.td-co{background:#e0e7ff;color:#1d4ed8}
.td-self{background:#dcfce7;color:#15803d}
/* 汇报状态：今天报过 = 绿；N 天没报 = 橙/红 */
.td-rep{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:#fef3c7;color:#b45309}
.td-rep.ok{background:#dcfce7;color:#15803d}
.td-rep.bad{background:#fee2e2;color:var(--bad)}
.td-flag{font-style:normal;font-weight:600;margin-right:5px}
.td-flag-blocked{color:#b45309}
.td-flag-idle{color:#6b7280}
.td-flag-progress{color:#0f766e}
/* 主动性条：自派任务 + 连续汇报 */
.td-selfbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:8px 12px;font-size:12.5px;margin:0 0 10px}
.td-selfbar b{font-size:14px}
.td-selfbar button{margin-left:auto;background:#166534;color:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
/* 督导：按人看谁没汇报 */
.td-board{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 10px}
.td-board-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 0 6px}
.td-board-h span{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.td-board-list{display:grid;gap:2px}
@media(min-width:820px){.td-board-list{grid-template-columns:1fr 1fr;column-gap:12px}}
.td-brow{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:6px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
.td-brow:hover{background:var(--chip)}
.td-brow.on{background:var(--chip);box-shadow:inset 0 0 0 1px var(--ink)}
.td-brow i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--ink);font-style:normal;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.td-brow.me i{background:var(--ink);color:#fff}
.td-brow>b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-brow>b em{font-style:normal;font-size:11px;color:var(--mut);margin-left:3px}
.td-num{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.td-num+.td-num{margin-left:8px}
.td-num b{font-weight:700;color:var(--ink)}
.td-num.bad b{color:var(--bad)}
.td-num.late b{color:#b45309}
.td-who-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:0 0 8px}
.td-who-bar button{margin-left:auto;font-size:12px;padding:3px 10px}
/* 汇报弹层：三个一键按钮 */
.td-quick{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin:4px 0 10px}
.td-quick button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.td-quick button b{font-size:13px;color:var(--ink)}
.td-quick button span{font-size:11.5px;color:var(--mut)}
.td-quick button:active{background:var(--chip)}
@media(max-width:640px){.td-quick{grid-template-columns:1fr}.td-quick button{flex-direction:row;align-items:center;gap:8px}}
.td-al-sub{font-size:12px;font-weight:700;color:var(--mut);margin-top:10px}
.td-impbox{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
#td_sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#td_sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
#td_sheet input,#td_sheet select,#td_sheet textarea{width:100%;font-size:16px}
/* 逾期：顶部红条 + 首页卡片红点 + 每日弹窗 */
.td-alert{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#fef2f2;border:1px solid #fecaca;color:var(--bad);font-weight:600;font-size:13.5px;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.td-alert button{margin-left:auto;background:var(--bad);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.td-dot{display:inline-block;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;padding:0 6px;vertical-align:middle}
.td-go{color:#b45309;font-style:normal;font-weight:600}
.td-fb{margin:4px 0 2px;background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:6px 9px;font-size:12.5px;color:#3f3f46;white-space:pre-wrap;overflow-wrap:anywhere}
.td-al-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.td-al-line{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;padding:4px 0}
.td-al-line b{font-weight:600;overflow-wrap:anywhere}
.td-al-line .td-late{margin-left:auto;flex:none;font-weight:700}
#td_report textarea,#td_alert{min-height:0}
#td_report textarea{width:100%;min-height:96px;font-size:16px}

/* 人员：卡片式列表，桌面多列、手机单列（不吃表格横向滚动） */
.ulist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ucard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.ucard .uhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ucard .uname{font-weight:600;font-size:14.5px}
.ucard .uacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ucard .uacts>button{flex:0 0 auto;padding:6px 10px;font-size:13px}
@media(max-width:640px){
  .ulist{grid-template-columns:1fr}
  .ucard .uacts>button{flex:1 1 40%;min-height:38px}
}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.mod{display:block;width:100%;text-align:left;font:inherit;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px}
.mod:hover{border-color:var(--tealborder)}
.mod:active{background:var(--card2)}
.mod i{font-style:normal;font-size:21px;display:block;margin-bottom:6px;line-height:1}
.mod b{display:block;font-size:14.5px;font-weight:600}
.mod span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.sec{margin:18px 0 8px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.6px}
.hello{margin:4px 0 2px;font-size:15px}
/* 目录磁贴：未开放的模块 */
.mod.soon{opacity:.55;cursor:default;position:relative}
.mod.soon em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--mut)}
.mod.soon b,.mod.soon span{color:var(--mut)}
/* 目录磁贴：右上角 ☆ 设/取消快捷（置顶） */
.mod.pinable{position:relative}
.mod.pinable b{padding-right:22px}
.mod>.pin{position:absolute;top:3px;right:3px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0;font-size:15px;line-height:1;color:var(--mut);opacity:.5;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.mod>.pin:hover{opacity:1;background:var(--chip)}
.mod>.pin.on{color:#e8a33d;opacity:1}

/* ---------- 财务 ---------- */
.fin-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.fin-kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fin-kpi b{display:block;font-size:17px;margin-top:2px}
.fin-kpi span{font-size:12px;color:var(--mut)}
.fin-bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.fin-bar select{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.fin-list{display:flex;flex-direction:column;gap:8px}
.fin-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.fin-row .d{font-size:12px;color:var(--mut);min-width:44px}
.fin-row .m{flex:1;min-width:0}
.fin-row .m b{font-size:15px}
.fin-row .m p{margin:2px 0 0;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-row .a{text-align:right;font-weight:700;white-space:nowrap}
.fin-row .a small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.fin-row img{width:38px;height:38px;object-fit:cover;border-radius:8px;margin-top:4px;border:1px solid var(--line)}
.fin-out .a{color:var(--bad)}.fin-in .a{color:var(--good)}.fin-float .a{color:var(--blue)}
.fin-transfer .a{color:var(--blue)}
.fin-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:14px;z-index:60;max-height:88vh;overflow:auto}
.fin-sheet h3{margin:0 0 10px;font-size:15px}
.fin-sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.fin-sheet input,.fin-sheet select,.fin-sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card)}
.fin-sheet .r{display:flex;gap:8px}
.fin-sheet .r>*{flex:1}
.fin-sheet .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fin-sheet .ph img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.fin-sheet .ph .pht{position:relative;display:inline-block;line-height:0}
.fin-sheet .ph .pht b{position:absolute;top:-7px;right:-7px;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:#111;color:#fff;font-size:15px;font-weight:400;cursor:pointer;border:1px solid #fff}
.fin-dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
.fin-acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.fin-orph{background:#fff6f4;border:1px solid #f3c6bb;border-radius:12px;padding:10px 12px;margin-bottom:8px;color:#8a2b12}
.fin-orph .acts{display:flex;gap:8px;margin-top:8px}
.fin-orph .acts button{flex:1;min-height:40px}
.fin-acct .n{font-weight:600}
.fin-acct .g{display:flex;gap:8px;margin-top:6px}
.fin-acct .g>div{flex:1}
.fin-acct input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.fin-acct label{font-size:11px;color:var(--mut);display:block}
.fin-acct b{display:block;font-size:17px;margin-top:1px}
.fin-acct small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.fin-acct .acts{display:flex;gap:8px;margin-top:8px}
.fin-acct .acts button{flex:1;min-height:40px}
.fin-seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}
.fin-seg button{flex:1;border:0;background:transparent;padding:10px;font-size:15px;font-weight:600;color:var(--mut);border-radius:9px}
.fin-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fin-acts{display:flex;gap:8px;margin:10px 0}
.fin-acts button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600}
.fin-acts button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.fin-move .a{color:var(--ink)}
.fin-ptab{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fin-ptab::-webkit-scrollbar{display:none}
.fin-ptab button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.fin-ptab button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.req{color:#c62828;font-style:normal;font-weight:700}
.fin-inv{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.fin-inv.y{background:#dcfce7;color:#166534}
.fin-inv.n{background:#eef2f6;color:#64748b}
.fin-inv.w{background:#fef3c7;color:#92400e}
.fin-inv.p{background:#ede9fe;color:#6d28d9}
.fin-inv.l{background:#e0f2fe;color:#075985}
.fin-mark{display:flex;gap:6px;margin-top:8px}
.fin-mark button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--ink)}

/* ---------- 操作提示（常驻，不自动消失） ---------- */

/* ---------- 更新提示（浮在表面，不进布局） ---------- */

.co-main{flex:1;display:grid;gap:2px;min-width:0}
.co-main span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-sh{color:var(--ink)}
.co-zm{font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}
.co-zm.on{color:var(--good)}
.co-docs{display:grid;gap:6px}
.co-doc{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.co-doc .co-ic{font-size:18px;line-height:1}
.co-doc a{flex:1;display:grid;gap:1px;min-width:0;color:var(--ink);text-decoration:none}
.co-doc a b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-doc a i{font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-doc:hover{border-color:var(--teal)}
.co-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.co-title{flex:1;font-weight:800;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.co-grid label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
@media(max-width:640px){.co-grid{grid-template-columns:1fr}}
.co-table{width:100%;border-collapse:collapse;font-size:13px}
.co-table th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700;padding:4px 2px;border-bottom:1px solid var(--line)}
.co-table td{padding:3px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.co-table input{border:1px solid transparent;border-radius:8px;padding:5px 6px;background:transparent;width:100%;color:inherit;font:inherit}
.co-table input:not([readonly]){border-color:var(--line);background:var(--card2)}
.co-x{width:26px;height:26px;padding:0;line-height:1;border-radius:8px}

/* 打卡 / 客户 / 出口 */
.row-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font:inherit;color:inherit}
.row-item b{font-size:14.5px;font-weight:600}
.row-item span{font-size:12.5px}
.st-dots{display:flex;gap:5px;padding:6px 2px 2px}
.st-dot{display:block;width:100%;height:4px;border-radius:99px;background:var(--line)}
.st-dot.on{background:var(--good)}
.exp-detail{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card2);margin:8px 0 14px}
.exp-stage{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.exp-stage:first-of-type{border-top:0;margin-top:0;padding-top:0}
.exp-stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:2px}
.exp-stage.done .exp-stage-h b{color:var(--good)}
.file-row{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.file-row a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.btn{display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:0}
</style>
</head>
<body>

<div id="setup" class="hide">
  <div class="card">
    <h1>ecobox 初始化</h1>
    <p class="mut">第一次使用：用部署时给出的「初始化口令」建第一个管理员账号。</p>
    <form id="sf">
      <label>初始化口令</label><input id="s_token" autocomplete="off" required>
      <div class="row"><div><label>姓名</label><input id="s_name" required></div><div><label>账号（可留空，默认用姓名）</label><input id="s_login" autocomplete="username" placeholder="邮箱 / 手机号 / 姓名"></div></div>
      <label>密码（≥8 位）</label><input id="s_pass" type="password" autocomplete="new-password" required>
      <div class="err" id="s_err"></div>
      <button class="pri" style="width:100%;margin-top:6px">创建管理员</button>
    </form>
  </div>
</div>

<div id="login" class="hide">
  <div class="card">
    <h1>ecobox 经营台账</h1>
    <p class="mut">赞比亚公司日常经营管理 · 每人一个账号</p>
    <form id="lf">
      <label>账号</label><input id="l_login" type="text" autocomplete="username" required placeholder="邮箱 / 手机号 / 姓名">
      <label>密码</label><input id="l_pass" type="password" autocomplete="current-password" required>
      <div class="err" id="l_err"></div>
      <button class="pri" style="width:100%;margin-top:6px">登录</button>
    </form>
    <p class="mut" style="margin:12px 0 0">还没有账号？找管理员开通。</p>
  </div>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <div class="bar">
      <button class="ghost hide" id="back" aria-label="返回目录">←</button>
      <b id="ttl">ECOBOX</b><span class="chip" id="who"></span><span class="sp"></span>
    </div>
    <nav id="tabs"></nav>
    <div id="pane"></div>
  </div>
</div>

<div id="moddlg" class="hide" style="position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50">

const BUILD = "__BUILD__";
let UPD_SEEN = false;
let UPD_AT = 0;
async function checkUpdate(force) {
  if (document.hidden && !force) return;
  const now = Date.now();
  if (now - UPD_AT < 55000) return;
  UPD_AT = now;
  try {
    const r = await fetch("/api/build", { cache: "no-store" });
    const j = await r.json();
    if (j.build && j.build !== BUILD && !UPD_SEEN) {
      UPD_SEEN = true;
      const d = document.createElement("div");
      d.id = "upd_ver";
      d.innerHTML = "<span>有新版本</span><button>立即更新</button>";
      d.querySelector("button").onclick = () => {
        try { caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch (e) {}
        location.reload();
      };
      document.body.appendChild(d);
    }
  } catch (e) {}
}
setInterval(checkUpdate, 300000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
window.addEventListener("focus", () => checkUpdate());

function tr(s) {
  if (!isEN() || !s) return s;
  const key = String(s).trim();
  if (EN[key]) return EN[key];
  for (const [re, rep] of EN_RULES) {
    const m = key.match(re);
    if (m) return typeof rep === "function" ? rep(m) : key.replace(re, rep);
  }
  /* 带 emoji 前缀的按钮："🏦 公司账户 · 对账基准" */
  const pre = key.match(/^([^\u4e00-\u9fffA-Za-z0-9]+)\s*([\u4e00-\u9fff].*)$/);
  if (pre) {
    const inner = tr(pre[2]);
    if (inner !== pre[2]) return pre[1] + inner;
  }
  /* 组合串："boss@ecobox.com · 现金 · buy diesel" */
  if (/[·•・]/.test(key)) {
    const parts = key.split(/\s*[·•・]\s*/);
    const mapped = parts.map(tr);
    if (mapped.some((x, i) => x !== parts[i])) return mapped.join(" · ");
  }
  return s;
}

const roleName = (r) => tr(ROLE_ZH[r] || "员工");

/* 双语内容：原文 + AI 译文；当前语言缺译文就回退原文 */
function tx(o, field) {
  if (!o) return "";
  const zh = o[field + "_zh"] || o[field] || "";
  const en = o[field + "_en"] || "";
  return isEN() ? (en || o[field] || zh) : (zh || o[field] || en);
}

/* 把当前 DOM 里能对上的中文文案翻成英文（渲染后调用；观察器兜住异步内容） */
function applyLang(root) {
  if (!isEN() || !root) return;
  const scope = root.nodeType === 1 ? root : document.body;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const raw = n.nodeValue;
    const key = raw.trim();
    if (!key || !/[\u4e00-\u9fff]/.test(key)) continue;
    const out = tr(key);
    if (out !== key) n.nodeValue = raw.replace(key, out);
  }
  for (const el of scope.querySelectorAll("[placeholder],[title],[aria-label]")) {
    for (const a of ["placeholder", "title", "aria-label"]) {
      const v = el.getAttribute(a);
      if (v && /[\u4e00-\u9fff]/.test(v)) {
        const out = tr(v);
        if (out !== v) el.setAttribute(a, out);
      }
    }
  }
}

let LANG_OBS = null;
function watchLang() {
  if (LANG_OBS) { LANG_OBS.disconnect(); LANG_OBS = null; }
  if (!isEN() || typeof MutationObserver === "undefined") return;
  LANG_OBS = new MutationObserver((muts) => {
    for (const m of muts) {
      if (m.type === "characterData") applyLang(m.target.parentElement || document.body);
      else for (const n of m.addedNodes) if (n.nodeType === 1) applyLang(n);
    }
  });
  LANG_OBS.observe(document.body, { childList: true, subtree: true, characterData: true });
}

async function setLang(l) {
  LANG = l === "en" ? "en" : "zh";
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  document.documentElement.lang = isEN() ? "en" : "zh-CN";
  if (S.user) {
    S.user.lang = LANG;
    api("/me", { method: "PATCH", body: { lang: LANG }, quiet: true }).catch(() => {});
    paintWho();
    buildTabs();
  }
  await render();
  toast(isEN() ? "Switched to English" : tr("已切换为中文"));
}

function langHtml() {
  const opt = (v, name, sub) => `<button class="langopt${LANG === v ? " on" : ""}" data-lang="${v}">
    <b>${name}</b><span>${sub}</span>${LANG === v ? "<em>✓</em>" : ""}</button>`;
  const subEN = isEN() ? "" : "英文";
  return `<div class="card"><h3>${tr("界面语言")}</h3>
    <p class="mut">${esc(tr("默认为中文。切换后目录、日报、账目、动态等界面全部用英文。"))}</p>
    <div class="langopts">${opt("zh", "中文", "Chinese")}${opt("en", "English", subEN)}</div>
    <p class="mut">${esc(tr("留言、备注等文字会由 AI 自动翻译成你选择的语言；原文仍然保留。"))}</p>
  </div>`;
}

let UPD_TIMER = 0;
function showUpd(msg, kind) {
  const b = document.getElementById("updbar");
  if (!b) return;
  b.textContent = (kind === "bad" ? "✗ " : "✓ ") + msg;
  b.className = "updbar show " + (kind === "bad" ? "bad" : "ok");
  requestAnimationFrame(() => b.classList.add("in"));
  clearTimeout(UPD_TIMER);
  UPD_TIMER = setTimeout(hideUpd, kind === "bad" ? 3500 : 1200);
}

function hideUpd() {
  clearTimeout(UPD_TIMER);
  const b = document.getElementById("updbar");
  if (!b) return;

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { ...(opts.body ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== "/me") { showLogin(); throw new Error(data.error || "请先登录"); }
  if (!r.ok) throw new Error(data.error || "请求失败 " + r.status);
  if (opts.method && opts.method !== "GET" && !opts.quiet && !/^\/(login|logout|setup)\b/.test(path)) {
    const txt = opts.toast || (opts.method === "DELETE" ? "已删除" : "已保存");
    toast(txt + " · " + new Date().toTimeString().slice(0, 5));
  }
  return data;
}

/* ---------- 生产（日报） ---------- */
const PROD_UNITS = [["kg", "公斤"], ["t", "吨"], ["bag", "袋"], ["truck", "车"]];
const PROD_PRESETS = ["钽铌精矿", "跳汰机粗颗粒", "手工原矿"];
const PROD_WINDOWS = [7, 30, 90];
const PROD_DAYS = 90;
let PROD_WIN = 30;

const prodUnitName = (u) => (PROD_UNITS.find((x) => x[0] === u) || PROD_UNITS[0])[1];
const unitRank = (u) => Math.max(0, PROD_UNITS.findIndex((x) => x[0] === u));
const prodNum = (v) => { const n = Number(v) || 0; return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); };
const prodPhotos = (r) => {
  try { const a = JSON.parse(r.photos || "[]"); return Array.isArray(a) ? a.filter((x) => typeof x === "string" && x) : []; }
  catch (e) { return []; }
};
/* 老记录只有 ore_t（矿石吨），没有 qty；显示时按吨算 */
const prodQty = (r) => (Number(r.qty) > 0 ? { n: Number(r.qty), u: r.unit || "kg" } : { n: Number(r.ore_t) || 0, u: "t" });
const prodMine = (r) => r.user_id === S.user.id || S.user.role === "admin" || S.user.role === "manager";

async function loadProd() {
  const now = new Date();
  const to = localDay(now);
  /* 累计要基于全部历史，所以多取一段；列表仍只显示最近 PROD_DAYS 天 */
  S.logsAll = (await api(`/logs?from=2000-01-01&to=${to}`)).logs || [];
  const cut = localDay(new Date(now.getTime() - (PROD_DAYS - 1) * 864e5));
  S.logs = S.logsAll.filter((r) => String(r.day) >= cut);
}

const prodRows = () => S.logs.slice().sort((a, b) => String(b.day).localeCompare(String(a.day)) || b.id - a.id);

function prodTotal(rows) {
  const m = new Map();
  rows.forEach((r) => { const q = prodQty(r); if (q.n) m.set(q.u, (m.get(q.u) || 0) + q.n); });
  return [...m.entries()].map(([u, v]) => prodNum(v) + " " + prodUnitName(u)).join(" · ") || "—";
}

/* 今日/本月只报一个主单位，别的单位放在小字里，免得 KPI 挤成两行 */
function prodTotals(rows) {
  const sum = new Map(), cnt = new Map();
  rows.forEach((r) => {
    const q = prodQty(r);
    if (!q.n) return;
    sum.set(q.u, (sum.get(q.u) || 0) + q.n);
    cnt.set(q.u, (cnt.get(q.u) || 0) + 1);
  });
  const order = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0])).map((x) => x[0]);
  if (!order.length) return { main: "—", rest: "" };
  const fmt = (u) => prodNum(sum.get(u)) + " " + prodUnitName(u);
  return { main: fmt(order[0]), rest: order.slice(1).map(fmt).join(" · ") };
}

const prodDayLabel = (d) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || "")) return d || "—";
  const wd = new Date(d + "T00:00:00").toLocaleDateString(LANG === "en" ? "en-GB" : "zh-CN", { weekday: "short" });
  return d.slice(5) + " " + wd;
};

const prodDaysBack = (n) => {
  const out = [];
  const now = new Date(); now.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) out.push(localDay(new Date(now.getTime() - i * 864e5)));
  return out;
};

/* 品位：按数量加权（同一产品单位一致，可直接加权；整体只取同一单位口径） */
function prodWavg(rows, key) {
  let w = 0, s = 0;
  rows.forEach((r) => {
    const q = prodQty(r), g = Number(r[key]);
    if (q.n > 0 && g > 0) { w += q.n; s += q.n * g; }
  });
  return w ? s / w : null;
}
const prodGradeTxt = (v) => (v == null ? "—" : prodNum(+v.toFixed(2)) + "%");

function prodOverallGrade(rows) {
  const graded = rows.filter((r) => { const q = prodQty(r); return q.n > 0 && (Number(r.ta) > 0 || Number(r.nb) > 0); });
  if (!graded.length) return null;
  const cnt = new Map();
  graded.forEach((r) => { const u = prodQty(r).u; cnt.set(u, (cnt.get(u) || 0) + 1); });
  const unit = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0]))[0][0];
  const use = graded.filter((r) => prodQty(r).u === unit);
  return { ta: prodWavg(use, "ta"), nb: prodWavg(use, "nb"), unit, n: use.length, qty: use.reduce((s, r) => s + prodQty(r).n, 0) };
}

/* 累计：数量逐日相加，品位按数量加权；累计基于全部历史，窗口只决定显示哪一段 */
function prodCumMap(rows) {
  const daily = new Map();
  rows.forEach((r) => {
    const q = prodQty(r);
    if (!q.n || !r.day) return;
    let d = daily.get(r.day);
    if (!d) { d = { inc: 0, wTa: 0, sTa: 0, wNb: 0, sNb: 0 }; daily.set(r.day, d); }
    d.inc += q.n;
    const ta = Number(r.ta), nb = Number(r.nb);
    if (ta > 0) { d.wTa += q.n; d.sTa += q.n * ta; }
    if (nb > 0) { d.wNb += q.n; d.sNb += q.n * nb; }
  });
  const out = new Map();
  let cum = 0, wTa = 0, sTa = 0, wNb = 0, sNb = 0;
  [...daily.keys()].sort().forEach((day) => {
    const d = daily.get(day);
    cum += d.inc; wTa += d.wTa; sTa += d.sTa; wNb += d.wNb; sNb += d.sNb;
    out.set(day, { inc: d.inc, cum, ta: wTa ? sTa / wTa : null, nb: wNb ? sNb / wNb : null });
  });
  return out;
}

/* 铺到窗口里每一天，没记录的日子沿用前一天的累计值 */
function prodCumPoints(map, days) {
  let cur = { cum: 0, ta: null, nb: null };
  return days.map((d) => {
    const v = map.get(d);
    if (v) cur = v;
    return { day: d, cum: cur.cum, ta: cur.ta, nb: cur.nb, inc: v ? v.inc : 0, has: !!v };
  });
}

/* 折线：实线=累计数量，虚线=累计 Ta% / Nb%（共用一条品位纵轴，便于对比） */
function prodCumSvg(points) {
  const W = 600, H = 120, PT = 8, PB = 6, PL = 3, PR = 3;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxQ = Math.max(1, ...points.map((p) => p.cum));
  const grades = points.flatMap((p) => [p.ta, p.nb]).filter((v) => v != null);
  const maxG = grades.length ? Math.max(...grades) : 0;
  const x = (i) => PL + (points.length > 1 ? (i * iw) / (points.length - 1) : iw / 2);
  const yQ = (v) => PT + ih * (1 - v / maxQ);
  const yG = (v) => PT + ih * (1 - v / (maxG * 1.1 || 1));
  const qPath = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${yQ(p.cum).toFixed(1)}`).join(" ");
  const qArea = `${qPath} L${x(points.length - 1).toFixed(1)} ${PT + ih} L${x(0).toFixed(1)} ${PT + ih} Z`;
  const gradePath = (key) => points
    .map((p, i) => (p[key] == null ? null : `${i && points[i - 1][key] != null ? "L" : "M"}${x(i).toFixed(1)} ${yG(p[key]).toFixed(1)}`))
    .filter(Boolean).join(" ");
  const taPath = gradePath("ta"), nbPath = gradePath("nb");
  const grid = [0.25, 0.5, 0.75]
    .map((f) => `<line x1="${PL}" x2="${W - PR}" y1="${(PT + ih * f).toFixed(1)}" y2="${(PT + ih * f).toFixed(1)}" class="pd-grid"/>`)
    .join("");
  return `<svg class="pd-cum" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    ${grid}
    <path d="${qArea}" class="pd-area"/>
    <path d="${qPath}" class="pd-line"/>
    ${taPath ? `<path d="${taPath}" class="pd-gline"/>` : ""}
    ${nbPath ? `<path d="${nbPath}" class="pd-nline"/>` : ""}
  </svg>`;
}

function prodRefUnit(rows) {
  const cnt = new Map();
  rows.forEach((r) => { const q = prodQty(r); if (q.n) cnt.set(q.u, (cnt.get(q.u) || 0) + 1); });
  const top = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0]))[0];
  return top ? top[0] : "kg";
}

function prodChartData() {
  const days = prodDaysBack(PROD_WIN);
  const all = S.logsAll || S.logs || [];
  const inSet = new Set(days);
  const win = all.filter((r) => inSet.has(r.day) && prodQty(r).n > 0);
  const unit = prodRefUnit(win);
  const points = prodCumPoints(prodCumMap(all.filter((r) => prodQty(r).u === unit)), days);
  const last = points[points.length - 1] || { cum: 0, ta: null, nb: null };
  return { days, win, all, unit, points, cum: last.cum, ta: last.ta, nb: last.nb };
}

/* 按品种拆当日产出：一个单位一张柱状面板，颜色区分产品 */
const PROD_COLORS = ["#111827", "#0f766e", "#b45309", "#7c3aed", "#be123c"];

function prodDailyPanels(days, all) {
  const byUnit = new Map();
  all.forEach((r) => {
    const q = prodQty(r);
    if (!q.n) return;
    if (!byUnit.has(q.u)) byUnit.set(q.u, new Map());
    const m = byUnit.get(q.u);
    const k = r.product || "";
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  const inSet = new Set(days);
  return [...byUnit.entries()]
    .sort((a, b) => unitRank(a[0]) - unitRank(b[0]))
    .map(([unit, m]) => {
      const products = [...m.entries()].map(([name, rows]) => {
        const daily = new Map();
        let total = 0;
        rows.forEach((r) => {
          if (!inSet.has(r.day)) return;
          const n = prodQty(r).n;
          daily.set(r.day, (daily.get(r.day) || 0) + n);
          total += n;
        });
        const cumMap = prodCumMap(rows);
        const lastDay = [...cumMap.keys()].pop();
        const last = lastDay ? cumMap.get(lastDay) : { cum: 0, ta: null, nb: null };
        return { name, daily, total, cum: last.cum, ta: last.ta, nb: last.nb };
      }).filter((p) => p.total > 0).sort((a, b) => b.total - a.total);
      products.forEach((p, i) => { p.color = PROD_COLORS[i % PROD_COLORS.length]; });
      const dailyTot = new Map(days.map((d) => [d, products.reduce((s, p) => s + (p.daily.get(d) || 0), 0)]));
      return { unit, products, dailyTot, max: Math.max(1, ...dailyTot.values()) };
    })
    .filter((p) => p.products.length);
}

/* 日表：每天每个品种的产出 + 当日合计 + 累计（同单位口径） */
function prodDayTableHtml(days, all, unit, panel) {
  const map = prodCumMap(all.filter((r) => prodQty(r).u === unit));
  const rows = days.slice().reverse().filter((d) => map.has(d));
  if (!rows.length) return "";
  const prods = panel ? panel.products : [];
  const shown = rows.slice(0, 20);
  const head = `<tr><th>日期</th>${prods.map((p) => `<th class="n"><i class="pd-dot" style="background:${p.color}"></i>${esc(p.name || "未填产品")}</th>`).join("")}<th class="n">合计</th><th class="n">累计</th><th class="n">累计 Ta %</th><th class="n">累计 Nb %</th></tr>`;
  const body = shown.map((d) => {
    const v = map.get(d);
    const cells = prods.map((p) => `<td class="n">${p.daily.get(d) ? prodNum(p.daily.get(d)) : "·"}</td>`).join("");
    return `<tr><td>${esc(d.slice(5))}</td>${cells}<td class="n"><b>${prodNum(v.inc)}</b></td><td class="n">${prodNum(v.cum)}</td>
      <td class="n">${prodGradeTxt(v.ta)}</td><td class="n">${prodGradeTxt(v.nb)}</td></tr>`;
  }).join("");
  return `<div class="pd-daytab">
    <div class="pd-sub">按日明细（${esc(prodUnitName(unit))}口径）</div>
    <table>${head}${body}</table>
    ${rows.length > shown.length ? `<div class="pd-note mut">只列最近 ${shown.length} 天</div>` : ""}
  </div>`;
}

function prodChartHtml() {
  const { days, win, all, unit, points, cum, ta, nb } = prodChartData();
  const wins = PROD_WINDOWS.map((n) => `<button class="td-chip${n === PROD_WIN ? " on" : ""}" data-win="${n}">${n} 天</button>`).join("");
  if (!win.length) {
    return `<div class="card" id="prod_chart"><h3>产量走势 · 累计</h3><div class="pd-win">${wins}</div>
      <div class="empty">这段时间没有产量记录</div></div>`;
  }
  const today = localDay(new Date());
  const todayTot = prodTotals(win.filter((r) => r.day === today));
  const otherUnits = win.some((r) => prodQty(r).u !== unit);
  const head = `<div class="pd-tot">
      <span class="pd-sum"><i>今日</i> <b>${esc(todayTot.main)}</b></span>
      ${todayTot.rest ? `<span class="mut">另有 ${esc(todayTot.rest)}</span>` : ""}
      <span class="pd-avg"><i>累计</i> <b>${prodNum(cum)} ${esc(prodUnitName(unit))}</b>
        ${ta == null && nb == null ? "" : `<em>Ta ${prodGradeTxt(ta)} · Nb ${prodGradeTxt(nb)}</em>`}</span>
    </div>`;
  const panelsAll = prodDailyPanels(days, all);
  const panels = panelsAll.map((p) => prodDailyPanelHtml(days, p)).join("");
  const refPanel = panelsAll.find((p) => p.unit === unit);
  return `<div class="card" id="prod_chart">
    <h3>产量走势 · 累计 <span class="mut" style="font-weight:400">近 ${PROD_WIN} 天</span></h3>
    <div class="pd-win">${wins}</div>
    ${head}
    ${prodCumSvg(points)}
    <div class="pd-x mut"><span>${days[0].slice(5)}</span><span>${days[days.length - 1].slice(5)}</span></div>
    <div class="pd-leg"><span><i class="pd-k1"></i>累计产量（${esc(prodUnitName(unit))}）</span><span><i class="pd-k2"></i>累计 Ta%</span><span><i class="pd-k3"></i>累计 Nb%</span></div>
    ${otherUnits ? `<div class="pd-note mut">累计只按单一单位统计，袋/吨等其它单位不计入</div>` : ""}
    ${panels}
    ${prodDayTableHtml(days, all, unit, refPanel)}
  </div>`;
}

function prodRowHtml(r) {
  const q = prodQty(r);
  const photos = prodPhotos(r);
  const grade = r.ta || r.nb ? `Ta ${prodNum(r.ta)}% · Nb ${prodNum(r.nb)}%` : (r.grade || "");
  return `<div class="pd-row">
    <span class="t">${esc(r.product || (q.u === "t" ? "矿石" : "精矿"))}</span>
    <span class="q">${q.n ? prodNum(q.n) + " " + esc(prodUnitName(q.u)) : "—"}</span>
    ${grade ? `<span class="chip">${esc(grade)}</span>` : ""}
    ${r.note ? `<div class="n">${esc(tx(r, "note"))}</div>` : ""}
    ${photos.length ? `<div class="pd-ths">${photos.map((k) => `<img src="/api/fin/photo/${esc(k)}" data-pdv="/api/fin/photo/${esc(k)}" alt="">`).join("")}</div>` : ""}
    <div class="m"><span class="u">${esc(r.user_name || "")}${r.site ? " · " + esc(r.site) : ""}</span>
      ${prodMine(r) ? `<button data-edit="${r.id}">改</button><button class="danger" data-del="${r.id}">删</button>` : ""}
    </div>
  </div>`;
}

function prodHtml() {
  const rows = prodRows();
  const today = localDay(new Date()), month = today.slice(0, 7);
  const todayRows = rows.filter((r) => r.day === today);
  const monthRows = rows.filter((r) => String(r.day).startsWith(month));
  const groups = new Map();
  rows.forEach((r) => { const k = r.day || "—"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  let list = "";
  groups.forEach((g, k) => {
    list += `<div class="pd-day"><b>${esc(prodDayLabel(k))}</b><span class="s">合计 ${prodTotal(g)}</span></div>`;
    list += g.map(prodRowHtml).join("");
  });
  const tToday = prodTotals(todayRows), tMonth = prodTotals(monthRows);
  const kpi = (label, t) => `<div class="kpi"><i>${label}</i><b>${t.main}</b>${t.rest ? `<i>另有 ${esc(t.rest)}</i>` : ""}</div>`;
  return `<div class="grid">
      ${kpi("今日产量", tToday)}
      ${kpi("本月", tMonth)}
      <div class="kpi"><i>本月记录</i><b>${monthRows.length} 笔</b><i>${new Set(monthRows.map((r) => r.day)).size} 天有记录</i></div>
    </div>
    ${prodChartHtml()}
    <div class="card">
      <h3>生产记录（${rows.length}）</h3>
      ${rows.length ? list : `<div class="empty">还没有记录，点右下角「记一笔」</div>`}
    </div>
    <button class="pd-fab" id="prod_new">＋ 记一笔</button>`;
}

function bindProd(pane) {
  $("#prod_new", pane).onclick = () => prodSheet(null);
  pane.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => {
    const r = S.logs.find((x) => x.id === +b.dataset.edit);
    if (r) prodSheet(r);
  });
  pane.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => delProd(+b.dataset.del));
  pane.querySelectorAll("[data-pdv]").forEach((im) => im.onclick = () => finView(im.dataset.pdv));
  pane.querySelectorAll("[data-win]").forEach((b) => b.onclick = () => {
    PROD_WIN = +b.dataset.win;
    $("#prod_chart", pane).outerHTML = prodChartHtml();
    bindProd(pane);
  });
}

function prodSheet(rec) {
  const d = rec || {};
  const q = rec ? prodQty(rec) : { n: 0, u: "kg" };
  let site = rec ? (d.site || "") : "";
  if (!site) { try { site = localStorage.getItem("prod_site") || S.user.site || SITES[0] || ""; } catch (e) { site = S.user.site || SITES[0] || ""; } }
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet">
    <h3>${rec ? "修改生产记录" : "记一笔"}</h3>
    <label>日期</label><input id="pg_date" type="date" value="${esc(rec ? d.day : localDay(new Date()))}">
    <span class="pd-lbl">产品</span>
    <div class="pd-picks">${PROD_PRESETS.map((p) => `<button type="button" class="chip" data-prod="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <input id="pg_prod" placeholder="产品 / 来源" value="${esc(d.product || "")}">
    <div class="r" style="margin-top:8px">
      <div><label>数量</label><input id="pg_qty" type="text" inputmode="decimal" placeholder="0" value="${rec && q.n ? prodNum(q.n) : ""}"></div>
      <div><label>单位</label><select id="pg_unit">${PROD_UNITS.map(([k, n]) => `<option value="${k}"${k === q.u ? " selected" : ""}>${n} ${k}</option>`).join("")}</select></div>
    </div>
    <div class="r" style="margin-top:8px">
      <div><label>Ta 品位 %</label><input id="pg_ta" type="text" inputmode="decimal" placeholder="0" value="${d.ta ? esc(d.ta) : ""}"></div>
      <div><label>Nb 品位 %</label><input id="pg_nb" type="text" inputmode="decimal" placeholder="0" value="${d.nb ? esc(d.nb) : ""}"></div>
    </div>
    <label>备注</label><input id="pg_note" value="${esc(tx(d, "note"))}">
    ${finPhotoHtml("pg")}
    <details style="margin-top:10px">
      <summary class="mut">现场信息（选填：矿区 / 班次 / 人数 / 废石 / 支出）</summary>
      <div class="r" style="margin-top:8px">
        <div><label>矿区/项目</label><input id="pg_site" list="sites" value="${esc(site)}"></div>
        <div><label>班次</label><select id="pg_shift">${["白班", "夜班", "全天"].map((x) => `<option${x === (d.shift || "白班") ? " selected" : ""}>${x}</option>`).join("")}</select></div>
      </div>
      <datalist id="sites">${SITES.map((s) => `<option>${esc(s)}</option>`).join("")}</datalist>
      <div class="row3" style="margin-top:8px">
        <div><label>出勤人数</label><input id="pg_people" type="number" min="0" step="1" value="${d.headcount || ""}"></div>
        <div><label>废石（吨）</label><input id="pg_waste" type="number" min="0" step="0.1" value="${d.waste_t || ""}"></div>
        <div><label>支出（USD）</label><input id="pg_cost" type="number" min="0" step="0.01" value="${d.cost_usd || ""}"></div>
      </div>
    </details>
    <p class="mut" id="pg_msg" style="min-height:1em;margin:8px 0 0"></p>
    <div class="r" style="margin-top:8px"><button class="ghost" id="pg_x">取消</button><button class="pri" id="pg_save">${rec ? "保存修改" : "保存"}</button></div>
  </div>`;
  document.body.appendChild(box);

  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#pg_x", box).onclick = close;

  const PH = finPhotoWire(box, "pg", rec ? prodPhotos(rec) : [], "prod");
  const prodInput = $("#pg_prod", box);
  const syncPicks = () => box.querySelectorAll("[data-prod]").forEach((b) => b.classList.toggle("on", b.dataset.prod === prodInput.value.trim()));
  box.querySelectorAll("[data-prod]").forEach((b) => b.onclick = () => { prodInput.value = b.dataset.prod; syncPicks(); });
  prodInput.oninput = syncPicks;
  syncPicks();
  ["pg_qty", "pg_ta", "pg_nb"].forEach((id) => {
    const inp = $("#" + id, box);
    inp.oninput = () => { const v = inp.value.replace(/[^\d.,]/g, ""); if (v !== inp.value) inp.value = v; };
  });

  const btn = $("#pg_save", box), msg = $("#pg_msg", box);
  const numIn = (id) => +(String($("#" + id, box).value || "0").replace(",", ".") || 0) || 0;
  btn.onclick = async () => {
    const qty = numIn("pg_qty");
    if (!(qty > 0)) { msg.textContent = "数量要大于 0"; return; }
    const siteV = $("#pg_site", box).value.trim();
    if (!siteV) { msg.textContent = "请填矿区/项目（在「现场信息」里）"; return; }
    const body = {
      day: $("#pg_date", box).value,
      site: siteV,
      product: prodInput.value.trim(),
      qty,
      unit: $("#pg_unit", box).value,
      ta: numIn("pg_ta"), nb: numIn("pg_nb"),
      note: $("#pg_note", box).value,
      photos: PH.list,
      shift: $("#pg_shift", box).value,
      headcount: numIn("pg_people"), waste_t: numIn("pg_waste"), cost_usd: numIn("pg_cost"),
    };
    btn.disabled = true; msg.textContent = "";
    try {
      if (rec) await api("/logs/" + rec.id, { method: "PATCH", body, toast: "生产记录已更新" });
      else await api("/logs", { method: "POST", body, toast: "生产记录已保存" });
      try { localStorage.setItem("prod_site", siteV); } catch (e) {}
      close();
      await render();
    } catch (e) { msg.textContent = e.message; btn.disabled = false; }
  };
}

async function delProd(id) {
  if (!confirm("删掉这条生产记录？不能撤销。")) return;
  try { await api("/logs/" + id, { method: "DELETE", toast: "生产记录已删除" }); await render(); }
  catch (e) { toast(e.message, "bad"); }
}

/* ---------- 待办 ---------- */
const TODO_FILTERS = [["all", "全部"], ["mine", "我负责"], ["made", "我发起"], ["company", "公司事项"], ["late", "已逾期"], ["done", "已完成"]];
let TODOS = [], TPEOPLE = [], TD_OPEN = {};
const daysLeft = (due) => Math.round((new Date(due + "T00:00:00") - new Date(iso(new Date()) + "T00:00:00")) / 864e5);
const isMine = (t) => t.owner === (S.user && S.user.login);
const canTouch = (t) => isMine(t) || t.creator === S.user.login || S.user.role === "admin" || S.user.role === "manager";
/* 派活是管理层的事；员工只给自己排（避免互相甩活） */
const canAssign = () => ["admin", "manager"].includes(S.user.role);

async function loadTodos() {
  const r = await api("/todos");
  TODOS = r.todos || [];
  if (!TPEOPLE.length) TPEOPLE = (await api("/people")).people || [];
}

const overdue = (t) => t.status !== "done" && !!t.due && daysLeft(t.due) < 0;
const lateForMe = () => TODOS.filter((t) => overdue(t) && (isMine(t) || t.creator === (S.user && S.user.login) || (t.scope === "company" && !t.owner)));
const NOTE_TIME = (n) => String(n.created_at || "").slice(5, 16).replace("T", " ");

const REPORT_FLAGS = { progress: "推进了", blocked: "卡住了", idle: "今天没动" };
const todayStr = () => iso(new Date());
/* 今天报过没？没有的话从派下来（或最后汇报）算起几天没报 */
const reportedToday = (t) => String(t.last_report_at || "").slice(0, 10) === todayStr();
const reportAge = (t) => {
  const base = t.last_report_at || t.assign_at || t.created_at || "";
  if (!base) return 0;
  return Math.max(0, Math.round((new Date(todayStr() + "T00:00:00") - new Date(String(base).slice(0, 10) + "T00:00:00")) / 864e5));
};
const myOpen = () => TODOS.filter((t) => t.status !== "done" && t.owner === S.user.login);
const needReport = () => myOpen().filter((t) => !reportedToday(t));
/* 连续汇报天数：从今天（今天还没报就从昨天）往前数，连着有汇报的天数 */
function reportStreak() {
  const days = new Set();
  for (const t of TODOS) for (const n of t.notes || []) {
    if (n.kind === "report" && n.uid === S.user.login) days.add(String(n.created_at || "").slice(0, 10));
  }
  let n = 0;
  const d = new Date();
  if (!days.has(iso(d))) d.setDate(d.getDate() - 1);
  while (days.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function noteLine(n) {
  const t = esc(NOTE_TIME(n));
  if (n.kind === "sys") return `<div class="td-note-line"><b>${esc(n.name)}</b><i class="mut">${esc(tr(n.body))}</i><span class="mut"> · ${t}</span></div>`;
  if (n.kind === "assign") return `<div class="td-note-line"><b>${esc(n.name)}</b><i class="td-go">${esc(n.body)}</i><span class="mut"> · ${t}</span></div>`;
  if (n.kind === "report") {
    const label = REPORT_FLAGS[n.flag] || REPORT_FLAGS.progress;
    return `<div class="td-note-line"><b>${esc(n.name)}</b><i class="td-flag td-flag-${esc(n.flag || "progress")}">${esc(tr(label))}</i>${esc(n.body)}<span class="mut"> · ${t}</span></div>`;
  }
  return `<div class="td-note-line"><b>${esc(n.name)}</b>${esc(n.body)}<span class="mut"> · ${t}</span></div>`;
}

function todoCard(t) {
  const st = t.status === "done" ? "done" : "doing";
  const dl = t.due ? daysLeft(t.due) : null;
  const late = st !== "done" && dl !== null && dl < 0;
  const dueTxt = dl === null ? ""
    : st === "done" ? esc(t.due)
      : dl < 0 ? `${esc(tr("逾期"))} ${-dl} ${esc(tr("天"))}`
        : dl === 0 ? esc(tr("今天到期"))
          : esc(String(t.due).slice(5)) + (dl <= 7 ? ` · ${dl} ${esc(tr("天"))}` : "");
  const isOwner = !!t.owner && t.owner === S.user.login;
  const age = reportAge(t);
  const rep = st === "done" ? ""
    : isOwner && reportedToday(t) ? `<span class="td-rep ok">✓ ${esc(tr("今天已汇报"))}</span>`
      : isOwner ? `<span class="td-rep${age >= 2 ? " bad" : ""}">${age ? `${age} ${esc(tr("天没汇报"))}` : esc(tr("今天还没汇报"))}</span>`
        : "";
  const tags = [
    t.imp ? `<span class="pill td-imp">★ ${esc(tr("重要"))}</span>` : "",
    t.self_set ? `<span class="pill td-self">${esc(tr("自定"))}</span>` : "",
    t.scope === "company" ? `<span class="pill td-co">${esc(tr("公司事项"))}</span>` : "",
    t.scope === "person" ? `<span class="pill">${esc(tr("指派"))}</span>` : "",
    st === "done" ? `<span class="pill">${esc(tr("已完成"))}</span>` : "",
  ].filter(Boolean).join("");
  const who = t.owner ? t.owner_name || t.owner : tr("未指派");
  const all = t.notes || [];
  const lastRep = [...all].reverse().find((n) => n.kind === "report" || n.kind === "cmt" || n.kind === "start");
  const notes = all.slice(-6).map(noteLine).join("");
  const open = !!TD_OPEN[t.id];
  const box = `class="td-check${st === "done" ? " on" : ""}" data-td-done="${t.id}" aria-label="${esc(tr(st === "done" ? "重新打开" : "标记完成"))}"`;
  return `<div class="td-card${st === "done" ? " done" : ""}${late ? " late" : ""}" data-td="${t.id}">
    <div class="td-row">
      <button ${box}>${st === "done" ? "✓" : ""}</button>
      <div class="td-mid">
        <div class="td-title">${esc(t.title)}</div>
        <div class="td-meta">
          <span class="td-who${t.owner ? "" : " none"}"><i>${esc(String(who).trim().slice(0, 1))}</i>${esc(who)}</span>
          ${dueTxt ? `<span class="td-due${late ? " late" : dl === 0 && st !== "done" ? " today" : ""}">🗓 ${dueTxt}</span>` : ""}
          ${rep}
          ${t.creator && t.creator !== t.owner ? `<span>· ${esc(tr("发起"))} ${esc(t.creator_name || t.creator)}</span>` : ""}
        </div>
        ${tags ? `<div class="td-tags">${tags}</div>` : ""}
        ${t.note ? `<div class="td-body">${esc(t.note)}</div>` : ""}
        ${lastRep ? `<div class="td-fb"><span class="mut">${esc(lastRep.name)} · ${esc(NOTE_TIME(lastRep))}</span> ${esc(lastRep.body)}</div>` : ""}
        ${open ? `<div class="td-log">${notes || `<div class="mut">${esc(tr("还没有留言"))}</div>`}
          <div class="td-cin"><input class="td-cmt" data-td-input="${t.id}" maxlength="500" placeholder="${esc(tr("写留言…"))}"><button data-td-send="${t.id}">${esc(tr("发送"))}</button></div></div>` : ""}
      </div>
      <div class="td-ops">
        <button data-td-star="${t.id}" class="${t.imp ? "on" : ""}" title="${esc(tr("重要"))}">★</button>
        ${canTouch(t) ? `<button data-td-edit="${t.id}" title="${esc(tr("改"))}">✎</button>` : ""}
      </div>
    </div>
    <div class="td-foot">
      ${isOwner && st !== "done" ? `<button class="pri" data-td-report="${t.id}">📝 ${esc(tr("汇报"))}</button>` : ""}
      ${canTouch(t) && st !== "done" ? `<button${isOwner ? "" : ' class="pri"'} data-td-fin="${t.id}">${esc(tr("完成"))}</button>` : ""}
      <button data-td-cmt="${t.id}">💬 ${all.length || ""} ${esc(tr("留言"))}</button>
    </div>
  </div>`;
}

function todoSection(title, list, cls) {
  if (!list.length) return "";
  return `<div class="td-sec ${cls || ""}">${esc(title)} <i>${list.length}</i></div>` + list.map(todoCard).join("");
}

function todoHtml() {
  const me = S.user.login;
  const f = S.todoFilter || (canAssign() ? "all" : "mine");
  const openAll = TODOS.filter((t) => t.status !== "done");
  const mineOpen = openAll.filter((t) => t.owner === me);
  const lateAll = TODOS.filter(overdue);
  const weekOf = (t) => t.status !== "done" && !!t.due && daysLeft(t.due) >= 0 && daysLeft(t.due) <= 7;
  const match = (t) => {
    if (f.startsWith("p:")) return t.owner === f.slice(2);
    if (f === "need") return t.owner === me && t.status !== "done" && !reportedToday(t);
    if (f === "late") return overdue(t);
    if (f === "done") return t.status === "done";
    if (f === "week") return weekOf(t);
    if (t.status === "done") return f === "all";
    if (f === "mine") return t.owner === me;
    if (f === "made") return t.creator === me;
    if (f === "company") return t.scope === "company";
    return true;
  };
  const list = TODOS.filter(match);
  const byDue = (a, b) => (a.due || "9999-12-31").localeCompare(b.due || "9999-12-31");
  const need = list.filter((t) => t.status !== "done" && t.owner === me && !reportedToday(t));
  const rest0 = list.filter((t) => !need.includes(t));
  const imp = rest0.filter((t) => t.status !== "done" && t.imp).sort(byDue);
  const rest = rest0.filter((t) => t.status !== "done" && !t.imp && !need.includes(t));
  const late = rest.filter((t) => t.due && daysLeft(t.due) < 0).sort(byDue);
  const today = rest.filter((t) => t.due && daysLeft(t.due) === 0);
  const soon = rest.filter((t) => t.due && daysLeft(t.due) > 0).sort(byDue);
  const none = rest.filter((t) => !t.due);
  const fin = list.filter((t) => t.status === "done");

  const cnt = (k) => k === "all" ? TODOS.length
    : k === "done" ? TODOS.length - openAll.length
      : k === "late" ? lateAll.length
        : k === "mine" ? mineOpen.length
          : k === "made" ? TODOS.filter((t) => t.creator === me && t.status !== "done").length
            : k === "company" ? openAll.filter((t) => t.scope === "company").length : 0;
  const chip = ([k, label]) => `<button class="td-chip${f === k ? " on" : ""}" data-td-filter="${k}">${esc(tr(label))}<i>${cnt(k)}</i></button>`;

  const needN = needReport().length;
  const myLate = mineOpen.filter(overdue).length;
  const kpi = [
    [tr("我负责"), mineOpen.length, tr("在办"), "mine", false],
    [tr("今天未汇报"), needN, needN ? tr("今天还没报") : tr("都报过了"), "need", needN > 0],
    [tr("已逾期"), myLate, myLate ? tr("尽快处理") : tr("没有逾期"), "late", myLate > 0],
    [tr("7 天内到期"), mineOpen.filter(weekOf).length, tr("含今天"), "week", false],
  ].map(([t, n, s, k, bad]) =>
    `<button class="${bad ? "bad " : ""}${f === k ? "on" : ""}" data-td-filter="${k}"><span>${esc(t)}</span><b>${n}</b><span>${esc(s)}</span></button>`).join("");

  /* 主动性：自己给自己排的任务 + 连续汇报天数 */
  const selfN = TODOS.filter((t) => t.self_set && t.status !== "done" && t.owner === me).length;
  const streak = reportStreak();
  const selfbar = `<div class="td-selfbar">
      <span>🌱 ${esc(tr("我给自己排了"))} <b>${selfN}</b> ${esc(tr("项"))}</span>
      <span>${streak ? `🔥 ${esc(tr("连续汇报"))} <b>${streak}</b> ${esc(tr("天"))}` : esc(tr("今天报一项，开始连击"))}</span>
      <button data-td-filter="mine">${esc(tr("看我的"))} →</button></div>`;

  const body = imp.length + late.length + today.length + soon.length + none.length + fin.length + need.length
    ? todoSection("📝 " + tr("今天还没汇报"), need, "need") +
      todoSection("★ " + tr("重要"), imp) + todoSection("⚠ " + tr("已逾期"), late, "late") +
      todoSection(tr("今天到期"), today) + todoSection(tr("接下来"), soon) +
      todoSection(tr("无截止"), none) + todoSection("✓ " + tr("已完成"), fin, "done")
    : `<div class="card"><div class="empty">${esc(tr(f === "all" ? "还没有待办，点右下角「＋」记一条。" : "这个筛选下没有内容。"))}</div></div>`;

  const lm = lateForMe();
  const banner = lm.length
    ? `<div class="td-alert">⚠ ${lm.length} ${esc(tr("条已逾期"))} · ${esc(tr("最久"))} ${Math.max(...lm.map((t) => -daysLeft(t.due)))} ${esc(tr("天"))}
        <button data-td-filter="late">${esc(tr("看已逾期"))} →</button></div>`
    : "";
  const who = f.startsWith("p:") ? `<div class="td-who-bar">${esc(tr("正在看"))} ${esc(nameOf(f.slice(2)))} ${esc(tr("的任务"))}
      <button data-td-filter="all">${esc(tr("看全部"))}</button></div>` : "";
  return statsBoard(f) + banner + `<div class="td-sec">👤 ${esc(tr("我的今天"))}</div><div class="td-kpi">${kpi}</div>${selfbar}
    <div class="td-filters">${TODO_FILTERS.map(chip).join("")}</div>${who}` + body +
    `<button class="fin-fab" id="td_new">＋ ${esc(tr("新待办"))}</button>`;
}

const nameOf = (login) => {
  const p = TPEOPLE.find((x) => x.login === login);
  const t = TODOS.find((x) => x.owner === login);
  return (p && p.name) || (t && t.owner_name) || login;
};

/* 置顶统计：谁手上还有多少事（未完成 / 未跟踪 / 逾期）。所有人都看得见，自己排第一个 */
function statsBoard(f) {
  const me = S.user.login;
  const agg = {};
  for (const t of TODOS) {
    if (t.status === "done" || !t.owner) continue;
    const p = agg[t.owner] = agg[t.owner] || { login: t.owner, name: t.owner_name || nameOf(t.owner), open: 0, need: 0, late: 0 };
    p.open++;
    if (!reportedToday(t)) p.need++;
    if (overdue(t)) p.late++;
  }
  const rows = Object.values(agg);
  if (!agg[me]) rows.push({ login: me, name: S.user.name || me, open: 0, need: 0, late: 0 });
  rows.sort((a, b) => (a.login === me ? -1 : b.login === me ? 1 : b.need - a.need || b.open - a.open));
  const tot = rows.reduce((s, r) => ({ open: s.open + r.open, need: s.need + r.need }), { open: 0, need: 0 });
  const rowsHtml = rows.map((r) => {
    const k = r.login === me ? "mine" : "p:" + r.login;
    return `<button class="td-brow${r.login === me ? " me" : ""}${f === k ? " on" : ""}" data-td-filter="${esc(k)}">
        <i>${esc(String(r.name).trim().slice(0, 1))}</i>
        <b>${esc(r.name)}${r.login === me ? `<em>${esc(tr("我"))}</em>` : ""}</b>
        <span class="td-num">${esc(tr("未完成"))} <b>${r.open}</b></span>
        <span class="td-num${r.need ? " bad" : ""}">${esc(tr("未跟踪"))} <b>${r.need}</b></span>
        ${r.late ? `<span class="td-num late">${esc(tr("逾期"))} <b>${r.late}</b></span>` : ""}
      </button>`;
  }).join("");
  return `<div class="td-board">
      <div class="td-board-h">👥 ${esc(tr("谁手上还有多少事"))}
        <span>${esc(tr("未完成"))} ${tot.open} · ${esc(tr("未跟踪"))} ${tot.need}</span></div>
      <div class="td-board-list">${rowsHtml}</div></div>`;
}

function bindTodo() {
  const pane = $("#pane");
  if ($("#td_new")) $("#td_new").onclick = () => todoSheet(null);
  pane.querySelectorAll("[data-td-filter]").forEach((b) => b.onclick = () => { S.todoFilter = b.dataset.tdFilter; render(); });
  pane.querySelectorAll("[data-td-edit]").forEach((b) => b.onclick = () => todoSheet(TODOS.find((t) => t.id === b.dataset.tdEdit)));
  pane.querySelectorAll("[data-td-cmt]").forEach((b) => b.onclick = () => { TD_OPEN[b.dataset.tdCmt] = !TD_OPEN[b.dataset.tdCmt]; render(); });
  pane.querySelectorAll("[data-td-star]").forEach((b) => b.onclick = () => todoPatch(b.dataset.tdStar, { imp: (TODOS.find((t) => t.id === b.dataset.tdStar) || {}).imp ? 0 : 1 }));
  pane.querySelectorAll("[data-td-done]").forEach((b) => b.onclick = () => {
    const t = TODOS.find((x) => x.id === b.dataset.tdDone);
    todoPatch(t.id, { status: t.status === "done" ? "doing" : "done" });
  });
  pane.querySelectorAll("[data-td-report]").forEach((b) => b.onclick = () => tdReport(TODOS.find((x) => x.id === b.dataset.tdReport)));
  pane.querySelectorAll("[data-td-fin]").forEach((b) => b.onclick = () => todoPatch(b.dataset.tdFin, { status: "done" }));
  pane.querySelectorAll("[data-td-send]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.tdSend;
    const inp = pane.querySelector(`[data-td-input="${id}"]`);
    const text = (inp && inp.value || "").trim();
    if (!text) { toast(tr("写点内容再发"), "bad"); return; }
    try { await api("/todos/" + encodeURIComponent(id) + "/notes", { method: "POST", body: { text }, quiet: true }); await loadTodos(); render(); }
    catch (e) { toast(e.message, "bad"); }
  });
}

async function todoPatch(id, patch) {
  try { await api("/todos/" + encodeURIComponent(id), { method: "PATCH", body: patch, quiet: true }); await loadTodos(); render(); }
  catch (e) { toast(e.message, "bad"); }
}

/* 每日汇报：三下五除二 —— 推进了 / 卡住了 / 今天没动，点一下就算报过；想细说再写字 */
function tdReport(t) {
  if (!t) return;
  const quick = [["progress", "🟢 推进了", "今天做到哪一步"], ["blocked", "🟠 卡住了", "卡在哪，需要谁支持"], ["idle", "⚪ 今天没动", "今天没排上，明天做"]];
  document.body.insertAdjacentHTML("beforeend", `<div class="fd-dim" id="tdr_dim"></div>
    <div class="fd-sheet" id="td_report">
      <div class="fd-sh"><h3>📝 ${esc(tr("汇报进展"))} · ${esc(t.title)}</h3><button id="tdr_x">${esc(tr("取消"))}</button></div>
      <div class="mut" style="font-size:12.5px;margin-bottom:8px">${esc(tr("点一下就记下今天报过了；有细节就顺手写一句。老板和同事都看得见。"))}</div>
      <div class="td-quick">${quick.map(([k, label, ph]) =>
        `<button data-tdr-flag="${k}"><b>${esc(tr(label))}</b><span>${esc(tr(ph))}</span></button>`).join("")}</div>
      <label>${esc(tr("说一句（选填）"))}</label>
      <textarea id="tdr_text" maxlength="1000" placeholder="${esc(tr("做了什么、卡在哪、预计什么时候能完"))}"></textarea>
      <div class="err" id="tdr_err"></div>
      <div class="acts" style="margin-top:10px"><button class="pri" id="tdr_ok">${esc(tr("提交"))}</button><button id="tdr_cancel">${esc(tr("取消"))}</button></div>
    </div>`);
  const close = () => { ["tdr_dim", "td_report"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); };
  $("#tdr_x").onclick = close;
  $("#tdr_cancel").onclick = close;
  $("#tdr_dim").onclick = close;
  const send = async (flag) => {
    const text = $("#tdr_text").value.trim();
    try {
      await api("/todos/" + encodeURIComponent(t.id) + "/report", { method: "POST", body: { text, flag }, quiet: true });
      close();
      toast(tr("已上报，今天这项算报了"));
      await loadTodos();
      render();
    } catch (e) { $("#tdr_err").textContent = e.message; }
  };
  document.querySelectorAll("[data-tdr-flag]").forEach((b) => b.onclick = () => send(b.dataset.tdrFlag));
  /* 直接点「提交」= 有推进（正文可选） */
  $("#tdr_ok").onclick = () => send("progress");
  if ($("#tdr_text")) $("#tdr_text").focus();
}

/* 每日提醒：逾期 + 今天还没汇报的，每天第一次打开工作台弹一张；管理层多看一行「谁还没报」 */
function maybeLateAlert() {
  if (!S.user || document.getElementById("td_alert")) return;
  const lm = lateForMe();
  const nr = needReport();
  const byOwner = {};
  if (canAssign()) {
    for (const t of TODOS) {
      if (t.status === "done" || !t.owner || t.owner === S.user.login || reportedToday(t)) continue;
      const p = byOwner[t.owner] = byOwner[t.owner] || { name: t.owner_name || nameOf(t.owner), n: 0 };
      p.n++;
    }
  }
  const team = Object.values(byOwner).sort((a, b) => b.n - a.n);
  if (!lm.length && !nr.length && !team.length) return;
  const key = "tdal_" + S.user.login + "_" + iso(new Date());
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  const line = (t, right) => `<div class="td-al-line"><b>${esc(t.title)}</b><span class="${right.cls}">${right.txt}</span></div>`;
  const lateRows = lm.slice(0, 5).map((t) => line(t, { cls: "td-late", txt: `${-daysLeft(t.due)} ${tr("天")}` })).join("");
  const needRows = nr.slice(0, 5).map((t) => line(t, {
    cls: reportAge(t) >= 2 ? "td-late" : "mut",
    txt: reportAge(t) ? `${reportAge(t)} ${tr("天没汇报")}` : tr("今天还没汇报"),
  })).join("");
  const teamRows = team.map((p) => `<div class="td-al-line"><b>${esc(p.name)}</b><span class="td-late">${p.n} ${esc(tr("项没汇报"))}</span></div>`).join("");
  const head = nr.length ? `📝 ${tr("今天还没汇报")} ${nr.length} ${tr("项")}`
    : lm.length ? `⚠ ${lm.length} ${tr("条已逾期")}`
      : `👀 ${team.length} ${tr("位同事今天还没汇报")}`;
  document.body.insertAdjacentHTML("beforeend", `<div class="fd-dim" id="tda_dim"></div>
    <div class="fd-sheet" id="td_alert">
      <div class="fd-sh"><h3>${esc(head)}</h3></div>
      <div class="mut" style="font-size:13px">${esc(tr(nr.length
        ? "点一下「今天没动」也算报过，别攒着。"
        : "这些过了截止日期还没交，今天处理一下。"))}</div>
      ${nr.length ? `<div class="td-al-sub">${esc(tr("今天还没汇报"))}</div><div class="td-al-list">${needRows}${nr.length > 5 ? `<div class="mut">+${nr.length - 5}</div>` : ""}</div>` : ""}
      ${lm.length ? `<div class="td-al-sub">${esc(tr("已逾期"))}</div><div class="td-al-list">${lateRows}${lm.length > 5 ? `<div class="mut">+${lm.length - 5}</div>` : ""}</div>` : ""}
      ${team.length ? `<div class="td-al-sub">${esc(tr("同事今天还没汇报"))}</div><div class="td-al-list">${teamRows}</div>` : ""}
      <div class="acts" style="margin-top:12px"><button class="pri" id="tda_go">${esc(tr(nr.length ? "去汇报" : "去处理"))}</button><button id="tda_ok">${esc(tr("知道了"))}</button></div>
    </div>`);
  const mark = () => { try { localStorage.setItem(key, "1"); } catch (e) {} };
  const close = () => { ["tda_dim", "td_alert"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); };
  $("#tda_ok").onclick = () => { mark(); close(); };
  $("#tda_dim").onclick = () => { mark(); close(); };
  $("#tda_go").onclick = async () => { mark(); close(); S.todoFilter = nr.length ? "need" : "late"; await enterApp("todo"); };
}

const coIn = (id, label, val, opts = {}) =>
  `<div${opts.wide ? ' style="grid-column:1/-1"' : ""}><label>${esc(tr(label))}</label>
    <input id="${id}" value="${esc(val == null ? "" : val)}"${CO.edit ? "" : " readonly"}${opts.type ? ` type="${opts.type}"` : ""}${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ""}></div>`;

function coPendRefresh() {
  const box = $("#co_pend_list");
  if (!box) return;
  box.innerHTML = CO.pending.map(coPendRow).join("");
  box.hidden = !CO.pending.length;
  bindPendDel();
}

function bindPendDel() {
  document.querySelectorAll("[data-pdel]").forEach((b) => {
    b.onclick = (ev) => { ev.preventDefault(); CO.pending.splice(Number(b.dataset.pdel), 1); coPendRefresh(); };
  });
}

const coKB = (n) => { const s = Number(n) || 0; return s > 1048576 ? (s / 1048576).toFixed(1) + " MB" : s ? Math.round(s / 1024) + " KB" : ""; };

async function coUploadDoc(cid, f) {
  if (f.size > 25 * 1024 * 1024) throw new Error(tr("文件太大（限 25MB）"));
  const data = await new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result);
    rd.onerror = () => rej(new Error(tr("读取失败")));
    rd.readAsDataURL(f);
  });
  const mime = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "image/jpeg");
  const r = await api("/companies/" + cid + "/doc", {
    method: "POST", quiet: true,
    body: { data, name: f.name, mime, label: f.name.replace(/\.[^.]+$/, "") },
  });
  return r.docs;
}

function coPendRow(f, i) {
  const pdf = /\.pdf$/i.test(f.name) || /pdf/i.test(f.type || "");
  return `<div class="co-doc">
      <span class="co-ic">${pdf ? "📄" : "🖼"}</span>
      <span style="flex:1;display:grid;gap:1px;min-width:0">
        <b style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</b>
        <i style="font-style:normal;font-size:11px;color:var(--mut)">${esc(coKB(f.size))}${esc(tr("· 保存后自动上传"))}</i></span>
      <button class="ghost co-dx" data-pdel="${i}" type="button" title="${esc(tr("移除"))}">×</button>
    </div>`;
}

function coDocRow(d, cid) {
  const pdf = /pdf/i.test(d.mime || "");
  const size = Number(d.size) || 0;
  const kb = size > 1048576 ? (size / 1048576).toFixed(1) + " MB" : size ? Math.round(size / 1024) + " KB" : "";
  return `<div class="co-doc">
      <span class="co-ic">${pdf ? "📄" : "🖼"}</span>
      <a href="/api/companies/${esc(cid)}/doc/${esc(d.k)}" target="_blank" rel="noopener">
        <b>${esc(d.label || d.name || d.k)}</b>
        <i>${esc(d.name || "")}${kb ? " · " + kb : ""}${d.at ? " · " + esc(d.at) : ""}</i></a>
      ${CO.edit ? `<button class="ghost co-dx" data-codel="${esc(d.k)}" type="button" title="${esc(tr("删除"))}">×</button>` : ""}
    </div>`;
}

function companyHtml() {
  if (CO.cur || CO.edit) return coDetailHtml(CO.cur || { shareholders: [], directors: [] });
  return coListHtml();
}

function coReadForm() {
  const v = (id) => { const el = $("#" + id); return el ? el.value.trim() : ""; };
  const rows = (sel, cols) => [...document.querySelectorAll(sel + " tr")].map((tr) => {
    const o = {};
    cols.forEach((k) => { const el = tr.querySelector('[data-f="' + k + '"]'); o[k] = el ? el.value.trim() : ""; });
    o.amount = Number(o.amount) || 0;
    return o;
  }).filter((x) => x.name);
  return {
    name: v("co_name"), name_en: v("co_name_en"), reg_no: v("co_reg_no"), reg_date: v("co_reg_date"),
    tpin: v("co_tpin"), address: v("co_addr"), phone: v("co_phone"), email: v("co_email"),
    share_capital: Number(v("co_cap")) || 0, currency: v("co_cur") || "ZMW",
    notes: v("co_notes"), tags: v("co_tags"),
    shareholders: rows("#co_sh", ["name", "nationality", "id_no", "amount"]),
    directors: rows("#co_dir", ["name", "nationality", "id_no", "role"]),
  };
}

function bindCompany(pane) {
  const go = (fn) => (e) => { e.preventDefault(); fn(); };
  if ($("#co_q")) {
    const run = () => { CO.q = $("#co_q").value.trim(); loadCompanies().then(render).catch((e) => toast(e.message, "bad")); };
    $("#co_q").onkeydown = (e) => { if (e.key === "Enter") run(); };
    $("#co_q").onchange = run;
  }
  if ($("#co_q_toggle")) $("#co_q_toggle").onclick = go(() => { CO.showSearch = !CO.showSearch; render(); });
  if ($("#co_q_go")) $("#co_q_go").onclick = go(() => {
    CO.q = ($("#co_q").value || "").trim();
    loadCompanies().then(render).catch((e) => toast(e.message, "bad"));
  });
  if ($("#co_q_clear")) $("#co_q_clear").onclick = go(() => {
    CO.q = "";
    loadCompanies().then(render).catch((e) => toast(e.message, "bad"));
  });
  if ($("#co_new")) $("#co_new").onclick = go(() => { CO.cur = null; CO.edit = true; CO.imp = false; CO.pending = []; render(); });
  if ($("#co_imp_btn")) $("#co_imp_btn").onclick = go(() => { CO.imp = !CO.imp; render(); });
  if ($("#co_imp_cancel")) $("#co_imp_cancel").onclick = go(() => { CO.imp = false; render(); });
  if ($("#co_imp_demo")) $("#co_imp_demo").onclick = go(() => {
    const ta = $("#co_json");
    if (ta) {
      ta.value = JSON.stringify([
        { name: "ABC Mining Ltd", name_en: "ABC Mining Limited", reg_no: "120200012345", reg_date: "2020-05-12", tpin: "1001234567",
          address: "Plot 12, Great East Road, Lusaka", phone: "+260 97 000 0000", share_capital: 500000,
          shareholders: [{ name: "Zhang San", nationality: "China", id_no: "P1234567", amount: 400000 },
            { name: "Local Partner", nationality: "Zambia", id_no: "123456/11/1", amount: 100000 }],
          directors: [{ name: "Zhang San", nationality: "China", role: "Director" }], notes: "" },
      ], null, 2);
    }
  });
  if ($("#co_imp_go")) $("#co_imp_go").onclick = go(async () => {
    let arr;
    try { arr = JSON.parse($("#co_json").value); } catch (e) { return toast(tr("JSON 格式不对"), "bad"); }
    if (!Array.isArray(arr)) return toast(tr("要一个数组"), "bad");
    try {
      const r = await api("/companies/bulk", { method: "POST", body: { companies: arr } });
      CO.imp = false;
      await loadCompanies();
      render();
      toast(tr("已导入") + " " + r.added);
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_doc_up")) $("#co_doc_up").onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f || !CO.cur) return;
    try {
      CO.cur.docs = await coUploadDoc(CO.cur.id, f);
      render();
      toast(tr("已上传") + " " + f.name);
    } catch (e) { toast(e.message, "bad"); }
  };
  if ($("#co_doc_pick")) $("#co_doc_pick").onchange = (ev) => {
    for (const f of [...(ev.target.files || [])]) {
      if (CO.pending.some((x) => x.name === f.name && x.size === f.size)) continue;
      CO.pending.push(f);
    }
    ev.target.value = "";
    coPendRefresh();
  };
  bindPendDel();
  pane.querySelectorAll("[data-codel]").forEach((b) => {
    b.onclick = async (ev) => {
      ev.preventDefault();
      if (!CO.cur || !confirm(tr("删除这份资料？"))) return;
      try {
        const r = await api("/companies/" + CO.cur.id + "/doc?k=" + encodeURIComponent(b.dataset.codel),
          { method: "DELETE", quiet: true });
        CO.cur.docs = r.docs;
        render();
        toast(tr("已删除"));
      } catch (e) { toast(e.message, "bad"); }
    };
  });
  pane.querySelectorAll("[data-co]").forEach((b) => {
    b.onclick = () => { CO.cur = CO.list.find((x) => x.id === b.dataset.co) || null; CO.edit = false; render(); };
  });
  if ($("#co_back")) $("#co_back").onclick = go(() => { CO.cur = null; CO.edit = false; CO.pending = []; render(); });
  if ($("#co_edit")) $("#co_edit").onclick = go(() => { CO.edit = true; render(); });
  if ($("#co_cancel")) $("#co_cancel").onclick = go(() => { CO.edit = false; render(); });
  if ($("#co_save")) $("#co_save").onclick = go(async () => {
    const data = coReadForm();
    if (!data.name) return toast(tr("公司名必填"), "bad");
    const isNew = !(CO.cur && CO.cur.id);
    try {
      const r = isNew
        ? await api("/companies", { method: "POST", body: data })
        : await api("/companies/" + CO.cur.id, { method: "PATCH", body: data });
      CO.cur = r.company;
      CO.edit = false;
      let up = 0, bad = [];
      if (isNew && (CO.pending || []).length) {
        for (const f of CO.pending) {
          try { CO.cur.docs = await coUploadDoc(CO.cur.id, f); up++; } catch (e) { bad.push(f.name); }
        }
        CO.pending = [];
      }
      await loadCompanies();
      render();
      if (up) toast(tr("已保存") + "，" + tr("资料") + " " + up + " " + tr("份已上传"));
      else toast(tr("已保存"));
      if (bad.length) toast(bad.length + " " + tr("份资料上传失败") + "：" + bad.join("、"), "bad");
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_del")) $("#co_del").onclick = go(async () => {
    if (!confirm(tr("确定删除") + "「" + CO.cur.name + "」？")) return;
    try {
      await api("/companies/" + CO.cur.id, { method: "DELETE" });
      CO.cur = null;
      await loadCompanies();
      render();
      toast(tr("已删除"));
    } catch (e) { toast(e.message, "bad"); }
  });
  if ($("#co_add_sh")) $("#co_add_sh").onclick = go(() => $("#co_sh").insertAdjacentHTML("beforeend", coShRow()));
  if ($("#co_add_dir")) $("#co_add_dir").onclick = go(() => $("#co_dir").insertAdjacentHTML("beforeend", coDirRow()));
  ["#co_sh", "#co_dir"].forEach((sel) => {
    const tb = $(sel);
    if (tb) tb.onclick = (e) => { const b = e.target.closest(".co-x"); if (b) b.closest("tr").remove(); };
  });
}
