<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>ECOBOX 工作台</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ECOBOX">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
:root{--bg:#f4f5f6;--card:#fff;--card2:#fafbfb;--chip:#eceeef;--ink:#111827;--mut:#6b7280;--line:#e2e5e8;--teal:#111111;--teal2:#111111;--tealsoft:#111111;--tealborder:#111111;--bar:#000;--good:#047857;--blue:#1d4ed8;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
a{color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 90px}
.bar{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -12px 12px}
.bar b{font-size:16px}
.bar .sp{flex:1}
.fin-acct .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fin-acct .row label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.fin-acct .bl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.fin-acct .bl-row:last-of-type{border-bottom:0}
.fin-acct .bl-row>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-acct .bl-amt{font-weight:600;white-space:nowrap}
.fin-acct .bl-row button{padding:2px 8px;font-size:12px}
.fin-acct .bl-add{display:grid;grid-template-columns:1fr 1.1fr 84px 1.4fr auto;gap:6px;margin:6px 0 2px}
.fin-acct .bl-add input,.fin-acct .bl-add select{padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit;min-width:0}
@media(max-width:520px){.fin-acct .bl-add{grid-template-columns:1fr 1fr;}}
.fin-acct .bd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fin-acct .bd-head .acts2{display:flex;align-items:center;gap:8px}
.fin-acct .bd-head button{padding:4px 10px;font-size:12px}
.fin-acct.bd-card{margin-bottom:6px}
.fin-acct.bd-card .fin-list{border-top:1px solid var(--line);margin-top:6px}
.fin-acct .row input,.fin-acct .row select{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit}
@media(max-width:520px){.fin-acct .row{grid-template-columns:1fr}}
.bar .fsbtn{display:none;padding:5px 9px;border-radius:8px;color:var(--mut);font-size:15px;line-height:1}
@media(max-width:820px){.bar .fsbtn{display:inline-flex;align-items:center}}
.chip{font-size:12px;color:var(--mut);background:var(--chip);border-radius:999px;padding:3px 9px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
nav button{flex:0 0 auto;border-radius:999px;padding:7px 14px;color:var(--mut)}
nav button.on{background:var(--tealsoft);border-color:var(--tealborder);color:var(--teal2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.kpi b{font-size:22px;letter-spacing:.5px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.row3{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.pill.me{background:var(--tealsoft);color:var(--teal2)}
.pill.fin{background:#fff4e5;color:var(--warn)}
.hide{display:none!important}
#setup,#login{max-width:380px;margin:8vh auto;padding:0 12px}
#setup .card,#login .card{padding:20px}
#setup h1,#login h1{font-size:19px;margin:0 0 4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ok{color:var(--teal2);font-size:13px;min-height:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:18px 0}

/* 待办：卡片列表，手机上单列不横向滚 */
.td-filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.td-rule{font-size:12px;color:var(--mut);margin:6px 0 2px;line-height:1.5}
.td-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.td-chip i{font-style:normal;font-size:11px;font-weight:700;color:inherit;opacity:.6}
.td-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.td-chip.on i{opacity:.85}
/* 顶部四个数：跟费用记录一个样子 */
.td-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.td-kpi>button{display:block;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;min-height:0}
.td-kpi>button span{display:block;font-size:11.5px;color:var(--mut);line-height:1.35}
.td-kpi>button b{display:block;font-size:19px;line-height:1.15;margin:1px 0;font-weight:700}
.td-kpi>button.bad b{color:var(--bad)}
.td-kpi>button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.td-kpi>button.on span{color:rgba(255,255,255,.72)}
@media(max-width:640px){.td-kpi{grid-template-columns:repeat(2,1fr)}}
.td-sec{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.td-sec i{font-style:normal;background:var(--chip);border-radius:999px;padding:0 6px;font-weight:600;color:var(--ink)}
.td-sec.late{color:var(--bad)}
.td-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:inset 3px 0 0 #e5e7eb}
.td-card.late{box-shadow:inset 3px 0 0 var(--bad)}
.td-card.done{box-shadow:inset 3px 0 0 var(--good);opacity:.62}
.td-row{display:flex;align-items:flex-start;gap:10px}
.td-check{flex:none;width:22px;height:22px;border:2px solid #cbd5e1;border-radius:6px;background:#fff;color:#fff;font-size:12px;line-height:1;padding:0;cursor:pointer}
.td-check.on{background:var(--good);border-color:var(--good)}
.td-mid{flex:1;min-width:0}
.td-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.td-card.done .td-title{text-decoration:line-through;color:var(--mut)}
.td-meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.td-who{display:inline-flex;align-items:center;gap:5px}
.td-who i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.td-who.none{opacity:.7}
.td-due{display:inline-flex;align-items:center;gap:3px}
.td-due.late{color:var(--bad);font-weight:600}
.td-due.today{color:#b45309;font-weight:600}
.td-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.td-body{font-size:13px;color:#374151;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.td-ops{display:flex;flex:none;gap:2px}
.td-ops button{background:transparent;border:0;color:var(--mut);font-size:12px;padding:4px 5px;cursor:pointer}
.td-ops button.on{color:#f59e0b}
.td-ops button.danger{color:var(--bad)}
.td-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:6px}
.td-foot button{font-size:12px;padding:4px 10px}
.td-log{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.td-note-line{font-size:12.5px;color:#374151;margin-bottom:3px;overflow-wrap:anywhere}
.td-note-line b{margin-right:4px}
.td-cin{display:flex;gap:6px;margin-top:6px}
.td-cin input{flex:1;min-width:0}
.td-cin button{font-size:12px;padding:4px 10px}
/* 附件 */
.td-atts{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.td-atts-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.td-att-add{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.td-att{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12.5px}
.td-att-ic{flex:none;font-size:14px}
.td-att a{flex:1;min-width:0;display:grid;text-decoration:none;color:var(--ink)}
.td-att a b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-att a i{font-style:normal;font-size:11px;color:var(--mut)}
.td-att-x{flex:none;background:transparent;border:0;color:var(--mut);font-size:16px;line-height:1;padding:0 4px}
.td-attn{font-size:12px;color:var(--mut);align-self:center}
.td-imp{background:#fef3c7;color:#b45309}
.td-co{background:#e0e7ff;color:#1d4ed8}
.td-self{background:#dcfce7;color:#15803d}
/* 汇报状态：今天报过 = 绿；N 天没报 = 橙/红 */
.td-rep{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:#fef3c7;color:#b45309}
.td-rep.ok{background:#dcfce7;color:#15803d}
.td-rep.bad{background:#fee2e2;color:var(--bad)}
.td-flag{font-style:normal;font-weight:600;margin-right:5px}
.td-flag-blocked{color:#b45309}
.td-flag-idle{color:#6b7280}
.td-flag-progress{color:#0f766e}
/* 主动性条：自派任务 + 连续汇报 */
.td-selfbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:8px 12px;font-size:12.5px;margin:0 0 10px}
.td-selfbar b{font-size:14px}
.td-selfbar button{margin-left:auto;background:#166534;color:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
/* 督导：按人看谁没汇报 */
.td-board{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 10px}
.td-board-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 0 6px}
.td-board-h span{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.td-board-list{display:grid;gap:2px}
@media(min-width:820px){.td-board-list{grid-template-columns:1fr 1fr;column-gap:12px}}
.td-brow{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:6px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
.td-brow:hover{background:var(--chip)}
.td-brow.on{background:var(--chip);box-shadow:inset 0 0 0 1px var(--ink)}
.td-brow i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--ink);font-style:normal;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.td-brow.me i{background:var(--ink);color:#fff}
.td-brow>b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-brow>b em{font-style:normal;font-size:11px;color:var(--mut);margin-left:3px}
.td-num{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.td-num+.td-num{margin-left:8px}
.td-num b{font-weight:700;color:var(--ink)}
.td-num.bad b{color:var(--bad)}
.td-num.late b{color:#b45309}
.td-who-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:0 0 8px}
.td-who-bar button{margin-left:auto;font-size:12px;padding:3px 10px}
/* 汇报弹层：三个一键按钮 */
.td-quick{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin:4px 0 10px}
.td-quick button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.td-quick button b{font-size:13px;color:var(--ink)}
.td-quick button span{font-size:11.5px;color:var(--mut)}
.td-quick button:active{background:var(--chip)}
@media(max-width:640px){.td-quick{grid-template-columns:1fr}.td-quick button{flex-direction:row;align-items:center;gap:8px}}
.td-al-sub{font-size:12px;font-weight:700;color:var(--mut);margin-top:10px}
.td-impbox{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
#td_sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#td_sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
#td_sheet input,#td_sheet select,#td_sheet textarea{width:100%;font-size:16px}
/* 逾期：顶部红条 + 首页卡片红点 + 每日弹窗 */
.td-alert{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#fef2f2;border:1px solid #fecaca;color:var(--bad);font-weight:600;font-size:13.5px;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.td-alert button{margin-left:auto;background:var(--bad);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.td-dot{display:inline-block;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;padding:0 6px;vertical-align:middle}
.td-go{color:#b45309;font-style:normal;font-weight:600}
.td-fb{margin:4px 0 2px;background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:6px 9px;font-size:12.5px;color:#3f3f46;white-space:pre-wrap;overflow-wrap:anywhere}
.td-al-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.td-al-line{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;padding:4px 0}
.td-al-line b{font-weight:600;overflow-wrap:anywhere}
.td-al-line .td-late{margin-left:auto;flex:none;font-weight:700}
#td_report textarea,#td_alert{min-height:0}
#td_report textarea{width:100%;min-height:96px;font-size:16px}

/* 人员：卡片式列表，桌面多列、手机单列（不吃表格横向滚动） */
.ulist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ucard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.ucard .uhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ucard .uname{font-weight:600;font-size:14.5px}
.ucard .uacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ucard .uacts>button{flex:0 0 auto;padding:6px 10px;font-size:13px}
@media(max-width:640px){
  .ulist{grid-template-columns:1fr}
  .ucard .uacts>button{flex:1 1 40%;min-height:38px}
}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.mod{display:block;width:100%;text-align:left;font:inherit;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px}
.mod:hover{border-color:var(--tealborder)}
.mod:active{background:var(--card2)}
.mod i{font-style:normal;font-size:21px;display:block;margin-bottom:6px;line-height:1}
.mod b{display:block;font-size:14.5px;font-weight:600}
.mod span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.sec{margin:18px 0 8px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.6px}
.hello{margin:4px 0 2px;font-size:15px}
/* 目录磁贴：未开放的模块 */
.mod.soon{opacity:.55;cursor:default;position:relative}
.mod.soon em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--mut)}
.mod.soon b,.mod.soon span{color:var(--mut)}
/* 目录磁贴：右上角 ☆ 设/取消快捷（置顶） */
.mod.pinable{position:relative}
.mod.pinable b{padding-right:22px}
.mod>.pin{position:absolute;top:3px;right:3px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0;font-size:15px;line-height:1;color:var(--mut);opacity:.5;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.mod>.pin:hover{opacity:1;background:var(--chip)}
.mod>.pin.on{color:#e8a33d;opacity:1}

/* ---------- 财务 ---------- */
.fin-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.fin-kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fin-kpi b{display:block;font-size:17px;margin-top:2px}
.fin-kpi span{font-size:12px;color:var(--mut)}
.fin-bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.fin-bar select{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.fin-list{display:flex;flex-direction:column;gap:8px}
.fin-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.fin-row .d{font-size:12px;color:var(--mut);min-width:44px}
.fin-row .m{flex:1;min-width:0}
.fin-row .m b{font-size:15px}
.fin-row .m p{margin:2px 0 0;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-row .a{text-align:right;font-weight:700;white-space:nowrap}
.fin-row .a small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.fin-row img{width:38px;height:38px;object-fit:cover;border-radius:8px;margin-top:4px;border:1px solid var(--line)}
.fin-out .a{color:var(--bad)}.fin-in .a{color:var(--good)}.fin-float .a{color:var(--blue)}
.fin-transfer .a{color:var(--blue)}
.fin-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:14px;z-index:60;max-height:88vh;overflow:auto}
.fin-sheet h3{margin:0 0 10px;font-size:15px}
.fin-sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.fin-sheet input,.fin-sheet select,.fin-sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card)}
.fin-sheet .r{display:flex;gap:8px}
.fin-sheet .r>*{flex:1}
.fin-sheet .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fin-sheet .ph img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.fin-sheet .ph .pht{position:relative;display:inline-block;line-height:0}
.fin-sheet .ph .pht b{position:absolute;top:-7px;right:-7px;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:#111;color:#fff;font-size:15px;font-weight:400;cursor:pointer;border:1px solid #fff}
.fin-dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
.fin-acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.fin-orph{background:#fff6f4;border:1px solid #f3c6bb;border-radius:12px;padding:10px 12px;margin-bottom:8px;color:#8a2b12}
.fin-orph .acts{display:flex;gap:8px;margin-top:8px}
.fin-orph .acts button{flex:1;min-height:40px}
.fin-acct .n{font-weight:600}
.fin-acct .g{display:flex;gap:8px;margin-top:6px}
.fin-acct .g>div{flex:1}
.fin-acct input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.fin-acct label{font-size:11px;color:var(--mut);display:block}
.fin-acct b{display:block;font-size:17px;margin-top:1px}
.fin-acct small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.fin-acct .acts{display:flex;gap:8px;margin-top:8px}
.fin-acct .acts button{flex:1;min-height:40px}
.fin-seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}

.fin-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fin-acts{display:flex;gap:8px;margin:10px 0}
.fin-acts button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600}
.fin-acts button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.fin-move .a{color:var(--ink)}
.fin-ptab{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fin-ptab::-webkit-scrollbar{display:none}
.fin-ptab button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.fin-ptab button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.req{color:#c62828;font-style:normal;font-weight:700}
.fin-inv{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.fin-inv.y{background:#dcfce7;color:#166534}
.fin-inv.n{background:#eef2f6;color:#64748b}
.fin-inv.w{background:#fef3c7;color:#92400e}
.fin-inv.p{background:#ede9fe;color:#6d28d9}
.fin-inv.l{background:#e0f2fe;color:#075985}
.fin-mark{display:flex;gap:6px;margin-top:8px}
.fin-mark button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--ink)}
.fin-mark button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.fin-mark button.on[data-inv="0"]{background:#94a3b8;border-color:#94a3b8}
.fin-fr{display:grid;grid-template-columns:1fr auto 78px 78px;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.fin-fr>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-fr>b,.fin-fr>i{text-align:right;font-style:normal;font-variant-numeric:tabular-nums}
.fin-fr>i{color:var(--mut);font-weight:500;font-size:12px}
.fin-fr.hd{border-top:none;padding-top:2px;color:var(--mut);font-size:11px}
.fin-fr.tot{border-top:2px solid var(--ink);font-weight:700}
.fin-fr.tot>i{color:var(--ink)}
/* 银行水单 */
.fin-fr.bk{cursor:pointer}
.fin-fr.bk:hover{background:rgba(0,0,0,.03)}
.fin-fr.bdoc{grid-template-columns:1fr auto;row-gap:4px}
.fin-fr.bdoc .bn{font-weight:600;font-size:13px}
.fin-fr.bdoc .acts2{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.fin-fr.bdoc .acts2 button{padding:3px 10px;font-size:12px}
.fin-fr.bk.dim{opacity:.55}
.fin-fr.bks{grid-template-columns:1fr auto;row-gap:4px}
.fin-fr.bks .bn{font-weight:600}
.fin-fr.bks .rt{text-align:right}
.fin-fr.bks .rt b{display:block;font-variant-numeric:tabular-nums}
.fin-fr.bks .rt small{display:block;font-size:11px;color:var(--mut)}
.fin-fr.bks .acts2{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.fin-fr.bks .acts2 button{padding:3px 10px;font-size:12px}
.bk-crumb{display:flex;align-items:center;gap:4px;margin:0 0 10px;flex-wrap:wrap;font-size:13px}
.bk-crumb button{padding:4px 10px;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--ink)}
.fin-acct[data-bkcardopen],.fin-acct[data-bkmonth]{cursor:pointer}
/* 银行数字账单：台账风格，和「原始单据」的档案目录刻意区分 */
.bkd-hero{border-radius:14px;padding:14px 16px;margin:0 0 12px;background:linear-gradient(135deg,#0f172a,#115e59);color:#fff}
.bkd-hero .k{font-size:12px;opacity:.72}
.bkd-hero .n{font-size:16px;font-weight:700;margin-top:2px}
.bkd-hero .g{display:flex;gap:14px;margin-top:10px}
.bkd-hero .g>div{flex:1;min-width:0}
.bkd-hero .g b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkd-hero .g span{font-size:11px;opacity:.72}
.bkd-hero .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#f59e0b;color:#3b2000;margin-left:6px}
.bkd-cards{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.bkd-cards::-webkit-scrollbar{display:none}
.bkd-cards button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.bkd-cards button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bkd-cards button b{color:#f59e0b;margin-left:4px}
.bkd-months{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.bkd-mrow{display:grid;grid-template-columns:78px 1fr auto 12px;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.bkd-mrow:first-child{border-top:none}
.bkd-mrow:hover{background:rgba(15,118,110,.05)}
.bkd-mrow .ym{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bkd-mrow .mid{min-width:0}
.bkd-mrow .bar{height:5px;border-radius:3px;background:#e6ebf1;overflow:hidden}
.bkd-mrow .bar i{display:block;height:100%;background:#0f766e}
.bkd-mrow .bar i.warn{background:#f59e0b}
.bkd-mrow .mid small{display:block;font-size:11px;color:var(--mut);margin-top:4px}
.bkd-mrow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.bkd-mrow .amt small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.bkd-sheet{border:1px solid var(--line);border-left:3px solid #0f766e;border-radius:12px;background:var(--card);padding:12px;margin-bottom:10px}
.bkd-sheet.pend{border-left-color:#f59e0b}
.bkd-sheet.dim{opacity:.6}
.bkd-sheet .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bkd-sheet .top .t{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bkd-sheet .src{font-size:11px;color:var(--mut);max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkd-sheet .pill{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#dcfce7;color:#166534}
.bkd-sheet .pill.pend{background:#fef3c7;color:#92400e}
.bkd-sheet .pill.bad{background:#fee2e2;color:#991b1b}
.bkd-sheet .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 8px}
.bkd-sheet .nums div{min-width:0}
.bkd-sheet .nums span{display:block;font-size:10px;color:var(--mut)}
.bkd-sheet .nums b{display:block;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkd-sheet .nums b.good{color:#0f766e}
.bkd-sheet .nums b.bad{color:#b91c1c}
.bkd-sheet .prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.bkd-sheet .prog .bar{flex:1;height:5px;border-radius:3px;background:#e6ebf1;overflow:hidden}
.bkd-sheet .prog .bar i{display:block;height:100%;background:#0f766e}
.bkd-sheet .prog .bar i.warn{background:#f59e0b}
.bkd-sheet .acts{display:flex;gap:8px;margin-top:10px}
.bkd-sheet .acts button{flex:1;min-height:38px}
.bkd-sheet .acts button.dz{flex:0 0 auto;padding:0 16px;color:#b91c1c;border-color:#f3c6bb}
.bkd-sheet .sub{font-size:11px;color:var(--mut);margin-left:6px;letter-spacing:.02em}
.bkd-sheet .top{align-items:baseline}
.bkd-old{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);margin:2px 0 10px}
.bkd-back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;margin:0 0 10px;color:var(--ink)}
.fin-fr>i.bad{color:#b91c1c;font-weight:600}
.fin-fr>i.ok{color:#0f766e;font-weight:600}
.fin-fr.bad{background:rgba(185,28,28,.05)}
.bk-list{max-height:52vh;overflow:auto}
.bk-tx{border-top:1px solid var(--line);padding:8px 0}
.bk-tx .l1{display:flex;gap:8px;align-items:baseline}
.bk-tx .l1 .d{color:var(--mut);font-size:12px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.bk-tx .l1 .m{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.35}
.bk-tx .l1 b{flex:0 0 auto;font-variant-numeric:tabular-nums}
.bk-tx .l1 b.out{color:#b91c1c}
.bk-tx .l1 b.in{color:#0f766e}
.bk-tx .l2{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.bk-tx .l2 select{max-width:150px}
.bk-tx .l2 em{font-style:normal;font-size:11px}
.bk-tx.ignored{opacity:.5}
.bk-tx.matched{background:rgba(15,118,110,.05)}
.bk-chk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.7;margin:6px 0;font-variant-numeric:tabular-nums}
.bk-chk b{margin-left:8px;white-space:nowrap}
.bk-chk b.ok{color:#0f766e}
.bk-chk.bad{border-color:#fecaca}
.bk-chk.bad b{color:#b91c1c}
.bk-gap{font-style:normal;color:#b91c1c;font-weight:600}
.fin-anabar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fin-anabar button{padding:6px 12px;font-size:12px;border-radius:999px}
.fin-anabar .mut{font-size:11px}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}

/* ---------- 手机适配 ---------- */
.fin-fab{display:flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(15,118,110,.35)}
@media(max-width:640px){
  .wrap{padding:0 10px calc(96px + env(safe-area-inset-bottom))}
  .bar{padding:calc(10px + env(safe-area-inset-top)) 10px 10px;margin:0 -10px 10px;gap:8px;flex-wrap:wrap}
  .bar b{font-size:15px}
  nav{gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 10px;margin:0 -10px 10px}

  nav button{padding:9px 15px;font-size:14px}
  input,select,textarea{font-size:16px;padding:11px 10px}
  button{min-height:42px}
  .row,.row3{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .kpi b{font-size:19px}
  .mods{grid-template-columns:1fr 1fr;gap:8px}
  .mod{padding:12px 10px}
  .mod i{font-size:19px}
  .mod b{font-size:14px}
  .card{padding:12px;border-radius:12px}
  #pane table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  #pane th,#pane td{padding:8px 6px}
  .fin-kpi{gap:8px}
  .fin-acts{flex-wrap:wrap}
  .fin-acts button{flex:1 1 44%}
  .fin-fr{grid-template-columns:1fr 62px 60px 60px;font-size:12px}
  .fin-kpi b{font-size:16px}
  .fin-bar{flex-wrap:wrap;gap:8px}
  .fin-bar select{font-size:16px;padding:10px}
  #fin_addbar{display:none}
  .fin-fab{display:flex}
  .fin-row{padding:11px 10px;gap:8px}
  .fin-row .m b{font-size:15px}
  .fin-row .a{font-size:15px}
  .fin-row img{width:46px;height:46px}
  .fin-row .d{min-width:40px;font-size:12px}
  .fin-acct{padding:12px}
  .fin-acct .g{gap:10px}
  .fin-seg button{font-size:16px}
  .fin-acts button{font-size:15px;min-height:46px}
  .fin-sheet{padding:14px 14px calc(16px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fin-sheet button{min-height:46px}
  .fin-sheet input,.fin-sheet select,.fin-sheet textarea{font-size:16px;padding:11px 10px}

}
@media(max-width:380px){.fin-kpi{grid-template-columns:1fr}.mods{grid-template-columns:1fr}}

#back{margin:0 2px 0 -4px;padding:6px 10px;font-size:18px;line-height:1;border-color:transparent}
/* 应用页进场：像新开了一页，不是原地换内容 */
@keyframes paneIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#pane.page-in{animation:paneIn .18s ease-out}
@media(prefers-reduced-motion:reduce){#pane.page-in{animation:none}}
button.chip{border:1px solid var(--line);background:var(--chip);color:var(--mut);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip:active{background:var(--tealsoft);color:var(--teal2)}
@media(max-width:640px){#back{min-width:42px;min-height:42px;font-size:20px;border:none;background:transparent}}

/* ---------- 操作提示（常驻，不自动消失） ---------- */
.toastbar{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:90;background:#0f766e;color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:600;line-height:1.35;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transition:opacity .18s,transform .18s;width:min(92vw,420px);text-align:center;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.35)}
.toastbar:before{content:"✓ ";font-weight:700}
.toastbar.on{opacity:1;transform:translate(-50%,0)}
.toastbar.bad{background:var(--bad)}
.toastbar.bad:before{content:"! "}
@media(max-width:640px){.toastbar{bottom:calc(86px + env(safe-area-inset-bottom))}}

/* ---------- 更新提示（浮在表面，不进布局） ---------- */
.updbar{display:none;position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:95;background:#0f766e;color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 20px;font:inherit;font-size:14px;font-weight:600;line-height:1.25;box-shadow:0 12px 34px rgba(0,0,0,.32);max-width:92vw;text-align:center;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none}
.updbar.show{display:block;pointer-events:auto}
.updbar.in{opacity:1;transform:translate(-50%,0)}
.updbar.bad{background:var(--bad)}
.updbar.wait{background:#111;color:#fff}
.updbar .sp{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
button.busy{opacity:.6;cursor:progress}
@media(max-width:640px){.updbar{bottom:calc(86px + env(safe-area-inset-bottom))}}

#fd_body{width:100%;box-sizing:border-box;border:1px solid var(--line,var(--line));border-radius:11px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;background:var(--card);color:inherit}

button.pri{background:#111;border-color:#111;color:#fff}

.mod:hover{border-color:#111}
.pill{background:var(--chip);color:#374151}
.pill.me{background:#111;color:#fff}
.updbar{background:#111;color:#fff;border-color:#000}
.updbar.ok{background:#047857;color:#fff}

.fd-top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.fd-title{font-size:17px;font-weight:700}

.fd-post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

<body>

<div id="setup" class="hide">

      <label>密码（≥8 位）</label><input id="s_pass" type="password" autocomplete="new-password" required>

    </form>
  </div>
</div>

<div id="login" class="hide">
  <div class="card">
    <h1>ecobox 经营台账</h1>
    <p class="mut">赞比亚公司日常经营管理 · 每人一个账号</p>
    <form id="lf">
      <label>账号</label><input id="l_login" type="text" autocomplete="username" required placeholder="邮箱 / 手机号 / 姓名">
      <label>密码</label><input id="l_pass" type="password" autocomplete="current-password" required>
      <div class="err" id="l_err"></div>
      <button class="pri" style="width:100%;margin-top:6px">登录</button>
    </form>
    <p class="mut" style="margin:12px 0 0">还没有账号？找管理员开通。</p>
  </div>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <div class="bar">
      <button class="ghost hide" id="back" aria-label="返回目录">←</button>

<script>
const BUILD = "__BUILD__";

let UPD_SEEN = false;
let UPD_AT = 0;
async function checkUpdate(force) {
  if (document.hidden && !force) return;
  const now = Date.now();
  if (now - UPD_AT < 55000) return;
  UPD_AT = now;
  try {
    const r = await fetch("/api/build", { cache: "no-store" });
    const j = await r.json();
    if (j.build && j.build !== BUILD && !UPD_SEEN) {
      UPD_SEEN = true;
      const d = document.createElement("div");
      d.id = "upd_ver";
      d.innerHTML = `<span>${esc(tr(`有新版本`))}</span><button>${esc(tr(`立即更新`))}</button>`;
      d.querySelector("button").onclick = () => {
        try { caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch (e) {}
        location.reload();
      };
      document.body.appendChild(d);
    }
  } catch (e) {}
}
setInterval(checkUpdate, 300000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
window.addEventListener("focus", () => checkUpdate());

function tr(s) {
  if (!isEN() || !s) return s;
  const key = String(s).trim();
  if (EN[key]) return EN[key];
  for (const [re, rep] of EN_RULES) {
    const m = key.match(re);
    if (m) return typeof rep === "function" ? rep(m) : key.replace(re, rep);
  }
  /* 带 emoji 前缀的按钮："🏦 公司账户 · 对账基准" */
  const pre = key.match(/^([^\u4e00-\u9fffA-Za-z0-9]+)\s*([\u4e00-\u9fff].*)$/);
  if (pre) {
    const inner = tr(pre[2]);
    if (inner !== pre[2]) return pre[1] + inner;
  }
  /* 组合串："boss@ecobox.com · 现金 · buy diesel" */
  if (/[·•・]/.test(key)) {
    const parts = key.split(/\s*[·•・]\s*/);
    const mapped = parts.map(tr);
    if (mapped.some((x, i) => x !== parts[i])) return mapped.join(" · ");
  }
  return s;
}

/* 双语内容：原文 + AI 译文；当前语言缺译文就回退原文 */
function tx(o, field) {
  if (!o) return "";
  const zh = o[field + "_zh"] || o[field] || "";
  const en = o[field + "_en"] || "";
  return isEN() ? (en || o[field] || zh) : (zh || o[field] || en);
}

/* 把当前 DOM 里能对上的中文文案翻成英文（渲染后调用；观察器兜住异步内容） */
function applyLang(root) {
  if (!isEN() || !root) return;
  if (root.nodeType === 3) {
    const raw = root.nodeValue || "";
    const key = raw.trim();
    if (key && /[\u4e00-\u9fff]/.test(key)) {
      const out = tr(key);
      if (out !== key) root.nodeValue = raw.replace(key, out);
    }
    return;
  }
  const scope = root.nodeType === 1 ? root : document.body;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const raw = n.nodeValue;
    const key = raw.trim();
    if (!key || !/[\u4e00-\u9fff]/.test(key)) continue;
    const out = tr(key);
    if (out !== key) n.nodeValue = raw.replace(key, out);
  }
  if (/[\u4e00-\u9fff]/.test(document.title)) document.title = tr(document.title);
  for (const el of scope.querySelectorAll("[placeholder],[title],[aria-label]")) {
    for (const a of ["placeholder", "title", "aria-label"]) {
      const v = el.getAttribute(a);
      if (v && /[\u4e00-\u9fff]/.test(v)) {
        const out = tr(v);
        if (out !== v) el.setAttribute(a, out);
      }
    }
  }
}

let LANG_OBS = null;
function watchLang() {
  if (LANG_OBS) { LANG_OBS.disconnect(); LANG_OBS = null; }
  if (!isEN() || typeof MutationObserver === "undefined") return;
  LANG_OBS = new MutationObserver((muts) => {
    for (const m of muts) {
      if (m.type === "characterData") applyLang(m.target.parentElement || document.body);
      else for (const n of m.addedNodes) if (n.nodeType === 1 || n.nodeType === 3) applyLang(n);
    }
  });
  LANG_OBS.observe(document.body, { childList: true, subtree: true, characterData: true });
}

/* ---------- 操作提示 ---------- */
let UPD_TIMER = 0;
function showUpd(msg, kind) {
  const b = document.getElementById("updbar");
  if (!b) return;
  const pre = kind === "wait" ? '<i class="sp"></i>' : (kind === "bad" ? "✗ " : "✓ ");
  b.innerHTML = pre + esc(msg);
  b.className = "updbar show " + (kind === "bad" ? "bad" : kind === "wait" ? "wait" : "ok");
  requestAnimationFrame(() => b.classList.add("in"));
  clearTimeout(UPD_TIMER);
  /* 等待态不自动收：等请求回来再换成成功/失败，否则「点完没反应」又回来了 */
  UPD_TIMER = kind === "wait" ? null : setTimeout(hideUpd, kind === "bad" ? 3500 : 1200);
}

function hideUpd() {
  clearTimeout(UPD_TIMER);
  const b = document.getElementById("updbar");
  if (!b) return;
  b.classList.remove("in");
  setTimeout(() => { if (!b.classList.contains("in")) b.classList.remove("show"); }, 200);
}

function toast(msg, kind = "good") {
  showUpd(msg, kind);
}

function resetUpdbar() { hideUpd(); }

/* 点下去马上有反应：记下刚点的按钮，写请求期间把它变成「处理中…」并禁用，
   同时底部浮条显示转圈；请求回来（含失败）再还原，避免用户以为卡住而连点。 */
let BUSY_N = 0, BUSY_WAIT = false, BTN_TIMER = 0;
const BTN_Q = [];
let LIVEBTN = null, LIVEBTN_AT = 0;
document.addEventListener("click", (e) => {
  const b = e.target && e.target.closest ? e.target.closest("button") : null;
  if (b) { LIVEBTN = b; LIVEBTN_AT = Date.now(); }
}, true);

function busyOn(btn) {
  BUSY_N++;
  if (BUSY_N === 1) { BUSY_WAIT = true; showUpd(tr("处理中…"), "wait"); }
  if (btn && !btn.disabled && btn.dataset.busyHtml === undefined) {
    btn.dataset.busyHtml = btn.innerHTML;
    btn.classList.add("busy");
    btn.disabled = true;
    btn.innerHTML = '<i class="sp"></i>' + esc(tr("处理中…"));
  }
}
function busyOff(btn) {
  BUSY_N = Math.max(0, BUSY_N - 1);
  if (BUSY_N === 0) {
    if (btn) BTN_Q.push(btn);
    clearTimeout(BTN_TIMER);
    /* 还原稍等一下：handler 里常跟一串 GET + render，别让按钮先闪回原样又消失 */
    BTN_TIMER = setTimeout(() => {
      while (BTN_Q.length) {
        const b = BTN_Q.pop();
        if (b.dataset && b.dataset.busyHtml !== undefined) {
          b.innerHTML = b.dataset.busyHtml;
          delete b.dataset.busyHtml;
          b.classList.remove("busy");
          b.disabled = false;
        }
      }
    }, 260);
    if (BUSY_WAIT) {
      BUSY_WAIT = false;
      const bar = document.getElementById("updbar");
      if (bar && bar.classList.contains("wait")) hideUpd();
    }
  }
}

async function api(path, opts = {}) {
  const mut = !!opts.method && opts.method !== "GET";
  const btn = mut && LIVEBTN && Date.now() - LIVEBTN_AT < 15000 ? LIVEBTN : null;
  if (mut) busyOn(btn);
  try {
    const r = await fetch("/api" + path, {
      method: opts.method || "GET",
      headers: { ...(opts.body ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: "same-origin",
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (r.status === 401 && path !== "/me") { showLogin(); throw new Error(data.error || "请先登录"); }
    if (!r.ok) throw new Error(data.error || "请求失败 " + r.status);
    if (mut && !opts.quiet && !/^\/(login|logout|setup)\b/.test(path)) {
      const txt = opts.toast || (opts.method === "DELETE" ? "已删除" : "已保存");
      toast(txt + " · " + new Date().toTimeString().slice(0, 5));
    }
    return data;
  } finally {
    if (mut) busyOff(btn);
  }
}

  const deep = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (deep && (ROOT(deep) || allowed(TAB_KEY[deep]))) { S.tab = deep; S.fresh = true; }
  try { history.replaceState({ t: S.tab }, "", tabUrl(S.tab)); } catch (e) {}
  $("#back").onclick = () => goBack();
  $("#updbar").onclick = async () => {
    if (BUSY_N) return; // 正在处理就不要再触发刷新
    const b = $("#updbar");
    b.textContent = "刷新中…";
    b.className = "updbar show in";
    try { await render(); showUpd("已刷新到最新"); }
    catch (e) { showUpd(e.message, "bad"); }
  };
  resetUpdbar();
  try { await loadTodos(); } catch (e) {}
  render();
  maybeLateAlert();
}

  if (!S.tab.startsWith("g:")) return S.tab;
  const has = keys ? keys.includes(S.tab) : [...$("#tabs").children].some((b) => b.dataset.tab === S.tab);
  return has ? S.tab : "home";
}

function buildTabs() {
  const tabs = [["home", tr("目录")], ["status", tr("动态")], ["g:系统", tr("系统")]];

  $("#tabs").innerHTML = tabs.map(([k, t]) => `<button data-tab="${k}" class="${cur === k ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").onclick = (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    enterApp(b.dataset.tab);
  };
}

/* 快捷（置顶）：存在账号上，换设备也跟着走 */
const pinned = (k) => (S.user.shortcuts || []).includes(k);
async function togglePin(k) {
  const cur = (S.user.shortcuts || []).slice();
  const next = cur.includes(k) ? cur.filter((x) => x !== k) : [...cur, k].slice(-8);
  S.user.shortcuts = next;
  render();
  try {
    const r = await api("/me", { method: "PATCH", body: { shortcuts: next }, quiet: true });
    if (r.user) S.user.shortcuts = r.user.shortcuts;
    toast(next.includes(k) ? tr("已加到快捷") : tr("已取消快捷"));
  } catch (e) {
    S.user.shortcuts = cur;
    render();
    toast(e.message, "bad");
  }
}

function modCard(x) {
  if (x.soon) return `<div class="mod soon"><i>${x.i}</i><b>${esc(tr(x.t))}</b><span>${esc(modDesc(x))}</span><em>${esc(tr("待开放"))}</em></div>`;
  const on = pinned(x.k);
  const label = esc(tr(on ? "取消快捷" : "设为快捷"));
  const pin = `<span class="pin${on ? " on" : ""}" data-pin="${esc(x.k)}" role="button" tabindex="-1" aria-label="${label}" title="${label}">${on ? "★" : "☆"}</span>`;
  /* 红点 = 逾期 + 今天还没汇报 + 等我审核，就是今天必须动手的件数 */
  const todoN = x.k === "todo" ? lateForMe().length + needReport().length + awaitingReview().length : 0;
  const dot = todoN ? `<em class="td-dot" title="${esc(tr("逾期 + 今天还没汇报"))}">${todoN}</em>` : "";
  const inner = `<i>${x.i}</i><b>${esc(tr(x.t))}${dot}</b><span>${esc(modDesc(x))}</span>${pin}`;
  return x.tab
    ? `<button class="mod pinable" data-go="${x.tab}">${inner}</button>`
    : `<a class="mod pinable" href="${x.u}" target="_blank" rel="noopener">${inner}</a>`;
}

function homeHtml() {
  const hour = new Date().getHours();
  const hi = hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : "晚上好";
  const vis = MODS.filter((m) => allowed(m.k) && !m.navOnly && (!m.soon || S.user.role === "admin"));
  /* 分组次序跟顶部页签一致；配置里新出现的组追加在最后 */
  const order = [...GROUPS];
  for (const m of vis) if (!order.includes(m.g)) order.push(m.g);
  const pins = (S.user.shortcuts || []).map((k) => vis.find((m) => m.k === k)).filter(Boolean);
  const quick = pins.length
    ? `<div class="sec">★ ${esc(tr("快捷"))}</div><div class="mods">${pins.map(modCard).join("")}</div>`
    : "";
  const secs = order.map((g) => {
    const list = vis.filter((m) => m.g === g);
    if (!list.length) return "";
    return `<div class="sec">${esc(tr(g))}</div><div class="mods">${list.map(modCard).join("")}</div>`;
  }).join("");
  return `<div class="hello">${hi}，${esc(S.user.name)}</div>
    <div class="mut" style="margin-bottom:4px">${esc(tr("点右上角 ☆ 把常用的放到最上面的「快捷」。"))}</div>
    ${quick}${secs || '<div class="empty">${esc(tr(`还没有可用模块，找管理员开通`))}</div>'}`;
}

/* ---------- 生产（日报） ---------- */
const PROD_UNITS = [["kg", "公斤"], ["t", "吨"], ["bag", "袋"], ["truck", "车"]];
const PROD_PRESETS = ["钽铌精矿", "跳汰机粗颗粒", "手工原矿"];
const PROD_WINDOWS = [7, 30, 90];
const PROD_DAYS = 90;
let PROD_WIN = 30;

const prodUnitName = (u) => (PROD_UNITS.find((x) => x[0] === u) || PROD_UNITS[0])[1];
const unitRank = (u) => Math.max(0, PROD_UNITS.findIndex((x) => x[0] === u));
const prodNum = (v) => { const n = Number(v) || 0; return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); };
const prodPhotos = (r) => {
  try { const a = JSON.parse(r.photos || "[]"); return Array.isArray(a) ? a.filter((x) => typeof x === "string" && x) : []; }
  catch (e) { return []; }
};
/* 老记录只有 ore_t（矿石吨），没有 qty；显示时按吨算 */
const prodQty = (r) => (Number(r.qty) > 0 ? { n: Number(r.qty), u: r.unit || "kg" } : { n: Number(r.ore_t) || 0, u: "t" });
const prodMine = (r) => r.user_id === S.user.id || S.user.role === "admin" || S.user.role === "manager";

async function loadProd() {
  const now = new Date();
  const to = localDay(now);
  /* 累计要基于全部历史，所以多取一段；列表仍只显示最近 PROD_DAYS 天 */
  S.logsAll = (await api(`/logs?from=2000-01-01&to=${to}`)).logs || [];
  const cut = localDay(new Date(now.getTime() - (PROD_DAYS - 1) * 864e5));
  S.logs = S.logsAll.filter((r) => String(r.day) >= cut);
}

const prodRows = () => S.logs.slice().sort((a, b) => String(b.day).localeCompare(String(a.day)) || b.id - a.id);

function prodTotal(rows) {
  const m = new Map();
  rows.forEach((r) => { const q = prodQty(r); if (q.n) m.set(q.u, (m.get(q.u) || 0) + q.n); });
  return [...m.entries()].map(([u, v]) => prodNum(v) + " " + prodUnitName(u)).join(" · ") || "—";
}

/* 今日/本月只报一个主单位，别的单位放在小字里，免得 KPI 挤成两行 */
function prodTotals(rows) {
  const sum = new Map(), cnt = new Map();
  rows.forEach((r) => {
    const q = prodQty(r);
    if (!q.n) return;
    sum.set(q.u, (sum.get(q.u) || 0) + q.n);
    cnt.set(q.u, (cnt.get(q.u) || 0) + 1);
  });
  const order = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0])).map((x) => x[0]);
  if (!order.length) return { main: "—", rest: "" };
  const fmt = (u) => prodNum(sum.get(u)) + " " + prodUnitName(u);
  return { main: fmt(order[0]), rest: order.slice(1).map(fmt).join(" · ") };
}

const prodDayLabel = (d) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || "")) return d || "—";
  const wd = new Date(d + "T00:00:00").toLocaleDateString(LANG === "en" ? "en-GB" : "zh-CN", { weekday: "short" });
  return d.slice(5) + " " + wd;
};

const prodDaysBack = (n) => {
  const out = [];
  const now = new Date(); now.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) out.push(localDay(new Date(now.getTime() - i * 864e5)));
  return out;
};

/* 品位：按数量加权（同一产品单位一致，可直接加权；整体只取同一单位口径） */
function prodWavg(rows, key) {
  let w = 0, s = 0;
  rows.forEach((r) => {
    const q = prodQty(r), g = Number(r[key]);
    if (q.n > 0 && g > 0) { w += q.n; s += q.n * g; }
  });
  return w ? s / w : null;
}
const prodGradeTxt = (v) => (v == null ? "—" : prodNum(+v.toFixed(2)) + "%");

function prodOverallGrade(rows) {
  const graded = rows.filter((r) => { const q = prodQty(r); return q.n > 0 && (Number(r.ta) > 0 || Number(r.nb) > 0); });
  if (!graded.length) return null;
  const cnt = new Map();
  graded.forEach((r) => { const u = prodQty(r).u; cnt.set(u, (cnt.get(u) || 0) + 1); });
  const unit = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0]))[0][0];
  const use = graded.filter((r) => prodQty(r).u === unit);
  return { ta: prodWavg(use, "ta"), nb: prodWavg(use, "nb"), unit, n: use.length, qty: use.reduce((s, r) => s + prodQty(r).n, 0) };
}

/* 累计：数量逐日相加，品位按数量加权；累计基于全部历史，窗口只决定显示哪一段 */
function prodCumMap(rows) {
  const daily = new Map();
  rows.forEach((r) => {
    const q = prodQty(r);
    if (!q.n || !r.day) return;
    let d = daily.get(r.day);
    if (!d) { d = { inc: 0, wTa: 0, sTa: 0, wNb: 0, sNb: 0 }; daily.set(r.day, d); }
    d.inc += q.n;
    const ta = Number(r.ta), nb = Number(r.nb);
    if (ta > 0) { d.wTa += q.n; d.sTa += q.n * ta; }
    if (nb > 0) { d.wNb += q.n; d.sNb += q.n * nb; }
  });
  const out = new Map();
  let cum = 0, wTa = 0, sTa = 0, wNb = 0, sNb = 0;
  [...daily.keys()].sort().forEach((day) => {
    const d = daily.get(day);
    cum += d.inc; wTa += d.wTa; sTa += d.sTa; wNb += d.wNb; sNb += d.sNb;
    out.set(day, { inc: d.inc, cum, ta: wTa ? sTa / wTa : null, nb: wNb ? sNb / wNb : null });
  });
  return out;
}

/* 铺到窗口里每一天，没记录的日子沿用前一天的累计值 */
function prodCumPoints(map, days) {
  let cur = { cum: 0, ta: null, nb: null };
  return days.map((d) => {
    const v = map.get(d);
    if (v) cur = v;
    return { day: d, cum: cur.cum, ta: cur.ta, nb: cur.nb, inc: v ? v.inc : 0, has: !!v };
  });
}

/* 折线：实线=累计数量，虚线=累计 Ta% / Nb%（共用一条品位纵轴，便于对比） */
function prodCumSvg(points) {
  const W = 600, H = 120, PT = 8, PB = 6, PL = 3, PR = 3;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxQ = Math.max(1, ...points.map((p) => p.cum));
  const grades = points.flatMap((p) => [p.ta, p.nb]).filter((v) => v != null);
  const maxG = grades.length ? Math.max(...grades) : 0;
  const x = (i) => PL + (points.length > 1 ? (i * iw) / (points.length - 1) : iw / 2);
  const yQ = (v) => PT + ih * (1 - v / maxQ);
  const yG = (v) => PT + ih * (1 - v / (maxG * 1.1 || 1));
  const qPath = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${yQ(p.cum).toFixed(1)}`).join(" ");
  const qArea = `${qPath} L${x(points.length - 1).toFixed(1)} ${PT + ih} L${x(0).toFixed(1)} ${PT + ih} Z`;
  const gradePath = (key) => points
    .map((p, i) => (p[key] == null ? null : `${i && points[i - 1][key] != null ? "L" : "M"}${x(i).toFixed(1)} ${yG(p[key]).toFixed(1)}`))
    .filter(Boolean).join(" ");
  const taPath = gradePath("ta"), nbPath = gradePath("nb");
  const grid = [0.25, 0.5, 0.75]
    .map((f) => `<line x1="${PL}" x2="${W - PR}" y1="${(PT + ih * f).toFixed(1)}" y2="${(PT + ih * f).toFixed(1)}" class="pd-grid"/>`)
    .join("");
  return `<svg class="pd-cum" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    ${grid}
    <path d="${qArea}" class="pd-area"/>
    <path d="${qPath}" class="pd-line"/>
    ${taPath ? `<path d="${taPath}" class="pd-gline"/>` : ""}
    ${nbPath ? `<path d="${nbPath}" class="pd-nline"/>` : ""}
  </svg>`;
}

function prodRefUnit(rows) {
  const cnt = new Map();
  rows.forEach((r) => { const q = prodQty(r); if (q.n) cnt.set(q.u, (cnt.get(q.u) || 0) + 1); });
  const top = [...cnt.entries()].sort((a, b) => b[1] - a[1] || unitRank(a[0]) - unitRank(b[0]))[0];
  return top ? top[0] : "kg";
}

function prodChartData() {
  const days = prodDaysBack(PROD_WIN);
  const all = S.logsAll || S.logs || [];
  const inSet = new Set(days);
  const win = all.filter((r) => inSet.has(r.day) && prodQty(r).n > 0);
  const unit = prodRefUnit(win);
  const points = prodCumPoints(prodCumMap(all.filter((r) => prodQty(r).u === unit)), days);
  const last = points[points.length - 1] || { cum: 0, ta: null, nb: null };
  return { days, win, all, unit, points, cum: last.cum, ta: last.ta, nb: last.nb };
}

/* 按品种拆当日产出：一个单位一张柱状面板，颜色区分产品 */
const PROD_COLORS = ["#111827", "#0f766e", "#b45309", "#7c3aed", "#be123c"];

function prodDailyPanels(days, all) {
  const byUnit = new Map();
  all.forEach((r) => {
    const q = prodQty(r);
    if (!q.n) return;
    if (!byUnit.has(q.u)) byUnit.set(q.u, new Map());
    const m = byUnit.get(q.u);
    const k = r.product || "";
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  const inSet = new Set(days);
  return [...byUnit.entries()]
    .sort((a, b) => unitRank(a[0]) - unitRank(b[0]))
    .map(([unit, m]) => {
      const products = [...m.entries()].map(([name, rows]) => {
        const daily = new Map();
        let total = 0;
        rows.forEach((r) => {
          if (!inSet.has(r.day)) return;
          const n = prodQty(r).n;
          daily.set(r.day, (daily.get(r.day) || 0) + n);
          total += n;
        });
        const cumMap = prodCumMap(rows);
        const lastDay = [...cumMap.keys()].pop();
        const last = lastDay ? cumMap.get(lastDay) : { cum: 0, ta: null, nb: null };
        return { name, daily, total, cum: last.cum, ta: last.ta, nb: last.nb };
      }).filter((p) => p.total > 0).sort((a, b) => b.total - a.total);
      products.forEach((p, i) => { p.color = PROD_COLORS[i % PROD_COLORS.length]; });
      const dailyTot = new Map(days.map((d) => [d, products.reduce((s, p) => s + (p.daily.get(d) || 0), 0)]));
      return { unit, products, dailyTot, max: Math.max(1, ...dailyTot.values()) };
    })
    .filter((p) => p.products.length);
}

function prodDailyBarsHtml(days, panel) {
  return `<div class="pd-dbars">${days.map((d) => {
    const segs = panel.products.map((p) => {
      const v = p.daily.get(d) || 0;
      if (!v) return "";
      const h = ((v / panel.max) * 100).toFixed(1);
      return `<span style="height:${h}%;background:${p.color}"></span>`;
    }).join("");
    const tip = [d].concat(panel.products.filter((p) => p.daily.get(d)).map((p) => `${p.name || "未填产品"} ${prodNum(p.daily.get(d))}`)).join(" · ");
    return `<div class="pd-dcol" title="${esc(tip)}">${segs}</div>`;
  }).join("")}</div>`;
}

function prodDailyPanelHtml(days, panel) {
  const leg = panel.products.map((p) =>
    `<span class="pd-lg"><i style="background:${p.color}"></i>${esc(p.name || "未填产品")}
      <b>${prodNum(p.cum)} ${esc(prodUnitName(panel.unit))}</b>
      <em>${p.ta == null && p.nb == null ? "" : `Ta ${prodGradeTxt(p.ta)} · Nb ${prodGradeTxt(p.nb)}`}</em></span>`).join("");
  return `<div class="pd-panel">
    <div class="pd-sub">${esc(tr(`按品种 · 当日产出（${esc(prodUnitName(panel.unit))}）`))}</div>
    ${prodDailyBarsHtml(days, panel)}
    <div class="pd-x mut"><span>${days[0].slice(5)}</span><span>${days[days.length - 1].slice(5)}</span></div>
    <div class="pd-leg col">${leg}</div>
  </div>`;
}

/* 日表：每天每个品种的产出 + 当日合计 + 累计（同单位口径） */
function prodDayTableHtml(days, all, unit, panel) {
  const map = prodCumMap(all.filter((r) => prodQty(r).u === unit));
  const rows = days.slice().reverse().filter((d) => map.has(d));
  if (!rows.length) return "";
  const prods = panel ? panel.products : [];
  const shown = rows.slice(0, 20);
  const head = `<tr><th>${esc(tr(`日期`))}</th>${prods.map((p) => `<th class="n"><i class="pd-dot" style="background:${p.color}"></i>${esc(p.name || "未填产品")}</th>`).join("")}<th class="n">${esc(tr(`合计`))}</th><th class="n">${esc(tr(`累计`))}</th><th class="n">${esc(tr(`累计 Ta %`))}</th><th class="n">${esc(tr(`累计 Nb %`))}</th></tr>`;
  const body = shown.map((d) => {
    const v = map.get(d);
    const cells = prods.map((p) => `<td class="n">${p.daily.get(d) ? prodNum(p.daily.get(d)) : "·"}</td>`).join("");
    return `<tr><td>${esc(d.slice(5))}</td>${cells}<td class="n"><b>${prodNum(v.inc)}</b></td><td class="n">${prodNum(v.cum)}</td>
      <td class="n">${prodGradeTxt(v.ta)}</td><td class="n">${prodGradeTxt(v.nb)}</td></tr>`;
  }).join("");
  return `<div class="pd-daytab">
    <div class="pd-sub">${esc(tr(`按日明细（${esc(prodUnitName(unit))}口径）`))}</div>
    <table>${head}${body}</table>
    ${rows.length > shown.length ? `<div class="pd-note mut">${esc(tr(`只列最近 ${shown.length} 天`))}</div>` : ""}
  </div>`;
}

function prodChartHtml() {
  const { days, win, all, unit, points, cum, ta, nb } = prodChartData();
  const wins = PROD_WINDOWS.map((n) => `<button class="td-chip${n === PROD_WIN ? " on" : ""}" data-win="${n}">${esc(tr(`${n} 天`))}</button>`).join("");
  if (!win.length) {
    return `<div class="card" id="prod_chart"><h3>${esc(tr(`产量走势 · 累计`))}</h3><div class="pd-win">${wins}</div>
      <div class="empty">${esc(tr(`这段时间没有产量记录`))}</div></div>`;
  }
  const today = localDay(new Date());
  const todayTot = prodTotals(win.filter((r) => r.day === today));
  const otherUnits = win.some((r) => prodQty(r).u !== unit);
  const head = `<div class="pd-tot">
      <span class="pd-sum"><i>${esc(tr(`今日`))}</i> <b>${esc(todayTot.main)}</b></span>
      ${todayTot.rest ? `<span class="mut">${esc(tr(`另有 ${esc(todayTot.rest)}`))}</span>` : ""}
      <span class="pd-avg"><i>${esc(tr(`累计`))}</i> <b>${prodNum(cum)} ${esc(prodUnitName(unit))}</b>
        ${ta == null && nb == null ? "" : `<em>Ta ${prodGradeTxt(ta)} · Nb ${prodGradeTxt(nb)}</em>`}</span>
    </div>`;
  const panelsAll = prodDailyPanels(days, all);
  const panels = panelsAll.map((p) => prodDailyPanelHtml(days, p)).join("");
  const refPanel = panelsAll.find((p) => p.unit === unit);
  return `<div class="card" id="prod_chart">
    <h3>${esc(tr(`产量走势 · 累计`))} <span class="mut" style="font-weight:400">${esc(tr(`近 ${PROD_WIN} 天`))}</span></h3>
    <div class="pd-win">${wins}</div>
    ${head}
    ${prodCumSvg(points)}
    <div class="pd-x mut"><span>${days[0].slice(5)}</span><span>${days[days.length - 1].slice(5)}</span></div>
    <div class="pd-leg"><span><i class="pd-k1"></i>${esc(tr(`累计产量（${esc(prodUnitName(unit))}）`))}</span><span><i class="pd-k2"></i>${esc(tr(`累计 Ta%`))}</span><span><i class="pd-k3"></i>${esc(tr(`累计 Nb%`))}</span></div>
    ${otherUnits ? `<div class="pd-note mut">${esc(tr(`累计只按单一单位统计，袋/吨等其它单位不计入`))}</div>` : ""}
    ${panels}
    ${prodDayTableHtml(days, all, unit, refPanel)}
  </div>`;
}

function prodRowHtml(r) {
  const q = prodQty(r);
  const photos = prodPhotos(r);
  const grade = r.ta || r.nb ? `Ta ${prodNum(r.ta)}% · Nb ${prodNum(r.nb)}%` : (r.grade || "");
  return `<div class="pd-row">
    <span class="t">${esc(r.product || (q.u === "t" ? "矿石" : "精矿"))}</span>

function prodHtml() {
  const rows = prodRows();
  const today = localDay(new Date()), month = today.slice(0, 7);
  const todayRows = rows.filter((r) => r.day === today);
  const monthRows = rows.filter((r) => String(r.day).startsWith(month));
  const groups = new Map();
  rows.forEach((r) => { const k = r.day || "—"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  let list = "";
  groups.forEach((g, k) => {
    list += `<div class="pd-day"><b>${esc(prodDayLabel(k))}</b><span class="s">${esc(tr(`合计 ${prodTotal(g)}`))}</span></div>`;
    list += g.map(prodRowHtml).join("");
  });
  const tToday = prodTotals(todayRows), tMonth = prodTotals(monthRows);
  const kpi = (label, t) => `<div class="kpi"><i>${label}</i><b>${t.main}</b>${t.rest ? `<i>${esc(tr(`另有 ${esc(t.rest)}`))}</i>` : ""}</div>`;
  return `<div class="grid">
      ${kpi("今日产量", tToday)}
      ${kpi("本月", tMonth)}
      <div class="kpi"><i>${esc(tr(`本月记录`))}</i><b>${esc(tr(`${monthRows.length} 笔`))}</b><i>${esc(tr(`${new Set(monthRows.map((r) => r.day)).size} 天有记录`))}</i></div>
    </div>
    ${prodChartHtml()}
    <div class="card">
      <h3>${esc(tr(`生产记录（${rows.length}）`))}</h3>
      ${rows.length ? list : `<div class="empty">${esc(tr(`还没有记录，点右下角「记一笔」`))}</div>`}

    <button class="pd-fab" id="prod_new">${esc(tr(`＋ 记一笔`))}</button>`;
}

/* ---------- 待办 ---------- */
/* 一条待办就是一个闭环：谁派的 → 派给谁 → 干的人汇报 / 提交完成申请 → 派的人审核 → 完成或打回。
   执行人不能自己按完成（服务端也拦）；只有派活的人审核通过才算结束。 */
const TODO_FILTERS = [["todo", "待我处理"], ["review", "等我审核"], ["made", "我发起"], ["company", "公司事项"], ["late", "已逾期"], ["done", "已完成"], ["all", "全部"]];
let TODOS = [], TPEOPLE = [], TD_PANEL = "", TD_ACT = null, TD_REPLY = null, TD_RAW = "", TD_POLL = null, TD_SCROLL = null;

const TD_ST = {
  doing: { t: "进行中", c: "doing" },
  submitted: { t: "待审核", c: "sub" },
  done: { t: "已完成", c: "done" },
};
const tdSt = (t) => TD_ST[t.status] || TD_ST.doing;
const daysLeft = (due) => Math.round((new Date(due + "T00:00:00") - new Date(iso(new Date()) + "T00:00:00")) / 864e5);
const tdMe = () => (S.user && S.user.login) || "";
const isMine = (t) => !!t.owner && t.owner === tdMe();
const isMaker = (t) => !!t.creator && t.creator === tdMe();
const canManage = () => ["admin", "manager"].includes((S.user || {}).role);
const isAdmin = () => (S.user || {}).role === "admin";
const canTouch = (t) => isMine(t) || isMaker(t) || canManage();
/* 谁能提交完成：干活的人；自己排的活由自己提交（提交即完成）；公司事项没指派时管理层说了算 */
const canSubmit = (t) =>
  t.status === "doing" && (isMine(t) || (isMaker(t) && !t.owner) || (t.scope === "company" && !t.owner && canManage()));
/* 谁能审核：派活的人，管理员可代审 */
const canReview = (t) => t.status === "submitted" && (isMaker(t) || isAdmin());
const awaitingReview = () => TODOS.filter((t) => t.status === "submitted" && isMaker(t));

async function loadTodos() {
  const r = await api("/todos", { quiet: true });
  TODOS = r.todos || [];
  TD_RAW = JSON.stringify(TODOS);
  if (!TPEOPLE.length) { try { TPEOPLE = (await api("/people", { quiet: true })).people || []; } catch (e) {} }
}

const overdue = (t) => t.status !== "done" && !!t.due && daysLeft(t.due) < 0;
const lateForMe = () => TODOS.filter((t) => overdue(t) && (isMine(t) || isMaker(t) || (t.scope === "company" && !t.owner)));
const NOTE_TIME = (n) => String(n.created_at || "").slice(5, 16).replace("T", " ");

const REPORT_FLAGS = { progress: "推进了", blocked: "卡住了", idle: "今天没动" };
const todayStr = () => iso(new Date());
/* 今天报过没？没有的话从派下来（或最后汇报）算起几天没报 */
const reportedToday = (t) => String(t.last_report_at || "").slice(0, 10) === todayStr();
const reportAge = (t) => {
  const base = t.last_report_at || t.assign_at || t.created_at || "";
  if (!base) return 0;
  return Math.max(0, Math.round((new Date(todayStr() + "T00:00:00") - new Date(String(base).slice(0, 10) + "T00:00:00")) / 864e5));
};
const myOpen = () => TODOS.filter((t) => t.status !== "done" && isMine(t));
const needReport = () => myOpen().filter((t) => t.status === "doing" && !reportedToday(t));
/* 连续汇报天数：从今天（今天还没报就从昨天）往前数，连着有汇报的天数 */
function reportStreak() {
  const days = new Set();
  for (const t of TODOS) for (const n of t.notes || []) {
    if (n.kind === "report" && n.uid === tdMe()) days.add(String(n.created_at || "").slice(0, 10));
  }
  let n = 0;
  const d = new Date();
  if (!days.has(iso(d))) d.setDate(d.getDate() - 1);
  while (days.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

const noteById = (t, id) => (t && (t.notes || []).find((n) => n.id === id)) || null;
function noteLine(n, t, noReply) {
  const time = esc(NOTE_TIME(n));
  const q = n.reply_to ? noteById(t, n.reply_to) : null;
  const quote = q ? `<div class="td-quote">↩ ${esc(q.name)}：${esc(String(q.body || "").slice(0, 80))}</div>` : "";
  const btn = noReply ? "" : `<button class="td-nreply" data-td-reply="${esc(n.id)}" title="${esc(tr("回复这条"))}">↩ ${esc(tr("回复"))}</button>`;
  let body;
  if (n.kind === "sys") body = `<i class="mut">${esc(tr(n.body))}</i>`;
  else if (n.kind === "assign") body = `<i class="td-go">${esc(n.body)}</i>`;
  else if (n.kind === "report") {
    const label = REPORT_FLAGS[n.flag] || REPORT_FLAGS.progress;
    body = `<i class="td-flag td-flag-${esc(n.flag || "progress")}">${esc(tr(label))}</i>${esc(n.body)}`;
  } else if (n.kind === "submit") body = `<i class="td-k-sub">📤 ${esc(tr("提交完成"))}</i>${esc(n.body)}`;
  else if (n.kind === "review") body = `<i class="td-k-rev${n.flag === "reject" ? " rej" : ""}">${n.flag === "reject" ? "↩" : "✅"} ${esc(tr("审核"))}</i>${esc(n.body)}`;
  else body = esc(n.body);
  return `<div class="td-msg">${quote}<div class="td-mhead"><b>${esc(n.name)}</b><span class="mut">${time}</span>${btn}</div>${body}</div>`;
}

const TD_MIME = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp",
  gif: "image/gif", txt: "text/plain", csv: "text/csv", zip: "application/zip", doc: "application/msword",
  xls: "application/vnd.ms-excel", ppt: "application/vnd.ms-powerpoint",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation" };
const tdExt = (name) => String(name || "").split(".").pop().toLowerCase();
const tdMime = (f) => TD_MIME[tdExt(f.name)] || (/^(image|text)\//.test(f.type || "") ? f.type : "");
const tdSize = (n) => { const s = Number(n) || 0; return !s ? "" : s < 1024 ? s + " B" : s < 1048576 ? Math.round(s / 1024) + " KB" : (s / 1048576).toFixed(1) + " MB"; };

function tdAttRow(f, id, canDel) {
  const img = /^image\//.test(f.mime || "");
  const pdf = /pdf/i.test(f.mime || "");
  const href = "/api/todos/" + encodeURIComponent(id) + "/file/" + encodeURIComponent(f.k);
  return `<div class="td-att">
      <span class="td-att-ic">${img ? "🖼" : pdf ? "📄" : "📎"}</span>
      <a href="${esc(href)}" target="_blank" rel="noopener"><b>${esc(f.name || f.k)}</b><i>${esc(tdSize(f.size))}${f.by ? " · " + esc(f.by) : ""}${f.at ? " · " + esc(f.at) : ""}</i></a>
      ${canDel ? `<button class="ghost td-att-x" data-td-fdel="${esc(f.k)}" data-td-fid="${esc(id)}" title="${esc(tr("删除"))}">×</button>` : ""}
    </div>`;
}

async function tdUpload(id, f) {
  if (f.size > 25 * 1024 * 1024) throw new Error(tr("文件超过 25MB，请线下提供（U 盘 / 网盘 / 邮件）"));
  const mime = tdMime(f);
  if (!mime) throw new Error(tr("不支持这种文件（PDF / 图片 / Office / 文本 / ZIP）"));
  const data = await new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result);
    rd.onerror = () => rej(new Error(tr("读取失败")));
    rd.readAsDataURL(f);
  });
  const r = await api("/todos/" + encodeURIComponent(id) + "/file", {
    method: "POST", quiet: true, body: { data, name: f.name, mime },
  });
  return r.files;
}

/* 卡片：一眼看清「谁的事、到哪一步、等我做什么」 */
function todoCard(t) {
  const st = tdSt(t);
  const dl = t.due ? daysLeft(t.due) : null;
  const late = t.status !== "done" && dl !== null && dl < 0;
  const dueTxt = dl === null ? ""
    : t.status === "done" ? esc(t.due)
      : dl < 0 ? `${esc(tr("逾期"))} ${esc(tr(`${-dl} 天`))}`
        : dl === 0 ? esc(tr("今天到期"))
          : esc(String(t.due).slice(5)) + (dl <= 7 ? ` · ${esc(tr(`${dl} 天`))}` : "");
  const age = reportAge(t);
  const rep = t.status !== "doing" ? ""
    : isMine(t) ? (reportedToday(t) ? `<span class="td-rep ok">✓ ${esc(tr("今天已汇报"))}</span>`
      : `<span class="td-rep${age >= 2 ? " bad" : ""}">${age ? `${esc(tr(`${age} 天没汇报`))}` : esc(tr("今天还没汇报"))}</span>`)
      : "";
  const tags = [
    t.imp ? `<span class="pill td-imp">★ ${esc(tr("重要"))}</span>` : "",
    t.self_set ? `<span class="pill td-self">${esc(tr("自定"))}</span>` : "",
    t.scope === "company" ? `<span class="pill td-co">${esc(tr("公司事项"))}</span>` : "",
    t.scope === "person" ? `<span class="pill">${esc(tr("指派"))}</span>` : "",
    t.rounds ? `<span class="pill">${esc(tr(`第 ${t.rounds} 轮`))}</span>` : "",
  ].filter(Boolean).join("");
  const who = t.owner ? t.owner_name || t.owner : tr("未指派");
  const all = t.notes || [];
  const last = [...all].reverse().find((n) => ["cmt", "report", "submit", "review"].includes(n.kind));
  const acts = [];
  if (canSubmit(t)) acts.push(`<button class="pri" data-td-act="submit" data-td-id="${t.id}">📤 ${esc(tr("提交完成"))}</button>`);
  if (canReview(t)) acts.push(`<button class="pri" data-td-act="review" data-td-id="${t.id}">✅ ${esc(tr("审核"))}</button>`);
  if (isMine(t) && t.status === "doing") acts.push(`<button data-td-act="report" data-td-id="${t.id}">📝 ${esc(tr("汇报"))}</button>`);
  return `<div class="td-card ${st.c}${late ? " late" : ""}" data-td-open="${t.id}">
    <div class="td-row">
      <span class="td-st ${st.c}">${esc(tr(st.t))}</span>
      <div class="td-mid">
        <div class="td-title">${esc(t.title)}</div>
        <div class="td-meta">
          <span class="td-who${t.owner ? "" : " none"}"><i>${esc(String(who).trim().slice(0, 1))}</i>${esc(who)}</span>
          ${dueTxt ? `<span class="td-due${late ? " late" : dl === 0 && t.status !== "done" ? " today" : ""}">🗓 ${dueTxt}</span>` : ""}
          ${t.status === "submitted" ? `<span class="td-wait">⏳ ${esc(tr(`等 ${t.creator_name || t.creator} 审核`))}</span>` : ""}
          ${rep}
          ${t.creator && t.creator !== t.owner ? `<span>· ${esc(tr("发起"))} ${esc(t.creator_name || t.creator)}</span>` : ""}
        </div>
        ${tags ? `<div class="td-tags">${tags}</div>` : ""}
        ${last ? `<div class="td-fb"><span class="mut">${esc(last.name)} · ${esc(NOTE_TIME(last))}</span> ${esc(String(last.body || "").slice(0, 70))}</div>` : ""}
      </div>
      <button class="td-star${t.imp ? " on" : ""}" data-td-star="${t.id}" title="${esc(tr("重要"))}">★</button>
    </div>
    <div class="td-foot">
      ${acts.join("")}
      <button data-td-open="${t.id}">💬 ${all.length || ""} ${esc(tr("打开"))}</button>
    </div>
  </div>`;
}

function todoSection(title, list, cls) {
  if (!list.length) return "";
  return `<div class="td-sec ${cls || ""}">${esc(title)} <i>${list.length}</i></div>` + list.map(todoCard).join("");
}

function todoHtml() {
  const me = tdMe();
  const f = S.todoFilter || (canManage() ? "all" : "todo");
  const openAll = TODOS.filter((t) => t.status !== "done");
  const mineOpen = openAll.filter(isMine);
  const lateAll = TODOS.filter(overdue);
  const match = (t) => {
    if (f.startsWith("p:")) return t.owner === f.slice(2);
    if (f === "review") return t.status === "submitted" && isMaker(t);
    if (f === "done") return t.status === "done";
    if (f === "late") return overdue(t);
    if (f === "company") return t.scope === "company" && t.status !== "done";
    if (f === "made") return isMaker(t) && t.status !== "done";
    if (f === "todo") return isMine(t) && t.status !== "done";
    if (f === "all") return true;
    return t.status !== "done";
  };
  const list = TODOS.filter(match);
  const byDue = (a, b) => (a.due || "9999-12-31").localeCompare(b.due || "9999-12-31");
  const pend = list.filter((t) => t.status === "submitted");
  const open = list.filter((t) => t.status === "doing");
  const imp = open.filter((t) => t.imp).sort(byDue);
  const rest = open.filter((t) => !t.imp);
  const late = rest.filter((t) => t.due && daysLeft(t.due) < 0).sort(byDue);
  const today = rest.filter((t) => t.due && daysLeft(t.due) === 0);
  const soon = rest.filter((t) => t.due && daysLeft(t.due) > 0).sort(byDue);
  const none = rest.filter((t) => !t.due);
  const fin = list.filter((t) => t.status === "done");

  const cnt = (k) => k === "all" ? TODOS.length
    : k === "done" ? TODOS.length - openAll.length
      : k === "late" ? lateAll.length
        : k === "review" ? awaitingReview().length
          : k === "todo" ? mineOpen.length
            : k === "made" ? TODOS.filter((t) => isMaker(t) && t.status !== "done").length
              : k === "company" ? openAll.filter((t) => t.scope === "company").length : 0;
  const chip = ([k, label]) => `<button class="td-chip${f === k ? " on" : ""}" data-td-filter="${k}">${esc(tr(label))}<i>${cnt(k)}</i></button>`;

  const needN = needReport().length;
  const myLate = mineOpen.filter(overdue).length;
  const revN = awaitingReview().length;
  const kpi = [
    [tr("我负责"), mineOpen.length, tr("在办"), "todo", false],
    [tr("等我审核"), revN, revN ? tr("对方已交") : tr("没有待审"), "review", revN > 0],
    [tr("今天未汇报"), needN, needN ? tr("今天还没报") : tr("都报过了"), "need", needN > 0],
    [tr("已逾期"), myLate, myLate ? tr("尽快处理") : tr("没有逾期"), "late", myLate > 0],
  ].map(([t, n, s, k, bad]) =>
    `<button class="${bad ? "bad " : ""}${f === k ? "on" : ""}" data-td-filter="${k}"><span>${esc(t)}</span><b>${n}</b><span>${esc(s)}</span></button>`).join("");

  const selfN = TODOS.filter((t) => t.self_set && t.status !== "done" && isMine(t)).length;
  const streak = reportStreak();
  const selfbar = `<div class="td-selfbar">
      <span>🌱 ${esc(tr("我给自己排了"))} <b>${selfN}</b> ${esc(tr("项"))}</span>
      <span>${streak ? `🔥 ${esc(tr("连续汇报"))} <b>${streak}</b> ${esc(tr(`${streak} 天`))}` : esc(tr("今天报一项，开始连击"))}</span>
      <button data-td-filter="todo">${esc(tr("看我的"))} →</button></div>`;

  const body = list.length
    ? todoSection("⏳ " + tr("等我审核"), pend, "pend") +
      todoSection("★ " + tr("重要"), imp) + todoSection("⚠ " + tr("已逾期"), late, "late") +
      todoSection(tr("今天到期"), today) + todoSection(tr("接下来"), soon) +
      todoSection(tr("无截止"), none) + todoSection("✓ " + tr("已完成"), fin, "done")
    : `<div class="card"><div class="empty">${esc(tr(f === "all" ? "还没有待办，点右下角「＋」记一条。" : "这个筛选下没有内容。"))}</div></div>`;

  const lm = lateForMe();
  const banner = lm.length
    ? `<div class="td-alert">⚠ ${lm.length} ${esc(tr("条已逾期"))} · ${esc(tr("最久"))} ${esc(tr(`${Math.max(...lm.map((t) => -daysLeft(t.due)))} 天`))}
        <button data-td-filter="late">${esc(tr("看已逾期"))} →</button></div>`
    : "";
  const rv = revN ? `<div class="td-alert td-alert-rev">⏳ ${esc(tr(`${revN} 条等你审核`))}
        <button data-td-filter="review">${esc(tr("去审核"))} →</button></div>` : "";
  const who = f.startsWith("p:") ? `<div class="td-who-bar">${esc(tr("正在看"))} ${esc(nameOf(f.slice(2)))} ${esc(tr("的任务"))}
      <button data-td-filter="all">${esc(tr("看全部"))}</button></div>` : "";
  return statsBoard(f) + rv + banner + `<div class="td-sec">👤 ${esc(tr("我的今天"))}</div><div class="td-kpi">${kpi}</div>${selfbar}
    <div class="td-filters">${TODO_FILTERS.map(chip).join("")}</div>${who}
    <div class="td-rule">ℹ️ ${esc(tr("规则：负责人点「提交完成」，发起人审核通过才算完成"))}</div>` + body +
    `<button class="fin-fab" id="td_new">＋ ${esc(tr("新待办"))}</button>`;
}

const nameOf = (login) => {
  const p = TPEOPLE.find((x) => x.login === login);
  const t = TODOS.find((x) => x.owner === login);
  return (p && p.name) || (t && t.owner_name) || login;
};

/* 置顶统计：谁手上还有多少事（未完成 / 未跟踪 / 逾期）。所有人都看得见，自己排第一个 */
function statsBoard(f) {
  const me = tdMe();
  const agg = {};
  for (const t of TODOS) {
    if (t.status === "done" || !t.owner) continue;
    const p = agg[t.owner] = agg[t.owner] || { login: t.owner, name: t.owner_name || nameOf(t.owner), open: 0, need: 0, late: 0, rev: 0 };
    p.open++;
    if (t.status === "doing" && !reportedToday(t)) p.need++;
    if (t.status === "submitted") p.rev++;
    if (overdue(t)) p.late++;
  }
  const rows = Object.values(agg);
  if (!agg[me]) rows.push({ login: me, name: S.user.name || me, open: 0, need: 0, late: 0, rev: 0 });
  rows.sort((a, b) => (a.login === me ? -1 : b.login === me ? 1 : b.need - a.need || b.open - a.open));
  const tot = rows.reduce((s, r) => ({ open: s.open + r.open, need: s.need + r.need }), { open: 0, need: 0 });
  const rowsHtml = rows.map((r) => {
    const k = r.login === me ? "todo" : "p:" + r.login;
    return `<button class="td-brow${r.login === me ? " me" : ""}${f === k ? " on" : ""}" data-td-filter="${esc(k)}">
        <i>${esc(String(r.name).trim().slice(0, 1))}</i>
        <b>${esc(r.name)}${r.login === me ? `<em>${esc(tr("我"))}</em>` : ""}</b>
        <span class="td-num">${esc(tr("未完成"))} <b>${r.open}</b></span>
        ${r.rev ? `<span class="td-num rev">${esc(tr("待审"))} <b>${r.rev}</b></span>` : ""}
        <span class="td-num${r.need ? " bad" : ""}">${esc(tr("未跟踪"))} <b>${r.need}</b></span>
        ${r.late ? `<span class="td-num late">${esc(tr("逾期"))} <b>${r.late}</b></span>` : ""}
      </button>`;
  }).join("");
  return `<div class="td-board">
      <div class="td-board-h">👥 ${esc(tr("谁手上还有多少事"))}
        <span>${esc(tr("未完成"))} ${tot.open} · ${esc(tr("未跟踪"))} ${tot.need}</span></div>
      <div class="td-board-list">${rowsHtml}</div></div>`;
}

/* ---------- 详情抽屉：留言 / 回复 / 汇报 / 提交 / 审核都在这里，不用来回切页 ---------- */
function tdOpenPanel(id) {
  TD_PANEL = id;
  TD_ACT = null;
  TD_REPLY = null;
  if (!document.getElementById("td_pdim")) {
    document.body.insertAdjacentHTML("beforeend",
      `<div class="td-pdim" id="td_pdim"></div><aside class="td-panel" id="td_panel"></aside>`);
    document.getElementById("td_pdim").onclick = tdClosePanel;
  }
  document.body.classList.add("td-open");
  paintPanel();
}

function tdClosePanel() {
  TD_PANEL = ""; TD_ACT = null; TD_REPLY = null; TD_SCROLL = null;
  ["td_pdim", "td_panel"].forEach((k) => { const el = document.getElementById(k); if (el) el.remove(); });
  document.body.classList.remove("td-open");
}

function tdActBox(t) {

    t.imp ? `<span class="pill td-imp">★ ${esc(tr("重要"))}</span>` : "",
    t.scope === "company" ? `<span class="pill td-co">${esc(tr("公司事项"))}</span>` : "",
    t.scope === "person" ? `<span class="pill">${esc(tr("指派"))}</span>` : "",
    t.self_set ? `<span class="pill td-self">${esc(tr("自定"))}</span>` : "",
  ].filter(Boolean).join("");
  const dueTxt = dl === null ? tr("无截止") : late ? `${tr("逾期")} ${tr(`${-dl} 天`)}` : dl === 0 ? tr("今天到期") : `${esc(t.due)} · ${tr(`${dl} 天`)}`;
  const bar = [
    canSubmit(t) ? `<button class="pri" data-td-act="submit" data-td-id="${t.id}">📤 ${esc(tr("提交完成"))}</button>` : "",
