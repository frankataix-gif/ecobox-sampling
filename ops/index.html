  const stmt = d.stmt;
  const canEdit = !!FIN.bankAll;
  const nb = (v) => Number(v) || 0;
  const one = (v) => Math.round(v * 100) / 100;
  let note = stmt.note || "";
  /* 按日期从旧到新；同一天保持录入顺序 */
  const txs = (d.txs || []).map((t, i) => Object.assign({}, t, { _o: i }))
    .sort((a, b) => String(a.d).localeCompare(String(b.d)) || a._o - b._o)
    .map((t) => ({
      id: t.id, d: t.d || "", descr: t.descr || "", ref: t.ref || "",
      debit: nb(t.debit), credit: nb(t.credit), bal: nb(t.bal),
      cat: t.cat || "", entry_id: t.entry_id || "", state: t.state || "new", note: t.note || "",
    }));
  const open0 = nb(stmt.open_bal), close1 = nb(stmt.close_bal);
  const hasClose = stmt.close_bal !== "" && stmt.close_bal !== null && stmt.close_bal !== undefined;
  const who = stmt.uid === FINCO ? tr(`公司账户`) : finNameOf(stmt.uid);
  const find = (tid) => txs.find((x) => x.id === tid);

  const wire = () => {
    box.onclick = (e) => { if (e.target === box) box.remove(); };
    $("#bk_close", box).onclick = () => box.remove();
    const nEl = $("#bk_note2", box);
    nEl.oninput = () => { note = nEl.value; };
    box.querySelectorAll("[data-bkok]").forEach((b) => (b.onclick = () => {
      const t = find(b.dataset.bkok);
      t.state = t.state === "matched" ? "new" : "matched";
      paint();
    }));
    box.querySelectorAll("[data-bkign]").forEach((b) => (b.onclick = () => {
      const t = find(b.dataset.bkign);
      t.state = t.state === "ignored" ? "new" : "ignored";
      paint();
    }));
    box.querySelectorAll("[data-bkcat]").forEach((sel) => {
      sel.onchange = () => { const t = find(sel.dataset.bkcat); if (t) t.cat = sel.value; };
    });
    if ($("#bk_all", box)) $("#bk_all", box).onclick = () => {
      txs.forEach((t) => { if (t.state !== "ignored") t.state = "matched"; });
      paint();
    };
    if ($("#bk_save", box)) $("#bk_save", box).onclick = async () => {
      const btn = $("#bk_save", box);
      btn.disabled = true;
      const allDone = txs.length > 0 && txs.every((t) => t.state === "matched" || t.state === "ignored");
      try {
        await api(`/fin/bank/${encodeURIComponent(stmt.id)}/tx`, { method: "POST", body: { txs }, quiet: true });
        await api("/fin/bank/" + encodeURIComponent(stmt.id), {
          method: "PATCH", body: { note, ...(allDone ? { status: "checked" } : {}) }, quiet: true,
        });
        box.remove();
        await loadFin(); render();
        toast(allDone ? tr(`全部核完，已标记核对完成`) : `${tr(`已保存`)} ${txs.filter((t) => t.state === "matched").length}/${txs.length}`);
      } catch (e) { btn.disabled = false; toast(e.message, "bad"); }
    };
    if ($("#bk_diff", box)) $("#bk_diff", box).onclick = async () => {
      try {
        await api("/fin/bank/" + encodeURIComponent(stmt.id), { method: "PATCH", body: { status: "diff", note }, quiet: true });
        box.remove(); await loadFin(); render(); toast(tr(`已标记为有差异`));
      } catch (e) { toast(e.message, "bad"); }
    };
    if ($("#bk_del", box)) $("#bk_del", box).onclick = async () => {
      if (!confirm(tr(`删除这份水单？逐笔记录一起删掉；从原件数字化来的，原件还留在档案里。`))) return;
      try {
        await api("/fin/bank/" + encodeURIComponent(stmt.id), { method: "DELETE", quiet: true });
        box.remove(); await loadFin(); bankMonthBack(); render(); toast(tr(`水单已删除`));
      } catch (e) { toast(e.message, "bad"); }
    };
  };

  const paint = () => {
    const sumIn = one(txs.reduce((a, t) => a + t.credit, 0));
    const sumOut = one(txs.reduce((a, t) => a + t.debit, 0));
    const calc = one(open0 + sumIn - sumOut);
    const gap = one(calc - close1);
    const okN = txs.filter((t) => t.state === "matched").length;
    const skipN = txs.filter((t) => t.state === "ignored").length;
    const pend = txs.filter((t) => t.state === "new");
    const pendIn = one(pend.reduce((a, t) => a + t.credit, 0));
    const pendOut = one(pend.reduce((a, t) => a + t.debit, 0));
    const stName = stmt.status === "checked" ? tr(`已核对`) : stmt.status === "diff" ? tr(`有差异`) : tr(`待核对`);
    const chk = hasClose
      ? `<div class="bk-chk${Math.abs(gap) > 0.01 ? " bad" : ""}">${esc(tr(`期初`))} ${finMoney(open0)} + ${esc(tr(`进`))} ${finMoney(sumIn)} − ${esc(tr(`出`))} ${finMoney(sumOut)} = ${finMoney(calc)}
          ${Math.abs(gap) > 0.01 ? `<b>${esc(tr(`和期末差`))} ${finMoney(gap)}</b>` : `<b class="ok">✓ ${esc(tr(`和期末一致`))}</b>`}</div>`
        + (Math.abs(gap) > 0.01
          ? `<div class="mut" style="margin:-4px 0 8px">${esc(tr(`逐笔合计和表头期末对不上，多半有行没解析出来，请对照原件补`))}</div>`
          : "")
      : "";
    let run = open0;
    const rows = txs.map((t) => {
      run = one(run + t.credit - t.debit);
      const bal = t.bal || run;
      const amt = t.debit || t.credit;
      return `<div class="bk-tx ${esc(t.state)}">
        <div class="l1"><span class="d">${esc(String(t.d).slice(5) || "—")}</span>
          <span class="m">${esc(t.descr || tr(`（没写摘要）`))}${t.ref ? ` <small class="mut">${esc(t.ref)}</small>` : ""}</span>
          <b class="${amt ? (t.debit ? "out" : "in") : "mut"}">${amt ? (t.debit ? "-" : "+") + finMoney(amt) : "—"}</b></div>
        <div class="l2"><em class="mut">${esc(tr(`余额`))} ${finMoney(bal)}</em>
          ${canEdit ? bankCatSel(t.cat, t.id) : `<em>${esc(finCatName(t.cat))}</em>`}
          ${canEdit ? `<button class="ghost" data-bkok="${esc(t.id)}">${esc(t.state === "matched" ? tr(`✓ 已核`) : tr(`☐ 待核`))}</button>` : ""}
          ${canEdit ? `<button class="ghost" data-bkign="${esc(t.id)}">${esc(t.state === "ignored" ? tr(`↺ 恢复`) : tr(`不管这行`))}</button>` : ""}
        </div></div>`;
    }).join("");
    box.innerHTML = `<div class="fin-sheet">
      <h3>${esc(who)} · ${esc([(finCardFind(stmt.card_id) || {}).name, stmt.bank || tr(`银行`)].filter(Boolean).join(" · "))}</h3>
      <div class="mut" style="margin-bottom:8px">${esc(stmt.pf)} → ${esc(stmt.pt)} · ${esc(stmt.acct_no || "")} · ${esc(stmt.ccy || "ZMW")} · ${txs.length} ${esc(tr(`笔`))} · ${esc(stName)}${stmt.checked_by ? ` · ${esc(tr(`核对人`))} ${esc(finNameOf(stmt.checked_by))}` : ""}</div>
      ${chk}
      <div class="acts" style="margin:8px 0">
        ${stmt.doc_id || stmt.file_key
          ? `<a class="ghost" href="/api/fin/bank${stmt.doc_id ? "docs/" + encodeURIComponent(stmt.doc_id) : "/" + encodeURIComponent(stmt.id)}/file" target="_blank" rel="noopener">${esc(tr(`看水单原件`))}</a>`
          : `<span class="mut">${esc(tr(`没有原件`))}</span>`}
        ${canEdit ? `<button class="ghost" id="bk_diff">${esc(tr(`标有差异`))}</button>` : ""}
        ${canEdit ? `<button class="ghost dz" id="bk_del">${esc(tr(`删除`))}</button>` : ""}
      </div>
      <div class="fin-fr hd"><span>${esc(tr(`逐笔（按日期）`))}</span><b>${esc(tr(`进 / 出`))}</b><i>${esc(tr(`已核`))}</i><i>${esc(tr(`笔`))}</i></div>
      <div class="fin-fr"><span>${esc(tr(`合计`))}</span><b>+${finMoney(sumIn)} / -${finMoney(sumOut)}</b><i>${okN}${skipN ? `+${skipN}` : ""}</i><i>${txs.length}</i></div>
      <div class="bk-list">${rows || `<div class="empty">${esc(tr(`这份水单没有逐笔明细`))}</div>`}</div>
      <div class="mut" style="margin:8px 0">${esc(tr(`还没核`))}：${esc(tr(`进`))} ${finMoney(pendIn)} · ${esc(tr(`出`))} ${finMoney(pendOut)}</div>
      <label>${esc(tr(`差异说明 / 备注`))}</label>
      <input id="bk_note2" value="${esc(note)}">
      <div class="acts" style="margin:8px 0 4px">
        ${canEdit ? `<button class="ghost" id="bk_all">${esc(tr(`全部标已核`))}</button>` : ""}
        ${canEdit ? `<button id="bk_save">${esc(tr(`保存核对`))}</button>` : ""}
        <button class="ghost" id="bk_close">${esc(tr(`关闭`))}</button>
      </div>
    </div>`;
    wire();
  };

  paint();
}

/* ---------- 照片区（记一笔 / 编辑 / 取现 共用） ---------- */
function finPhotoHtml(p) {
  return `<label>${esc(tr(`单据照片`))} <span id="${p}_phn" style="font-weight:400;color:var(--mut)">0/6</span></label>
    <div class="r" style="gap:8px;margin-bottom:6px">
      <button class="ghost" type="button" id="${p}_cam">${esc(tr(`📷 拍照`))}</button>
      <button class="ghost" type="button" id="${p}_alb">${esc(tr(`🖼 从相册选`))}</button>
    </div>
    <input id="${p}_cam_in" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="${p}_alb_in" type="file" accept="image/*" multiple style="display:none">
    <div class="ph" id="${p}_ph"></div>`;
}

function finPhotoWire(box, p, initial, dir) {
  const state = { list: Array.isArray(initial) ? initial.slice(0, 6) : [], busy: false };
  const phBox = $("#" + p + "_ph", box), phN = $("#" + p + "_phn", box), msgEl = $("#" + p + "_msg", box);
  const draw = () => {
    phBox.innerHTML = state.list.map((k, i) => `<span class="pht"><img src="/api/fin/photo/${k}" data-phv="/api/fin/photo/${k}" alt=""><b data-delph="${i}" title="${esc(tr(`移除`))}">×</b></span>`).join("");
    phN.textContent = state.list.length + "/6";
    phBox.querySelectorAll("[data-delph]").forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); state.list.splice(+b.dataset.delph, 1); draw(); });
    phBox.querySelectorAll("[data-phv]").forEach((im) => im.onclick = () => finView(im.dataset.phv));
  };
  const addFiles = async (files) => {
    const list = [...files].slice(0, Math.max(0, 6 - state.list.length));
    if (!list.length) { if (msgEl) msgEl.textContent = "最多 6 张，先移除一些再添加"; return; }
    let fail = 0;
    state.busy = true;
    try {
      for (let i = 0; i < list.length; i++) {
        if (msgEl) msgEl.textContent = tr("上传中…") + " (" + i + "/" + list.length + ")";
        const key = await finUpload(list[i], msgEl, dir);
        if (key) state.list.push(key); else fail++;
        draw();
      }
    } finally { state.busy = false; }
    if (msgEl) {
      msgEl.textContent = fail ? "有 " + fail + " 张没传上" : "已添加 " + list.length + " 张";
      if (fail) toast("有 " + fail + " 张照片没传上，先别保存", "bad");
      setTimeout(() => { if (/^(已添加|有 )/.test(msgEl.textContent)) msgEl.textContent = ""; }, 2500);
    }
  };
  $("#" + p + "_cam", box).onclick = () => $("#" + p + "_cam_in", box).click();
  $("#" + p + "_alb", box).onclick = () => $("#" + p + "_alb_in", box).click();
  $("#" + p + "_cam_in", box).onchange = async (e) => { const f = [...e.target.files]; e.target.value = ""; await addFiles(f); };
  $("#" + p + "_alb_in", box).onchange = async (e) => { const f = [...e.target.files]; e.target.value = ""; await addFiles(f); };
  draw();
  return state;
}

/* 上次用过的 分类 / 渠道 / 归属：日常记账预填，少点几下 */
const finLastUse = () => { try { return JSON.parse(localStorage.getItem("ops_fin_last") || "{}"); } catch (e) { return {}; } };
const saveFinLast = (o) => { try { localStorage.setItem("ops_fin_last", JSON.stringify(o)); } catch (e) {} };

function finSheet(presetTo, presetKind, editEntry) {
  const canAll = FIN.canAll;
  const viewUid = FINWHO && FINWHO !== "ALL" ? FINWHO : FIN.me.uid;
  const people = canAll ? finPeople().map((u) => u.login) : [FIN.me.uid];
  /* 归属（大类）→ 分类（细类）：两级联动，项目/矿权维护的自定义项来自 fin_cfg.cats */
  const opt = (k) => `<option value="${esc(k)}">${esc(finCatName(k))}</option>`;
  const catsOf = (ft) => {
    const base = (FIN_FT_CATS[ft] || []).filter((k) => FIN_CAT_ZH[k]);
    const custom = ((FIN.cats && FIN.cats[ft]) || []).filter(Boolean);
    const extra = ft === "life" ? ["u:员工工资"] : [];
    return [...new Set([...base, ...custom, ...extra])];
  };
  const catsHtml = (ft, cur) => {
    const list = catsOf(ft);
    if (cur && !list.includes(cur)) list.unshift(cur);
    return list.length ? list.map(opt).join("") : `<option value="">${esc(tr(`（暂无，先「改分类」添加）`))}</option>`;
  };
  const ftHtml = FIN_FT.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join("");
  const last = editEntry ? null : finLastUse();
  const initFt = editEntry ? (FIN_FT_CATS[editEntry.ft] ? editEntry.ft : (FIN_CAT_FT[editEntry.cat] || "life"))
    : (last && FIN_FT_CATS[last.ft] ? last.ft : "life");
  const edit = editEntry || null;
  const d = edit || {};
  const initKind = edit ? edit.kind : (presetTo || presetKind === "float" ? "float" : "out");
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet">
    <h3>${edit ? "修改记录" : "记一笔"}</h3>
    <label>${esc(tr(`类型`))}</label>
    <select id="ff_kind"${edit ? " disabled" : ""}><option value="out">${esc(tr(`支出`))}</option><option value="in">${esc(tr(`收入`))}</option>${FIN.owner ? `<option value="float">${esc(tr(`发备用金`))}</option>` : ""}</select>
    <div class="r" style="margin-top:8px">
      <div><label>${esc(tr(`金额 ZMW`))} <i class="req">*</i></label><input id="ff_amt" type="text" inputmode="decimal" data-money="1" value="${edit ? finMoney(d.amount) : ""}"></div>
      <div><label>${esc(tr(`日期`))}</label><input id="ff_date" type="date" value="${esc(edit ? d.date : new Date().toISOString().slice(0, 10))}"></div>
    </div>
    <label>${esc(tr(`备注`))} <i class="req">*</i></label><input id="ff_note" placeholder="${esc(tr(`比如：去矿区打车`))}" value="${esc(d.note || "")}">
    <div id="ff_out">
      <div class="row3" style="margin-top:8px">
        <div><label>${esc(tr(`归属`))}</label><select id="ff_ft">${ftHtml}</select></div>
        <div><label>${esc(tr(`分类`))}</label><select id="ff_cat">${catsHtml(initFt, edit ? d.cat : null)}</select></div>
        <div><label>${esc(tr(`渠道`))}</label><select id="ff_ch"><option value="cash">${esc(tr(`现金`))}</option><option value="card">${esc(tr(`银行`))}</option></select></div>
      </div>
      <div id="ff_cardwrap" class="hide" style="margin-top:8px">
        <label>${esc(tr(`哪张卡`))}</label>
        <select id="ff_card"></select>
        <div class="mut" style="margin:4px 0 0">${esc(tr(`银行账要落到具体的卡上，账单才核得动`))}</div>
      </div>
      <div class="mut" id="ff_cat_hint" style="display:none;margin:6px 0 0"></div>
      <div id="ff_invwrap" style="margin-top:8px">
        <div class="fin-seg" style="margin:0">
          <button type="button" data-inv="0">${esc(tr(`无发票`))}</button>
          <button type="button" data-inv="1">${esc(tr(`有发票`))} <i class="req" id="ff_inv_req" style="display:none">*</i></button>
        </div>
        <div class="mut" id="ff_inv_hint" style="display:none;margin:6px 0 0">${esc(tr(`有发票要上传发票照片（最多 6 张）`))}</div>
      </div>
      <label>${esc(tr(`记在谁名下`))}</label>${(!edit && FIN.canCo)
        ? `<select id="ff_uid"><option value="${esc(FIN.me.uid)}" ${viewUid !== FINCO ? "selected" : ""}>${esc(finNameOf(FIN.me.uid))}</option><option value="${FINCO}" ${viewUid === FINCO ? "selected" : ""}>${esc(tr(`公司账户`))}</option></select>`
        : `<div class="mut" style="margin:-2px 0 2px">${esc(finNameOf(edit ? d.uid : FIN.me.uid))}</div>`}
    </div>
    <div id="ff_fl" class="hide">
      <div class="r"><div><label>${esc(tr(`从谁出`))}</label><div class="mut" style="margin:-2px 0 2px">${esc(finNameOf(edit ? d.uid : FIN.me.uid))}</div></div>
      <div><label>${esc(tr(`从哪个口`))}</label><select id="ff_from"><option value="cash">${esc(tr(`现金`))}</option><option value="card">${esc(tr(`银行`))}</option></select></div></div>
      <label>${esc(tr(`发给谁`))}</label><select id="ff_to">${people.filter((p) => p !== (edit ? d.uid : FIN.me.uid)).map((p) => `<option value="${esc(p)}">${esc(finNameOf(p))}</option>`).join("")}</select>
    </div>
    ${finPhotoHtml("ff")}
    <p class="mut" id="ff_msg" style="min-height:1em;margin:8px 0 0"></p>
    <div class="r" style="margin-top:8px"><button class="ghost" id="ff_x">${esc(tr(`取消`))}</button><button id="ff_save">${edit ? "保存修改" : "保存"}</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#ff_x", box).onclick = close;
  const setKind = (k) => {
    const fl = k === "float";
    $("#ff_kind", box).value = k;
    $("#ff_out", box).classList.toggle("hide", fl);
    $("#ff_fl", box).classList.toggle("hide", !fl);
  };
  setKind(initKind);
  let INV = edit ? (Number(d.inv) ? 1 : 0) : 0;
  const paintInv = () => {
    box.querySelectorAll("[data-inv]").forEach((b) => b.classList.toggle("on", +b.dataset.inv === INV));
    const req = $("#ff_inv_req", box);
    if (req) req.style.display = INV ? "inline" : "none";
    const hint = $("#ff_inv_hint", box);
    if (hint) hint.style.display = INV ? "block" : "none";
  };
  box.querySelectorAll("[data-inv]").forEach((b) => b.onclick = () => { INV = +b.dataset.inv; paintInv(); });
  paintInv();
  const ftSel = $("#ff_ft", box), catSel = $("#ff_cat", box);
  ftSel.value = initFt;
  if (edit) {
    if (d.cat) catSel.value = d.cat;
    $("#ff_ch", box).value = d.ch || "cash";
    $("#ff_from", box).value = d.ch || "cash";
    if ($("#ff_to", box)) $("#ff_to", box).value = d.to_uid || "";
    if ($("#ff_uid", box)) $("#ff_uid", box).value = d.uid || FIN.me.uid;
  } else if (presetTo) {
    if ($("#ff_to", box)) $("#ff_to", box).value = presetTo;
  }
  if (!edit && last) {
    /* 日常记账少点几下：沿用上次的 分类 / 渠道 / 归属（往来科目不记） */
    if (last.cat && !FIN_OFFBOOK[last.cat] && catsOf(initFt).includes(last.cat)) catSel.value = last.cat;
    if (last.ch) $("#ff_ch", box).value = last.ch === "card" ? "card" : "cash";
  }
  /* 公司账户只有银行口：选中公司账户时锁死渠道并禁用「现金」 */
  const uidSel = $("#ff_uid", box), chSel = $("#ff_ch", box);
  const lockCoCh = () => {
    if (!uidSel || !chSel) return;
    const isCo = uidSel.value === FINCO;
    const cashOpt = [...chSel.options].find((o) => o.value === "cash");
    if (cashOpt) cashOpt.disabled = isCo;
    if (isCo) chSel.value = "card";
  };
  /* 选「银行」才出现卡下拉：多张卡必须挑一张，只有一张卡就默认它 */
  const cardSel = $("#ff_card", box), cardWrap = $("#ff_cardwrap", box);
  const paintCards = () => {
    if (!cardSel || !cardWrap) return;
    const owner = (uidSel && uidSel.value) || (edit ? d.uid : FIN.me.uid);
    const acctRow = (FIN.accounts || []).find((a) => a.uid === owner) || {};
    const cards = (acctRow.banks || []).filter((c) => c.id);
    const keep = (edit && edit.card_id) || cardSel.value;
    cardSel.innerHTML = cards.length
      ? cards.map((c) => `<option value="${esc(c.id)}">${esc(finCardLabel(c))}</option>`).join("")
      : `<option value="">${esc(tr(`这个账户还没登记银行卡`))}</option>`;
    if (keep && cards.some((c) => c.id === keep)) cardSel.value = keep;
    const bank = (kindNow() === "float" ? $("#ff_from", box) : chSel).value === "card";
    cardWrap.classList.toggle("hide", !bank);
  };
  const kindNow = () => $("#ff_kind", box).value;
  if (chSel) chSel.onchange = paintCards;
  if ($("#ff_from", box)) $("#ff_from", box).onchange = paintCards;
  if (uidSel) { uidSel.onchange = () => { lockCoCh(); paintCards(); }; lockCoCh(); }
  paintCards();
  /* 改别人的账：金额和渠道锁死，只能改分类 / 备注 / 发票 */
  if (edit && d.uid !== FIN.me.uid && d.uid !== FINCO && !FIN.owner) {
    $("#ff_amt", box).disabled = true;
    chSel.disabled = true;
    const fromSel = $("#ff_from", box);
    if (fromSel) fromSel.disabled = true;
    const msg = $("#ff_msg", box);
    if (msg) msg.textContent = tr("别人的金额和渠道不能改，可以改分类 / 备注 / 发票");
  }
  const paintCat = () => {
    const hint = $("#ff_cat_hint", box);
    const txt = FIN_CAT_HINT[catSel.value] || "";
    hint.textContent = txt;
    hint.style.display = txt ? "block" : "none";
  };
  ftSel.onchange = () => { catSel.innerHTML = catsHtml(ftSel.value, null); paintCat(); };
  catSel.onchange = paintCat;
  paintCat();
  $("#ff_kind", box).onchange = (e) => setKind(e.target.value);
  const PH = finPhotoWire(box, "ff", edit ? d.photos : []);
  $("#ff_save", box).onclick = async () => {
    const kind = $("#ff_kind", box).value;
    const amt = moneyNum($("#ff_amt", box).value);
    const note = $("#ff_note", box).value.trim();
    const inv = kind === "float" ? 0 : INV;
    const fail = (t) => { const m = $("#ff_msg", box); if (m) m.textContent = t; toast(t, "bad"); };
    if (PH.busy) return fail("照片还在上传，等一两秒再点保存");
    if (!(amt > 0)) return fail("金额要填（大于 0）");
    if (!$("#ff_date", box).value) return fail("选个日期");
    if (kind !== "move" && !note) return fail("备注要填");
    if (inv && !PH.list.length) return fail("选了「有发票」就要上传发票照片");

/* ---------- CSV 导出：给会计核对 / Excel 直接打开 ---------- */
function finCsv(name, head, rows) {
  const cell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const body = [head, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function finUpload(file, msgEl, dir) {
  const data = await new Promise((res) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc) || 1; c.height = Math.round(img.height * sc) || 1;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      } catch (err) { res(""); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(""); };
    img.src = url;
  });
  if (!data) { if (msgEl) msgEl.textContent = "这张照片读不了（可能是 HEIC 或文件损坏），请换 JPG 再试"; return ""; }

    return (await api("/fin/photo", { method: "POST", body: { data, dir: dir || "" }, quiet: true })).key;
  } catch (e) { if (msgEl) msgEl.textContent = "照片没传上：" + e.message; return ""; }
}

/* 视频走原文件直传：照片那条链路会先画进 canvas 转 JPEG，视频进去就废了 */
const FD_VID_MAX = 90 * 1024 * 1024;
const FD_VID_CHUNK = 4 * 1024 * 1024;
const FD_ZIP_MIN = 18 * 1024 * 1024;
const FD_VID_EXT = { mp4: "video/mp4", m4v: "video/x-m4v", mov: "video/quicktime", webm: "video/webm", "3gp": "video/3gpp" };
const fdVideoOk = (f) => /^video\//.test(f.type || "") || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || "");
/* 有些机器给的 type 是空的或 application/octet-stream，按扩展名兜底：
   mime 存错，iOS 会直接把视频当未知文件，点开黑屏 */
function fdVideoType(f) {
  const t = String(f.type || "").toLowerCase();
  if (/^video\/(mp4|x-m4v|webm|3gpp|quicktime)$/.test(t)) return t;
  const ext = (String(f.name || "").match(/\.([a-z0-9]+)$/i) || [])[1];
  return (ext && FD_VID_EXT[ext.toLowerCase()]) || "video/mp4";
}
const fdRndId = () =>
  String(crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2))
    .replace(/[^a-z0-9]/gi, "").slice(0, 32).toLowerCase();
const fdFp = (f) => `${f.name}|${f.size}|${f.lastModified || 0}`;
const fdMB = (n) => (n / 1048576).toFixed(1);
const fdSpeed = (n) => (n > 1048576 ? fdMB(n) + "MB/s" : Math.max(1, Math.round(n / 1024)) + "KB/s");
/* 传了一半关页面/断网，下次选同一个文件接着传 */
const fdUpStore = {
  get(fp) { try { return JSON.parse(localStorage.getItem("fd_up:" + fp) || "null"); } catch (e) { return null; } },
  set(fp, v) { try { localStorage.setItem("fd_up:" + fp, JSON.stringify(v)); } catch (e) {} },
  del(fp) { try { localStorage.removeItem("fd_up:" + fp); } catch (e) {} },
};

function fdVideoPart(file, uid, i, n, type) {
  const blob = file.slice(i * FD_VID_CHUNK, Math.min(file.size, (i + 1) * FD_VID_CHUNK));
  const q = `?u=${uid}&i=${i}&n=${n}&sz=${file.size}&t=${encodeURIComponent(type)}`;
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/feed/v/part" + q);
    xhr.timeout = 120000;
    xhr.setRequestHeader("content-type", "application/octet-stream");
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return res(true);
      let d = {};
      try { d = JSON.parse(xhr.responseText); } catch (e) {}
      rej(new Error((d.error || "HTTP " + xhr.status) + tr(`（第 N 片）`).replace("N", String(i + 1))));
    };
    xhr.onerror = () => rej(new Error(tr(`网络断了`) + tr(`（第 N 片）`).replace("N", String(i + 1))));
    xhr.ontimeout = () => rej(new Error(tr(`这一片超时`) + tr(`（第 N 片）`).replace("N", String(i + 1))));
    xhr.send(blob);
  });
}

async function fdUploadVideo(file, onPct) {
  if (!fdVideoOk(file)) throw new Error(tr(`只收 MP4 / MOV / WEBM 视频`));
  if (file.size > FD_VID_MAX) throw new Error(tr(`视频太大（限 90MB）`));
  const type = fdVideoType(file);
  const n = Math.max(1, Math.ceil(file.size / FD_VID_CHUNK));
  const fp = fdFp(file);
  let st = fdUpStore.get(fp);
  if (!st || st.size !== file.size || st.n !== n || st.type !== type || !/^[a-z0-9]{16,40}$/.test(st.uid || "")) {
    st = { uid: fdRndId(), size: file.size, n, type, done: [] };
  }
  /* 服务端已经存了哪几片：换设备、重开页面都不用从头再来 */
  try {
    const r = await api(`/feed/v/status?u=${st.uid}&n=${n}`, { quiet: true });
    st.done = (r && Array.isArray(r.parts) ? r.parts : []).filter((x) => Number.isInteger(x) && x >= 0 && x < n);
  } catch (e) {}
  fdUpStore.set(fp, st);
  const t0 = Date.now();
  let done = st.done.length;
  const report = () => {
    const b = Math.min(file.size, done * FD_VID_CHUNK);
    const rate = b / Math.max(1, (Date.now() - t0) / 1000);
    if (onPct) onPct(Math.round((done / n) * 100), b, rate);
  };
  report();
  for (let i = 0; i < n; i++) {
    if (st.done.indexOf(i) >= 0) continue;
    let ok = false, last = null;
    for (let t = 0; t < 5 && !ok; t++) {
      try { await fdVideoPart(file, st.uid, i, n, type); ok = true; }
      catch (e) { last = e; if (t < 4) await new Promise((r) => setTimeout(r, Math.min(8000, 1000 * Math.pow(2, t)))); }
    }
    if (!ok) {
      fdUpStore.set(fp, st);
      const err = new Error(last ? last.message : tr(`有一片传不上去`));
      err.done = st.done.length; err.total = n; err.resumable = true;
      throw err;
    }
    st.done.push(i); done = st.done.length; fdUpStore.set(fp, st); report();
  }
  const r = await api(`/feed/v/finish?u=${st.uid}&n=${n}&sz=${file.size}&t=${encodeURIComponent(type)}`, { method: "POST", body: {}, quiet: true });
  if (!r || !r.key) throw new Error(tr(`合并分片失败`));
  fdUpStore.del(fp);
  return r.key;
}

/* ---------- 可选压缩：只有能录出 MP4（H.264+AAC）的浏览器才给这个选项，
   否则录出 webm，iPhone 打不开，反而更糟 ---------- */
function fdCanZip() {
  try {
    return typeof MediaRecorder !== "undefined" && typeof HTMLCanvasElement.prototype.captureStream === "function" &&
      !!MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/mp4;codecs="avc1.42E01E,mp4a.40.2"');
  } catch (e) { return false; }
}
function fdProbeVideo(file) {
  return new Promise((res) => {
    const u = URL.createObjectURL(file), v = document.createElement("video");
    let hit = false;
    const done = (ok) => { if (hit) return; hit = true; URL.revokeObjectURL(u); res(ok); };
    v.onloadedmetadata = () => done(v.duration > 0.2);
    v.onerror = () => done(false);
    setTimeout(() => done(false), 8000);
    v.src = u;
  });
}
async function fdZipVideo(file, preset, onPct) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.src = url; v.playsInline = true; v.preload = "auto";
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error(tr(`视频读不了`))); });
  const srcH = v.videoHeight || preset.h, srcW = v.videoWidth || Math.round((preset.h * 16) / 9);
  const sc = Math.min(1, preset.h / srcH);
  const w = Math.max(2, Math.round((srcW * sc) / 2) * 2), h = Math.max(2, Math.round((srcH * sc) / 2) * 2);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  const stream = cv.captureStream(30);
  let ac = null;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const dst = ac.createMediaStreamDestination();
    ac.createMediaElementSource(v).connect(dst);
    dst.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
  } catch (e) { ac = null; }
  const rec = new MediaRecorder(stream, {
    mimeType: 'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    videoBitsPerSecond: preset.bps, audioBitsPerSecond: 96000,
  });
  const parts = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
  const stopped = new Promise((res) => (rec.onstop = res));
  let raf = 0;
  const draw = () => { try { ctx.drawImage(v, 0, 0, w, h); } catch (e) {} raf = requestAnimationFrame(draw); };
  rec.start(1000);
  draw();
  try { await v.play(); } catch (e) {}
  await new Promise((res) => {
    const tick = () => {
      if (onPct) onPct(Math.min(99, Math.round((v.currentTime / (v.duration || 1)) * 100)));
      if (v.ended || v.paused) return res();
      setTimeout(tick, 400);
    };
    tick();
  });
  cancelAnimationFrame(raf);
  try { rec.stop(); } catch (e) {}
  await stopped;
  if (ac) try { ac.close(); } catch (e) {}
  URL.revokeObjectURL(url);
  const out = new File(parts, (file.name || "video").replace(/\.[^.]+$/, "") + ".mp4", { type: "video/mp4" });
  if (!out.size || !(await fdProbeVideo(out))) throw new Error(tr(`压出来的文件坏了`));
  return out;
}

/* ---------- 上传队列：一条一条传，失败留着片子等用户点继续 ---------- */
let FD_VJOBS = [];
let FD_VRUN = false;
function fdDrawVBox() {
  const box = $("#fd_vbox");
  if (!box) return;
  const btn = (i, act, label, pri) => `<button class="${pri ? "pri" : ""}" data-vjob="${i}:${act}">${esc(label)}</button>`;
  box.innerHTML = FD_VJOBS.map((j, i) => {
    const nm = `<div>${esc(j.file.name || tr(`视频`))} · ${fdMB(j.file.size)}MB</div>`;
    if (j.err) return `<div class="fd-vj">${nm}<div class="bad">${esc(j.err)}</div><div class="r2">${btn(i, "retry", tr(`继续上传`), true)}${btn(i, "drop", tr(`放弃`))}</div></div>`;
    if (j.mode === "ask") return `<div class="fd-vj">${nm}<div class="mut">${esc(tr(`原样上传画质最好；压一下更省流量`))}</div><div class="r2">${btn(i, "raw", tr(`原样上传`))}${btn(i, "zip", tr(`压到 1080p`), true)}</div></div>`;
    return `<div class="fd-vj">${nm}<div class="mut">${esc(j.label || "")}</div></div>`;
  }).join("");
  box.querySelectorAll("[data-vjob]").forEach((b) => {
    b.onclick = () => {
      const [i, act] = b.dataset.vjob.split(":");
      fdVJobAct(+i, act);
    };
  });
}
async function fdVJobAct(i, act) {
  const j = FD_VJOBS[i];
  if (!j) return;
  if (act === "drop") {
    const st = fdUpStore.get(fdFp(j.file));
    if (st && st.uid) api(`/feed/v/abort?u=${st.uid}`, { method: "POST", body: {}, quiet: true }).catch(() => {});
    fdUpStore.del(fdFp(j.file));
    FD_VJOBS.splice(i, 1);
    fdDrawVBox();
    return;
  }
  if (act === "raw" || act === "retry") { j.err = ""; j.mode = "up"; fdDrawVBox(); fdRunV(); return; }
  if (act === "zip") {
    j.mode = "zip"; j.label = tr(`压缩中…`);
    fdDrawVBox();
    try {
      const out = await fdZipVideo(j.file, { h: 1080, bps: 3500000 }, (p) => { j.label = tr(`压缩中…`) + " " + p + "%"; fdDrawVBox(); });
      j.file = out; j.label = ""; j.mode = "up";
      fdDrawVBox();
      toast(tr(`压好了`) + " · " + fdMB(out.size) + "MB");
      fdRunV();
    } catch (e) {
      j.mode = "up"; j.label = "";
      toast(tr(`压不了，改按原样上传：`) + e.message, "bad");
      fdRunV();
    }
  }
}
async function fdRunV() {
  if (FD_VRUN) return;
  FD_VRUN = true;
  const btn = $("#fd_send");
  try {
    for (;;) {
      const j = FD_VJOBS.find((x) => x.mode === "up");
      if (!j) break;
      if (btn) { btn.disabled = true; btn.textContent = tr(`上传中…`) + " 0%"; }
      j.label = tr(`上传中…`);
      fdDrawVBox();
      try {
        const key = await fdUploadVideo(j.file, (pct, done, rate) => {
          j.label = tr(`上传中…`) + " " + fdMB(done) + "/" + fdMB(j.file.size) + "MB " + pct + "% · " + fdSpeed(rate);
          if (btn) btn.textContent = tr(`上传中…`) + " " + pct + "%";
          fdDrawVBox();
        });
        FD_DRAFT.push({ t: "v", u: key });
        FD_VJOBS = FD_VJOBS.filter((x) => x !== j);
        drawDraft();
      } catch (e) {
        j.mode = "err";
        const prog = e.done !== undefined && e.done !== e.total ? " · " + tr(`已传`) + " " + e.done + "/" + e.total + " · " + tr(`点继续上传接着传`) : "";
        j.err = e.message + prog;
        fdDrawVBox();
        toast(tr(`视频上传失败：`) + e.message, "bad");
        break;
      }
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = FD_EDIT ? "保存" : tr(`发布`); }
    FD_VRUN = false;
  }
}

/* 单张银行卡的设置：改银行 / 账号 / 币种 / 期初，或删掉这张卡（不删整个账户） */
function finBankCardSheet(uid, idx) {
  const a = (FIN.accounts || []).find((x) => x.uid === uid) || {};
  const banks = (a.banks || []).map((x) => ({ ...x }));
  const i = idx === null || idx === undefined || idx === "" ? -1 : Number(idx);
  const cur = i >= 0 ? banks[i] || {} : {};
  const hasBal = (x) => !!x && x.bal !== null && x.bal !== undefined && x.bal !== "";
  const noneAlloc = !banks.some(hasBal);
  const cardTotal = Number(a.card) || 0;
  /* 只登记过账号、没分过期初的老账户：把账户的银行期初预填到唯一那张卡上，等于认领 */
  const preBal = hasBal(cur) ? cur.bal
    : (i < 0 && !banks.length) || (i === 0 && banks.length === 1)
      ? (noneAlloc && cardTotal ? cardTotal : "") : "";
  const box = document.createElement("div");
  box.className = "fin-dim";
  box.innerHTML = `<div class="fin-sheet">
    <h3>${esc(tr(i >= 0 ? `银行账户设置` : `＋ 添加银行卡`))}</h3>
    <label>${esc(tr(`银行`))}</label>
    <input id="bc_bank" maxlength="40" value="${esc(cur.bank || "")}">
    <label>${esc(tr(`卡名 / 用途（可选）`))}</label>
    <input id="bc_name" maxlength="30" value="${esc(cur.name || "")}" placeholder="${esc(tr(`经营户 / 工资户 / USD 结算`))}">
    <label>${esc(tr(`户名（可选）`))}</label>
    <input id="bc_holder" maxlength="60" value="${esc(cur.holder || "")}" placeholder="${esc(tr(`银行登记的账户名`))}">
    <div class="row3">
      <div><label>${esc(tr(`币种`))}</label><select id="bc_ccy">${FIN_CCY.map((c) => `<option value="${c}"${(cur.ccy || "ZMW") === c ? " selected" : ""}>${c}</option>`).join("")}</select></div>
      <div><label>${esc(tr(`账号`))}</label><input id="bc_no" maxlength="40" inputmode="numeric" value="${esc(cur.no || "")}"></div>
      <div><label>${esc(tr(`期初余额`))}</label><input id="bc_bal" type="text" inputmode="decimal" data-money="1" value="${preBal === "" ? "" : finMoney(preBal)}"></div>
    </div>
    <div class="mut" id="bc_msg" style="margin:6px 0"></div>
    <div class="acts">
      <button class="pri" id="bc_save">${esc(tr(`保存`))}</button>
      ${i >= 0 ? `<button class="danger" id="bc_del">${esc(tr(`删除这张卡`))}</button>` : ""}
      <button class="ghost" id="bc_cancel">${esc(tr(`取消`))}</button>
    </div>
    <div class="mut" style="margin-top:6px">${esc(tr(`期初就是这张卡在基准日的余额；保存后账户的「银行期初」按各卡合计重算，流水不动。`))}</div>
  </div>`;
  document.body.appendChild(box);
  const msg = (t, bad) => { const el = $("#bc_msg", box); el.textContent = t; el.style.color = bad ? "#b91c1c" : ""; };
  const save = (next, toastMsg) => {
    const card = Math.round(next.reduce((s, x) => s + (hasBal(x) ? Number(x.bal) || 0 : 0), 0) * 100) / 100;
    return api("/fin/accounts/" + encodeURIComponent(uid), { method: "PUT", body: { name: finNameOf(uid), banks: next, card }, toast: toastMsg });
  };
  $("#bc_cancel", box).onclick = () => box.remove();
  $("#bc_save", box).onclick = async () => {
    const bank = $("#bc_bank", box).value.trim();
    const no = $("#bc_no", box).value.trim();
    if (!bank && !no) return msg(tr("银行和账号至少填一个"), true);
    const rec = { bank, no, ccy: $("#bc_ccy", box).value || "ZMW",
      name: $("#bc_name", box).value.trim(), holder: $("#bc_holder", box).value.trim() };
    if (i >= 0 && cur.id) rec.id = cur.id;
    const raw = $("#bc_bal", box).value.trim();
    if (raw !== "") rec.bal = moneyNum(raw);
    const next = banks.slice();
    if (i >= 0) next[i] = rec; else next.push(rec);
    try {
      await save(next, tr("已保存"));
      box.remove();
      await loadFin(); render();
    } catch (e) { msg(e.message, true); }
  };
  const del = $("#bc_del", box);
  if (del) del.onclick = async () => {
    const label = [cur.bank, cur.no].filter(Boolean).join(" · ") || tr("这张卡");
    if (!confirm(tr(`删除「${label}」？银行期初按剩下的卡重算，历史流水不动。`))) return;
    try {
      await save(banks.filter((_, k) => k !== i), tr("已删除"));
      box.remove();
      await loadFin(); render();
    } catch (e) { msg(e.message, true); }
  };
}

function bindFinAcct() {
  const pane = $("#pane");
  const val = (uid, f) => {
    const el = pane.querySelector(`[data-set="${uid}"] [data-f="${f}"]`);
    return el ? el.value.trim() : "";
  };
  const put = (uid, body, toastMsg) =>
    api("/fin/accounts/" + encodeURIComponent(uid), { method: "PUT", body: { name: finNameOf(uid), ...body }, toast: toastMsg });

  pane.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const uid = b.dataset.save;
    try {
      await put(uid, { cash: moneyNum(val(uid, "cash")), card: moneyNum(val(uid, "card")), since: val(uid, "since") }, "已保存");
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  });

  pane.querySelectorAll("[data-init]").forEach((b) => b.onclick = async () => {
    const uid = b.dataset.init;
    if (!confirm(tr(`把「${finNameOf(uid)}」的期初清 0、对账基准改成今天？历史收支不动。`))) return;
    try {
      await put(uid, { cash: 0, card: 0, since: FIN_START }, tr("已初始化"));
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  });

  pane.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
    const uid = b.dataset.rm;
    if (!confirm(tr(`删除「${finNameOf(uid)}」的账户设置？期初会清零，账目记录保留。`))) return;
    try {
      await api("/fin/accounts/" + encodeURIComponent(uid), { method: "DELETE", toast: "已删除" });

    } catch (e) { toast(e.message, "bad"); }
  });

  /* 银行账号：一加一删都立刻落到账户设置里，不跟「保存」混在一起 */
  const banksOf = (uid) => ((FIN.accounts || []).find((x) => x.uid === uid) || {}).banks || [];

    if (!bank && !no) { toast(tr("银行和账号至少填一个"), "bad"); return; }
    const next = [...banksOf(uid), { bank, no, ccy, name }];
    try {
      await put(uid, { banks: next }, tr("账号已加"));
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-bset]").forEach((b) => b.onclick = () => {
    const [uid, i] = b.dataset.bset.split(":");
    finBankCardSheet(uid, i);
  });

  const nb = $("#fa_new");
  if (nb) nb.onclick = async () => {
    const uid = $("#fa_new_uid").value;
    try {
      await put(uid, { cash: 0, card: 0, since: FIN_START }, tr("已创建"));
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  };

  const fc = $("#fin_cats");
  if (fc) fc.onclick = async () => {
    const life = prompt(tr("生活 · 自定义分类（逗号分隔，可留空）"), (FIN.cats.life || []).join(","));
    if (life === null) return;
    const project = prompt(tr("项目（逗号分隔，可留空）"), (FIN.cats.project || []).join(","));
    if (project === null) return;
    const licence = prompt(tr("矿权维护 · 矿证（逗号分隔，可留空）"), (FIN.cats.licence || []).join(","));
    if (licence === null) return;
    try {
      await api("/fin/cats", { method: "PUT", body: {
        life: life.split(",").map((x) => x.trim()).filter(Boolean),
        project: project.split(",").map((x) => x.trim()).filter(Boolean),
        licence: licence.split(",").map((x) => x.trim()).filter(Boolean),
        names: FIN.cats.names || {},
      }, toast: "分类已更新" });
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  };

  const fm = $("#fin_merge");
  if (fm) fm.onclick = async () => {
    try {
      const pre = await api("/fin/cats/merge?dry=1", { method: "POST", quiet: true });
      if (!pre.total && !pre.ftFixed) return toast("没有要合并的老分类");
      const detail = Object.entries(pre.map || {}).filter(([, v]) => v.n)
        .map(([k, v]) => `${finCatName(k)} ${v.n} 条 → ${finCatName(v.to)}`);
      if (pre.ftFixed) detail.push(`${pre.ftFixed} 条 借款/家庭开支 的归属改为「往来」`);
      if (!confirm(tr("整理老分类？") + "\n\n" + detail.join("\n"))) return;
      const r = await api("/fin/cats/merge", { method: "POST", toast: "分类已合并" });
      toast(`合并 ${r.total} 条，归属修正 ${r.ftFixed} 条`);
      await loadFin(); render();
    } catch (e) { toast(e.message, "bad"); }
  };
}

    + (canDel ? `<button data-act="del" class="dz">${esc(tr(`删除`))}</button>` : "");
  document.body.appendChild(m);
  m.querySelector('[data-act="edit"]').onclick = () => { closeFinMenu(); if (e.kind === "transfer") finTransferSheet(e); else finSheet(null, null, e); };

  if (delBtn) delBtn.onclick = async () => {
    closeFinMenu();
    if (!confirm(tr("删除这条记录？"))) return;
    try { await api("/fin/entries/" + encodeURIComponent(e.id), { method: "DELETE", toast: "记录已删除" }); await loadFin(); render(); }
    catch (err) { toast(err.message, "bad"); }
  };
  setTimeout(() => document.addEventListener("click", closeFinMenu, { once: true }), 0);
}

/* ---------- 导航 ---------- */
const GROUPS = ["财务", "日常协同", "业务现场", "资产", "系统"];
function groupMods(g) {
  return MODS.filter((m) => m.g === g && allowed(m.k) && (!m.soon || S.user.role === "admin"));
}

/* 根页面：看得见页签；其余都是「点进去的独立页」，只有返回 */
const ROOT = (t) => t === "home" || t === "status" || String(t).startsWith("g:");
function tabUrl(k) {
  const h = !k || k === "home" ? "" : "#" + encodeURIComponent(k);
  return location.pathname + location.search + h;
}

function enterApp(k, opts = {}) {
  if (k === S.tab) { S.editId = 0; S.editUid = 0; render(); return; }
  S.stack.push(S.tab);
  if (ROOT(k)) S.stack = [];
  if (S.stack.length > 20) S.stack.shift();
  S.tab = k; S.editId = 0; S.editUid = 0; S.fresh = true;
  if (!opts.noHist) { try { history.pushState({ t: k }, "", tabUrl(k)); } catch (e) {} }
  try { window.scrollTo(0, 0); } catch (e) {}
  render();
}
function goBack() {
  const to = S.stack.pop() || "home";
  S.tab = to; S.editId = 0; S.editUid = 0; S.fresh = true;
  try { history.replaceState({ t: to }, "", tabUrl(to)); } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
  render();
}
function goHome() { S.stack = []; enterApp("home"); }
window.addEventListener("popstate", (e) => {
  const t = (e.state && e.state.t) || "home";
  S.tab = t; S.editId = 0; S.editUid = 0; S.stack = []; S.fresh = true;
  render();
});
function syncChrome() {
  /* 根页面留着页签；进了应用就变成独立页：只剩「← 标题」 */
  const root = ROOT(S.tab);
  const tabs = $("#tabs"); if (tabs) tabs.classList.toggle("hide", !root);
  const back = $("#back"); if (back) back.classList.toggle("hide", root);
  const ttl = $("#ttl");
  if (ttl) {
    const names = { status: "动态", home: "目录", todo: "待办", log: "生产", company: "公司", users: "人员", mine: "我的", fin: "费用记录", lang: "语言" };
    const mod = MODS.find((m) => (m.tab || m.k) === S.tab);
    ttl.textContent = tr(names[S.tab] || (mod && mod.t) || (S.tab.startsWith("g:") ? S.tab.slice(2) : "ECOBOX"));
  }
}


let FEED = null;

/* ---------- 动态：卡片流 ---------- */
const mediaSrc = (u) => (/^https?:\/\//.test(u) ? u : "/api/fin/photo/" + u);
const mediaList = (p) => (p.photos || []).map((m) => (typeof m === "string" ? { t: "i", u: m } : m)).filter((m) => m && m.u);
const KIND = { company: "🏢 公司", prod: "⛏ 生产", export: "🚢 出口" };
const whenOf = (p) => { const raw = String(p.created_at || ""); return raw.slice(11, 16) === "00:00" ? raw.slice(0, 10) : raw.replace("T", " ").slice(0, 16); };
const ago = (t) => { if (!t) return ""; const d = Date.now() - new Date(t).getTime(); if (d < 60000) return "刚刚"; if (d < 3600000) return Math.floor(d / 60000) + " 分钟前"; if (d < 86400000) return Math.floor(d / 3600000) + " 小时前"; if (d < 604800000) return Math.floor(d / 86400000) + " 天前"; return String(t || "").slice(0, 10); };
const fb = (u) => (u.startsWith("feed/old/") ? ` onerror="this.onerror=null;this.src='/api/feed/img/${u.slice(9)}'"` : "");
const FD_EXP = new Set();
const FD_OPEN = new Set();
const meId = () => (S.user && (S.user.login || S.user.uid)) || "";

function feedHtml() {
  return `<div class="fd-top"><div class="fd-title">${esc(tr(`公司动态`))}</div><span class="mut">${esc(tr(`全体可见`))}</span></div>
    <div id="fd_list"><div class="empty">${esc(tr(`加载中…`))}</div></div>
    <button id="fd_fab" class="fd-fab" title="${esc(tr(`添加动态`))}">＋</button>`;
}

function bindFeed() {
  const f = $("#fd_fab");
  if (f) f.onclick = () => openComposer();
  loadFeed();
}

function loadFeed() {
  return api("/feed", { quiet: true })
    .then((r) => { FEED = r.posts || []; drawFeed(); })
    .catch((e) => { const el = $("#fd_list"); if (el) el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
}

function mediaHtml(p) {
  const list = mediaList(p);
  if (!list.length) return "";
  const cls = list.length === 1 ? "g1" : list.length === 2 ? "g2" : "g3";
  const tiles = list.slice(0, 9).map((m, i) => {
    const src = mediaSrc(m.u);
    const more = i === 8 && list.length > 9 ? `<span class="fd-more-n">+${list.length - 9}</span>` : "";
    return m.t === "v"
      ? `<button class="fd-tile" data-vid="${esc(src)}"><video src="${esc(src)}" preload="none" muted playsinline></video><span class="fd-play">▶</span>${more}</button>`
      : `<button class="fd-tile" data-img="${esc(src)}"><img src="${esc(src)}" loading="lazy" alt=""${fb(m.u)}>${more}</button>`;
  }).join("");
  return `<div class="fd-media ${cls}">${tiles}</div>`;
}

function cmtHtml(p) {
  if (!FD_OPEN.has(p.id)) return "";
  const list = p.comments || [];
  const me = meId();
  const all = FD_EXP.has(p.id) || list.length <= 3;
  const pairs = list.map((c, i) => [c, i]);
  const vis = all ? pairs : pairs.slice(0, 3);
  const rows = vis.map(([c, i]) => `<div class="fd-c"><b>${esc(c.by || "")}</b><span>${esc(tx(c, "text"))}</span><em>${esc(ago(c.at))}</em>${
    (c.uid === me || isAdmin()) ? `<button class="x" data-cdel="${esc(p.id)}:${i}" title="${esc(tr(`删除`))}">×</button>` : ""}</div>`).join("");
  const moreBtn = list.length > 3
    ? (all ? `<button class="fd-cmore" data-cmore="${esc(p.id)}">${esc(tr(`收起留言`))}</button>` : `<button class="fd-cmore" data-cmore="${esc(p.id)}">${esc(tr(`查看全部 ${list.length} 条留言`))}</button>`)
    : "";
  return `<div class="fd-comments">${rows}${moreBtn}
    <div class="fd-cin"><input data-cin="${esc(p.id)}" maxlength="300" placeholder="${esc(tr(`写留言…`))}"><button data-csend="${esc(p.id)}">${esc(tr(`发送`))}</button></div>
  </div>`;
}

function postHtml(p) {
  const me = meId();
  const mine = !!me && (p.uid === me || isAdmin());
  const liked = (p.likes || []).includes(me);
  const nLike = (p.likes || []).length;
  const nCmt = (p.comments || []).length;
  return `<article class="fd-post" data-id="${esc(p.id)}">
    <div class="fd-h">
      <div class="fd-av">${esc((p.name || "?").slice(0, 1).toUpperCase())}</div>
      <div class="fd-meta"><b>${esc(p.name || p.uid)}</b><span>${esc(KIND[p.kind] || KIND.company)} · ${esc(whenOf(p))}</span></div>
      ${mine ? `<button class="fd-more" data-more="${esc(p.id)}" title="${esc(tr(`更多`))}">⋯</button>` : ""}
    </div>
    ${p.body ? `<div class="fd-b">${esc(tx(p, "body"))}</div>` : ""}
    ${mediaHtml(p)}
    <div class="fd-acts">
      <button class="fd-like${liked ? " on" : ""}" data-like="${esc(p.id)}" aria-label="${esc(tr(`点赞`))}"><i>${liked ? "❤" : "♡"}</i><span>${nLike || esc(tr("赞"))}</span></button>
      <button class="fd-cmtb" data-cmt="${esc(p.id)}" aria-label="${esc(tr(`评论`))}"><i>💬</i><span>${nCmt || "评论"}</span></button>
    </div>
    ${cmtHtml(p)}
  </article>`;
}

function bindPost(el) {
  el.querySelectorAll("[data-img]").forEach((b) => (b.onclick = () => fdView(b.dataset.img, "")));
  el.querySelectorAll("[data-vid]").forEach((b) => (b.onclick = () => fdView("", b.dataset.vid)));
  el.querySelectorAll("[data-like]").forEach((b) => (b.onclick = () => likePost(b.dataset.like)));
  el.querySelectorAll("[data-cmt]").forEach((b) => (b.onclick = () => toggleCmt(b.dataset.cmt)));
  el.querySelectorAll("[data-cmore]").forEach((b) => (b.onclick = () => { FD_EXP.has(b.dataset.cmore) ? FD_EXP.delete(b.dataset.cmore) : FD_EXP.add(b.dataset.cmore); refreshPost(b.dataset.cmore); }));
  el.querySelectorAll("[data-csend]").forEach((b) => (b.onclick = () => sendComment(b.dataset.csend)));
  el.querySelectorAll("[data-cin]").forEach((inp) => (inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); sendComment(inp.dataset.cin); } }));
  el.querySelectorAll("[data-cdel]").forEach((b) => (b.onclick = () => delComment(b.dataset.cdel)));
  el.querySelectorAll("[data-more]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); openMenu(b.dataset.more, b); }));
}

function thumbVideos() {
  const load = (v) => { if (v.dataset.tried) return; v.dataset.tried = "1"; v.preload = "metadata"; v.load(); };
  document.querySelectorAll(".fd-tile[data-vid] video").forEach((v) => {
    if (v.dataset.tried) return;
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) {} }, { once: true });
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { load(v); io.disconnect(); } }), { rootMargin: "300px" });
      io.observe(v.closest(".fd-tile"));
    } else load(v);
  });
}

function drawFeed() {
  const el = $("#fd_list");
  if (!el || !S.user) return;
  el.innerHTML = (FEED && FEED.length) ? FEED.map(postHtml).join("") : '<div class="empty">还没有动态，点右下角 ＋ 发第一条</div>';
  el.querySelectorAll(".fd-post").forEach(bindPost);
  thumbVideos();
}

function refreshPost(id) {
  const p = (FEED || []).find((x) => x.id === id);
  if (!p) return;
  const el = document.querySelector(`.fd-post[data-id="${id}"]`);
  if (!el) return;
  el.outerHTML = postHtml(p);
  const next = document.querySelector(`.fd-post[data-id="${id}"]`);
  if (next) bindPost(next);
  thumbVideos();
}

function toggleCmt(id) {
  if (FD_OPEN.has(id)) FD_OPEN.delete(id); else FD_OPEN.add(id);
  refreshPost(id);
  if (FD_OPEN.has(id)) focusCmt(id);
}
function focusCmt(id) {
  const inp = document.querySelector(`[data-cin="${id}"]`);
  if (inp) inp.focus();
}

async function likePost(id) {
  const p = (FEED || []).find((x) => x.id === id);
  if (!p) return;
  const me = meId();
  const liked = (p.likes || []).includes(me);
  p.likes = liked ? p.likes.filter((x) => x !== me) : (p.likes || []).concat([me]);
  refreshPost(id);
  try { await api("/feed/" + encodeURIComponent(id) + "/like", { method: "POST", quiet: true }); }
  catch (e) { toast("点赞失败", "bad"); await loadFeed(); }
}

async function sendComment(id) {
  const inp = document.querySelector(`[data-cin="${id}"]`);
  const text = (inp && inp.value || "").trim();
  if (!text) { if (inp) inp.focus(); return; }
  const p = (FEED || []).find((x) => x.id === id);
  const me = meId();
  if (p) { p.comments = (p.comments || []).concat([{ uid: me, by: S.user.name || me, text, at: new Date().toISOString() }]); FD_EXP.add(id); refreshPost(id); }
  if (inp) inp.value = "";
  try { await api("/feed/" + encodeURIComponent(id) + "/comment", { method: "POST", body: { text }, quiet: true }); }
  catch (e) { toast("留言没发出去，重试一下", "bad"); await loadFeed(); }
}

async function delComment(spec) {
  const [id, i] = spec.split(":");
  const p = (FEED || []).find((x) => x.id === id);
  if (!p) return;
  p.comments.splice(+i, 1);
  refreshPost(id);
  try { await api(`/feed/${encodeURIComponent(id)}/comment/${i}`, { method: "DELETE", quiet: true }); }
  catch (e) { await loadFeed(); }
}

function openMenu(id, btn) {
  closeMenu();
  const p = (FEED || []).find((x) => x.id === id);
  if (!p) return;
  const r = btn.getBoundingClientRect();
  const m = document.createElement("div");
  m.className = "fd-menu";
  m.id = "fd_menu";
  m.style.top = Math.round(r.bottom + 6) + "px";
  m.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + "px";
  m.innerHTML = `<button data-act="edit">${esc(tr(`编辑`))}</button><button data-act="copy">${esc(tr(`复制内容`))}</button><button data-act="del" class="dz">${esc(tr(`删除`))}</button>`;
  document.body.appendChild(m);
  m.querySelector('[data-act="edit"]').onclick = () => { closeMenu(); openComposer(p); };
  m.querySelector('[data-act="copy"]').onclick = () => {
    closeMenu();
    const t = p.body || "";
    if (!t) { toast("没有文字可复制", "bad"); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast("已复制", "good")).catch(() => toast("复制失败", "bad"));
    else toast("复制失败", "bad");
  };
  m.querySelector('[data-act="del"]').onclick = async () => {
    closeMenu();
    if (!confirm(tr("删除这条动态？"))) return;
    try { await api("/feed/" + encodeURIComponent(id), { method: "DELETE", toast: "已删除" }); await loadFeed(); }
    catch (e) {}
  };
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { const m = $("#fd_menu"); if (m) m.remove(); }

let FD_EDIT = null, FD_DRAFT = [];
function openComposer(post) {
  FD_EDIT = post || null;
  FD_DRAFT = post ? mediaList(post).slice() : [];
  closeSheet();
  const dim = document.createElement("div");
  dim.className = "fd-dim"; dim.id = "fd_dim"; dim.onclick = closeSheet;
  const s = document.createElement("div");
  s.className = "fd-sheet"; s.id = "fd_sheet";
  s.innerHTML = `<div class="fd-sh"><h3>${post ? "编辑动态" : "添加动态"}</h3><button id="fd_x">${esc(tr(`取消`))}</button></div>
    <textarea id="fd_body" maxlength="2000" placeholder="${esc(tr(`说点什么…`))}">${esc(post ? post.body : "")}</textarea>
    <div class="fd-cnt"><span id="fd_cnt">0</span>/2000</div>
    <div id="fd_ph" class="fd-thumbs"></div>
    <div id="fd_vbox"></div>
    <div class="row"><button id="fd_pick">${esc(tr(`＋ 照片`))}</button><button id="fd_vpick" title="${esc(tr(`大视频自动切片上传，断线只补一片`))}">${esc(tr(`＋ 视频`))}</button><button class="pri" id="fd_send">${post ? "保存" : "发布"}</button></div>
    <input id="fd_file" type="file" accept="image/*" multiple hidden>
    <input id="fd_vfile" type="file" accept="video/*" multiple hidden>
    <div class="mut" style="margin:6px 0 0;font-size:12px">${esc(tr(`视频限 90MB；切片上传，断了接着传；能录 MP4 的设备可选压缩`))}</div>`;
  document.body.appendChild(dim);
  document.body.appendChild(s);
  $("#fd_x").onclick = closeSheet;
  $("#fd_pick").onclick = () => $("#fd_file").click();
  $("#fd_file").onchange = async (e) => {
    const files = [...e.target.files].slice(0, Math.max(0, 9 - FD_DRAFT.length));
    e.target.value = "";
    const btn = $("#fd_send");
    if (!files.length) return;
    btn.disabled = true; btn.textContent = tr("上传中…");
    for (const f of files) {
      const key = await finUpload(f, null, "feed");
      if (key) FD_DRAFT.push({ t: "i", u: key });
      drawDraft();
    }
    btn.disabled = false; btn.textContent = FD_EDIT ? "保存" : "发布";
  };
  /* 视频一个一个传，按钮上直接显示进度：手机视频动辄几十兆，不给进度会被当成卡死 */
  $("#fd_vpick").onclick = () => $("#fd_vfile").click();
  $("#fd_vfile").onchange = (e) => {
    const room = Math.max(0, 9 - FD_DRAFT.length - FD_VJOBS.length);
    const files = [...e.target.files].slice(0, room);
    e.target.value = "";
    if (!files.length) { toast(tr(`一条动态最多 9 个附件`), "bad"); return; }
    for (const f of files) {
      if (!fdVideoOk(f)) { toast(tr(`只收 MP4 / MOV / WEBM 视频`), "bad"); continue; }
      if (f.size > FD_VID_MAX) { toast(tr(`视频太大（限 90MB）`) + " · " + fdMB(f.size) + "MB", "bad"); continue; }
      FD_VJOBS.push({ file: f, mode: fdCanZip() && f.size > FD_ZIP_MIN ? "ask" : "up", label: "", err: "" });
    }
    fdDrawVBox();
    fdRunV();
  };
  $("#fd_body").oninput = () => { const c = $("#fd_cnt"); if (c) c.textContent = ($("#fd_body").value || "").length; };
  $("#fd_send").onclick = sendPost;
  const c = $("#fd_cnt"); if (c) c.textContent = (post ? post.body : "").length;
  drawDraft();
  fdDrawVBox();
  $("#fd_body").focus();
}

function drawDraft() {
  const box = $("#fd_ph");
  if (!box) return;
  box.innerHTML = FD_DRAFT.map((m, i) => `<div class="t">${
    m.t === "v" ? `<video src="${esc(mediaSrc(m.u))}" muted preload="metadata" playsinline></video><span class="fd-play">▶</span>` : `<img src="${esc(mediaSrc(m.u))}" alt="">`
  }<button class="x" data-rm="${i}">×</button></div>`).join("");
  box.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { FD_DRAFT.splice(+b.dataset.rm, 1); drawDraft(); }));
}

function closeSheet() { ["fd_dim", "fd_sheet"].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); }); }

async function sendPost() {
  const t = ($("#fd_body").value || "").trim();
  if (!t && !FD_DRAFT.length) { toast("写点内容再发", "bad"); return; }
  const btn = $("#fd_send");
  btn.disabled = true;
  try {
    if (FD_EDIT) {
      await api("/feed/" + encodeURIComponent(FD_EDIT.id), { method: "PATCH", body: { body: t, photos: FD_DRAFT }, toast: "已保存" });
    } else {

function fdView(img, vid) {

  if (vid) {
    box.innerHTML = `<video src="${esc(vid)}" controls autoplay playsinline preload="auto"></video><button class="fd-view-x">×</button>`;
    box.onclick = (e) => { if (e.target === box || e.target.classList.contains("fd-view-x")) box.remove(); };
  } else {
    box.innerHTML = `<div class="fd-zoom"><img src="${esc(img)}" alt=""></div><button class="fd-view-x">×</button>`;
    box.onclick = (e) => { if (e.target === box || e.target.classList.contains("fd-view-x")) box.remove(); };
    attachZoom(box.querySelector(".fd-zoom"), box.querySelector(".fd-zoom img"));
  }
  document.body.appendChild(box);
}

function attachZoom(wrap, im) {
  let s = 1, tx = 0, ty = 0, pinch = 0, startS = 1, px = 0, py = 0, start = null, last = 0;
  const apply = () => { im.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const reset = () => { s = 1; tx = ty = 0; apply(); };
  wrap.onclick = (e) => e.stopPropagation();
  wrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      startS = s;
    } else if (e.touches.length === 1) { start = [e.touches[0].clientX, e.touches[0].clientY]; px = tx; py = ty; }
  }, { passive: false });
  wrap.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { s = Math.min(4, Math.max(1, startS * d / pinch)); apply(); }
    } else if (e.touches.length === 1 && start && s > 1) {
      tx = px + (e.touches[0].clientX - start[0]); ty = py + (e.touches[0].clientY - start[1]); apply();
    }
  }, { passive: false });
  wrap.addEventListener("touchend", (e) => {
    start = null; pinch = 0;
    const now = Date.now();
    if (e.touches.length === 0) {
      if (now - last < 320) { if (s > 1) reset(); else { s = 2.5; tx = ty = 0; apply(); } last = 0; }
      else last = now;
    }
  });
}

const ATT = { ym: "", all: false, cfg: null, rec: null, phase: "in", records: [], stats: {}, scope: "me" };

const gpsFix = () => new Promise((ok, bad) => {
  if (!navigator.geolocation) return bad(new Error("这台设备/浏览器不支持定位"));
  navigator.geolocation.getCurrentPosition(
    (p) => ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
    (e) => bad(new Error(e.code === 1 ? "定位被拒绝：请在浏览器里允许定位" : "定位失败，到空旷处再试")),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
});
const hhmm = (iso) => (iso ? new Date(iso).toTimeString().slice(0, 5) : "");

    <div class="mut" style="font-size:12px;margin-top:8px;">${esc(tr(`点打卡时自动定位，需在 ${esc(cfg.radius || 300)} 米范围内${cfg.site_name ? "（" + esc(cfg.site_name) + "）" : ""}；两段打卡都要在范围内。`))}</div>

function attMinOf(v) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(v || ""));
  return m ? +m[1] * 60 + +m[2] : 0;
}
function attHours(r) {
  const mins = (new Date(r.outAt) - new Date(r.inAt)) / 60000;
  if (!(mins > 0)) return "-";
  return Math.floor(mins / 60) + "h " + Math.round(mins % 60) + "m";
}

function bindAtt(pane) {
  const btn = $("#att-punch", pane);
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = "正在定位…";
    try {
      const g = await gpsFix();
      const now = new Date();
      const r = await api("/att/punch", {
        method: "POST", quiet: true,
        body: { lat: g.lat, lng: g.lng, acc: g.acc, d: localDay(now), hm: now.toTimeString().slice(0, 5) },
      });
      toast(r.phase === "in" ? "上班打卡成功" : "下班打卡成功");
      await punchPane(pane);
    } catch (e) {
      toast(e.message, "bad");
      btn.disabled = false;
      btn.textContent = old;
    }
  };
  const mo = $("#att-month", pane);
  if (mo) mo.onchange = () => { ATT.ym = mo.value; render(); };
  const sc = $("#att-scope", pane);
  if (sc) sc.onchange = () => { ATT.all = sc.value === "all"; render(); };
  const here = $("#att-here", pane);
  if (here) here.onclick = async () => {
    try {
      const g = await gpsFix();
      $("#att-lat", pane).value = g.lat.toFixed(6);
      $("#att-lng", pane).value = g.lng.toFixed(6);
      toast("已填入当前位置，记得保存");
    } catch (e) { toast(e.message, "bad"); }
  };
  const save = $("#att-cfg-save", pane);
  if (save) save.onclick = async () => {
    try {
      await api("/att/cfg", {
        method: "PUT", toast: "打卡设置已保存",
        body: {
          site_name: $("#att-site", pane).value.trim(),
          radius: +$("#att-radius", pane).value || 300,
          lat: +$("#att-lat", pane).value || 0,
          lng: +$("#att-lng", pane).value || 0,
          start: $("#att-start", pane).value.trim(),
          end: $("#att-end", pane).value.trim(),
          grace: +$("#att-grace", pane).value || 0,
        },
      });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
}

  bindCust(pane);
}

function custHtml() {
  const form = CUST.edit !== null ? custFormHtml() : "";
  const rows = CUST.list.map((c) => `<button class="row-item" data-cu="${esc(c.id)}">
      <b>${esc(c.name)}</b>
      <span class="mut">${esc([c.contact, c.phone, c.country].filter(Boolean).join(" · ") || "—")}</span>
    </button>`).join("");
  return `<div class="card">
    <h3>${esc(tr(`客户 (${CUST.total})`))}</h3>
    <div class="row">
      <label>${esc(tr(`搜索`))}<input id="cu-q" placeholder="${esc(tr(`名称 / 联系人 / 电话 / 国家`))}" value="${esc(CUST.q)}"></label>
      <label>&nbsp;<button id="cu-new" class="btn pri" style="width:100%;">${esc(tr(`＋ 新建客户`))}</button></label>
    </div>
    ${rows || `<div class="empty">${esc(tr(`还没有客户`))}</div>`}
    ${CUST.q ? `<div class="mut" style="font-size:12px;margin-top:8px;">${esc(tr(`搜索「${esc(CUST.q)}」`))}</div>` : ""}
  </div>
  ${form}`;
}

function custFormHtml() {
  const c = CUST.edit || {};
  const isNew = !c.id;
  return `<div class="card" id="cu-form">
    <h3>${isNew ? "新建客户" : "编辑客户"}</h3>
    <div class="grid">
      ${CUST_FIELDS.map(([k, label]) => `<label>${label}${k === "name" ? " *" : ""}<input data-cf="${k}" value="${esc(c[k] || "")}"></label>`).join("")}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="cu-save" class="btn pri" style="flex:1;">${esc(tr(`保存`))}</button>
      <button id="cu-cancel" class="btn">${esc(tr(`取消`))}</button>
      ${isNew ? "" : `<button id="cu-del" class="btn danger">${esc(tr(`删除`))}</button>`}
    </div>
  </div>`;
}

function bindCust(pane) {
  const q = $("#cu-q", pane);
  if (q) {
    q.onkeydown = (e) => { if (e.key === "Enter") { CUST.q = q.value.trim(); render(); } };
    q.onblur = () => { if (q.value.trim() !== CUST.q) { CUST.q = q.value.trim(); render(); } };
  }
  const isNew = CUST.edit !== null && !CUST.edit.id;
  const nw = $("#cu-new", pane);
  if (nw) nw.onclick = () => { CUST.edit = {}; render(); };
  pane.querySelectorAll("[data-cu]").forEach((b) => b.onclick = async () => {
    try {
      const r = await api("/customers/" + b.dataset.cu);
      CUST.edit = r.customer;
      render();
    } catch (e) { toast(e.message, "bad"); }
  });
  const cancel = $("#cu-cancel", pane);
  if (cancel) cancel.onclick = () => { CUST.edit = null; render(); };
  const save = $("#cu-save", pane);
  if (save) save.onclick = async () => {
    const body = {};
    pane.querySelectorAll("[data-cf]").forEach((i) => { body[i.dataset.cf] = i.value.trim(); });
    if (!body.name) return toast("客户名称必填", "bad");
    try {
      if (isNew) await api("/customers", { method: "POST", body, toast: "客户已建立" });
      else await api("/customers/" + CUST.edit.id, { method: "PATCH", body, toast: "已保存" });
      CUST.edit = null;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
  const del = $("#cu-del", pane);
  if (del) del.onclick = async () => {
    if (!confirm(tr(`删除客户「${CUST.edit.name}」？`))) return;
    try {
      await api("/customers/" + CUST.edit.id, { method: "DELETE", toast: "已删除" });
      CUST.edit = null;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
}

/* ================= 出口 ================= */
const EXP = { list: [], q: "", labels: {}, stages: [], open: null, editing: null, adding: null };
const EXP_STAGE_FIELDS = {
  applied: [["summary", "申请摘要"]],
  moses: [["ref", "MOSES 编号 / 条码"]],
  analysis: [["labRef", "化验单编号"], ["grades", "化验品位"]],
  valuation: [["mvcRef", "估价证编号"], ["netValue", "估定净值 (US$)"]],
  royalty: [["amount", "矿权费 (US$)"], ["due", "缴纳期限"]],
  permit: [["permitNo", "许可证号"], ["validUntil", "有效期"]],
  exported: [["note", "备注"]],
};
const EXP_MINERALS = ["Tantalum", "Niobium", "Copper", "Cobalt", "Manganese", "Tin", "Emerald", "Gold", "Other"];

async function exportPane(pane) {
  pane.innerHTML = `<div class="empty">${esc(tr(`加载中…`))}</div>`;
  try {
    const r = await api("/exports" + (EXP.q ? "?q=" + encodeURIComponent(EXP.q) : ""));
    EXP.list = r.exports;
    EXP.labels = r.labels;
    EXP.stages = r.stages;
    if (EXP.open && !EXP.list.some((x) => x.id === EXP.open)) EXP.open = null;
  } catch (e) {
    pane.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  pane.innerHTML = expHtml();
  bindExp(pane);
}

const expStageIdx = (x) => Math.max(0, EXP.stages.indexOf(x.status));

function expHtml() {
  const rows = EXP.list.map((x) => {
    const idx = expStageIdx(x);
    const dots = EXP.stages.map((k, i) => `<i class="st-dot${i <= idx ? " on" : ""}" title="${esc(EXP.labels[k] || k)}"></i>`).join("");
    return `<div class="exp-row">
      <button class="row-item" data-exp="${esc(x.id)}">
        <b>${esc(x.date || "")} · ${esc([x.co, x.mineral].filter(Boolean).join(" · ") || "出口单")}</b>
        <span class="mut">${x.qty ? esc(x.qty + " " + (x.unit || "t")) : ""} ${esc([x.importer, x.dest].filter(Boolean).join(" → "))}</span>
        <span class="mut">${esc(EXP.labels[x.status] || x.status)}</span>
      </button>
      <div class="st-dots">${dots}</div>
      ${EXP.open === x.id ? expDetailHtml(x) : ""}
    </div>`;
  }).join("");

  return `<div class="card">
    <h3>${esc(tr(`出口单 (${EXP.list.length})`))}</h3>
    <div class="row">
      <label>${esc(tr(`搜索`))}<input id="exp-q" placeholder="${esc(tr(`公司 / 矿种 / 进口商 / 目的国`))}" value="${esc(EXP.q)}"></label>
      <label>&nbsp;<button id="exp-new" class="btn pri" style="width:100%;">${esc(tr(`＋ 新出口单`))}</button></label>
    </div>
    ${EXP.adding ? expNewHtml() : ""}
    ${rows || `<div class="empty">${esc(tr(`还没有出口单`))}</div>`}
  </div>`;
}

function expNewHtml() {
  return `<div class="card" id="exp-new-form" style="background:var(--card2);">
    <h3>${esc(tr(`新建出口单`))}</h3>
    <div class="grid">
      <label>${esc(tr(`日期`))}<input id="ex-date" type="date" value="${localDay(new Date())}"></label>
      <label>${esc(tr(`公司`))}<input id="ex-co" placeholder="${esc(tr(`公司名`))}"></label>
      <label>${esc(tr(`矿种`))}<select id="ex-mineral">${EXP_MINERALS.map((m) => `<option>${m}</option>`).join("")}</select></label>
      <label>${esc(tr(`类型`))}<select id="ex-kind"><option value="product">${esc(tr(`产品`))}</option><option value="sample">${esc(tr(`样品`))}</option></select></label>
      <label>${esc(tr(`数量`))}<input id="ex-qty" type="number" step="0.001" value="0"></label>
      <label>${esc(tr(`单位`))}<input id="ex-unit" value="t"></label>
      <label>${esc(tr(`进口商`))}<input id="ex-importer"></label>
      <label>${esc(tr(`目的国`))}<input id="ex-dest"></label>
      <label>${esc(tr(`HS 编码`))}<input id="ex-hs"></label>
      <label>${esc(tr(`化验元素`))}<input id="ex-elems" placeholder="Ta2O5, Nb2O5"></label>
    </div>
    <label>${esc(tr(`备注`))}<input id="ex-note"></label>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="ex-save" class="btn pri" style="flex:1;">${esc(tr(`建立`))}</button>
      <button id="ex-cancel" class="btn">${esc(tr(`取消`))}</button>
    </div>
  </div>`;
}

function expDetailHtml(x) {
  const filesByStage = {};
  (x.files || []).forEach((f) => { (filesByStage[f.stage] = filesByStage[f.stage] || []).push(f); });
  const stages = EXP.stages.map((k) => {
    const st = (x.stages || {})[k] || {};
    const done = !!st.at;
    const fields = EXP_STAGE_FIELDS[k] || [];
    const inputs = fields.map(([fk, label]) =>
      `<label>${label}<input data-es="${k}:${fk}" value="${esc(st[fk] || "")}" placeholder="${done ? "" : "填写后点标记完成"}"></label>`).join("");
    const files = filesByStage[k] || [];
    const fileRows = files.map((f) => `<div class="file-row">
        <a href="/api/exports/${encodeURIComponent(x.id)}/file?k=${encodeURIComponent(f.k)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span class="mut">${Math.max(1, Math.round(f.size / 1024))} KB</span>
        <button class="btn danger" data-ef-del="${esc(k)}|${esc(f.k)}">${esc(tr(`删`))}</button>
      </div>`).join("");
    return `<div class="exp-stage${done ? " done" : ""}">
      <div class="exp-stage-h"><b>${esc(EXP.labels[k] || k)}</b>
        <span class="mut">${done ? "已完成 " + esc(String(st.at).slice(0, 10)) : "未完成"}</span></div>
      <div class="grid">${inputs}</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn${done ? "" : " pri"}" data-es-save="${esc(k)}">${done ? "更新本阶段" : "标记完成"}</button>
        <label class="btn" style="margin:0;display:inline-flex;align-items:center;cursor:pointer;">${esc(tr(`＋ 上传文件`))}
          <input type="file" accept="application/pdf,image/*" data-ef-up="${esc(k)}" style="display:none;">
        </label>
      </div>
      ${fileRows}
    </div>`;
  }).join("");

  return `<div class="exp-detail">
    <div class="mut" style="font-size:13px;">${esc([x.qty ? x.qty + " " + (x.unit || "t") : "", x.hs ? "HS " + x.hs : "", x.elems].filter(Boolean).join(" · "))}</div>
    ${x.note ? `<div class="mut" style="font-size:13px;">${esc(tr(`备注：${esc(x.note)}`))}</div>` : ""}
    ${stages}
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn danger" data-exp-del="${esc(x.id)}">${esc(tr(`删除这张单`))}</button>
    </div>
  </div>`;
}

function bindExp(pane) {
  const q = $("#exp-q", pane);
  if (q) {
    q.onkeydown = (e) => { if (e.key === "Enter") { EXP.q = q.value.trim(); render(); } };
    q.onblur = () => { if (q.value.trim() !== EXP.q) { EXP.q = q.value.trim(); render(); } };
  }
  const nw = $("#exp-new", pane);
  if (nw) nw.onclick = () => { EXP.adding = true; render(); };
  const cancel = $("#ex-cancel", pane);
  if (cancel) cancel.onclick = () => { EXP.adding = false; render(); };
  const save = $("#ex-save", pane);
  if (save) save.onclick = async () => {
    const body = {
      date: $("#ex-date", pane).value, co: $("#ex-co", pane).value.trim(),
      mineral: $("#ex-mineral", pane).value, kind: $("#ex-kind", pane).value,
      qty: +$("#ex-qty", pane).value || 0, unit: $("#ex-unit", pane).value.trim() || "t",
      importer: $("#ex-importer", pane).value.trim(), dest: $("#ex-dest", pane).value.trim(),
      hs: $("#ex-hs", pane).value.trim(), elems: $("#ex-elems", pane).value.trim(),
      note: $("#ex-note", pane).value.trim(),
    };
    try {
      const r = await api("/exports", { method: "POST", body, toast: "出口单已建立" });
      EXP.adding = false;
      EXP.open = r.id;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  };
  pane.querySelectorAll("[data-exp]").forEach((b) => b.onclick = () => {
    EXP.open = EXP.open === b.dataset.exp ? null : b.dataset.exp;
    render();
  });
  pane.querySelectorAll("[data-es-save]").forEach((b) => b.onclick = async () => {
    const stage = b.dataset.esSave;
    const body = { stage, fields: {} };
    pane.querySelectorAll(`[data-es^="${stage}:"]`).forEach((i) => { body.fields[i.dataset.es.split(":")[1]] = i.value; });
    try {
      await api(`/exports/${EXP.open}/stage`, { method: "POST", body, toast: "阶段已更新" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-ef-up]").forEach((inp) => inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast("文件太大（限 20MB）", "bad");
    const data = await new Promise((ok, bad) => {
      const rd = new FileReader();
      rd.onload = () => ok(rd.result);
      rd.onerror = () => bad(new Error("读取文件失败"));
      rd.readAsDataURL(f);
    });
    try {
      await api(`/exports/${EXP.open}/file`, { method: "POST", body: { stage: inp.dataset.efUp, name: f.name, data }, toast: "已上传" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-ef-del]").forEach((b) => b.onclick = async () => {
    const [stage, k] = b.dataset.efDel.split("|");
    if (!confirm(tr("删除这份文件？"))) return;
    try {
      await api(`/exports/${EXP.open}/file?k=${encodeURIComponent(k)}`, { method: "DELETE", toast: "已删除" });
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
  pane.querySelectorAll("[data-exp-del]").forEach((b) => b.onclick = async () => {
    if (!confirm(tr("删除这张出口单（含全部文件）？"))) return;
    try {
      await api("/exports/" + b.dataset.expDel, { method: "DELETE", toast: "已删除" });
      EXP.open = null;
      await render();
    } catch (e) { toast(e.message, "bad"); }
  });
}

/* ---------- 启动 ---------- */

  try {
    const r = await api("/login", { method: "POST", body: { login: $("#l_login").value, password: $("#l_pass").value } });

  $("#s_err").textContent = "";
  try {

    S.user = r.user; await showApp();

};

/* ---------- 手机全屏 / 添加到主屏幕 ---------- */
const IS_STANDALONE = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const IS_IOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function wireFullscreen() {
  const btn = $("#fsbtn");
  if (!btn || IS_STANDALONE()) return;          // 已从桌面图标打开：本来就没有地址栏
  btn.classList.remove("hide");
  const paint = () => {
    const on = !!document.fullscreenElement;
    btn.textContent = on ? "⤢" : "⛶";
    btn.title = tr(on ? `退出全屏` : `全屏`);
  };
  paint();
  btn.onclick = async () => {
    if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch (e) {} return; }
    if (!IS_IOS() && document.documentElement.requestFullscreen) {
      try { await document.documentElement.requestFullscreen(); return; } catch (e) {}
    }
    /* iPhone 的 Safari 不能把网页全屏：只能引导装到桌面 */
    toast(tr(`点「分享」→ 添加到主屏幕，从桌面图标打开就没有顶部地址栏`));
  };
  document.addEventListener("fullscreenchange", paint);
}

/* 只在 iPhone/iPad 的 Safari 里、还没装到桌面时提示一次 */
function iosHomeHint() {
  if (!IS_IOS() || IS_STANDALONE()) return;
  try {
    if (localStorage.getItem("a2hs_hint")) return;
    localStorage.setItem("a2hs_hint", "1");
  } catch (e) { return; }
  toast(tr(`想全屏？点「分享」→ 添加到主屏幕，以后从桌面图标进`));
}

wireFullscreen();
iosHomeHint();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

(async () => {
  try {
    const st = await api("/status");
    if (st.setup_needed) return showSetup();
  } catch {}
  /* /me 是页面刚打开时发的；慢网下它可能在用户登录成功之后才回来，
     这时别拿旧结果把登录态打回登录页 */
  try {
    const r = await api("/me");
    if (S.user) return;
    if (r.user) { S.user = r.user; await showApp(); } else showLogin();
  } catch { if (!S.user) showLogin(); }
})();
