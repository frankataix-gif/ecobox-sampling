<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清理缓存 - ECOBOX矿区考察记录本</title>
  <style>
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
    .box{background:#fff;border-radius:14px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    h1{font-size:18px;margin-bottom:12px}
    p{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:20px}
    button{border:none;border-radius:10px;padding:12px 20px;font-size:15px;background:#1668dc;color:#fff;width:100%;cursor:pointer}
    #status{margin-top:16px;font-size:13px;color:#64748b}
  </style>
</head>
<body>
  <div class="box">
    <h1>清理离线缓存</h1>
    <p>如果手机上的 PWA 一直不显示最新版本，点下面按钮清除缓存并重新加载。</p>
    <button id="go">清除并重新打开</button>
    <p id="status"></p>
  </div>
  <script>
    document.getElementById("go").onclick = async () => {
      const st = document.getElementById("status");
      st.textContent = "正在清理…";
      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ("serviceWorker" in navigator) {
          const rs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(rs.map(r => r.unregister()));
        }
        st.textContent = "清理完成，正在跳转…";
      } catch (e) {
        st.textContent = "清理出错，请手动删除 App 后重装";
        return;
      }
      setTimeout(() => {
        location.replace("./sampling_helper.html");
      }, 500);
    };
  </script>
</body>
</html>
